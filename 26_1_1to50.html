<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title> 26년 1회 산업기사 01~50</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>

<script>
const QS=[{"id":1,"text":"패러데이 관에 대한 설명으로 틀린 것은?","opts":["패러데이 관내의 전속수는 일정하다.","패러데이 관의 밀도는 전속 밀도와 같다.","패러데이 관 진전하가 있는 점에서 연속이다.","패러데이 관 양단에 양(+), 음(-)의 단위전하가 있다."],"answer":2,"exp":"3번 : 패러데이 관 진전하가 없는 점에서 연속이다.","img":null},{"id":2,"text":"B-H곡선을 자세히 관찰하면 매끈한 곡선이 아니라 B가 계단적으로 증가 또는 감소함을 알 수 있다. 이러한 현상을 무엇이라 하는가?","opts":["퀴리점(Curie point)","자기여자효과(magnetic after effect)","자왜현상(magneto-striction effect)","바크하우젠 효과(Barkhausen effect)"],"answer":3,"exp":"","img":null},{"id":3,"text":"유전체 중의 전계의 세기를 $E\\text{[V/m]}$, 유전율을 $\\varepsilon\\text{[F/m]}$ 이라 하면 전기변위[C/m²]는?","opts":["$\\varepsilon E$","$\\varepsilon E^2$","$\\frac{\\varepsilon}{E}$","$\\frac{E}{\\varepsilon}$"],"answer":0,"exp":"","img":null},{"id":4,"text":"원점 주위의 전류밀도가 $J = \\frac{2}{r} a_r$ [A/m$^2$]의 분포를 가질 때 반지름 5[cm]의 구면을 지나는 전전류는?","opts":["$0.1 \\pi$","$0.2 \\pi$","$0.3 \\pi$","$0.4 \\pi$"],"answer":3,"exp":"전전류 $I$는 전류밀도 $J$의 면적분으로 구합니다.$$I = \\int_S J \\cdot dS$$\n\n","img":null},{"id":5,"text":"강자성체의 자화에 관한 설명으로 틀린 것은?","opts":["강자성체의 자화의 세기는 자계의 세기에 비례한다.","강자성체의 자계를 변화시키면 히스테리시스현상이 나타난다.","강자성체의 히스테리시스손은 히스테리시스 곡선의 면적과 같다.","강자성체의 자속밀도 $B$는 자계의 세기 $H$에 비례하지 않는다."],"answer":3,"exp":"4번 : $B = \\mu H$ 로, 비례한다","img":null},{"id":6,"text":"자계의 세기가 $1,000\\text{[AT/m]}$ 이고, 자속밀도가 $0.1\\text{[Wb/m}^2\\text{]}$ 인 재질의 투자율[H/m]은?","opts":["$10^{-3}\\text{[H/m]}$","$10^3\\text{[H/m]}$","$10^{-4}\\text{[H/m]}$","$10^4\\text{[H/m]}$"],"answer":2,"exp":"자속밀도 $B$ , 자계의 세기 $H$ , 투자율 $\\mu$ 사이에는 다음과 같은 관계식이 성립합니다.$$B = \\mu H$$\n\n투자율 $\\mu$ \n$$\\mu = \\frac{B}{H}$$\n\n주어진 값을 대입하면 다음과 같습니다.$$\\mu = \\frac{0.1}{1,000} = \\frac{10^{-1}}{10^3} = 10^{-4}\\text{[H/m]}$$\n","img":null},{"id":7,"text":"무한길이의 직선 도체에 전하가 균일하게 분포되어 있다. 이 직선 도체로부터 $l$ 인 거리에 있는 점의 전계의 세기는?","opts":["$l$ 에 비례한다.","$l$ 에 반비례한다.","$l^2$ 에 비례한다.","$l^2$ 에 반비례한다."],"answer":1,"exp":"무한길이 선전하(선전하밀도 $\\lambda$ )에 의한 거리가 $l$ 떨어진 지점의 전계의 세기 $E$ 공식은 다음과 같습니다.$$E = \\frac{\\lambda}{2\\pi \\varepsilon_0 l}$$위 공식에서 전계의 세기 $E$ 는 거리 $l$ 에 반비례함을 알 수 10^3$"],"answer":3,"exp":"무손실 전송선로에서 특성 임피던스 $Z_0$ 의 계산 공식은 다음과 같아.$$Z_0 = \\sqrt{\\frac{L}{C}}$$주어진 값들을 기본 단위인 H와 F로 환산해서 대입하면 다음과 같아.$L = 360 \\text{[mH]} = 360 \\times 10^{-3} \\text{[H]} = 0.36 \\text{[H]}$$C = 0.01 \\text{[\\mu F]} = 0.01 \\times 10^{-6} \\text{[F]} = 10^{-8} \\text{[F]}$이를 공식에 대입하면:$$Z_0 = \\sqrt{\\frac{360 \\times 10^{-3}}{0.01 \\times 10^{-6}}} = \\sqrt{\\frac{0.36}{10^{-8}}} = \\sqrt{0.36 \\times 10^8} = \\sqrt{36 \\times 10^6}$$$$Z_0 = 6 \\times 10^3 \\quad [\\Omega]$$","img":null},{"id":16,"text":"평행판 공기콘덴서의 두 전극판 사이에 전위차계를 접속하고 전지에 의하여 충전하였다. 충전한 상태에서 비유전율 $\\epsilon_r$ 의 유전체를 콘덴서에 채우면 전위차계의 지시는 어떻게 되는가?","opts":["불변이다.","0이 된다.","감소한다.","증가한다."],"answer":2,"exp":"충전 후 전지를 분리하면 전하량 $Q$ 가 일정하게 유지(개로 상태)돼.콘덴서의 정전용량 $C = \\epsilon \\frac{S}{d}$ 에서 비유전율 $\\epsilon_r$ 인 유전체를 채우면 정전용량은 $C' = \\epsilon_r C$ 로 증가해.전하량 $Q$ 가 일정할 때, 전위차(전압) $V$ 는 $V = \\frac{Q}{C}$ 이므로 정전용량 $C$ 가 증가하면 전위차 $V$ 는 감소하게 돼.따라서 전위차계의 지시는 감소","img":null},{"id":17,"text":"진공 중에 놓인 반지름 2[m]의 도체구에 전하 $Q$ [C]이 있다면 그 표면에 있어서의 전속밀도 $D$ 는 몇 [C/m$^2$]인가?","opts":["$Q$","$\\frac{Q}{16\\pi}$","$\\frac{Q}{2\\pi}$","$\\frac{Q}{4\\pi}$"],"answer":1,"exp":"반지름이 $r$ 인 도체구의 전체 전하량이 $Q$ 일 때, 구 표면에서의 전속밀도 $D$ 는 전체 전하량을 구의 표면적 $S = 4\\pi r^2$ 으로 나눈 값이야.$$D = \\frac{Q}{S} = \\frac{Q}{4\\pi r^2}$$문제에서 반지름 $r = 2\\text{[m]}$ 이므로 이를 대입하면 다음과 같이 계산돼.$$D = \\frac{Q}{4\\pi \\times 2^2} = \\frac{Q}{16\\pi} \\quad [\\text{C/m}^2]$$","img":null},{"id":18,"text":"공기 중에 무한 평면도체로부터 거리 $a\\text{[m]}$ 인 곳에 점전하 $Q\\text{[C]}$ 가 있을 때 도체 표면에 유도되는 최대 전하 밀도는 몇 $\\text{[C/m}^2\\text{]}$ 인가?","opts":["$\\frac{Q}{2\\pi\\epsilon_o a^2}$","$\\frac{Q}{4\\pi a^2}$","$-\\frac{Q}{2\\pi a^2}$","$\\frac{Q}{4\\pi\\epsilon_o a^2}$"],"answer":2,"exp":"$$\\sigma = -\\frac{Q a}{2\\pi (r^2 + a^2)^{\\frac{3}{2}}}$$\n로, -값의 최대 전하 밀도를 찾으면 된다.","img":null},{"id":19,"text":"그림과 같이 진공 중에 서로 평행인 무한 길이 두 직선도선 $A$ , $B$ 가 $d \\text{[m]}$ 떨어져 있다. $A$ , $B$ 의 선전하 밀도를 각각 $\\lambda_1 \\text{[C/m]}$ , $\\lambda_2 \\text{[C/m]}$ 라 할 때, $A$ ,000,000}{31,536,000} \\approx 133.18 \\quad [\\text{m}^3\\text{/s}]$$","img":null},{"id":26,"text":"간격이 300[m]이고 지지점의 높이가 같은 두 철탑 사이에 처짐정도(이도)가 7.4[m]가 되도록 전선을 시설하고자 할 때, 소요되는 전선의 길이는 약 몇 [m]인가?(단, 주어지지 않은 조건은 고려하지 않는다)","opts":["300.09","300.19","300.49","300.79"],"answer":2,"exp":"전선의 실제 길이 $L \\quad [\\text{m}]$ 를 구하는 공식은 다음과 같습니다.$$L = S + \\frac{8 D^2}{3 S}$$여기서 각 변수의 값은 다음과 같습니다.경간(철탑 간격) $S = 300 \\quad [\\text{m}]$이도(처짐정도) $D = 7.4 \\quad [\\text{m}]$위 값들을 공식에 대입하여 계산합니다.$$L = 300 + \\frac{8 \\times 7.4^2}{3 \\times 300}$$$$L = 300 + \\frac{8 \\times 54.76}{900}$$$$L = 300 + \\frac{438.08}{900} \\approx 300 + 0.486756 \\approx 300.49 \\quad [\\text{m}]$$","img":null},{"id":27,"text":"다음 중 코로나 방지대책으로 옳지 않은 것은?","opts":["복도체를 사용한다.","가선 금구를 개량한다.","선간거리를 감소시킨다.","가선 시 전선표면의 금구를 손상하지 않도록 한다."],"answer":2,"exp":"","img":null},{"id":28,"text":"수용가 측에서 부하의 무효전력 변동분을 흡수하여 플리커의 발생을 방지하는 대책으로 거리가 먼 것은?","opts":["부스터 방식","동기조상기와 리액터 방식","사이리스터 이용 콘덴서 개폐 방식","사이리스터용 리액터 방식"],"answer":0,"exp":"","img":null},{"id":29,"text":"계기용 변성기 중에서 전압전류를 동시에 변성하여 전력량을 계량할 목적으로 사용하는 것은?","opts":["CT","PT","ZCT","MOF"],"answer":3,"exp":"4 MOF : 전력수급용계기용변성기","img":null},{"id":30,"text":"배전선로에서 손실계수 $H$ 와 $F$ 사이에 성립하는 것은? 단, 부하율 $F \\le 1$ 이다.","opts":["$H \\ge F^2$","$H \\le 0$","$H = F$","$H \\ge F$"],"answer":0,"exp":"손실계수 $H$ 와 부하율 $F$ 사이의 관계는 다음 범위 내에 있어.$$F^2 \\le H \\le F$$손실계수 $H$ 는 항상 부하율의 제곱 $F^2$ 보다는 크거나 같고, 부하율 $F$ 보다는 작거나 같다는 성질을 가져.","img":null},{"id":31,"text":"전원으로부터의 합성 임피던스가 0.5[%](15,000[kVA] 기준)인 곳에 설치하는 차단기 용량은 몇 [MVA] 이상이어야 하는가?","opts":["2,000","2,500","3,000","3,500"],"answer":2,"exp":"차단기 용량 $P_s$ 의 계산 공식은 다음과 같아.$$P_s = \\frac{100}{\\%Z} \\times P_n$$주어진 조건은 다음과 같아.기준 용량 $P_n = 15,000 \\quad [\\text{kVA}] = 15 \\quad [\\text{MVA}]$퍼센트 임피던스 $\\%Z = 0.5 \\quad [\\%]$공식에 대입해서 계산하면:$$P_s = \\frac{100}{0.5} \\times 15 = 200 \\times 15 = 3,000 \\quad [\\text{MVA}]$$","img":null},{"id":32,"text":"그림과 같이 전원 변전소로부터 1회선을 인출하여 수용가에 전원을 공급하며, 신규증설이 용이한 배전방식은?","opts":["평행 ega L = \\frac{1}{3\\omega C}$$양변을 $\\omega$ 로 나누어 소호리액터의 인덕턴스 $L$ 에 대해 정리하면 다음과 같아.$$L = \\frac{1}{3\\omega^2 C}$$","img":null},{"id":38,"text":"피뢰기의 구조는?","opts":["특성요소와 소호리액터","특성요소와 콘덴서","소호리액터와 콘덴서","특성요소와 직렬 갭"],"answer":3,"exp":"","img":null},{"id":39,"text":"화력발전소에서 탈기기의 설치 목적으로 가장 타당한 것은?","opts":["급수 중의 용해 산소의 분리","급수의 습증기 건조","연료 중의 공기 제거","염류 및 부유물질 제거"],"answer":0,"exp":"","img":null},{"id":40,"text":"그림과 같이 임피던스 $Z_1, Z_2$ 및 $Z_3$ 인 송전선이 접속된 선로의 $A$ 쪽에서 전압파 $E$ 가 진행해 왔을 때 접속점 $B$ 에서 무반사로 되기 위한 조건은?","opts":["$Z_1 = Z_2 \\times Z_3$","$Z_1 = Z_2 + Z_3$","$\\frac{1}{Z_1} = \\frac{1}{Z_2} \\times \\frac{1}{Z_3}$","$\\frac{1}{Z_1} = \\frac{1}{Z_2} + \\frac{1}{Z_3}$"],"answer":3,"exp":"무반사 조건은 입사측 임피던스 $Z_1$ 이 병렬 합성 임피던스 $Z_{23}$ 과 같은 경우야.$$Z_1 = \\frac{Z_2 Z_3}{Z_2 + Z_3}$$이 식의 양변에 역수를 취해주면 다음과 같이 정리할 수 있어.$$\\frac{1}{Z_1} = \\frac{Z_2 + Z_3}{Z_2 Z_3} = \\frac{1}{Z_2} + \\frac{1}{Z_3}$$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAErAbYDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7CNFKaSgAooooAKKKKACiiigAooooAKKKKACiiigAooooAKUdKSlHSgAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACgUUCgB1FFFABRRRQAUUUUAFFFFABRRRQAUUUUANNFLijFACCnUmKWgAooooAKKKKAG0UpFJg0AFFGDRzQAUmKOaOaAFooooAKKKKACiiigAxRiiigAooooAKKKKACiilx \frac{\\omega_0}{\\omega}$","$\\frac{\\omega}{\\omega_0}$"],"answer":3,"exp":"유도 전동기의 2차 효율 $\\eta_2$ 는 2차 입력 $P_2$ 에 대한 2차 출력(기계적 출력) $P_m$ 의 비로 정의돼.$$\\eta_2 = \\frac{P_m}{P_2} = \\frac{T \\omega}{T \\omega_0} = \\frac{\\omega}{\\omega_0}$$여기서 $T$ 는 토크, $\\omega_0$ 는 동기각속도, $\\omega$ 는 회전자의 각속도를 나타내며, 슬립 $s$ 를 이용하면 $1 - s$ 와도 같아.","img":null},{"id":43,"text":"A, B 2대의 동기발전기를 병렬운전 중 계통 주파수를 바꾸지 않고 B기의 역률을 좋게 하는 것은?","opts":["A기의 여자전류를 증대","A기의 원동기 출력을 증대","B기의 여자전류를 증대","B기의 원동기 출력을 증대"],"answer":0,"exp":"","img":null},{"id":44,"text":"직류기에서 전압변동률이 (-)로 표시되는 발전기는?","opts":["분권발전기","평복권발전기","과복권발전기","타여자발전기"],"answer":2,"exp":"","img":null},{"id":45,"text":"부하용량은 $6 \\text{ [kW]}$ 일 때, $100 \\text{ [V]}$ 를 $120 \\text{ [V]}$ 로 승압하는 단권변압기의 자기용량은 몇 $\\text{[kVA]}$ 인가?","opts":["$1$","$3$","$4$","$10$"],"answer":0,"exp":"단권변압기의 자기용량 $W_s$ 는 부하용량 $P$ 와 전압 관계를 이용해서 구하면 돼.$$W_s = P \\times \\left( 1 - \\frac{V_1}{V_2} \\right)$$주어진 조건에서 부하용량 $P = 6 \\text{ [kW]}$, 저전압측 전압 $V_1 = 100 \\text{ [V]}$, 고전압측 전압 $V_2 = 120 \\text{ [V]}$ 이니까 대입해 보면,$$W_s = 6 \\times \\left( 1 - \\frac{100}{120} \\right) = 6 \\times \\left( 1 - \\frac{5}{6} \\right) = 6 \\times \\frac{1}{6} = 1 \\quad \\text{[kVA]}$$","img":null},{"id":46,"text":"$220 \\text{ [V]}$ , $6$ 극, $60 \\text{ [Hz]}$ , $10 \\text{ [kW]}$ 인 $3$ 상 유도전동기의 회전자 $1$ 상의 저항은 $0.1 \\text{ [}\\Omega\\text{]}$ , 리액턴스는 $0.5 \\text{ [}\\Omega\\text{]}$ 이다. 정격전압을 가했을 때 슬립이 $4 \\text{ [\\%]}$ 일 때 회전자 전류는 몇 $\\text{[A]}$ 인가? (단, 고정자와 회전자는 $\\Delta$ 결선으로서 권수는 각각 $300$ 회, $150$ 회이며, 각 권선계수는 같다)","opts":["$27$","$36$","$43$","$52$"],"answer":2,"exp":"권수비 $a$ 계산:$$a = \\frac{N_1}{N_2} \\times \\frac{k_{w1}}{k_{w2}} = \\frac{300}{150} = 2$$2차측(회전자) 정지 시 1상 기전력 $E_2$ 계산:$$E_2 = \\frac{V_1}{a} = \\frac{220}{2} = 110 \\quad \\text{[V]}$$슬립 $s = 0.04$ 일 때 회전자 전류 $I_2$ 계산:$$I_2 = \\frac{s E_2}{\\sqrt{r_2^2 + (s x_2)^2}} = \\frac{0.04 \\times 110}{\\sqrt{0.1^2 + (0.04 \\times 0.5)^2}} = \\frac{4.4}{\\sqrt{0.01 + 0.0004}} = \\frac{4.4}{\\sqrt{0.0104}} \\approx 43.14 \\quad \\text{[A]}$$","img":null},{"id":47,"text":"2개의 사이리스터를 이용한 단상 전파 정류 회로에서 직류 전압 $150 \\text{ [V]}$ 를 얻는 데 필요한 1차 측 교류 전압 $\\text{[V]}$ 과 이 회에 사용되는 다이오드의 첨두 역전압(PIV)은 얼마인가?","opts":["$166.5 , 235.5$","$166.5 , 471$","$235.5 , 323$","$235.5 , 471$"],"answer":1,"exp":"1차 측 교류 전압(실효값 $V$ ) 계산:단상 전파 정류 회로에서 무제어 정류(또는 점호각 $\\alpha = 0$ 일 때)의 평균 직류 전압 $E_d$ 와 교류 전압의 실효값 $V$ 사이의 관계는 다음과 같아.$$E_d = \\frac{2 \\sqrt{2}}{\\pi} V$$여기서 직류 전압 $E_d = 150 \\text{ [V]}$ 이므로, 교류 전압 $V$ 는 다음과 같이 구해.$$V = \\frac{\\pi E_d}{2 \\sqrt{2}} = \\frac{3.14159 \\times 150}{2 \\times 1.4142} \\approx \\frac{471.24}{2.8284} \\approx 166.6 \\approx 166.5 \\quad \\text{[V]}$$다이오드(사이리스터)의 첨두 역전압(PIV) 계산:단상 전파 센터탭 회로에서 각 소자에 걸리는 최대 역전압(PIV)은 변압기 2차 전압(또는 전체 교류 전압)의 최대값인 $2 \\sqrt{2} V$ 가 돼.$$\\text{PIV} = 2 \\sqrt{2} V = 2 \\sqrt{2} \\times 166.5 \\approx 471.3 \\approx 471 \\quad \\text{[V]}$$또는 평균 직류 전압 $E_d$ 와의 관계를 이용하면 $\\text{PIV} = \\pi E_d = 3.14159 \\times 150 \\approx 471.2 \\text{ [V]}$ 로도 바로 구할 수 있어.","img":null},{"id":48,"text":"직류전동기의 속도제어 방법에서 광범위한 속도 제어가 가능하며, 운전효율이 가장 좋은 방법은?","opts":["계자제어","전압제어","직렬 저항제어","병렬 저항제어"],"answer":1,"exp":"","img":null},{"id":49,"text":"스테핑 모터를 구조면에서 분류한 형태에 해당하지 않는 것은?","opts":["영구자석형(permanant magnet type)","가변릴럭턴스형(variant reluctance type)","회전전기자형(rotating armature type)","하이브리드형(hybrid type)"],"answer":2,"exp":"","img":null},{"id":50,"text":"단상 반파정류로 직류전압 $150 \\text{ [V]}$ 를 얻으려면 변압기 $2$ 차 권선의 상전압 $V_s$ 를 약 몇 $\\text{[V]}$ 로 하면 되는가? 단, 부하는 저항이고, 정류 회로 및 변압기 내의 전압강하는 무시한다.","opts":["$150$","$200$","$333$","$472$"],"answer":2,"exp":"단상 반파 정류 회로에서 평균 직류 전압 $E_d$ 와 변압기 $2$ 차 교류 전압의 실효값(상전압) $V_s$ 사이의 관계는 다음과 같아.$$E_d = \\frac{\\sqrt{2}}{\\pi} V_s \\approx 0.45 V_s$$여기서 직류 전압 $E_d = 150 \\text{ [V]}$ 이므로, 상전압 $V_s$ 는 다음과 같이 계산할 수 있어.$$V_s = \\frac{\\pi E_d}{\\sqrt{2}} = \\frac{3.14159 \\times 150}{1.4142} \\approx \\frac{471.24}{1.4142} \\approx 333.22 \\quad \\text{[V]}$$","img":null}];
const title=" 26년 1회 산업기사 01~50";
let cur=0,score=0,ans=new Array(QS.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return '해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+QS.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=QS[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div></div>';
  const isLast=cur===QS.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+QS.length+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===QS[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(QS.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function result(){
  const total=QS.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100),pass=pct>=60;
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+(pass?'#3fb950':'#f85149')+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+(pass?'#3fb950':'#f85149')+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+(pass?'🎉 합격!':'😥 불합격')+'</div>'+
    '<div class="res-sub">'+(pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다')+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div><button class="retry" onclick="restart()">🔄 다시 풀기</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function restart(){cur=0;score=0;ans=new Array(QS.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/QS.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
