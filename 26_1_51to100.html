<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title> 26년 1회 산업기사 51~100</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>

<script>
const QS=[{"id":1,"text":"직류기의 양호한 정류를 얻는 조건이 아닌 것은?","opts":["정류 주기를 크게 할 것","정류 코일의 인덕턴스를 작게 할 것","리액턴스 전압을 작게 할 것","브러시 접촉 저항을 작게 할 것"],"answer":3,"exp":"4 브러시 접촉 저항을 크게 한다. (탄소브러시)","img":null},{"id":2,"text":"3상 동기발전기의 병렬운전 조건이 아닌 것은?","opts":["기전력의 파형이 같을 것","용량이 같을 것","기전력의 위상이 같을 것","기전력의 크기가 같을 것"],"answer":1,"exp":"","img":null},{"id":3,"text":"유도전동기를 기동하기 위하여 $\\Delta$ 결선을 $\\text{Y}$ 결선으로 바꿀 때 토크는 몇 배가 되는가?","opts":["$3$","$\\frac{1}{3}$","$\\sqrt{3}$","$\\frac{1}{\\sqrt{3}}$"],"answer":1,"exp":"","img":null},{"id":4,"text":"변압기 단락시험과 관계없는 것은?","opts":["전압 변동률","임피던스 와트","임피던스 전압","여자 어드미턴스"],"answer":3,"exp":"여자어드미턴스 : 개방측 (무부하 시험일 때)","img":null},{"id":5,"text":"유도전동기의 회전자에 슬립 주파수의 전압을 공급하여 속도를 제어하는 방법은?","opts":["2차 여자법","2차 저항법","직류 여자법","주파수 변환법"],"answer":0,"exp":"","img":null},{"id":6,"text":"직류기를 구성하고 있는 3요소는?","opts":["전기자, 계자, 정류자","전기자, 계자, 보상권선","전기자, 정류자, 브러시","전기자, 계자, 슬립링"],"answer":0,"exp":"","img":null},{"id":7,"text":"변압기의 개방회로시험으로 구할 수 없는 것은?","opts":["동손","철손","무부하전류","여자임피던스"],"answer":0,"exp":"","img":null},{"id":8,"text":"전기자 반작용이 직류발전기에 영향을 주는 것을 설명한 것으로 틀린 것은?","opts":["전기자 중성축을 이동시킨다.","자속을 감소시켜 부하 시 전압 강하의 원인이 된다.","정류자 편간전압이 불균일하게 되어 섬락의 원인이 된다.","전류의 파형은 찌그러지거나 출력에는 변화가 없다."],"answer":3,"exp":"","img":null},{"id":9,"text":"$60 \\text{ [Hz]}$ 인 동기발전기의 극수 $p$ 에 따른 동기속도 $N_s \\text{ [rpm]}$ 의 조합으로 옳은 것은?","opts":["$p = 2 , N_s = 3,600$","$p = 4 , N_s = 1,600$","$p = 6 , N_s = 1,800$","$p = 8 , N_s = 1,000$"],"answer":0,"exp":"동기발전기의 동기속도 $N_s$ 공식은 다음과 같아.$$N_s = \\frac{120 f}{p} \\quad \\text{[rpm]}$$주파수 $f = 60 \\text{ [Hz]}$ 일 때, 각 극수에 따른 동기속도를 계산해 보면 다음과 같아.$p = 2$ 일 때:$$N_s = \\frac{120 \\times 60}{2} = 3,600 \\quad \\text{[rpm]}$$$p = 4$ 일 때:$$N_s = \\frac{120 \\times 60}{4} = 1,800 \\quad \\text{[rpm]}$$$p = 6$ 일 때:$$N_s = \\frac{120 \\times 60}{6} = 1,200 \\quad \\text{[rpm]}$$$p = 8$ 일 때:$$N_s = \\frac{120 \\times 60}{8} = 900 \\quad \\text{[rpm]}$$","img":null},{"id":10,"text":"6극 슬롯수 54의 동기기가 있다. 전기자 코일의 두 변이 제 1슬롯과 제 9슬롯에 연결된다고 한다. 기본파에 대한 단절권 계수는 약 몇인가?","opts":["$0.449$","$0.643$","$0.802$","$0.985$"],"answer":3,"exp":"극피치(극간격 $\\tau$ ) 계산:$$\\tau = \\frac{\\text{총 슬롯수}}{\\text{극수}} = \\frac{54}{6} = 9 \\text{ [슬롯]}$$코일피치(코일간격 $\\beta$ ) 계산:\n제 1슬롯과 제 9슬롯에 연결되므로 코일피치는 다음과 같아.$$\\beta = 9 - 1 = 8 \\text{ [슬롯]}$$단절권 계수 $k_p$ 계산:\n단절권 계수 공식에 대입하면,$$k_p = \\sin \\left( \\frac{\\beta}{\\tau} \\times \\frac{\\pi}{2} \\right) = \\sin \\left( \\frac{8}{9} \\times 90^\\circ \\right) = \\sin (80^\\circ) \\approx 0.9848 \\approx 0.985$$","img":null},{"id":11,"text":"기본파의 $60 \\text{ [\\%]}$ 인 제3고조파와 $80 \\text{ [\\%]}$ 인 제5고조파를 포함하는 전압의 왜형률은?","opts":["$0.3$","$0.8$","$1$","$0.5$"],"answer":2,"exp":"왜형률(Distortion Factor)은 기본파의 실효값에 대한 전고조파(모든 고조파)의 실효값의 비로 정의돼.$$\\text{왜형률} = \\frac{\\sqrt{\\text{(제3고조파)}^2 + \\text{(제5고조파)}^2 + \\cdots}}{\\text{기본파}}$$기본파의 크기를 $100 \\text{ [\\%]}$ (또는 $1$ )이라 하면, 제3고조파는 $60 \\text{ [\\%]}$ ( $0.6$ ), 제5고조파는 $80 \\text{ [\\%]}$ ( $0.8$ )이 되므로 대입해서 계산할 수 있어.$$\\text{왜형률} = \\frac{\\sqrt{0.6^2 + 0.8^2}}{1} = \\sqrt{0.36 + 0.64} = \\sqrt{1} = 1$$","img":null},{"id":12,"text":"$v = 100 \\sqrt{2} \\sin \\omega t + 50 \\sqrt{2} \\sin \\left( 3 \\omega t + \\frac{\\pi}{6} \\right) \\text{ [V]} ,$ $i = 40 \\sqrt{2} \\sin \\left( 3 \\omega t - \\frac{\\pi}{6} \\right) + 100 \\sqrt{2} \\sin 5 \\omega t \\text{ [A]}$ 일 때, 이 회로에서 소비되는 전력은 약 몇 $\\text{[kW]}$ 인가?","opts":["$2$","$4.9$","$5.2$","$1$"],"answer":3,"exp":"비정현파 교류 회로에서 소비되는 전체 전력은 주파수가 같은 동기 고조파 성분끼리의 곱(전압 실효값 $\\times$ 전류 실효값 $\\times$ 역률)의 합으로 구해집니다. 주어진 전압과 전류의 각 주파수 성분을 나누어 살펴보면 다음과 같습니다.기본파 성분 ($\\omega$):전압: $V_1 = 100 \\text{ [V]}$전류: $I_1 = 0 \\text{ [A]}$ (전류에 기본파 성분이 없음)전력 $P_1 = 0$제3고조파 성분 ($3\\omega$):전압 실효값 $V_3 = 50 \\text{ [V]}$, 위상 $\\theta_v = \\frac{\\pi}{6}$전류 실효값 $I_3 = 40 \\text{ [A]}$, 위상 $\\theta_i = -\\frac{\\pi}{6}$두 성분 간의 위상차 $\\theta = \\theta_v - \\theta_i = \\frac{\\pi}{6} - \\left( -\\frac{\\pi}{6} \\right) = \\frac{\\pi}{3}$ ($60^\\circ$)전력 $P_3 = V_3 I_3 \\cos \\theta = 50 \\times 40 \\times \\cos\\left(\\frac{\\pi}{3}\\right) = 2,000 \\times \\frac{1}{2} = 1,000 \\text{ [W]} = 1 \\text{ [kW]}$제5고조파 성분 ($5\\omega$):전압: $V_5 = 0 \\text{ [V]}$ (전압에 제5고조파 성분이 없음)전류: $I_5 = 100 \\text{ [A]}$전력 $P_5 = 0$따라서 회전 전체에서 소비되는 총 전력 $P$ 는 다음과 같습니다.$$P = P_1 + P_3 + P_5 = 0 + 1 + 0 = 1 \\quad \\text{[kW]}$$","img":null},{"id":13,"text":"다음의 회로에서 전류 $i(t)$ 를 나타낸 식은?","opts":["$i(t) = \\frac{q(t)v(t)}{C}$","$i(t) = C \\frac{dq(t)}{dt}$","$i(t) = \\frac{q(t)}{j\\omega C}$","$i(t) = C \\frac{v(t)}{dt}$"],"answer":3,"exp":"콘덴서(커패시터) 회로에서 축적되는 전하량 $q(t)$ 와 전압 $v(t)$ , 그리고 전류 $i(t)$ 사이의 관계를 이용하면 돼.콘덴서의 전하량 $q(t)$ 와 전압 $v(t)$ 의 관계는 다음과 같아.$$q(t) = C v(t)$$전류 $i(t)$ 는 단위 시간당 흐르는 전하량의 변화율(즉, 전하량을 시간에 대해 미분한 값)이므로 다음과 같이 표현돼.$$i(t) = \\frac{dq(t)}{dt}$$여기에 $q(t) = C v(t)$ 관계식을 대입하면 전류 식을 다음과 같이 쓸 수 있어.$$i(t) = \\frac{d}{dt} [C v(t)] = C \\frac{dv(t)}{dt}$$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCADXAVMDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6+NFFFABRRS0AJRS0lABRRS0AJRiiigAoopaAEopc0ZoASiiigAooooAKKUUtADaKdRQAg60tA60tACUoooNAC0UnNLQAhpMU6kxQAmKMUfhRQAYoxRRQAoUUtNzSigBaKKKAEIzTcGn0UAMwaMGn0UAIBxRS0UAR0tJS0AI5CIXYgKBkn0rwSf44eNvFOqagnwk+G7+JtH02fyJtUub5LZJnH3liDYz9cn1x0r2zxNZT6n4b1PTbac2893aSwRyjqjMhA -6} [\\text{F}]$$$X_C = \\frac{1}{2 \\pi \\times 50 \\times 10 \\times 10^{-6}} = \\frac{1}{100 \\pi \\times 10^{-6}} = \\frac{10^6}{100 \\pi} = \\frac{10000}{\\pi} \\approx 318.31 [\\Omega]$$전체 임피던스 ($Z$) 계산:$$Z = \\sqrt{R^2 + X_C^2}$$주어진 값 대입 ($R = 100 [\\Omega]$):$$Z = \\sqrt{100^2 + 318.31^2} = \\sqrt{10000 + 101321.25} = \\sqrt{111321.25} \\approx 333.65 [\\Omega]$$역률 ($\\cos \\theta$) 계산:$$\\cos \\theta = \\frac{R}{Z}$$$$\\cos \\theta = \\frac{100}{333.65} \\approx 0.2997 \\approx 0.3$$","img":null},{"id":24,"text":"그림과 같은 회로가 정저항 회로가 되기 위한 $R [\\Omega]$ 의 값은 얼마인가?","opts":["$200$","$2$","$2 \\times 10^{-2}$","$2 \\times 10^{-4}$"],"answer":0,"exp":"정저항 회로의 조건식:$$R = \\sqrt{\\frac{L}{C}}$$주어진 수치 대입:$L = 4 [\\text{mH}] = 4 \\times 10^{-3} [\\text{H}]$$C = 0.1 [\\mu\\text{F}] = 0.1 \\times 10^{-6} [\\text{F}] = 10^{-7} [\\text{F}]$계산:$$R = \\sqrt{\\frac{4 \\times 10^{-3}}{10^{-7}}} = \\sqrt{4 \\times 10^4} = 2 \\times 10^2 = 200 [\\Omega]$$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCACyAY0DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7CooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACkpaKAEpaKKACiiigBDQKWigAooooAKKKKACiiigAooooAKKKKACiiigAooxRigAooxS4oATFAFLRQAUUUUAB6UlLRQAlFLRQAlFLRQAlFGKMUAFFGKMUAFFGKMUAFFGKXFACUU 식은 다음과 같습니다.$$P_{in} = \\sqrt{3} V_L I_L \\cos \\theta$$이를 선전류 $I_L$ 에 대해 정리하면,$$I_L = \\frac{P_{in}}{\\sqrt{3} V_L \\cos \\theta}$$수치 대입 및 선전류 계산:$V_L = 200 [\\text{V}]$$\\cos \\theta = 0.85$$$I_L = \\frac{8288.89}{\\sqrt{3} \\times 200 \\times 0.85} = \\frac{8288.89}{1.732 \\times 200 \\times 0.85} = \\frac{8288.89}{294.44} \\approx 28.15 [\\text{A}]$$","img":null},{"id":30,"text":"그림과 같은 회로의 출력전압 $e_o ( t )$ 의 위상은 입력 전압 $e_i ( t )$ 의 위상보다 어떻게 되는가?","opts":["앞선다.","뒤진다.","같다.","앞설 수도 있고, 뒤질 수도 있다."],"answer":1,"exp":"","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCADwAVcDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7BxRilooATFGKWigBMUYpaKAExRilooAKKKKACiiigAooooAKKKKACiijFABRRijFABRRijFABSgUgHrS0AFGKKKADFGKKKADFGKKKAENFKRSYoAKMUYpaAExRilooATFGKWigBMUYpaKAExSiiigAooooASiiigAooooAKKKKACiiigAooooAKKU9KSgAoFFAoAqa5qEek6Ne6nLG8kdnbvO6pjcVRSxAzxnArnfhV43g+IPhS38S2Wj6jptjc5Nv9tVVaVQSNwCk8cVgftQa5JofwP8SNbZN3qFuNMtVX7zSXDCIY9wGJ/Ctzwk2keC9K8KeAlkJu1sFggjQbjshjAZ29BnHPqQKAOxFFAooAKKKKACiiigAooooAKKKKAFFBFAoNACUUUUAFFFFABRRRQAUUUCgAopcUYoASilNJQAUUUUAFFFFACUUYoxQAUUGq2pXttp1hNfXknlW8C75HwTtHrgc0AWaK8gsfjd4Vl+Jt/pD69F/ZEelQ3ERNs4ImMjBv4c427a7n4h+L7fwp4Ok15Ld755Hhhs4Y8fv5pnVIlz2BZhk+maAOmorya6+J+q+DPFNjpHxTt9E0q11WCSSwvrCeSSISR const title=" 26년 1회 산업기사 51~100";
let cur=0,score=0,ans=new Array(QS.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return '해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+QS.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=QS[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div></div>';
  const isLast=cur===QS.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+QS.length+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===QS[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(QS.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function result(){

    '<div class="ring-pct" style="color:'+(pass?'#3fb950':'#f85149')+'">'+pct+'%</div></div>'+

    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div><button class="retry" onclick="restart()">🔄 다시 풀기</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function restart(){cur=0;score=0;ans=new Array(QS.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/QS.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
</body>
</html>
