<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>26년 3회 산업기사 51~100</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>

  </div>

</div>
<div class="main" id="main"></div>

<script>
const QS=[{"id":1,"text":"동기발전기의 병렬운전에 필요한 조건이 아닌 것은?","opts":["기전력의 크기가 같을 것","기전력의 위상이 같을 것","기전력의 주파수가 같을 것","출력 용량이 같을 것"],"answer":3,"exp":"","img":null},{"id":2,"text":"변압기의 벡터도에서 1차 단자전압($\\dot{V}_1$)을 나타내는 식은? (단, $\\dot{V}_1$ : 1차 단자전압, $V_1 = (-\\dot{E}_1)$ : 1차 유도기전력, $Z_1$ : 1차 권선 임피던스, $\\dot{I}_w$ : 철손전류, $\\dot{I}_\\mu$ : 자화전류, $\\dot{I}_1$ : 1차 부하전류이다)","opts":["$\\dot{V}_1 = V_1 - (\\dot{I}_w + \\dot{I}_\\mu + \\dot{I}_1) Z_1$","$\\dot{V}_1 = V_1 + (\\dot{I}_w - \\dot{I}_\\mu - \\dot{I}_1) Z_1$","$\\dot{V}_1 = V_1 - (\\dot{I}_w + \\dot{I}_\\mu - \\dot{I}_1) Z_1$","$\\dot{V}_1 = V_1 + (\\dot{I}_w + \\dot{I}_\\mu + \\dot{I}_1) Z_1$"],"answer":3,"exp":"1차 유도기전력($V_1$) 기준으로 단자전압을 구할 때\n권선 임피던스에 의한 전압강하는 방향을 고려해서 더해준다.\n\n철손전류($\\dot{I}_w$), 자화전류($\\dot{I}_\\mu$), 부하전류($\\dot{I}_1$)를 모두 합친 전체 1차 전류가 흘러서 생기는 전압강하를 더해주는 형태\n\nhttps://youtu.be/4E4QaFkAJ40?t=1511 참고","img":null},{"id":3,"text":"변압기의 임피던스 전압이란?","opts":["무부하 전류에 의한 2차측 단자전압","단락 전류에 의한 변압기 내부 전압 강하","정격 전류에 의한 변압기 내부 전압 강하","정격 전류시 2차측 단자전압"],"answer":2,"exp":"퍼센트 임피던스 $\\%Z = \\frac{I_n \\cdot Z_1}{V_{1m}} \\times 100$\n\n여기서 분자에 있는 $I_n \\cdot Z_1$은 정격전류와 1차 권선 임피던스를 곱한 값으로, 앞서 살펴본 '내부 전압 강하(임피던스 전압 $V_s$)'를 의미\n\n분모는 기준이 되는 전압(정격전압)을 뜻함.","img":null},{"id":4,"text":"220[V], 60[Hz], 4극의 3상 유도전동기가 있다. 전부하에서의 출력은 10[kW]이고, 회전수가 1,700[rpm]이라면 동기 와트는 약 몇 [W]인가?","opts":["56.2","67.6","10,588","12,479"],"answer":2,"exp":"동기속도 $N_s = \\frac{120 \\times f}{P} = \\frac{120 \\times 60}{4} = 1,800[\\text{rpm}]$ \n슬립 $s$는 $\\frac{1,800 - 1,700}{1,800} = \\frac{1}{18}$\n동기 와트($P_s$)는 출력 $P_o$를 (1 - s)로 나눠서 구하니까, $P_s = \\frac{10,000}{1 - \\frac{1}{18}} = \\frac{180,000}{17} \\approx 10,588\\text{ W}$","img":null},{"id":5,"text":"단방향성 4단자 사이리스터는?","opts":["TRIAC","SCS","SCR","SSS"],"answer":1,"exp":"4단자는 SCS 하나, \nTRIAC, SCR는 3단자.\nSSS는 2단자.","img":null},{"id":6,"text":"서보기구의 위치 검출에 사용되는 것이 아닌 것은?","opts":["벨로즈(Bellows)","싱크로(Synchro)","엔코더(Encoder)","포텐서미터(Potentiometer)"],"answer":0,"exp":"벨로즈는 압력검출에 사용된다.","img":null},{"id":7,"text":"직류 분권전동기가 있다. 여기에 전원전압 120[V]를 가했을 때 전기자 전류 35[A]가 흐르고 회전수는 1,300[rpm]이었다. 이때 계자전류 및 부하전류를 일정하게 유지하고 전원전압을 150[V]로 올리면 회전수[rpm]는 약 얼마인가?(단, 전기자 저항은 0.4[Ω]이다)","opts":["1,543","1,668","1,825","2,040"],"answer":1,"exp":"직류 분권전동기에서 회전수 $N$은 역기전력 $E$에 비례하고 자속 $\\Phi$에 반비례해 ($N \\propto \\frac{E}{\\Phi}$). 계자 전류가 일정하므로 자속 $\\Phi$는 일정\n\n첫 번째 상태일 때의 역기전력 $E_1$\n$E_1 = V_1 - I_{a1}R_a = 120 - (35 \\times 0.4) = 120 - 14 = 106[\\text{V}]$\n\n두 번째 상태일 때 전원전압은 150부하전류(전기자 전류)가 일정하므로 ($I_{a2} = 35[\\text{A}]$), 역기전력 $E_2$는\n$E_2 = V_2 - I_{a2}R_a = 150 - (35 \\times 0.4) = 150 - 14 = 136[\\text{V}]$\n\n회전수는 역기전력에 비례하므로 비율식을 세우면:\n$\\frac{N_2}{N_1} = \\frac{E_2}{E_1}$\n\n따라서 나중 회전수 $N_2$는:\n$N_2 = N_1 \\times \\frac{E_2}{E_1} = 1,300 \\times \\frac{136}{106} \\approx 1,667.92[\\text{rpm}] \\approx 1,668[\\text{rpm}]$","img":null},{"id":8,"text":"1차 전압 100[V], 2차 전압 200[V], 선로출력 50[kVA]인 단권변압기에서 자기용량[kVA]은?","opts":["25","50","250","500"],"answer":0,"exp":"단권변압기의 자기용량($W_s$)은 선로출력($W_L$)에 전압비를 곱해서 구함.\n공식으로 쓰면 $W_s = W_L \\times \\frac{\\vert{}V_1 - V_2\\vert{}}{V_2}$ 또는 자기용량 = 선로출력 $\\times \\frac{\\text{고압측 전압 - 저압측 전압}}{\\text{고압측 전압}}$\n\n여기에 값들을 대입해 보면:\n$50 \\times \\frac{200 - 100}{200} = 50 \\times \\frac{100}{200} = 50 \\times \\frac{1}{2} = 25[\\text{kVA}]$","img":null},{"id":9,"text":"30[kW]의 3상 유도전동기에 전력을 공급할 때 2대의 단상변압기를 사용하는 경우 변압기 1대의 용량은 약 몇 [kVA]인가?(단, 전동기의 역률과 효율은 각각 84[%], 86[%]이고, 전동기 손실은 무시한다)","opts":["17","24","51","72"],"answer":1,"exp":"3상 유도전동기에 V결선(단상변압기 2대)으로 전력을 공급할 때, 변압기 1대의 용량($Q_1$)을 구하는 공식\n$Q_1 = \\frac{\\text{전동기 출력}}{\\sqrt{3} \\times \\text{역률} \\times \\text{효율}} = \\frac{30}{\\sqrt{3} \\times 0.84 \\times 0.86}$\n$$Q_1 = \\frac{30}{\\sqrt{3} \\times 0.84 \\times 0.86} = \\frac{30}{1.732 \\times 0.84 \\times 0.86} \\approx 23.98[\\text{kVA}]$$","img":null},{"id":10,"text":"25[kW], 235[V], 1,200[rpm]의 직류 타여자 발전기가 있다. 전기자 저항(브러시 저항 포함)은 0.4[Ω]이다. 이 발전기를 정격 상태에서 운전하고 있을 때 속도를 200[rpm]으로 저하시켰다면 발전기의 유도기전력은 어떻게 변화하겠는가? 단, 정상상태에서 유기기전력을 $E$라 한다.","opts":["$\\frac{1}{2}E$","$\\frac{1}{4}E$","$\\frac{1}{6}E$","$\\frac{1}{8}E$"],"answer":2,"exp":"직류 타여자 발전기의 유기기전력($E$)은 자속($\\Phi$)과 회전수($N$)의 곱에 비례\n$E = K\\Phi N$\n\n타여자 발전기 특성상 계자전류가 일정하므로 자속 $\\Phi$도 일정\n따라서 기전력은 회전수 $N$에만 비례($E \\propto N$)\n\n$$\\frac{N_2}{N_1} = \\frac{200}{1,200} = \\frac{1}{6}$$","img":null},{"id":11,"text":"$F(s) = \\frac{s+1}{s^2+2s}$ 의 라플라스 역변환은?","opts":["$\\frac{1}{2}(1 + e^{-2t})$","$\\frac{1}{2}(1 - e^{-2t})$","$\\frac{1}{2}(1 + e^t)$","$\\frac{1}{2}(1 - e^{-t})$"],"answer":0,"exp":"주어진 전달함수 F(s) 의 분모를 인수분해\n$F ( s ) = \\frac{s + 1}{s ( s + 2 ) }$\n\n부분분수 전개법을 이용하여 $F ( s )$ 를 간단한 항의 합으로 나눔\n$F ( s ) = \\frac{A}{s} + \\frac{B}{s + 2}$\n\n양변에 $s ( s + 2 )$ 를 곱하여 계수 $A$ 와 $B$ 를 구합니다.\n$s + 1 = A ( s + 2 ) + B s$\n\n$s = 0$ 을 대입하면:\n$1 = 2 A \\implies A = \\frac{1}{2}$\n\n$s = -2$ 를 대입하면:\n$-2 + 1 = B ( -2 ) \\implies -1 = -2 B \\implies B = \\frac{1}{2}$\n\n따라서 부분분수 전개된 식\n$F ( s ) = \\frac{\\frac{1}{2}}{s} + \\frac{\\frac{1}{2}}{s + 2} = \\frac{1}{2} \\left( \\frac{1}{s} + \\frac{1}{s + 2} \\right)$\n\n각 항을 라플라스 역변환\n$\\mathcal{L}^{-1} \\left[ \\frac{1}{s} \\right] = 1$\n$\\mathcal{L}^{-1} \\left[ \\frac{1}{s + 2} \\right] = e^{-2t}$\n\n역변환 결과를 합치면 $f ( t ) = \\frac{1}{2} ( 1 + e^{-2t} )$\n","img":null},{"id":12,"text":"$r [\\Omega]$ 인 6개의 저항을 그림과 같이 접속하고 평형 3상 전압 $E$ 를 가했을 때 전류 $I$ 는 몇 $[A]$ 인가? 단, $r = 3 [\\Omega]$, $E = 60 [V]$ 이다.","opts":["8.66","9.56","10.8","12.6"],"answer":0,"exp":"내부 $\\Delta$ 회로의 Y 등가 변환:\n내부의 델타 결선 저항 $r = 3 [\\Omega]$ 3개를 와이 결선으로 변환하면 한 상의 저항은\n$$r_Y = \\frac{r}{3} = \\frac{3}{3} = 1 [\\Omega]$$\n\n선로에 직렬로 연결된 저항 $r = 3 [\\Omega]$ 과 변환된 Y 등가 저항 $r_Y = 1 [\\Omega]$ 이 직렬이므로 한 상의 총 임피던스\n$$Z_s = r + r_Y = 3 + 1 = 4 [\\Omega]$$\n\n선전류 I\n$$I = \\frac{\\sqrt{3} \\times E}{3 \\times Z_s} \\quad \\text{또는} \\quad I = \\frac{E}{\\sqrt{3} \\times Z_s}$$\n\n$$I = \\frac{60}{\\sqrt{3} \\times 4} = \\frac{60}{4\\sqrt{3}} = \\frac{15}{\\sqrt{3}} \\approx 8.66 \\ [\\mathrm{A}]$$"," ,"$10,000$","$5,000$","$5,000 \\sqrt{3}$"],"answer":0,"exp":"서로 다른 주파수 $\\omega_1$ 과 $\\omega_2$ 를 가진 정현파의 곱을 한 주기 동안 적분하면 그 값은 항상 $0$ 이 돼. 즉, 주파수가 다른 전압과 전류 사이에서는 유효전력이 소비되지 않아 평균전력이 $0$ ","img":null},{"id":19,"text":"어떤 회로에 $E = 40 + j 30 [ \\text{V} ]$ 의 전압을 가하면 $I = 30 + j 10 [ \\text{A} ]$ 의 전류가 흐른다. 이 회로의 역률은?","opts":["$0.456$","$0.567$","$0.854$","$0.949$"],"answer":3,"exp":"임피던스 $Z = \\frac{V}{I}$ 를 먼저 구한 다음, 역률 공식 $\\cos \\theta = \\frac{R}{\\vert{}Z\\vert{}}$ (또는 $\\frac{R}{Z}$ 의 크기 비)를 이용\n$$Z = \\frac{V}{I} = \\frac{40 + j 30}{30 + j 10}$$\n\n임피던스\n$$Z = \\frac{1,500 + j 500}{1,000} = 1.5 + j 0.5$$\n\n임피던스의 크기 $\\vert{}Z\\vert{} = \\sqrt{1.5^2 + 0.5^2} = \\sqrt{2.25 + 0.25} = \\sqrt{2.5} \\approx 1.5811$ 므로,\n역률 $\\cos \\theta = \\frac{R}{\\vert{}Z\\vert{}} = \\frac{1.5}{1.5811} \\approx 0.9487 \\approx 0.949$\n","img":null},{"id":20,"text":"저항 $4 [ \\Omega ]$ 과 $X_L$ 의 유도 리액턴스가 병렬로 접속된 회로에 $12 [ \\text{V} ]$ 의 교류 전압을 가하니 $5 [ \\text{A} ]$ 의 전류가 흐른다. 이 회로의 리액턴스 $X_L$ 의 값 $[ \\Omega ]$ 은?","opts":["$8$","$6$","$3$","$1$"],"answer":2,"exp":"5[A]의 전류가 흐르는 병렬회로에서,\n저항에 흐르는 전류는 12/4 = 3[A], \n인덕터에 흐르는 전류는 4[A] (전류끼리 피타고라스 정리를 통하여 도출)\n\n* 12[V]에 4[A]가 흐르는 인덕터의 값은 3","img":null},{"id":21,"text":"3대의 단상변압기를 $\\Delta$ 결선으로 하여 운전하던 중 변압기 1대를 고장으로 제거하여 V결선으로 한 경우 공급할 수 있는 전력은 고장 전 전력의 몇 $[ \\% ]$ 인가?","opts":["$57.7$","$50.0$","$63.3$","$67.7$"],"answer":0,"exp":"$\\Delta$ 결선 시 3대의 변압기로 공급할 수 있는 전력은 $3P_1$\nV결선 시 2대의 변압기로 공급할 수 있는 출력은 $\\sqrt{3} P_1 \\approx 1.732 P_1$\n\n$$\\frac{\\sqrt{3} P_1}{3 P_1} \\times 100 = \\frac{\\sqrt{3}}{3} \\times 100 = \\frac{1}{\\sqrt{3}} \\times 100 \\approx 57.73 [ \\% ]$$\n","img":null},{"id":22,"text":"저항 $R_1 = 10 [ \\Omega ]$ 과 $R_2 = 40 [ \\Omega ]$ 이 직렬로 접속된 회로에 $100 [ \\text{V} ]$ , $60 [ \\text{Hz} ]$ 인 정현파 교류전압을 인가할 때, 이 회로에 흐르는 전류로 옳은 것은?","opts":["$\\sqrt{2} \\sin 377 t [ \\text{A} ]$","$2 \\sqrt{2} \\sin 377 t [ \\text{A} ]$","$\\sqrt{2} \\sin 422 t [ \\text{A} ]$","$2 \\sqrt{2} \\sin 422 t [ \\text{A} ]$"],"answer":1,"exp":"합성저항\n$$R = R_1 + R_2 = 10 + 40 = 50 [ \\Omega ]$$\n\n전압의 실효값 $V = 100 [ \\text{V} ]$ 이므로, 회로에 흐르는 전류의 실효값 $I$\n$$I = \\frac{V}{R} = \\frac{100}{50} = 2 [ \\text{A} ]$$\n\n정현파 교류의 전류 순시값은 최대값을 기준으로 표현하므로, 전류의 최대값 $I_m$ 은 실효값에 $\\sqrt{2}$ 를 곱함.\n$$I_m = \\sqrt{2} I = 2 \\sqrt{2} [ \\text{A} ]$$\n\n주파수 $f = 60 [ \\text{Hz} ]$ 이므로 각주파수 $\\omega$ \n$$\\omega = 2 \\pi f = 2 \\pi \\times 60 \\approx 377 [ \\text{rad/sec} ]$$\n\n* $$i(t) = 2 \\sqrt{2} \\sin 377 t [ \\text{A} ]$$","img":null},{"id":23,"text":"콘덴서 양단의 전위차와 콘덴서에 축적되는 에너지와의 관계는?","opts":["전위차가 클수록 에너지는 작다.","전위차가 클수록 에너지는 크다.","전위차에 관계없이 에너지는 항상 일정하다.","에너지량에 관계없이 전위차는 항상 일정하다."],"answer":1,"exp":"$$W = \\frac{1}{2} C V^2$$\n$C$ 는 정전용량, $V$ 는 콘덴서 양단의 전위차\n\n\n","img":null},{"id":24,"text":"시정수 $\\tau$ 를 갖는 $R L$ 직렬회로에 직류전압을 가할 때 $t = 3 \\tau$ 가 되는 시점에 회로에 흐르는 전류는 정상상태 전류의 약 몇 $[ \\% ]$ 가 되는가?","opts":["$98$","$86$","$63$","$95$"],"answer":3,"exp":"전류의 순시값\n$$i(t) = I_0 \\left( 1 - e^{-\\frac{t}{\\tau}} \\right)$$\n\n$t = 3 \\tau$ 일 때\n$$i(3\\tau) = I_0 \\left( 1 - e^{-\\frac{3\\tau}{\\tau}} \\right) = I_0 \\left( 1 - e^{-3} \\right)$$\n\n$e^{-3} \\approx 0.0498$\n$$i(3\\tau) = I_0 ( 1 - 0.0498 ) = I_0 \\times 0.9502 \\approx 0.95 I_0$$","img":null},{"id":25,"text":"최대치가 $100 [ \\text{V} ]$ 이고 주파수가 $60 [ \\text{Hz} ]$ 인 정현파 전압이 $t = 0$ 일 때 전압의 크기가 $50 [ \\text{V} ]$ 이고 이 순간에 정현파 전압의 크기가 감소하고 있었다. 이 정현파 전압의 순시치 $v(t)$ 는 몇 $[ \\text{V} ]$ 인가?","opts":["$v(t) = 100 \\sin ( 120 \\pi t + 135^\\circ )$","$v(t) = 100 \\sin ( 120 \\pi t + 150^\\circ )$","$v(t) = 100 \\sin ( 120 \\pi t + 45^\\circ )$","$v(t) = 100 \\sin ( 120 \\pi t + 30^\\circ )$"],"answer":1,"exp":"정현파 교류전압의 순시치 기본 형식\n$$v(t) = V_m \\sin ( \\omega t + \\theta )$$\n\n각주파수 $\\omega = 2 \\pi f = 2 \\pi \\times 60 = 120 \\pi [ \\text{rad/sec} ]$\n최대치 $V_m = 100 [ \\text{V} ]$\n\n$t = 0$ 일 때 $v(0) = 50 [ \\text{V} ]$ \n$$v(0) = 100 \\sin ( \\theta ) = 50 \\implies \\sin \\theta = \\frac{1}{2}$$\n이를 만족하는 각도는 $30^\\circ$ 와 $150^\\circ$ \n\n\"전압의 크기가 감소하고 있었다\"는 것은 시간에 따른 변화율(미분값)이 음수\n$t = 0$ 일 때 $\\cos \\theta < 0$ 이어야 하므로, 코사인 값이 음수가 되는 제2사분면의 각도인 $\\theta = 150^\\circ$\n","img":null},{"id":26,"text":"$\\cos \\omega t$ 의 라플라스 변환은?","opts":["$\\frac{\\omega}{s^2 + \\omega^2}$","$\\frac{\\omega}{s^2 - \\omega^2}$","$\\frac{s}{s^2 + \\omega^2}$","$\\frac{s}{s^2 - \\omega^2}$"],"answer":2,"exp":"$\\sin \\omega t$ 의 라플라스 변환\n$$\\mathcal{L} \\{ \\sin \\omega t \\} = \\frac{\\omega}{s^2 + \\omega^2}$$\n\n$\\cos \\omega t$ 의 라플라스 변환\n$$\\mathcal{L} \\{ \\cos \\omega t \\} = \\frac{s}{s^2 + \\omega^2}$$","img":null},{"id":27,"text":"임피던스 궤적이 직선일 때 이의 역수인 어드미턴스 궤적은?","opts":["원점을 통하는 직선","원점을 통하지 않는 직선","원점을 통하는 원","원점을 통하지 않는 원"],"answer":2,"exp":"임피던스의 궤적이 직선 → 어드미턴스의 궤적은 원이 된다.\n이때, 원은 모두 원점을 통과한다.","img":null},{"id":28,"text":"3상 불평형 전압을 $V_a$ , $V_b$ , $V_c$ 라고 할 때 영상전압은?","opts":["$\\frac{1}{3} ( V_a + a V_b + a^2 V_c )$","$\\frac{1}{3} ( V_a + a^2 V_b + a V_c )$","$\\frac{1}{3} ( V_a + a^2 V_b + V_c )$","$\\frac{1}{3} ( V_a + V_b + V_c )$"],"answer":3,"exp":"대칭분 전압의 종류\n\n영상전압 ($V_0$): $V_0 = \\frac{1}{3} ( V_a + V_b + V_c )$\n정상전압 ($V_1$): $V_1 = \\frac{1}{3} ( V_a + a V_b + a^2 V_c )$\n역상전압 ($V_2$): $V_2 = \\frac{1}{3} ( V_a + a^2 V_b + a V_c )$\n\n","img":null},{"id":29,"text":"주기함수 $f(t)$ 의 푸리에 급수 전개식으로 옳은 것은?","opts":["$f(t) = \\sum_{n=1}^{\\infty} a_n \\sin n \\omega t + \\sum_{n=1}^{\\infty} b_n \\sin n \\omega t$","$f(t) = b_o + \\sum_{n=2}^{\\infty} a_n \\sin n \\omega t + \\sum_{n=2}^{\\infty} b_n \\cos n \\omega t$","$f(t) = a_0 + \\sum_{n=1}^{\\infty} a_n \\cos n \\omega t + \\sum_{n=1}^{\\infty} b_n \\sin n \\omega t$","$f(t) = \\sum_{n=1}^{\\infty} a_n \\cos n \\omega t + \\sum_{n=1}^{\\infty} b_n \\cos n \\omega t$"],"answer":2,"exp":"푸리에 급수의 기본 식\n$$f(t) = a_0 + \\sum_{n=1}^{\\infty} ( a_n \\cos n \\omega t + b_n \\sin n \\omega t )$$\n\n","img":null},{"id":30,"text":"그림과 같은 순저항으로 된 회로에 대칭 3상 전압을 가했을 때 각 선에 흐르는 전류가 같으려면 $R [ \\Omega ]$ 의 값은?","opts":["$20$","$25$","$30$","$35$"],"answer":1,"exp" const title="26년 3회 산업기사 51~100";
let cur=0,score=0,ans=new Array(QS.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return '해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+QS.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=QS[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div></div>';
  const isLast=cur===QS.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+QS.length+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===QS[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(QS.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function result(){
  const total=QS.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100),pass=pct>=60;
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+(pass?'#3fb950':'#f85149')+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+(pass?'#3fb950':'#f85149')+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+(pass?'🎉 합격!':'😥 불합격')+'</div>'+
    '<div class="res-sub">'+(pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다')+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div><button class="retry" onclick="restart()">🔄 다시 풀기</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function restart(){cur=0;score=0;ans=new Array(QS.length).fill(null);cache={};render();}
