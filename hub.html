<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CBT 허브</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:15px;padding:14px 14px 60px;max-width:640px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
h1{flex:1;font-size:19px;font-weight:900;color:#58a6ff}
.sub{font-size:11px;color:#8b949e;margin-bottom:14px}
button{font-family:inherit;cursor:pointer}
.b{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:9px;padding:7px 11px;font-size:12px;font-weight:700}
.b.red{color:#f85149}.b.on{background:#58a6ff;color:#0d1117;border-color:#58a6ff}
.grp{margin-bottom:18px}
.gh{border-bottom:2px solid #58a6ff;padding-bottom:6px;margin-bottom:8px}
.gh h2{font-size:15px;font-weight:800}
.lk{background:#161b22;border:1px solid #30363d;border-radius:11px;padding:11px 13px;margin-bottom:7px;display:flex;gap:10px;align-items:flex-start}
.lk .m{flex:1;min-width:0}
.lk a{color:#e6edf3;font-weight:700;text-decoration:none;display:block;word-break:keep-all}
.st{font-size:12px;color:#8b949e;margin-top:4px;line-height:1.6}
.st b{color:#3fb950}.st .w{color:#f85149}
.rs{background:none;border:1px solid #30363d;color:#8b949e;border-radius:8px;padding:3px 8px;font-size:11px}
.empty{color:#8b949e;font-size:13px;padding:20px 0;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:#161b22;border:1px solid #30363d;border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:16px;max-height:85vh;overflow:auto}
.sheet h3{font-size:15px;margin-bottom:10px}
.sheet .b{display:block;width:100%;margin-bottom:7px;padding:11px;text-align:left}
textarea{width:100%;height:150px;background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:9px;padding:9px;font-size:12px;word-break:break-all}
.note{font-size:12px;color:#8b949e;margin:6px 0 10px;line-height:1.6}
</style>
</head>
<body>
<div class="top"><h1 id="ttl"></h1><button class="b" id="bMenu">메뉴</button></div>
<div class="sub" id="sub"></div>
<div id="app"></div>
<script>
const HUB={"title":"CBT 허브","groups":[{"name":"23년도 문제","links":[{"t":"23년 1회 001 - 050","u":"https://puouq87.github.io/23_1_01to50.html"},{"t":"23년 1회 051 - 100","u":"https://puouq87.github.io/23_1_51to100.html"},{"t":"23년 2회 001 - 050","u":"https://puouq87.github.io/23_2_01to50.html"},{"t":"23년 2회 051 - 100","u":"https://puouq87.github.io/23_2_51to100.html"},{"t":"23년 3회 001 - 050","u":"https://puouq87.github.io/23_3_01to50.html"},{"t":"23년 3회 051 - 100","u":"https://puouq87.github.io/23_3_51to100.html"}]},{"name":"24년도 문제","links":[{"t":"24년 1회 001 - 050","u":"https://puouq87.github.io/24_1_01to50.html"},{"t":"24년 1회 051 - 100","u":"https://puouq87.github.io/24_1_51to100.html"},{"t":"24년 2회 001 - 050","u":"https://puouq87.github.io/24_2_01to50.html"},{"t":"24년 2회 051 - 100","u":"https://puouq87.github.io/24_2_51to100.html"},{"t":"24년 3회 001 - 050","u":"https://puouq87.github.io/24_3_01to50.html"},{"t":"24년 3회 051 - 100","u":"https://puouq87.github.io/24_3_51to100.html"}]},{"name":"25년도 문제","links":[{"t":"25년 1회 001 - 050","u":"https://puouq87.github.io/25_1_01to50.html"},{"t":"25년 1회 051 - 100","u":"https://puouq87.github.io/25_1_51to100.html"},{"t":"25년 2회 001 - 050","u":"https://puouq87.github.io/25_2_01to50.html"},{"t":"25년 2회 051 - 100","u":"https://puouq87.github.io/25_2_50to100.html"},{"t":"25년 3회 001 - 050","u":"https://puouq87.github.io/25_3_01to50.html"},{"t":"25년 3회 051 - 100","u":"https://puouq87.github.io/25_3_51to100.html"}]},{"name":"26년도 문제","links":[{"t":"26년 1회 001 - 050","u":"https://puouq87.github.io/26_1_1to50.html"},{"t":"26년 1회 051 - 100","u":"https://puouq87.github.io/26_1_51to100.html"},{"t":"26년 2회 001 - 050","u":"https://puouq87.github.io/26_2_1to50.html"},{"t":"26년 2회 051 - 100","u":"https://puouq87.github.io/26_2_51to100.html"},{"t":"26년 3회 001 - 050","u":"https://puouq87.github.io/26_3_01to50.html"},{"t":"26년 3회 051 - 100","u":"https://puouq87.github.io/26_3_51to100.html"}]},{"name":"파이널","links":[{"t":"~p23","u":"https://puouq87.github.io/final_p23.html"},{"t":"p26~p39","u":"https://puouq87.github.io/final_p26~p39.html"},{"t":"p40~p52","u":"https://puouq87.github.io/final_p40~p52.html"},{"t":"p54~p68","u":"https://puouq87.github.io/final_p54~p68.html"},{"t":"p69~p82","u":"https://puouq87.github.io/final_p69~p82.html"},{"t":"p83~p100","u":"https://puouq87.github.io/final_p83~p100.html"},{"t":"p101~p114","u":"https://puouq87.github.io/final_p101~p114.html"},{"t":"p115~p130","u":"https://puouq87.github.io/final_p115~p130.html"},{"t":"p131~p144","u":"https://puouq87.github.io/final_p131~p144.html"},{"t":"p149~p161","u":"https://puouq87.github.io/final_p149~p161.html"},{"t":"p162~p174","u":"https://puouq87.github.io/final_p162~p174.html"},{"t":"p175~p191","u":"https://puouq87.github.io/final_p175~p191.htm"},{"t":"p193~p205","u":"https://puouq87.github.io/final_p193~p205.html"},{"t":"p207~p220","u":"https://puouq87.github.io/final_p207~p220.html"},{"t":"p221~p237","u":"https://puouq87.github.io/final_p221~p237.htm"},{"t":"p238~p255","u":"https://puouq87.github.io/final_p238~p255.html"},{"t":"p256~p267","u":"https://puouq87.github.io/final_p256~p267.html"},{"t":"p273~p284","u":"https://puouq87.github.io/final_p273~p284.html"},{"t":"p285~p296","u":"https://puouq87.github.io/final_p285~p296.html"}]}]};
const K='cbtHub.records.v1',BK='cbtHub.lastBackup';
function load(){try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d&&d.exams)return d}catch(e){}return{exams:{}}}
function save(d){try{localStorage.setItem(K,JSON.stringify(d));return true}catch(e){return false}}
function idOf(u){try{const p=decodeURIComponent(new URL(u,location.href).pathname).split('/').pop(),i=p.lastIndexOf('.');return i>0?p.slice(0,i):p}catch(e){return''}}
function enc(o){return'CBTREC1:'+btoa(unescape(encodeURIComponent(JSON.stringify(o))))}
function dec(t){t=String(t||'').replace(/\s+/g,'');if(t.indexOf('CBTREC1:')!==0)return null;try{return JSON.parse(decodeURIComponent(escape(atob(t.slice(8)))))}catch(e){return null}}
function clean(d){
  if(!d||typeof d.exams!=='object')return null;const o={exams:{}};
  Object.keys(d.exams).forEach(function(id){const s=d.exams[id]||{},e={attempts:s.attempts|0,total:s.total|0,last:+s.last||0,lastScore:s.lastScore|0,best:s.best|0,wrong:{}};
    Object.keys(s.wrong||{}).forEach(function(q){const n=s.wrong[q]|0;if(n>0)e.wrong[q]=n});o.exams[id]=e});
  return o;
}
function h(t,a,c){const e=document.createElement(t);for(const k in(a||{})){if(k==='on')for(const v in a.on)e.addEventListener(v,a.on[v]);else if(k==='cls')e.className=a[k];else e.setAttribute(k,a[k])}[].concat(c==null?[]:c).forEach(function(x){e.append(x)});return e}
function safeUrl(u){u=String(u||'').trim();if(/^[a-z][a-z0-9+.-]*:/i.test(u))return/^https?:/i.test(u)?u:'';return u}

function stats(u){
  const e=load().exams[idOf(u)];
  if(!e||!e.attempts)return h('div',{cls:'st'},'아직 응시 기록이 없어요');
  const ws=Object.keys(e.wrong).map(function(q){return[q,e.wrong[q]]}).sort(function(a,b){return b[1]-a[1]||a[0]-b[0]});
  const box=h('div',{cls:'st'},[h('b',0,'응시 '+e.attempts+'회'),' · 최근 '+e.lastScore+'점 · 최고 '+e.best+'점']);
  if(ws.length)box.append(h('br'),h('span',{cls:'w'},'자주 틀린 문항(고유번호) '),ws.slice(0,6).map(function(x){return'#'+x[0]+'×'+x[1]}).join('  '));
  return box;
}
function render(){
  document.getElementById('ttl').textContent=HUB.title||'CBT 허브';document.title=HUB.title||'CBT 허브';
  const lb=+localStorage.getItem(BK),days=lb?Math.floor((Date.now()-lb)/864e5):-1;
  document.getElementById('sub').textContent=days<0?'기록 백업을 아직 하지 않았어요 (메뉴 → 기록 백업)':'마지막 기록 백업: '+(days?days+'일 전':'오늘');
  const app=document.getElementById('app');app.innerHTML='';
  if(!HUB.groups.length)app.append(h('div',{cls:'empty'},'등록된 시험이 없어요'));
  HUB.groups.forEach(function(g){
    const grp=h('div',{cls:'grp'},[h('div',{cls:'gh'},[h('h2',0,g.name)])]);
    g.links.forEach(function(k){
      const u=safeUrl(k.u);if(!u)return;
      grp.append(h('div',{cls:'lk'},[h('div',{cls:'m'},[h('a',{href:u},k.t||idOf(u)),stats(u)]),
        h('button',{cls:'rs',on:{click:function(){if(confirm('"'+(k.t||idOf(u))+'"의 응시·오답 기록을 지울까요?')){const d=load();delete d.exams[idOf(u)];save(d);render()}}}},'초기화')]));
    });
    app.append(grp);
  });
}
function sheet(title,nodes){
  const ov=h('div',{cls:'ov',on:{click:function(e){if(e.target===ov)ov.remove()}}},[h('div',{cls:'sheet'},[h('h3',0,title)].concat(nodes,[h('button',{cls:'b',on:{click:function(){ov.remove()}}},'닫기')]))]);
  document.body.append(ov);return ov;
}
function textOut(text){
  const ta=h('textarea',{readonly:'readonly'});ta.value=text;
  const note=h('div',{cls:'note'},'아래 텍스트를 복사해서 카톡 "나와의 채팅"에 보관하세요.');
  sheet('기록 백업',[note,ta]);ta.focus();ta.select();
  const ok=function(){note.textContent='클립보드에 복사했어요. 카톡 "나와의 채팅"에 붙여넣어 보관하세요.'};
  try{if(navigator.clipboard)navigator.clipboard.writeText(text).then(ok,function(){})}catch(e){}
  try{if(document.execCommand('copy'))ok()}catch(e){}
  localStorage.setItem(BK,Date.now());render();
}
function textIn(){
  const ta=h('textarea');let ov;
  ov=sheet('기록 복원',[h('div',{cls:'note'},'백업한 기록 텍스트를 붙여넣으세요. 현재 기록은 교체돼요.'),ta,h('button',{cls:'b on',on:{click:function(){
    const d=clean(dec(ta.value));if(!d){alert('기록 텍스트가 아니에요. 처음부터 끝까지 그대로 붙여넣었는지 확인해 주세요.');return}
    if(!confirm('시험 '+Object.keys(d.exams).length+'개의 기록으로 바꿀까요?\n현재 기록은 사라져요.'))return;
    save(d);ov.remove();render()}}},'적용')]);
}
document.getElementById('bMenu').onclick=function(){
  let ov;const go=function(f){return function(){ov.remove();f()}};
  ov=sheet('메뉴',[
    h('button',{cls:'b',on:{click:go(function(){textOut(enc(load()))})}},'기록 백업 (응시·오답)'),
    h('button',{cls:'b',on:{click:go(textIn)}},'기록 복원'),
    h('button',{cls:'b red',on:{click:go(function(){
      const v=prompt('모든 시험의 응시·오답 기록이 지워져요.\n계속하려면 "초기화"를 입력하세요.');
      if(v&&v.trim()==='초기화'){save({exams:{}});render()}else if(v!=null)alert('입력이 달라서 취소했어요.')})}},'전체 기록 초기화')]);
};
window.addEventListener('pageshow',render);
render();
</script>
</body>
</html>
