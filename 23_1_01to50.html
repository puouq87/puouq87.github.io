<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>2024년 제1회 전기기능사 CBT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.retry.wrong{background:linear-gradient(135deg,#f85149,#d29922);color:#fff;}
.retry.sub{background:#21262d;color:#8b949e;border:1px solid #30363d;margin-top:8px;}
.res-note{font-size:12px;color:#8b949e;line-height:1.7;margin:-12px 0 20px;word-break:keep-all;}
</style>

":null},{"id":12,"text":"양극판의 면적이 $S$ [ $\\text{m}^2$ ], 극판 간의 간격이 $d$ [m], 정전용량이 $C_1$ [F]인 평행판 콘덴서가 있다. 양극판 면적을 각각 $3S$ [ $\\text{m}^2$ ]로 늘이고 극판 간격을 $\\frac{1}{3} d$ [m]로 줄였을 때의 정전용량 $C_2$ [F]는?","opts":["$C_2 = C_1$","$C_2 = 3C_1$","$C_2 = 6C_1$","$C_2 = 9C_1$"],"answer":3,"exp":"평행판 콘덴서의 정전용량 $C_1 = \\frac{\\epsilon S}{d}$ [F]에서\n양극판 면적을 $3$배로 하고 간격을 $1/3$배로 하면 $C_2 = \\frac{\\epsilon \\cdot 3S}{\\frac{d}{3}} = 9 \\frac{\\epsilon S}{d} = 9C_1$ [F]","img":null,"expImg":null},{"id":13,"text":"면적이 $300$ [ $\\text{cm}^2$ ], 판 간격이 $2$ [cm]인 2장의 전극 사이를 비유전율 $5$ 의 유전체로 채우고 양 전극에 $20$ [kV]의 전압을 인가할 경우 전극 사이에 작용하는 정전력은 약 몇 [N]인가?","opts":["$0.33$","$0.99$","$0.66$","$1.32$"],"answer":2,"exp":"정전응력 $f = \\frac{\\sigma^2}{2\\epsilon_0} = \\frac{1}{2} \\epsilon_0 E^2 = \\frac{D^2}{2\\epsilon_0} = \\frac{1}{2} ED$ [ $\\text{N/m}^2$ ]\n$f = \\frac{1}{2} \\epsilon E^2 = \\frac{1}{2} \\epsilon \\left( \\frac{V}{d} \\right)^2$\n힘 $F = f \\cdot S = \\frac{1}{2} \\epsilon E^2 \\cdot S = \\frac{1}{2} \\epsilon \\left( \\frac{V}{d} \\right)^2 \\cdot S$ [N]\n$= \\frac{1}{2} \\times 5 \\times 8.855 \\times 10^{-12} \\times 300 \\times 10^{-4} \\times \\frac{(20 \\times 10^3)^2}{(2 \\times 10^{-2})^2} = 0.66$ [N]","img":null,"expImg":null},{"id":14,"text":"강자성체가 아닌 것은?","opts":["철","백금","니켈","코발트"],"answer":1,"exp":"강자성체 : 철(Fe), 니켈(Ni), 코발트(Co)\n\n상자성체 : 알루미늄(Al), 백금(Pt), 주석(Sn), 산소(O), 질소(N)\n\n반자성체 : 구리(Cu), 은(Ag), 납(Pb)","img":null,"expImg":null},{"id":15,"text":"자기회로의 자기저항에 대한 설명으로 옳은 것은?","opts":["투자율에 반비례한다.","자기회로의 단면적에 비례한다.","자기회로의 길이에 반비례한다.","단면적에 반비례하고, 길이의 제곱에 비례한다."],"answer":0,"exp":"자기저항 $R_m = \\frac{l}{\\mu S}$ [AT/Wb]\n자기저항은 길이에 비례, 투자율과 면적에 반비례","img":null,"expImg":null},{"id":16,"text":"제벡(Seebeck) 효과를 이용한 것은?","opts":["광전지","열전대","전자냉동","수정 발진기"],"answer":1,"exp":"제벡 효과 : 두 종류 금속(열전대) 접속면에 온도차가 있으면 기전력이 발생. 열전온도계의 원리\n\n펠티어 효과 : 서로 다른 두 종류의 금속선으로 폐회로를 만들고 전류를 흘리면 금속선의 접속면에서의 열이 흡수 또는 발생\n\n톰슨 효과 : 동일한 금속 도선의 두 절점 간에 전류를 흘리면 도선 속에서 열이 발생되거나 흡수","img":null,"expImg":null},{"id":17,"text":"액체 유전체를 넣은 콘덴서의 용량이 $30$ [ $\\mu\\text{F}$ ]이다. 여기에 $500$ [V]의 전압을 가했을 때 누설전류는 약 얼마인가? 단, 고유 저항 $\\rho$ 는 $10^{11}$ [ $\\Omega \\cdot \\text{m}$ ], 비유전율 $\\epsilon_s$ 는 $2.2$ 이다.","opts":["$5.1$ [mA]","$7.7$ [mA]","$10.2$ [mA]","$15.4$ [mA]"],"answer":1,"exp":"$RC = \\rho\\epsilon$ 에서 접지저항 $R = \\frac{\\rho\\epsilon}{C}$ [ $\\Omega$ ]\n누설전류 $I = \\frac{V}{R} = \\frac{CV}{\\rho\\epsilon} = \\frac{CV}{\\rho\\epsilon_0 \\epsilon_s} = \\frac{30 \\times 10^{-6} \\times 500}{10^{11} \\times 8.855 \\times 10^{-12} \\times 2.2} \\times 10^3 = 7.7$ [mA]","img":null,"expImg":null},{"id":18,"text":"다음은 전기 및 자기 쌍극자에 의한 전계와 자계의 세기에 대한 설명이다. (   ) 안에 들어갈 내용으로 옳은 것은?","opts":["ⓐ 제곱, ⓑ 제곱","ⓐ 제곱, ⓑ 세제곱","ⓐ 세제곱, ⓑ 제곱","ⓐ 세제곱, ⓑ 세제곱"],"answer":1,"exp":"전기 쌍극자 : 전위 $V = \\frac{M\\cos\\theta}{4\\pi\\epsilon_0 r^2}$, 전계 $E = \\frac{M\\sqrt{1 + 3\\cos^2\\theta}}{4\\pi\\epsilon_0 r^3}$\n자기 쌍극자 : 자위 $U = \\frac{M\\cos\\theta}{4\\pi\\mu_0 r^2}$, 자계 $H = \\frac{M\\sqrt{1 + 3\\cos^2\\theta}}{4\\pi\\mu_0 r^3}$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCABXAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7CoorkPEnjeXQ9atNLm8Ia/ctfXBt7KaGSyEdw4RnIG+4Vl+VWPzBemOpFAzr6K5w+KCuv6JpE2lT202qRTSMk00Ze3Ma52sELKSfZsU7XPEWo6ZcTK }}$","img":null,"expImg":null},{"id":27,"text":"수조에 대한 설명 중 옳지 않은 것은?","opts":["수로 내의 수위의 이상상승을 방지한다.","수로식 발전소의 수로의 처음 부분과 수압관의 아래 부분에 설치한다.","수로에서 유입하는 물속의 토사를 침전시켜서 배사문으로 배사하고 부유물을 제거한다.","용량을 크게 하는 것이 바람직하나, 지형적 조건에 따라서 최소한 최대사용유량을 1~2분 동안 저장할 수 있는 용적을 가져야 한다."],"answer":1,"exp":"수조(head tank)\n\n    수로와 수압관을 연결하는 접속부에 설치\n\n    유하 토사의 최종적인 침전(부유물 제거)\n\n    유량의 과부족 조정(최대 사용 수량의 1~2분 정도)\n\n    수로 내 수위 상승 억제","img":null,"expImg":null},{"id":28,"text":"3상 3선식 가공 송전선로가 있다. 전선 한 가닥의 저항은 $15$ [ $\\Omega$ ], 리액턴스는 $20$ [ $\\Omega$ ]이고, 수전단의 선간전압은 $30$ [kV], 부하 역률은 $0.8$ (늦음)이다. 전압강하율을 $5$ [%]로 하면 이 송전선로로 몇 [kW]까지 수전할 수 있는가?","opts":["$2,000$ [kW]","$2,500$ [kW]","$1,000$ [kW]","$1,500$ [kW]"],"answer":3,"exp":"전압 강하율 $\\delta = \\frac{V_s - V_r}{V_r} \\times 100 = \\frac{e}{V_r} \\times 100 = \\frac{P}{V_r^2} (R + X\\tan\\theta) \\times 100$ [%]에서\n부하전력 $P = \\frac{V_r^2 \\delta}{R + X\\tan\\theta}$\n$\\therefore$ 부하전력 $P = \\frac{30,000^2 \\times 0.05}{15 + 20 \\times \\frac{0.6}{0.8}} \\times 10^{-3} = 1,500$ [kW]","img":null,"expImg":null},{"id":29,"text":"지중 케이블에서 고장점을 찾는 방법이 아닌 것은?","opts":["머레이 루프(murray loop) 시험기에 의한 방법","메거(megger)에 의한 측정 방법","정전용량의 측정에 의한 방법","펄스에 의한 측정법"],"answer":1,"exp":"지중 케이블 고장점 탐색\n\n    머레이 루프법\n\n    수색 코일법\n\n    음향법\n\n    정전용량법\n\n    펄스법\n   \n여기서, 메거는 절연저항을 측정하는 계기이다.","img":null,"expImg":null},{"id":30,"text":"가공전선을 단도체식으로 하는 것보다 같은 단면적의 복도체식으로 하였을 경우에 대한 내용으로 틀린 것은?","opts":["전선의 인덕턴스가 감소된다.","전선의 정전용량이 감소된다.","코로나 발생률이 적어진다.","송전용량이 증가한다."],"answer":1,"exp":"복도체(다도체) 방식의 주목적 : 코로나 방지\n\n    인덕턴스는 감소, 정전용량은 증가\n\n    코로나의 방지, 코로나 임계 전압의 상승\n\n    송전용량의 증대, 안정도 증대","img":null,"expImg":null},{"id":31,"text":"송전계통의 안정도 증진 대책이 아닌 것은?","opts":["병렬 회선 수 증가","차폐선의 채용","고속 재폐로 방식 채용","중간 조상설비 설치"],"answer":1,"exp":"안정도 향상 대책\n① 직렬 리액턴스($X$)를 작게 한다.\n발전기나 변압기의 리액턴스를 작게 한다.\n선로의 병행 회선수를 늘리거나 복도체 또는 다도체 방식을 사용한다.\n직렬 콘덴서를 삽입하여 선로의 리액턴스를 보상한다.\n② 전압 변동을 작게 한다.\n③ 중간 조상 방식을 채용한다.\n④ 고장 전류를 줄이고 고장 구간을 신속하게 차단한다","img":null,"expImg":null},{ r":2,"exp":"1선당 작용 정전용량(대지 정전용량 : $C_s$, 선간 정전용량 : $C_m$)\n단상 2선식 : $C = C_s + 2C_m$\n3상 3선식 : $C = C_s + 3C_m$","img":null,"expImg":null},{"id":37,"text":"페란티 현상이 발생하는 주된 원인으로 알맞은 것은?","opts":["선로의 인덕턴스","선로의 정전용량","선로의 누설 컨덕턴스","선로의 저항"],"answer":1,"exp":"페란티 현상\n\n    무부하(경부하) 시 선로의 정전용량에 의해서 송전단 전압보다 수전단 전압이 커지는 현상\n\n    방지법 : 분로 리액터(Sh. R)","img":null,"expImg":null},{"id":38,"text":"전력계통은 충분한 안정도를 가지고 가장 경제적으로 그 의무를 다하는 것이 최종 목표이다. 이런 관점에서 계통 운용과 개발확충 계획으로 구분했을 때, 계통 운영의 관점에서 문제점으로 적합하지 않은 것은?","opts":["전력계통의 주파수와 유효 전력 제어","전력계통의 전압과 무효 전력 제어","발전설비의 확충","전력계통의 신뢰도 제어"],"answer":2,"exp":"전력계통 운영 목표\n전력계통 운영의 목표는 발전 및 송, 변전, 배전 등의 전력설비를 종합적으로 운영하여 전력을 고품질로, 경제적으로, 신뢰성 있게 공급하는 것\n\n    규정주파수 유지 : 유효전력 제어, 자동발전제어\n\n    규정전압 유지 : 무효전력 제어\n\n    경제적 생산과 공급 : 여러 발전설비를 최소한의 송전손실과 종합경제성을 갖도록 최적 배분\n\n    신뢰성 확보 : 상시 감시 제어 및 긴급 시의 예방제어와 복구제어","img":null,"expImg":null},{"id":39,"text":"장거리 대전력을 송전할 때 교류 송전방식에 비교한 직류 송전의 장점이 아닌 것은?","opts":["변압이 쉬워 고압 송전에 유리하다.","송전효율이 높다.","선로 절연이 유리하다.","안정도가 좋다."],"answer":0,"exp":"직류송전의 특징\n\n    선로의 리액턴스가 없으므로 안정도가 높다.\n\n    비동기연계가 가능하다(주파수가 다른 선로의 연계 가능).\n\n    도체의 표피효과가 없다.\n\n    충전전류와 유전체손을 고려하지 않아도 된다.\n\n    변압이 어렵다.\n\n    고조파 억제 대책이 필요하다.","img":null,"expImg":null},{"id":40,"text":"공칭 단면적 $200$ [ $\\text{mm}^2$ ], 전선 무게 $1.838$ [kg/m], 전선의 바깥지름 $18.5$ [mm]인 경동연선을 경간 $200$ [m]로 가설하는 경우 처짐정도(이도)는 약 몇 [m]인가? 단, 경동연선의 인장하중은 $7,910$ [kg], 빙설하중은 $0.416$ [kg/m], 풍압 하중은 $1.525$ [kg/m]이고 안전율은 $2.0$ 이다.","opts":["$3.44$","$3.78$","$4.28$","$4.78$"],"answer":0,"exp":"전체 하중 $W = \\sqrt{\\text{수평하중}^2 + \\text{수직하중}^2} = \\sqrt{W_1^2 + W_2^2} = \\sqrt{(1.838 + 0.416)^2 + 1.525^2} = 2.72$\n처짐정도(이도) $D = \\frac{WS^2}{8T} = \\frac{2.72 \\times 200^2}{8 \\times \\frac{7,910}{2}} = 3.44$ [m]","img":null,"expImg":null},{"id":41,"text":"3상 직권 정류자 전동기의 중간 변압기는 고정자 권선과 회전자 권선 사이에 직렬로 접속되는데 이 중간 변압기를 사용하는 중요한 이유는?","opts":["경부하 시 속도의 급상승 방지를 위하여","주파수 변동으로 속도를 조정하기 위하여","회전자 상수를 감소하기 위하여","역회전을 방지하기 위하여"],"answer":0,"exp":"3상 직권 정류자 전동기에서 중간 변압기를 사용하는 목적\n전원 전압의 크기에 관계없이 정류자 전압 조정\n중간 변압기의 권수비를 조정하여 전동기 특성을 조정\n경부하 시 직권 특성 $T \\propto I^2 \\propto \\frac{1}{N^2}$ 이므로 속도가 크게 상승할 수 있어 중간 변압기를 사용하여 속도 상승을 억제\n실효 권수비 조정","img":null,"expImg":null},{"id":42,"text":"단상변압기 2대를 사용하여 $3,150$ [V]의 평형 3상에서 $210$ [V]의 평형 2상으로 변환하는 경우에 각 변압기의 1차 전압과 2차 전압은 얼마인가?","opts":["주좌 변압기 : 1차 $3,150$ [V], 2차 $210$ [V] / T좌 변압기 : 1차 $3,150$ [V], 2차 $210$ [V]","주좌 변압기 : 1차 $3,150$ [V], 2차 $210$ [V] / T좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [V], 2차 $210$ [V]","주좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [V], 2차 $210$ [V] / T좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [V], 2차 $210$ [V]","주좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [V], 2차 $210$ [V] / T좌 변압기 : 1차 $3,150$ [V], 2차 $210$ [V]"],"answer":1,"exp":"스코트 결선(T결선)\nT좌 변압기의 권선비 : $a_T = \\frac{\\sqrt{3}}{2} a$\n주좌 변압기 : 1차 $3,150$ [V], 2차 $210$ [V]\nT좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [V], 2차 $210$ [V]","img":null,"expImg":null},{"id":43,"text":"3상 동기 발전기에서 그림과 같이 1상의 권선을 서로 똑같은 2조로 나누어서 그 1조의 권선전압을 $E$ [V], 각 권선의 전류를 $I$ [A]라 하고 2중 Y형(double star)으로 결선한 경우 선간전압[V], 선전류[A], 피상전력[W]은?","opts":["$3E, \\ I, \\ 5.19EI$","$\\sqrt{3}E, \\ 2I, \\ 6EI$","$E, \\ 2\\sqrt{3}I, \\ 6EI$","$\\sqrt{3}E, \\ \\sqrt{3}I, \\ 5.19EI$"],"answer":1,"exp":"2개의 권선이 병렬 연결\n전압은 동일\n임피던스는 $\\frac{1}{2}$\nY결선\n$V_l = \\sqrt{3} V_p$ 에서 선간전압 $V_l = \\sqrt{3} E$\n$I_l = I_p = \\frac{V_p}{Z}$ 에서 $I_l = \\frac{E}{\\frac{Z}{2}} = 2I$\n피상전력 $P_a = \\sqrt{3} V_l I_l = \\sqrt{3} \\times \\sqrt{3} E \\times 2I = 6EI$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAIAAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipK     box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+Q.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=Q[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===Q.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+Q.length+(round>1?' · 오답 '+(round-1)+'차':'')+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===Q[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function wrongIdx(){
  const r=[];
  for(let i=0;i<Q.length;i++){ if(ans[i]===null||!ans[i].ok) r.push(i); }
  return r;
}
function result(){
  const total=Q.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100);
  const wrong=wrongIdx(),skipped=total-done,retryMode=round>1;
  const pass=pct>=60;
  const col=retryMode?(wrong.length===0?'#3fb950':'#58a6ff'):(pass?'#3fb950':'#f85149');
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  let rt,sub;
  if(retryMode){
    rt=wrong.length===0?'🎉 오답 정복 완료!':'📝 오답 재풀이 '+(round-1)+'차 결과';
    sub=total+'문제 중 '+score+'문제 정답'+(wrong.length?' · 아직 '+wrong.length+'문제 남았어요':'');
  } else {
    rt=pass?'🎉 합격!':'😥 불합격';
    sub=pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다';
  }
  let note='';
  if(wrong.length){
    note='<div class="res-note">다시 볼 문제: '+wrong.map(i=>'Q'+String(Q[i].id).padStart(2,'0')).join(' ')+(skipped?'<br>안 푼 문제 '+skipped+'개도 다시 풀기에 포함돼요':'')+'</div>';
  }
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+col+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+rt+'</div>'+
    '<div class="res-sub">'+sub+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div>'+note+
    (wrong.length?'<button class="retry wrong" onclick="retryWrong()">❌ '+(skipped?'오답·미풀이 ':'오답 ')+wrong.length+'문제만 다시 풀기</button>':'')+
    '<button class="retry'+(wrong.length?' sub':'')+'" onclick="restart()">🔄 '+(retryMode?'전체 문제 처음부터 다시 풀기':'처음부터 다시 풀기')+'</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function retryWrong(){
  const w=wrongIdx(); if(!w.length) return;
  Q=w.map(i=>Q[i]); round++;
  cur=0; score=0; ans=new Array(Q.length).fill(null); cache={}; render();
}
function restart(){Q=QS;round=1;cur=0;score=0;ans=new Array(Q.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/Q.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
</body>
</html>
