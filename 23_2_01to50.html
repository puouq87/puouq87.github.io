<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title> 23년 2회 산업기사 01~50</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.retry.wrong{background:linear-gradient(135deg,#f85149,#d29922);color:#fff;}
.retry.sub{background:#21262d;color:#8b949e;border:1px solid #30363d;margin-top:8px;}
.res-note{font-size:12px;color:#8b949e;line-height:1.7;margin:-12px 0 20px;word-break:keep-all;}
</style>

<script>
const QS=[{"id":1,"text":"자기인덕턴스와 상호인덕턴스와의 관계에서 결합계수 $k$ 에 영향을 주지 않는 것은?","opts":["코일의 형상","코일의 크기","코일의 재질","코일의 상대위치"],"answer":2,"exp":"상호 인덕턴스 $M = k\\sqrt{L_1 L_2}$ 이고 (여기서 $k$ : 결합계수)\n완전결합 시 $k = 1$\n미결합시 $k = 0$\n결합계수는 코일의 형상, 코일의 크기, 코일의 상대위치에 따라 결정된다.","img":null,"expImg":null},{"id":2,"text":"전자석의 흡인력은 자속 밀도를 $B$ 라 할 때 어떻게 되는가?","opts":["$B$ 에 비례","$B^{\\frac{3}{2}}$ 에 비례","$B^{1.6}$ 에 비례","$B^2$ 에 비례"],"answer":3,"exp":"자화에 필요한 에너지 $w = \\frac{1}{2} \\mu H^2 = \\frac{B^2}{2\\mu} = \\frac{1}{2} BH [\\mathrm{J/m^3}][\\mathrm{N/m^2}]$ 에서\n흡인력(힘) $F = \\frac{B^2}{2\\mu_0} \\times S [\\mathrm{N}]$\n따라서 흡인력은 자속밀도의 제곱( $B^2$ )에 비례한다.","img":null,"expImg":null},{"id":3,"text":"무한 직선 전류에 의한 P점에서의 자계의 세기 $[\\mathrm{AT/m}]$ 는? (단, $I[\\mathrm{A}]$ 는 전류이고, $a[\\mathrm{m}]$ 는 직선 전류가 흐르는 도체로부터 P점까지의 거리이다)","opts":["$H = \\frac{1}{2a}$","$H = \\frac{1}{2\\pi a}$","$H = \\frac{I}{2a}$","$H = \\frac{I}{2\\pi a}$"],"answer":3,"exp":"무한장 직선도체의 자계의 세기 $H = \\frac{I}{2\\pi r} = \\frac{I}{2\\pi a} [\\mathrm{AT/m}]$","img":null,"expImg":null},{"id":4,"text":"도체 1을 $Q$ 가 되도록 대전시키고, 여기에 도체 2를 접촉했을 때 도체 2가 얻은 전하를 전위계수로 표시하면? 단, $P_{11}$, $P_{12}$, $P_{21}$, $P_{22}$ 는 전위계수이다.","opts":["$\\frac{Q}{P_{11} - 2P_{12} + P_{22}}$","$\\frac{(P_{11} - P_{12})Q}{P_{11} - 2P_{12} + P_{22}}$","$\\frac{(P_{11}P_{12} + P_{22})Q}{P_{11} - 2P_{12} + P_{22}}$","$\\frac{(P_{11} - P_{12})Q}{P_{11} + 2P_{12} + P_{22}}$"],"answer":1,"exp":"연결하면 등전위($V_1 = V_2$)가 되며\n$V_1 = P_{11} Q_1 + P_{12} Q_2$\n$V_2 = P_{21} Q_1 + P_{22} Q_2$에서\n여기서, $Q_1 = Q - Q_2$ 이므로 $(P_{11} - P_{12})Q = (P_{11} + P_{22} - 2P_{12})Q_2$\n$\\therefore Q_2 = \\dfrac{P_{11} - P_{12}}{P_{11} - 2P_{12} + P_{22}} Q$ ","img":null,"expImg":null},{"id":5,"text":"여러 개의 도체가 한 공간 내에서 하나의 도체계를 형성하고 있을 때, 각 도체의 전하를 $n$ 배 할 경우 각 도체의 전위는 어떻게 되는가?","opts":["$n^2$ 배가 된다.","$\\frac{1}{2} n$ 배가 된다.","$n$ 배가 된다.","$2n$ 배가 된다."],"answer":2,"exp":"전위 : 스칼라 함수이므로 중첩의 원리가 성립 $\\rightarrow$ 전하를 $n$ 배하면 전위도 $n$ 배된다.","img":null,"expImg":null},{"id":6,"text":"비유전율이 $2.4$ 인 유전체 내의 전계의 세기가 $100[\\mathrm{mV/m}]$ 이다. 유전체에 축적되는 단위 체적당 정전에너지는 몇 $[\\mathrm{J/m^3}]$ 인가?","opts":["$1.06 \\times 10^{-13}$","$1.77 \\times 10^{-13}$","$2.32 \\times 10^{-13}$","$2.32 \\times 10^{-11}$"],"answer":0,"exp":"유전체 내의 체적당 에너지\n$w = \\frac{1}{2} \\varepsilon E^2 = \\frac{D^2}{2\\varepsilon} = \\frac{1}{2} ED [\\mathrm{J/m^3}]$ 에서\n$= \\frac{1}{2} \\times 8.855 \\times 10^{-12} \\times 2.4 \\times (100 \\times 10^{-3})^2 = 1.06 \\times 10^{-13} [\\mathrm{J/m^3}]$","img":null,"expImg":null},{"id":7,"text":"두 유전체의 경계면에서 정전계가 만족하는 것은?","opts":["전계의 법선성분이 같다.","전계의 접선성분이 같다.","전속밀도의 접선성분이 같다.","분극 세기의 접선성분이 같다."],"answer":1,"exp":"전계의 접선성분이 연속 : $E_1 \\sin\\theta_1 = E_2 \\sin\\theta_2$\n전속밀도의 법선성분이 연속 : $D_1 \\cos\\theta_1 = D_2 \\cos\\theta_2$","img":null,"expImg":null},{"id":8,"text":"$\\mathrm{div}\\ i = 0$ 에 대한 설명이 아닌 것은?","opts":["도체 내에 흐르는 전류는 연속적이다.","도체 내에 흐르는 전류는 일정하다.","단위 시간당 전하의 변화는 없다.","도체 내에 전류가 흐르지 않는다."],"answer":3,"exp":"전류의 연속성 : $\\mathrm{div}\\ i = 0$ (도체 내의 전류는 일정하며, 전류의 발산은 없다)","img":null,"expImg":null},{"id":9,"text":"그림과 같이 도체구 내부 공동의 중심에 점전하 $Q[\\mathrm{C}]$ 가 있을 때 이 도체구의 외부로 발산되어 나오는 전기력선의 수는 몇 개인가? 단, 도체 내외의 공간은 진공이라 한다.","opts":["$4\\pi$","$\\frac{Q}{\\varepsilon_0}$","$Q$","$\\varepsilon_0 Q$"],"answer":1,"exp":"전기력선의 총수 $N = \\int_s E ds = \\frac{Q}{\\varepsilon_0}$ (가우스의 법칙)","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAI8AkYDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJB pImg":null},{"id":18,"text":"지표면에 대지로 향하는 $300[\\mathrm{V/m}]$ 의 전계가 있다면 지표면의 전하 밀도의 크기는 몇 $[\\mathrm{C/m^2}]$ 인가?","opts":["$1.33 \\times 10^{-9}$","$2.66 \\times 10^{-9}$","$1.33 \\times 10^{-7}$","$2.66 \\times 10^{-7}$"],"answer":1,"exp":"전기력선은 $(+)$ 전하에서 $(-)$ 전하로 진행하므로\n지구 표면의 전하 밀도의 극성은 $(-)$ 전하이고 크기 $E = \\frac{\\sigma}{\\varepsilon_0}$ 이다\n따라서 $\\sigma = -8.855 \\times 10^{-12} \\times 300 = -2.66 \\times 10^{-9} [\\mathrm{C/m^2}.]$ 이다.","img":null,"expImg":null},{"id":19,"text":"전자계에서 맥스웰의 기본 이론이 아닌 것은?","opts":["자극은 단독으로 존재한다.","전도전류는 회전하는 자계를 발생한다.","전하에서 전속선이 발산된다.","자계의 시간적 변화에 따라 전계의 회전이 생긴다."],"answer":0,"exp":"전자계에 대한 맥스웰의 기본 이론\n$\\mathrm{rot}\\ E = -\\frac{\\partial B}{\\partial t}$ : 자계의 시간적 변화에 따라 전계의 회전이 생긴다.\n$\\mathrm{rot}\\ H = i + \\frac{\\partial D}{\\partial t}$ : 전도 전류와 변위 전류는 회전하는 자계를 발생시킨다.\n$\\mathrm{div}\\ D = \\rho$ : 전하에서 전속선이 발산된다.\n$\\mathrm{div}\\ B = 0$ : 고립된 자극이 없다(연속).","img":null,"expImg":null},{"id":20,"text":"유전체 중을 흐르는 전도전류 $i_g$ 와 변위전류 $i_d$ 를 같게 하는 주파수를 임계주파수 $f_c$, 임의의 주파수를 $f$ 라 할 때 유전손실 $\\tan\\delta$ 는?","opts":["$\\frac{f_c}{2f}$","$\\frac{f}{2f_c}$","$\\frac{f_c}{f}$","$\\frac{f}{f_c}$"],"answer":2,"exp":"임계주파수 |ic| = |id|에서 k = ωε = 2πfcε에서 $f_c = \\frac{k}{2\\pi\\epsilon}$ \n유전체의 손실각 $\\tan\\theta = \\left\\vert{}\\frac{i_c}{i_d}\\right\\vert{} = \\frac{k}{\\omega\\epsilon} = \\frac{k}{2\\pi f\\epsilon}$\n따라서 $\\tan\\theta = \\left\\vert{}\\frac{i_c}{i_d}\\right\\vert{} = \\frac{k}{\\omega\\epsilon} = \\frac{k}{2\\pi f\\epsilon} = \\frac{f_c}{f}$  ","img":null,"expImg":null},{"id":21,"text":"단상 승압기 $1$ 대를 사용하여 승압할 경우 승압기의 전압을 $E_1$ 이라 하면, 승압 후의 전압 $E_2$ 는 어떻게 되는가? 단, 승압기의 변압비는 $\\frac{\\text{전원측전압}}{\\text{부하측전압}} = \\frac{e_1}{e_2}$ 이다.","opts":["$E_2 = E_1 + e_1$","$E_2 = E_1 + e_2$","$E_2 = E_1 + \\frac{e_2}{e_1} E_1$","$E_2 = E_1 + \\frac{e_1}{e_2} E_1$"],"answer":2,"exp":"단권변압기\n$\\frac{V_2}{V_1} = \\frac{n_1 + n_2}{n_1} = \\left(1 + \\frac{n_2}{n_1}\\right)$ 에서\n$\\frac{E_2}{E_1} = \\frac{n_1 + n_2}{n_1} = \\left(\\frac{e_1 + e_2}{e_1}\\right) = \\left(1 + \\frac{e_2}{e_1}\\right)$\n따라서 $E_2 = E_1 + \\frac{e_2}{e_1} E_1$","img":null,"expImg":null},{"id":22,"text":"출력 $3,000[\\mathrm{kW}]$, 유효 낙차 $50[\\mathrm{m}]$ 인 수력발전소의 최대사용수량 $[\\mathrm{m^3/s}]$ 은 얼마가 되는가? (단, 수차 및 발전기의 효율은 $80[\\%]$ 이다)","opts":["$7.6$","$12$","$18.5$","$28.5$"],"answer":0,"exp":"수력 발전소 출력 $P = 9.8 Q H \\eta_w \\eta_g [\\mathrm{kW}]$\n유량 $Q = \\frac{P}{9.8 H \\eta} = \\frac{3,000}{9.8 \\times 50 \\times 0.8} = 7.6 [\\mathrm{m^3/sec}]$","img":null,"expImg":null},{"id":23,"text":"송전계통의 중성점을 접지하는 목적으로 틀린 것은?","opts":["지락 고장 시 전선로의 대지 전위 상승을 억제하고 전선로와 기기의 절연을 경감시킨다.","소호리액터 접지방식에서는 11 선 지락 시 지락점 아크를 빨리 소멸시킨다.","차단기의 차단용량을 증대시킨다.","지락고장에 대한 계전기의 동작을 확실하게 한다."],"answer":2,"exp":"송전선의 중성점 접지 목적\n$1$ 선 지락 시 전위 상승 억제하고, 전선로와 기기의 절연을 경감\n지락 사고 시 보호 계전기 동작의 확실\n유도장해도 증진\n이상 전압 발생 방지","img":null,"expImg":null},{"id":24,"text":"$62,000[\\mathrm{kW}]$ 의 전력을 $60[\\mathrm{km}]$ 떨어진 지점에서 송전하려면 전압은 몇 $[\\mathrm{kV}]$ 로 하면 좋은가? 단, Still의 식을 사용한다.","opts":["$66$","$110$","$140$","$154$"],"answer":2,"exp":"Still의 식(경제적인 송전 전압 결정식)\n$V_s = 5.5\\sqrt{0.6l + \\frac{P}{100}} [\\mathrm{kV}]$ 여기서, $l$ : 송전 거리 $[\\mathrm{km}]$, $P$ : 송전전력 $[\\mathrm{kW}]$\n$= 5.5\\sqrt{0.6 \\times 60 + \\frac{62,000}{100}} = 140.86[\\mathrm{kV}]$","img":null,"expImg":null},{"id":25,"text":"여러 회선의 비접지 $3$ 상 $3$ 선식 배전선로에 방향계전기를 사용하여 선택지락보호를 하려고 할 때 필요한 것은?","opts":["$\\mathrm{GPT}$ 와 $\\mathrm{ZCT}$","$\\mathrm{PT}$ 와 $\\mathrm{CT}$","$\\mathrm{PT}$ 와 $\\mathrm{ZCT}$","$\\mathrm{GPT}$ 와 $\\mathrm{CT}$"],"answer":0,"exp":"$\\mathrm{GPT}$ (Ground Potential Transformer) : 접지형 계기용 변압기, 영상전압 검출\n영상변류기( $\\mathrm{ZCT}$ ) : 영상(지락)전류 검출","img":null,"expImg":null},{"id":26,"text":"뇌해 방지와 관계없는 것은?","opts":["초호각","매설지선","가공지선","댐퍼"],"answer":3,"exp":"가공지선 : 직격뢰, 유도뢰 차폐\n\n매설지선 : 역섬락 방지\n\n소호각(소호환) : 섬락 시 애자련 보호\n여기서, 댐퍼는 선로의 진동 방지에 쓴다.","img":null,"expImg":null},{"id":27,"text":"송전 계통에서 이상 전압의 방지 대책으로 볼 수 없는 것은?","opts":["철탑 접지저항의 저감","가공 송전선로의 피뢰용으로서의 가공지선에 의한 뇌차폐","기기 보호용으로서의 피뢰기 설치","복도체 방식 채택"],"answer":3,"exp":"이상 전압 보호 장치 및 기능\n\n    가공지선 : 뇌뢰 차폐\n\n    피뢰기 : 기기(변압기) 보호\n\n    매설지선, 철탑 접지저항의 저감 : 역섬락 방지\n    여기서, 복도체 방식은 코로나 대책이다.","img":null,"expImg":null},{"id":28,"text":"정격 전압 $15.4[\\mathrm{kV}]$, 차단용량 $665[\\mathrm{MVA}]$ 인 $3$ 상 차단기의 정격차단전류는 약 몇 $[\\mathrm{kA}]$ 인가?","opts":["$16$","$25$","$32$","$12.5$"],"answer":1,"exp":"$3$ 상용 차단기의 정격 용량 $P_s = \\sqrt{3} \\times \\text{정격전압} \\times \\text{정격차단전류} [\\mathrm{MVA}]$\n정격 차단 전류 : $I_s = \\frac{P_s}{\\sqrt{3} V} = \\frac{665}{\\sqrt{3} \\times 15.4} = 25 [\\mathrm{kA}]$","img":null,"expImg":null},{"id":29,"text":"변류기의 2차측 외부를 변류기와 분리할 때 변류기의 2차측에 과전압이 유도되는 것을 방지하기 위한 조치로 옳은 것은?","opts":["2차 측 각 단자를 단락시킨다.","2차 측 각 단자를 절연시킨다.","2차 측 각 단자를 고저항으로 연결한다.","2차 측 각 단자를 개방한다."],"answer":0,"exp":"계기용 변성기 점검\n\n    PT(계기용 변압기) : 2차측 개방(2차측 과전류 보호)\n\n    CT(변류기) : 2차측 단락(2차측 과전압보호, 2차측 절연보호)","img":null,"expImg":null},{"id":30,"text":"열사이클의 효율을 올리는 방법과 거리가 먼 것은?","opts":["절탄기 설치","저압저온 이용","재생사이클 채용","과열증기 사용"],"answer":1,"exp":"화력 발전소 열효율 향상\n절탄기, 공기예열기의 설치\n재생 $\\cdot$ 재열 사이클의 채용\n고압, 고온증기의 채용과 과열기의 설치","img":null,"expImg":null},{"id":31,"text":"지락사고 시 영상변류기를 사용하는 계전기는?","opts":["지락 과전류 계전기","비율 차동 계전기","지락 과전압 계전기","부족 전압 계전기"],"answer":0,"exp":"영상변류기(ZCT) : 영상(지락)전류 검출\n지락(접지)계전기와 연결","img":null,"expImg":null},{"id":32,"text":"원자력 발전소에서 원자로의 냉각재가 갖추어야 할 조건으로 틀린 것은?","opts":["열전도가 잘 될 것","비열이 클 것","핵연료의 피복재와 감속재 등의 사이에서 화학반응이 적을 것","중성자 흡수 단면적이 클 것"],"answer":3,"exp":"냉각재\n원자로 내의 열을 외부로 운반하는 역할\n열전도율과 비열이 클 것\n$\\mathrm{H_2O}$ (경수), $\\mathrm{D_2O}$ (중수), $\\mathrm{CO_2}$, $\\mathrm{He}$, 액체 $\\mathrm{Na}$ 등\n중성자의 흡수 단면적이 클 것은 제어재의 구비 조건이다.","img":null,"expImg":null},{"id":33,"text":"전력계통에서 인터록의 설명으로 옳은 것은?","opts":["차단기와 단로기는 각각 열리고 닫힌다.","차단기가 열려 있어야만 단로기를 닫을 수 있다.","차단기의 접점과 단로기의 접점이 동시에 투입될 수 있다.","차단기가 닫혀 있어야만 단로기를 닫을 수 있다."],"answer":1,"exp":"인터록(Interlock) : 차단기가 열려 있어야 단로기 조작 가능\n\n    투입 시 : DS - CB 순\n\n    차단 시 : CB - DS 순","img":null,"expImg":null},{"id":34,"text":"전력계통의 전압 조정을 위한 방법은?","opts":["계통의 주파수 조정","계통의 무효전력 조정","부하의 유효전력 조정","발전기의 유효전력 조정"],"answer":1,"exp":"계통의 전압 조정 : 무효전력을 조절(동기조상기, 분로 리액터, 전력용 콘덴서 등)\n\n주파수 조정 : 유효전력 조정","img":null,"expImg":null},{"id":35,"text":"전력용 퓨즈는 주로 어떤 전류의 차단을 목적으로 사용하는가?","opts":["과도전류","단락전류","과부하전류","지락전류"],"answer":1,"exp":"전력 퓨즈(PF : Power Fuse) : 단락전류 차단","img":null,"expImg":null},{"id":36,"text":"총 설비용량이 $400[\\mathrm{kW}]$, 수용률이 $70[\\%]$ 라면, 변압기 용량은 최소 몇 $[\\mathrm{kVA}]$ 인가? (단, 부하역률은 $0.8$ 이다)","opts":["$250$","$200$","$350$","$500$"],"answer":2,"exp":"변압기 용량 $[\\mathrm{kVA}] = \\frac{\\text{설비 용량} \\times \\text{수용률}}{\\text{부등률} \\times \\text{역률}} = \\frac{400 \\times 0.7}{0.8} = 350[\\mathrm{kVA}]$","img":null,"expImg":null},{"id":37,"text":"일반회로정수가 $A$, $B$, $C$, $D$ 이고 송전단 상전압이 $E_s$ 인 경우, 무부하 시의 충전전류(송전단 전류)는?","opts":["$CE_s$","$ACE_s$","$\\frac{C}{A} E_s$","$\\frac{A}{C} E_s$"],"answer":2,"exp":"무부하 시( $I_r = 0$ )\n$E_s = AE_r + BI_r$ 에서 $E_s = AE_r \\qquad \\therefore E_r = \\frac{1}{A} E_s$\n$I_s = CE_r + DI_r$\n따라서 무부하시의 충전 전류(송전단 전류) $I_s = CE_r = \\frac{C}{A} E_s$","img":null,"expImg":null},{"id":38,"text":"송배전 선로의 도중에 직렬로 삽입하여 선로의 유도성 리액턴스를 보상함으로써 선로정수 그 자체를 변화시켜 선로의 전압 강하를 감소시키는 직렬 콘덴서 방식의 특성에 대한 설명으로 옳은 것은?","opts":["최대 송전전력이 감소하고 정태 안정도가 감소된다.","부하의 변동에 따른 수전단의 전압 변동률은 증대된다.","장거리 선로의 유도 리액턴스를 보상하고 전압 강하를 감소시킨다.","송 $\\cdot$ 수 양단의 전달 임피던스가 증가하고 안정 극한 전력이 감소한다."],"answer":2,"exp":"직렬 콘덴서(직렬 축전지)는 유도 리액턴스에 의한 선로의 전압 강하 보상용으로, 전압 변동을 줄이고 정태 안정도 개선용으로 사용한다. 따라서 역률 개선에는 큰 영향이 되지 않는다.","img":null,"expImg":null},{"id":39,"text":"등가 선간거리를 $D$ 라 할 때, 등가 선간거리 $D$ 가 증가할 때 송전선의 정전용량은 어떻게 되는가?","opts":["$\\log_{10} \\frac{r}{D}$ 에 비례","$\\log_{10} \\frac{D}{r}$ 에 비례","$\\log_{10} \\frac{r}{D}$ 에 반비례","$\\log_{10} \\frac{D}{r}$ 에 반비례"],"answer":3,"exp":"작용정전용량 $C = \\frac{0.02413}{\\log_{10} \\frac{D}{r}} [\\mu\\mathrm{F/km}] \\qquad$ 작용정전용량 $C \\propto \\frac{1}{\\log_{10} \\frac{D}{r}}$","img":null,"expImg":null},{"id":40,"text":"코로나 방지에 가장 효과적인 방법은?","opts":["선로의 절연을 강화한다.","선간거리를 감소시킨다.","선로의 높이를 낮게 한다.","전선의 바깥지름을 크게 한다."],"answer":3,"exp":"코로나 방지대책\n\n    코로나 임계 전압을 크게, 전위경도를 작게\n\n    전선의 바깥지름을 크게\n\n    복도체(다도체) 방식(가장 효과적인 방법)\n\n    가선금구류 개량","img":null,"expImg":null},{"id":41,"text":"특수 동기기에 대한 설명 중 틀린 것은?","opts":["정현파 발전기는 부하에 관계없이 정현파 기전력을 발생한다.","동기 주파수변환기는 조작이 간편하고 효율이 좋다.","유도 동기전동기는 기동 토크와 인입 토크가 크다.","반작용 전동기는 역률이 좋다."],"answer":3,"exp":"반작용 전동기(reaction motor), 릴럭턴스 모터(reluctance motor)\n① 원리 : 고정자 회전자계의 자기유도에 의해 돌극 부분에서 발생하는 회전자계를 이용하는 동기전동기\n② 특징 : 토크가 작고 역률이나 효율이 나쁘지만 구조가 간단하고 직류여자가 필요하지 않다.\n③ 응용 분야 : 팩시밀리의 드럼구동용, 공업계기의 차트지 발송용의 소용량 모터","img":null,"expImg":null},{"id":42,"text":"직류발전기에서 유기기전력을 발생시키는 부분은 어디인가?","opts":["계자","전기자","정류자","계철"],"answer":1,"exp":"직류기의 3요소\n① 전기자 : 유기기전력을 발생\n② 계자 : 자속을 발생\n③ 정류자 : 교류를 직류로 변환하는 부분","img":null,"expImg":null},{"id":43,"text":"브러시를 이용하여 회전속도를 제어하는 전동기는?","opts":["반발 전동기","단상 직권전동기","직류 직권전동기","정류자형 주파수 변환기"],"answer":0,"exp":"반발 전동기 : 기동토크가 크며 브러시를 단락하며 브러시를 이동하여 속도를 제어\n종류 : 아트킨손형, 톰슨형, 데리형","img":null,"expImg":null},{"id":44,"text":"변압기에서 권수가 $2$ 배가 되면 유기기전력은 몇 배가 되는가?","opts":["$1$","$2$","$4$","$8$"],"answer":1,"exp":"변압기 유기기전력 $E_1 = 4.44 f \\phi_m N_1$ 에서 기전력과 권수는 비례하므로\n따라서 $E \\propto N \\propto 2$ 배","img":null,"expImg":null},{"id":45,"text":"자여자 발전기에 대한 설명으로 옳은 것은?","opts":["계자저항이 대단히 크다.","회전방향에 상관 없이 발전이 가능하다.","무부하 특성곡선이 존재한다.","잔류자기가 존재해야 발전이 가능하다."],"answer":3,"exp":"자여자 발전기\n\n    잔류자기에 의한 발전(직권, 분권, 복권발전기)\n\n    회전방향이 변경되면 잔류자기가 소멸되어 발전 불능","img":null,"expImg":null},{"id":46,"text":"용량 $1[\\mathrm{kVA}]$, $3,000/220[\\mathrm{V}]$ 의 단상변압기를 단권변압기로 연결해서 승압기로 사용할 때, $1$ 차 측에 $3,000[\\mathrm{V}]$ 를 가할 경우 부하용량은 약 몇 $[\\mathrm{kVA}]$ 인가?","opts":["$1$","$10$","$15$","$16$"],"answer":2,"exp":"승압된 전압 $V_h = V_l \\left(1 + \\frac{1}{a}\\right) = 3,000 \\left(1 + \\frac{220}{3,000}\\right) = 3,220[\\mathrm{V}]$\n$\\frac{\\text{자기용량}}{\\text{부하용량}} = \\frac{e_2 I_2}{V_h I_2} = \\frac{e_2}{V_h} = \\frac{V_h - V_l}{V_h}$\n$\\text{부하용량} = \\frac{V_h}{e_2} \\times \\text{자기용량} = \\frac{3,220}{220} \\times 1 = 14.64[\\mathrm{kVA}]$","img":null,"expImg":null},{"id":47,"text":"전부하시의 단자전압이 무부하시의 단자전압보다 높은 직류발전기는?","opts":["분권발전기","평복권발전기","과복권발전기","차동복권발전기"],"answer":2,"exp":"전압변동률 $\\varepsilon = \\frac{V_0 - V}{V} \\times 100 = \\frac{E - V}{V} \\times 100 = \\frac{I_a R_a}{V} \\times 100[\\%]$ 에서\n$\\varepsilon(+)$ : 분권, 타여자 발전기( $V_0 > V$ )\n$\\varepsilon(0)$ : 평복권 ( $V_0 = V$ : 무부하 전압=정격전압)\n$\\varepsilon(-)$ : 과복권 발전기( $V_0 < V$ )","img":null,"expImg":null},{"id":48,"text":"역률 $0.85$ 의 부하 $350[\\mathrm{kW}]$ 에 $50[\\mathrm{kW}]$ 를 소비하는 동기전동기를 병렬로 접속하여 합성 부하의 역률을 $0.95$ 로 개선하려면 전동기의 진상 무효 전력은 약 몇 $[\\mathrm{kVar}]$ 인가?","opts":["$68$","$72$","$80$","$85$"],"answer":3,"exp":"동기전동기로 진상무효전력을 공급하면\n합성 유효전력 $P = 50 + 350 = 400[\\mathrm{kW}]$\n합성 무효전력 $Q = P\\tan\\theta - Q_c = 350 \\times \\frac{\\sqrt{1 - 0.85^2}}{0.85} - Q_c = 216.92 - Q_c [\\mathrm{kVar}]$\n따라서 역률 $0.95$ 로 하려면\n$\\cos\\theta = \\frac{P}{P_a} = \\frac{400}{\\sqrt{400^2 + (216.92 - Q_c)^2}} = 0.95$\n따라서 진상무효전력 $Q_c = 85.45[\\mathrm{kVar}]$","img":null,"expImg":null},{"id":49,"text":"$2$ 방향성 $3$ 단자 사이리스터는?","opts":["SCR","SSS","TRIAC","SCS"],"answer":2,"exp":"반도체 소재괄호 안은 극(단자) 수)\n\n    단방향성 : SCR(3), GTO(3), LASCR(3), SCS(4)\n\n    양방향성 : SSS(2), TRIAC(3), DIAC(2)","img":null,"expImg":null},{"id":50,"text":"스테핑 전동기의 스텝 각이 $3^\\circ$ 이고, 스테핑 주파수(pulse rate)가 $1,200[\\mathrm{pps}]$ 이다. 이 스테핑 전동기의 회전속도 $[\\mathrm{rps}]$ 는?","opts":["$10$","$12$","$14$","$16$"],"answer":0,"exp":"스테핑 모터 속도 계산\n스텝각 $\\times$ 스테핑 주파수 $= 3 \\times 1,200 = 3,600$\n스테핑의 회전속도 $n = \\frac{3,600^\\circ}{360^\\circ} = 10[\\mathrm{rps}]$","img":null,"expImg":null}];
const title=" 23년 2회 산업기사 01~50";
let Q=QS,cur=0,score=0,round=1,ans=new Array(Q.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+Q.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=Q[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===Q.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+Q.length+(round>1?' · 오답 '+(round-1)+'차':'')+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===Q[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function wrongIdx(){
  const r=[];
  for(let i=0;i<Q.length;i++){ if(ans[i]===null||!ans[i].ok) r.push(i); }
  return r;
}
function result(){
  const total=Q.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100);
  const wrong=wrongIdx(),skipped=total-done,retryMode=round>1;
  const pass=pct>=60;
  const col=retryMode?(wrong.length===0?'#3fb950':'#58a6ff'):(pass?'#3fb950':'#f85149');
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  let rt,sub;
  if(retryMode){
    rt=wrong.length===0?'🎉 오답 정복 완료!':'📝 오답 재풀이 '+(round-1)+'차 결과';
    sub=total+'문제 중 '+score+'문제 정답'+(wrong.length?' · 아직 '+wrong.length+'문제 남았어요':'');
  } else {
    rt=pass?'🎉 합격!':'😥 불합격';
    sub=pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다';
  }
  let note='';
  if(wrong.length){
    note='<div class="res-note">다시 볼 문제: '+wrong.map(i=>'Q'+String(Q[i].id).padStart(2,'0')).join(' ')+(skipped?'<br>안 푼 문제 '+skipped+'개도 다시 풀기에 포함돼요':'')+'</div>';
  }
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+col+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+rt+'</div>'+
    '<div class="res-sub">'+sub+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div>'+note+
    (wrong.length?'<button class="retry wrong" onclick="retryWrong()">❌ '+(skipped?'오답·미풀이 ':'오답 ')+wrong.length+'문제만 다시 풀기</button>':'')+
    '<button class="retry'+(wrong.length?' sub':'')+'" onclick="restart()">🔄 '+(retryMode?'전체 문제 처음부터 다시 풀기':'처음부터 다시 풀기')+'</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function retryWrong(){
  const w=wrongIdx(); if(!w.length) return;
  Q=w.map(i=>Q[i]); round++;
  cur=0; score=0; ans=new Array(Q.length).fill(null); cache={}; render();
}
function restart(){Q=QS;round=1;cur=0;score=0;ans=new Array(Q.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/Q.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
</body>
</html>
