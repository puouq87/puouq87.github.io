<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>변압기 용량 선정문제</title><style>
:root{--bg:#f3f5f6;--card:#fff;--ink:#1b2a33;--sub:#5b6b75;--line:#d5dce0;--acc:#17506e;--acc-ink:#fff;--ok:#1d7a46;--okbg:#e4f4ea;--ng:#b3321f;--ngbg:#fbe8e4;--fs:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif;--mono:Consolas,'D2Coding',monospace}
@media(prefers-color-scheme:dark){:root{--bg:#12191d;--card:#1b252b;--ink:#e6edf0;--sub:#9aaab3;--line:#33434c;--acc:#6fb7d8;--acc-ink:#0d1a21;--ok:#5fcf8d;--okbg:#17352488;--ng:#ff8f7d;--ngbg:#3d1f1b88}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--fs)}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 96px}
h1.app{font-size:20px;margin:8px 0 16px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:6px 12px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.x{padding:2px 9px;color:var(--sub)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
.card .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;color:var(--sub);font-size:14px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
textarea{resize:vertical}
.t-in{font-size:18px;font-weight:700}
.note-in{font-size:13px;color:var(--sub)}
.f{margin:8px 0}
.f label,.lab{display:block;font-size:13px;color:var(--sub);margin-bottom:2px}
.rows{display:grid;grid-template-columns:minmax(80px,1fr) 2fr auto;gap:6px;margin:8px 0}
.rows input.k{font-family:var(--mono);font-weight:700}
details{margin-top:10px}
summary{cursor:pointer;color:var(--acc);font-size:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pool{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.cnt{font-size:14px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:14px;display:inline-flex;gap:4px;align-items:center}
.chip.a{background:var(--okbg);border-color:var(--ok)}
.cx{border:0;background:none;padding:0 2px;color:var(--sub)}
.addrow{display:flex;gap:6px}
.grp{margin:12px 0}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:6px;margin-bottom:6px}
.chk{display:flex;gap:4px;align-items:center;font-size:14px;white-space:nowrap}
.chk input{width:auto}
.sm{width:6em}
.resv{font-weight:700}
.hid{display:none}
.drop{border:2px dashed var(--line);border-radius:8px;padding:10px;font-size:14px;color:var(--sub);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.imgpv{display:flex;gap:8px;align-items:flex-end;margin-top:6px}
.imgpv img{max-width:100%;max-height:160px;border:1px solid var(--line);border-radius:6px}
/* 생성되는 문제지에서도 사용 */
.q h2{font-size:20px;margin:0 0 4px}
.q .ins{margin:0 0 4px;white-space:pre-wrap}
.q .note{margin:0 0 12px;font-size:13px;color:var(--sub);white-space:pre-wrap}
.banner{background:var(--acc);color:var(--acc-ink);text-align:center;font-size:20px;font-weight:700;border-radius:6px;padding:6px 12px;margin-bottom:12px}
.pimg{display:block;margin:10px auto;border:1px solid var(--line);border-radius:6px}
.pair{display:grid;grid-template-columns:minmax(90px,1fr) 2fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pair .k{font-family:var(--mono);font-weight:700;font-size:18px}
.pair .r{display:flex;flex-direction:column;gap:4px;min-width:0}
.pair.ok select{border-color:var(--ok);background:var(--okbg)}
.pair.ng select{border-color:var(--ng);background:var(--ngbg)}
.mark{font-size:13px;font-weight:700}
.ok .mark{color:var(--ok)}.ng .mark{color:var(--ng)}
.mark.okm{color:var(--ok)}.mark.ngm{color:var(--ng)}
input.ok{border-color:var(--ok);background:var(--okbg)}
input.ng{border-color:var(--ng);background:var(--ngbg)}
.key{font-size:14px;color:var(--acc)}
.score{font-weight:700;margin-top:8px}
.fx{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin:12px 0}
.frac{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;margin:0 4px}
.fn,.fd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center}
.fn{padding:0 6px 6px;border-bottom:2px solid var(--ink)}
.fd{padding:6px 6px 0}
.frac.wide{flex:1 1 260px;max-width:440px}
.frac.wide .iw{width:100%}
.frac.wide input{flex:1}
.iw{display:inline-flex;align-items:center;gap:4px}
.op{color:var(--sub)}
.term{width:8em}
.pal{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.sym{min-width:42px;font-size:18px;padding:4px 10px}
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dock .tot{margin-left:auto;font-weight:700}
@media(max-width:520px){.pair{grid-template-columns:1fr}}

   var v=normT(F[gk+j]),hit=-1;

   if(hit>=0)used[hit]=1;
   put(gk+j,hit>=0)})});

function gradeAny(p){if(p.type==='calc'){var g=gradeCalc(p);return[g.pts,g.max]}return gradeMatch(p)}
function start(){ans={};graded=false;showKey=false;opts={};
 P.forEach(function(p){if(p.type==='calc'){ans[p.id]={};return}
  var s=new Set(p.rows.map(function(r){return r.v}));(p.fakes||[]).forEach(function(f){s.add(f)});opts[p.id]=shuffle(Array.from(s))});render()}
function matchCard(p,i){var rs=graded?gradeMatch(p):null;
 return h('section',{class:'card q'},
  h('h2',{},(P.length>1?(i+1)+'. ':'')+(p.title||'')),
  p.instr&&h('p',{class:'ins'},p.instr),p.note&&h('p',{class:'note'},p.note),
  p.rows.map(function(r,j){var id=p.id+':'+j;
   var sel=h('select',{'aria-label':r.k+' 명칭',onchange:function(e){ans[id]=e.target.value}},h('option',{value:''},'선택'),opts[p.id].map(function(o){return h('option',{value:o},o)}));
   sel.value=ans[id]||'';var ok=graded&&ans[id]===r.v;
   return h('div',{class:'pair'+(graded?(ok?' ok':' ng'):'')},h('div',{class:'k'},r.k),
    h('div',{class:'r'},sel,graded&&h('span',{class:'mark'},ok?'정답':'오답'),showKey&&h('span',{class:'key'},'정답: '+r.v)))}),
  rs&&h('div',{class:'score'},'점수 '+rs[0]+' / '+rs[1]))}
function calcCard(p){
 var F=ans[p.id],g=graded?gradeCalc(p):null,G=p.groups,out=[];
 function iw(inp,k){var s=h('span',{class:'iw'},inp);if(g){var ok=g.r[k];inp.className+=ok?' ok':' ng';s.append(h('span',{class:'mark '+(ok?'okm':'ngm')},ok?'✓':'✗'))}return s}
 function terms(gk){var o=[];G[gk].forEach(function(t,j){if(j)o.push(h('span',{class:'op'},'×'));var k=gk+j;o.push(t.blank?iw(cin(F[k],'?',function(v){F[k]=v},'term'),k):h('span',{},t.n.split(',')[0].trim()))});return o}
 function nm(gk){return G[gk].map(function(t){return t.n.split(',')[0].trim()})}
 var dec=p.dec==null?2:p.dec;
 out.push(p.banner&&h('div',{class:'banner'},p.banner),p.text&&h('p',{class:'ins'},p.text),p.note&&h('p',{class:'note'},p.note),

  out.push(h('div',{class:'fx'},h('b',{},'기본 공식 :'),p.lhs,'[',iw(cin(F.u,'단위',function(v){F.u=v},'term'),'u'),'] =',
   fraction(terms('num'),terms('den')),G.post.length?[h('span',{class:'op'},'×'),terms('post')]:null));
  if(showKey)out.push(h('div',{class:'key'},'정답 공식: '+p.lhs+'['+p.unit+'] = ('+nm('num').join(' × ')+') / ('+nm('den').join(' × ')+')'+nm('post').map(function(x){return ' × '+x}).join('')))}
 out.push(h('div',{class:'fx'},h('b',{},'계산 :'),
  fraction([iw(cin(F.cn,'분자 식',function(v){F.cn=v}),'cn')],[iw(cin(F.cd,'분모 식',function(v){F.cd=v}),'cd')],'wide'),
  '=',iw(cin(F.cr,'결과',function(v){F.cr=v},'term'),'cr'),'['+p.unit+']'),
  palette((p.syms||'').split(/\s+/).filter(Boolean)));
 if(showKey)out.push(h('div',{class:'fx key'},'정답 :',fraction([p.ansNum.replace(/\*/g,'×')],[p.ansDen.replace(/\*/g,'×')]),'= '+(evalExpr(p.ansNum)/evalExpr(p.ansDen)).toFixed(dec)+' ['+p.unit+']'));
 out.push(h('div',{class:'fx'},h('b',{},'답 :'),iw(cin(F.cs,'',function(v){F.cs=v},'term'),'cs'),'['+p.selUnit+']'));

function render(){app.innerHTML='';

  h('button',{class:'pri',onclick:function(){graded=true;render()}},'채점'),

  h('span',{class:'tot'},tot),h('button',{onclick:start},'다시 풀기')))}
