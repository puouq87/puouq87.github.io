<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title> 전기산업기사_파이널_273p~284p</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.retry.wrong{background:linear-gradient(135deg,#f85149,#d29922);color:#fff;}
.retry.sub{background:#21262d;color:#8b949e;border:1px solid #30363d;margin-top:8px;}
.res-note{font-size:12px;color:#8b949e;line-height:1.7;margin:-12px 0 20px;word-break:keep-all;}
</style>

 소손할 수 있는 과전류가 생길 우려가 없는 경우","전동기가 단상의 것으로 전원 측 전로에 시설하는 배선차단기의 정격전류가 20 [A] 이하인 경우","전동기가 단상의 것으로 전원 측 전로에 시설하는 과전류 차단기의 정격전류가 16 [A] 이하인 경우"],"answer":0,"exp":"(KEC 212.6.3조) 저압전로 중의 전동기 보호용 과전류보호장치의 시설\n옥내에 시설하는 전동기(정격 출력이 0.2 [kW] 이하인 것을 제외한다.)에는 전동기가 소손될 우려가 있는 과전류가 생겼을 때에 자동적으로 이를 저지하거나 이를 경보하는 장치를 하여야 한다. 다만, 다음에 해당하는 경우에는 그러하지 아니하다.\n\n    전동기를 운전 중 상시 취급자가 감시할 수 있는 위치에 시설하는 경우\n\n    전동기의 구조나 부하의 성질로 보아 전동기가 소손할 수 있는 과전류가 생길 우려가 없는 경우\n\n    단상전동기로서 그 전원측 전로에 시설하는 과전류 차단기의 정격전류가 16 [A](배선차단기는 20 [A]) 이하인 경우","img":null,"expImg":null},{"id":7,"text":"저압 옥내배선에 사용되는 연동선의 굵기는 일반적인 경우 몇 [ $\\text{mm}^2$ ] 이상이어야 하는가?","opts":["2","2.5","4","6"],"answer":1,"exp":"(KEC 231.3조) 저압 옥내배선의 사용전선 및 중성선의 굵기\n저압 옥내배선의 전선 : 단면적이 2.5 [ $\\text{mm}^2$ ] 이상의 연동선 또는 이와 동등 이상의 강도 및 굵기의 것","img":null,"expImg":null},{"id":8,"text":"옥내에 시설하는 저압 전선으로 나전선을 사용할 수 있는 배선공사는?","opts":["합성수지관 공사","금속관 공사","버스덕트 공사","플로어덕트 공사"],"answer":2,"exp":"(KEC 231.4조) 나전선의 사용 제한\n\n    애자사용공사에 의하여 전개된 곳에 다음의 전선을 시설하는 경우\n\n    전기로용 전선\n\n    전선의 피복 절연물이 부식하는 장소에 시설하는 전선\n\n    취급자 이외의 자가 출입할 수 없도록 설비한 장소에 시설하는 전선\n\n    버스덕트공사에 의하여 시설하는 경우\n\n    라이팅덕트공사에 의하여 시설하는 경우\n\n    접촉 전선을 시설하는 경우","img":null,"expImg":null},{"id":9,"text":"백열전등 또는 방전등에 전기를 공급하는 옥내전로의 대지전압은 몇 [V] 이하이어야 하는가?","opts":["150","300","400","600"],"answer":1,"exp":"(KEC 231.6조) 옥내전로의 대지 전압의 제한\n백열전등 또는 방전등에 전기를 공급하는 대지전압은 300 [V] 이하이어야 하며 다만 다음 각 호에 의하여 시설한다. 다만, 대지전압 150 [V] 이하의 전로인 경우에는 다음에 따르지 않을 수 있다.\n\n    백열전등 또는 방전등 및 이에 부속하는 전선은 사람이 접촉할 우려가 없도록 시설할 것\n\n    백열전등 또는 방전등용 안정기는 저압의 옥내배선과 직접 접속하여 시설할 것\n\n    백열전등의 전구소켓은 키나 그 밖의 점멸기구가 없는 것일 것","img":null,"expImg":null},{"id":10,"text":"옥내전로의 대지전압에 대한 내용이다. ( ) 안에 알맞은 숫자를 바르게 나열한 것은?","opts":["㉠ : 1, ㉡ : 500","㉠ : 1, ㉡ : 300","㉠ : 3, ㉡ : 300","㉠ : 3, ㉡ : 500"],"answer":2,"exp":"(KEC 231.6조) 옥내전로의 대지 전압의 제한\n주택의 전로 인입구에는 「전기용품 및 생활용품 안전관리법」에 적용을 받는 감전보호용 누전차단기를 시설하여야 한다. 다만, 전로의 전원측에 정격용량이 3 [kVA] 이하인 절연변압기(1차 전압이 저압이고 2차 전압이 300 [V] 이하인 것에 한한다)를 사람이 쉽게 접촉할 우려가 없도록 시설하고 또한 그 절연변압기의 부하측 전로를 접지하지 않는 경우에는 예외로 한다.","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCABdAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6i8BaTpUvgfQpJdMsndtOgLM0Ckk+WuSTitr+xdH/AOgTYf8AgOn+FUfh7/yIWgf9g23/APRa1u0AUf7G0f8A6BNh/wCA6f4Uf2No/wD0CrD/AMB0/wAK4j4weKf7GltLDTPF5sNckid7bRbSxjvL3USeE2RtyqgqwL8KOSxAWsf4SeKPEjatb6J8RfFMVn4paORG0KazhhFwy5PnW0q/6+PapPy528hsEGgD0/8AsbR/+gVYf+A6f4Uf2No//QJsP/AdP8K+efC3xN+IOqfB3VPF95eavFdJ4env4nOgRxWglXG3y5izbz6Arzz6V0mj/ErxGfCni/VvJniux4xt9F06LVYAo09J1s0VpVQ8qjTO+N2TkDIzwAexf2No/wD0CbD/AMB0/wAKP7G0f/oE2H/gOn+FeO+OfF/jbw14b8b6He69Z32q6TottqlnqtnZi3ZBLM8ZjkiLOob90Sp7gnjK5Ps2qR302l3EWm3cVpePERDPJD5qxvjhimV3AemR9aAI/wCxtH/6BNh/4Dp/hR/Y2j/9Amw/8B0/wrxTwJ8SPF17L4mu9Q1ZPENpo9/JZQWmi6CRPdRFMR3gJmOIvMSZMgEExnnrjZbxpq0Pwm+H+oP4may1nXLC3Yv/AGBNqkl5KbXzZAsUBUqcBmJ6YB4oA9S/sbR/+gVYf+A6f4Uf2No//QJsP/AdP8K8v8E+KfHd58QNK026u7rVNGuILhr2aXwdeaULdlVTF+8mYhtxLcf7PvXVfFLxBq2kHw7pGi3FpZXniDVl05L66j8xLUeTLKWCZG9yIiigkDcwJzjBAOm/sbR/+gVYf+A6f4Uf2No//QKsP/AdP8K8s1TxZ4q0/RvF+i3uqR3WoaDqOlpFqlvbiEyxXU0RMbpyokVWIJHVXU4BNM8e+NNftdQ8eTW3izT/AA8vhO0Se1srq1jk+3ZgEolkLHd5TOTCBHg7o25J4AB6t/Y2j/8AQJsP/AdP8KP7G0f/AKBVh/4Dp/hXGeG/EWs6n8TLazuWks7W48I22ovYMo/c3EkzBs5GcgAL+HSpr3Q/HNpZTXUvxKYJDG0jn+xLfGAMnv7UAdb/AGNo/wD0CrD/AMB0/ 사에서 전선 상호 간의 간격은 몇 [m] 이상이어야 하는가?","opts":["0.06","0.02","0.04","0.08"],"answer":0,"exp":"(KEC 232.56조) 애자공사\n애자공사에 의한 저압 옥내 배선시 전선 상호 간의 간격은 0.06 [m] 이상일 것","img":null,"expImg":null},{"id":12,"text":"건조한 장소에 시설하는 애자공사로서 사용 전압이 440 [V] 인 경우 전선과 조영재와의 이격거리는 최소 몇 [cm] 이상이어야 하는가?","opts":["2.5","3.5","4.5","5.5"],"answer":0,"exp":"(KEC 232.56조) 애자공사\n\n    전선은 절연전선(옥외용 비닐 절연전선 및 인입용 비닐 절연전선을 제외한다)일 것\n\n    전선 상호 간의 간격은 0.06 [m] 이상일 것\n\n    전선과 조영재 사이의 이격거리는 사용전압이 400 [V] 이하인 경우에는 25 [mm] 이상, 400 [V] 초과인 경우에는 45 [mm] (건조한 장소에 시설하는 경우에는 25 [mm]) 이상일 것\n\n    전선의 지지점 간 거리는 전선을 조영재 윗면 또는 옆면에 따라 붙일 경우에는 2 [m] 이하일 것\n\n    ④의 경우 이외에는 전선의 지지점 간의 거리는 6 [m] 이하일 것","img":null,"expImg":null},{"id":13,"text":"합성수지관공사 시 연선이 아닌 경우 사용할 수 있는 전선의 단면적은 몇 [ $\\text{mm}^2$ ] 이하인가?(단, 알루미늄선은 제외한다)","opts":["4","6","10","16"],"answer":2,"exp":"(KEC 232.11조) 합성수지관공사\n전선은 절연전선(옥외용 비닐 절연전선 제외)일 것\n전선은 연선일 것 다만, 다음의 것은 적용하지 않는다.\n짧고 가는 합성수지관에 넣은 것\n단면적 10 [ $\\text{mm}^2$ ] (알루미늄선은 단면적 16 [ $\\text{mm}^2$ ]) 이하의 것\n전선은 합성수지관 안에서 접속점이 없도록 할 것","img":null,"expImg":null},{"id":14,"text":"금속관공사에 의한 저압 옥내배선의 시설방법으로 틀린 것은?","opts":["전선은 절연전선일 것","관의 두께는 콘크리트에 매입하는 것은 1.2 [mm] 이상일 것","전선은 16 [ $\\text{mm}^2$ ] 경동선단일 것","전선은 금속관 안에서 접속점이 없도록 할 것"],"answer":2,"exp":"(KEC 232.12조) 금속관공사\n(1) 전선은 절연전선(옥외용 비닐절연전선을 제외한다)일 것\n(2) 전선은 연선일 것. 다만, 다음의 것은 적용하지 않는다.\n짧고 가는 금속관에 넣은 것\n단면적 10 [ $\\text{mm}^2$ ] (알루미늄선은 단면적 16 [ $\\text{mm}^2$ ]) 이하의 것\n(3) 전선은 금속관 안에서 접속점이 없도록 할 것\n(4) 관의 두께는 다음에 의할 것\n① 콘크리트에 매설하는 것은 1.2 [mm] 이상\n② 콘크리트에 매설하는 것 이외의 것은 1 [mm] 이상","img":null,"expImg":null},{"id":15,"text":"금속관공사로부터 애자공사로 옮기는 경우 절연부싱을 사용하는 가장 주된 목적은?","opts":["관의 끝이 터지는 것을 방지","관내 해충 및 이물질 출입 방지","관의 끝부분에서 조영재의 접촉 방지","관의 끝부분에서 전선 피복의 손상 방지"],"answer":3,"exp":"(KEC 232.12조) 금속관공사\n관의 끝 부분에는 전선의 피복을 손상하지 아니하도록 적당한 구조의 부싱을 사용할 것. 단, 금속관공사로부터 애자공사로 옮기는 경우에는 그 부분의 관의 끝 부분에는 절연부싱 또는 이와 유사한 것을 사용하여야 한다.","img":null,"expImg":null},{"id":16,"text":"금속제 가요전선관 공사방법의 내용으로 틀린 것은?","opts":["전선은 절연전선(옥외용 비닐 절연전선을 제외한다.)일 것","가요전선관공사는 접지공사를 생략할 것","전선은 연선일 것 다만, 단면적 10 [ $\\text{mm}^2$ ](알루미늄선은 단면적 16 [ $\\text{mm}^2$ ]) 이하인 것은 그러하지 아니하다.","가요 전선관 안에는 전선에 접속점이 없도록 할 것"],"answer":1,"exp":"(KEC 232.13조) 금속제 가요전선관공사\n① 전선은 절연전선(옥외용 비닐 절연전선을 제외한다)일 것\n② 전선은 연선일 것 다만, 단면적 10 [ $\\text{mm}^2$ ](알루미늄선은 단면적 16 [ $\\text{mm}^2$ ]) 이하인 것은 그러하지 아니하다.\n③ 가요 전선관 안에는 전선에 접속점이 없도록 할 것\n④ 접지공사를 할 것","img":null,"expImg":null},{"id":17,"text":"금속덕트공사에 대한 내용으로 틀린 것은?","opts":["덕트의 끝부분은 막지 않을 것","금속덕트 안에는 전선에 접속점이 없을 것","전선은 옥외용 비닐절연전선을 제외한 절연전선일 것","덕트는 물이 고이는 낮은 부분을 만들지 않도록 시설할 것"],"answer":0,"exp":"(KEC 232.31조) 금속덕트공사\n① 덕트의 끝부분은 막을 것\n② 덕트 안에는 전선의 접속점이 없을 것(전선을 분기하는 경우에 그 접속점을 쉽게 점검할 수 있는 경우는 가능)\n③ 전선은 절연전선(옥외용 비닐절연전선을 제외한다)일 것\n④ 덕트는 물이 고이는 낮은 부분을 만들지 않도록 시설할 것","img":null,"expImg":null},{"id":18,"text":"저압 옥내배선을 금속 덕트 공사로 할 경우 금속 덕트에 넣는 전선의 단면적(절연피복의 단면적 포함)의 합계는 덕트의 내부 단면적의 몇 [ % ]까지 할 수 있는가?","opts":["20","30","40","50"],"answer":0,"exp":"(KEC 232.31조) 금속덕트공사\n금속덕트공사에 의한 저압 옥내배선은 다음 각 호에 따라 시설하여야 한다.\n① 전선은 절연전선(옥외용 비닐절연전선을 제외한다)일 것 \n②금속 덕트에 넣은 전선의 단면적(절연피복의 단면적을 포함한다)의 합계는 덕트의 내부 단면적의 20 [ % ] (전광표시 장치·기타 이와 유사한 장치 또는 제어회로 등의 배선만을 넣는 경우에는 50 [ % ]) 이하일 것","img":null,"expImg":null},{"id":19,"text":"플로어덕트 공사에 의한 저압 옥내배선에서 연선을 사용하지 않아도 되는 전선의 단면적은 최대 몇 [ $\\text{mm}^2$ ]인가?","opts":["2","4","8","10"],"answer":3,"exp":"(KEC 232.32조) 플로어덕트공사\n전선은 절연전선(옥외용 비닐절연전선을 제외한다)일 것\n전선은 연선일 것. 다만, 단면적 10 [ $\\text{mm}^2$ ](알루미늄선은 단면적 16 [ $\\text{mm}^2$ ]) 이하인 것은 그러하지 아니하다.","img":null,"expImg":null},{"id":20,"text":"호텔 또는 여관 각 객실의 램프 등을 점등할 경우 몇 분 이내에 소등되는 타임스위치를 사용하여야 하는가?","opts":["1","2","3","4"],"answer":0,"exp":"(KEC 234.6조) 괄동시의 시설\n호텔숙박업 또는 숙박업의 호텔이나 여관 각 객실 입구등 1분, 일반 주택 및 아파트 현관등 3분 이내","img":null,"expImg":null},{"id":21,"text":"교통 신호등 제어장치의 2차측 배선의 최대사용전압은 [v]이하 이어야 하는가?","opts":["380","300","220","110"],"answer":1,"exp":"(KEC 234.15조) 신호시스물\n교통신호등 제어장치의 2차측 배선의 최대사용전압은 300 [V] 이하이어야 한다.","img":null,"expImg":null},{"id":22,"text":"전기 울타리의 시설에 관한 설명으로 틀린 것은?","opts":["전원장치에 전기를 공급하는 전로의 사용전압은 600 [V] 이하이어야 한다.","사람이 쉽게 출입하지 아니하는 곳에 시설한다.","전선은 지름 2 [mm] 이상의 경동선을 사용한다.","수목 사이의 이격거리는 30 [cm] 이상이어야 한다."],"answer":0,"exp":"(KEC 241.13조) 전기울타리의 시설\n① 전기울타리는 사람이 쉽게 출입하지 아니하는 곳에 시설할 것\n② 전기울타리를 시설한 곳에는 사람이 보기 쉽도록 적당한 간격으로 위험표기를 할 것\n③ 전선은 인장강도 1.38 [kN] 이상 또는 지름 2 [mm] 이상의 경동연선일 것\n④ 전선과 이를 지지하는 가물 사이의 이격거리는 25 [mm] 이상일 것\n⑤ 전선과 다른 시설물(가공 전선로 전선은 제외) 또는 수목 사이의 이격거리는 0.3 [m] 이상일 것\n⑥ 전기울타리에 전기를 공급하는 전로에는 쉽게 개폐할 수 있는 곳에 전용 개폐기를 시설하여야 한다.\n⑦ 전기울타리를 전원 장치에 전기를 공급하는 전로의 사용전압은 250 [V] 이하이어야 한다.","img":null,"expImg":null},{"id":23,"text":"전기온장의 발열선은 온도기가 몇 [ ${}^\\circ \\text{C}$ ]를 넘지 않도록 시설하여야 하는가?","opts":["70","80","90","100"],"answer":1,"exp":"(KEC 241.5조) 전기온장 등\n전로의 대지전압 : 300 [V] 이하\n발열선은 그 온도가 80 [ ${}^\\circ \\text{C}$ ]를 넘지 아니하도록 시설할 것\n발열선을 공중에 시설하는 전기온장 등은 발열선의 지지점간의 거리는 1 [m] 이하일 것","img":null,"expImg":null},{"id":24,"text":"발열선을 공중에 시설하는 전기온장 등에서 발열선을 애자로 지지하는 경우 지지형간의 거리는 몇 [m] 이하이어야 하는가?(단, 발열선의 상호간의 간격이 0.06 [m] 미만인 경우이다)","opts":["1","0.6","1.6","3"],"answer":0,"exp":"(KEC 241.5조) 전기온장 등\n발열선을 공중에 시설하는 전기온장 등은 발열선의 자가지산의 거리는 1 [m] 이하일 것 (단, 발열선 상호 간의 간격이 0.06 [m] 이상인 경우에는 2[m] 이하 가능)","img":null,"expImg":null},{"id":25,"text":"아크 용접기의 시설 기준으로 틀린 것은?","opts":["용접변압기의 1차측 전로의 대지전압은 300 [V] 이하일 것","전로는 용접 시 안전을 위해 흐르는 전류를 통과하지 못하게 하여 시설할 것","용접변압기는 절연변압기일 것","용접변압기 1차측 전로에는 용접변압기에 가까운 곳에 쉽게 개폐할 수 있는 개폐기를 시설할 것"],"answer":1,"exp":"(KEC 241.10조) 아크 용접기\n① 변압기는 1차 대지전압 300 [V] 이하의 절연 변압기일 것\n② 용접변압기로부터 용접 접극에 이르는 부분 및 용접 변압기로부터 피용접재에 이르는 부분의 전선은 캡타이어나 1종 이외의 캡타이어 케이블을 사용한다.\n③ 전로는 용접 시 흐르는 전류를 안전하게 통할 수 있는 것일 것","img":null,"expImg":null},{"id":26,"text":"파이프라인 등에 전열장치 발열선을 시설하는 기준에 대한 설명으로 틀린 것은?","opts":["발열체 상호 간의 접속은 용접 또는 프렌지 접합에 의할 것","발열체는 그 온도가 피 가열 액체의 발화 온도의 90 [%]를 넘지 않도록 시설할 것","발열체에는 슈를 직접 붙이지 아니할 것","발열체와 통기관 드레인관 등의 부속과의 접속부분에는 발열체가 발생하는 열에 견디는 절연물을 삽입할 것"],"answer":1,"exp":"(KEC 241.11조) 파이프라인 등의 전열장치\n① 발열체는 그 온도가 피 가열 액체의 발화 온도의 80 [%]를 넘지 아니하도록 시설할 것\n② 발열체 상호 간의 접속은 용접 또는 프렌지 접합에 의할 것\n③ 발열체에는 슈를 직접 붙이지 아니할 것\n④ 발열체 상호 간의 프렌지 접합부 및 발열체와 통기관·드레인관 등의 부속물과의 접속부분에는 발열체가 발생하는 열에 견디는 절연물을 삽입할 것","img":null,"expImg":null},{"id":27,"text":"수중조명등의 절연변압기는 1차 권선과 2차 권선 사이에 금속제의 혼촉방지판을 설치하는 경우 2차측 전로의 사용전압이 몇 [V] 이하인가?","opts":["30","60","150","300"],"answer":0,"exp":"(KEC 234.14조) 수중조명등\n절연 변압기는 그 2차측 전로의 사용전압이 30 [V] 이하인 경우에는 1차 권선과 2차권선 사이에 금속제의 혼촉방지판을 설치하여야 하며 또한 이를 접지공사 할 것","img":null,"expImg":null},{"id":28,"text":"전기부식방지 시설을 시설할 때 전기부식방지용 전원 장치로부터 양극 및 피방식체까지의 전로의 사용전압은 직류 몇 [V] 이하이어야 하는가?","opts":["20","40","60","80"],"answer":2,"exp":"(KEC 241.16조) 전기부식방지 시설\n지중 또는 수중에 시설되는 금속체의 부식을 방지하기 위하여 지중 또는 수중에 시설하는 양극과 금속체 간에 방식 전류를 통하는 시설로 다음와 같이 한다.\n① 사용 전압은 직류 60 [V] 이하일 것\n② 지중에 매설하는 양극은 0.75 [m] 이상의 깊이일 것\n③ 전선은 케이블인 경우를 제외하고 2 [mm] 경동선 이상이어야 한다.","img":null,"expImg":null},{"id":29,"text":"폭연성 먼지 또는 화약류의 가루가 전기설비가 발화원이 되어 폭발할 우려가 있는 곳에 시설하는 저압 옥내배선의 공사방법으로 옳은 것은?","opts":["금속관 공사","애자 공사","합성수지관 공사","캡타이어 케이블 공사"],"answer":0,"exp":"(KEC 242.2조) 폭연성 먼지 위험장소\n폭연성 먼지 또는 화약류의 가루가 전기설비가 발화원이 되어 폭발할 우려가 있는 곳에 시설하는 저압 옥내 전기설비는 금속관 공사 또는 케이블 공사에 의할 것","img":null,"expImg":null},{"id":30,"text":"진열장 안의 사용전압이 400 [V] 이하인 저압 옥내배선으로 외부에서 보기 쉬운 곳에 한하여 시설할 수 있는 전선은? 단, 진열장은 건조한 곳에 시설하고 또한 진열장 내부를 건조한 상태로 사용하는 경우이다.","opts":["단면적이 0.75 [ $\\text{mm}^2$ ] 이상인 코드 또는 캡타이어 케이블","단면적이 0.75 [ $\\text{mm}^2$ ] 이상인 나전선 또는 캡타이어 케이블","단면적이 1.25 [ $\\text{mm}^2$ ] 이상인 코드 또는 절연전선","단면적이 1.25 [ $\\text{mm}^2$ ] 이상인 나전선 또는 다심형전선"],"answer":0,"exp":"(KEC 234.8조) 진열장 또는 이와 유사한 것의 내부 배선\n건조한 곳에 시설하고 내부를 건조한 상태로 사용하는 진열장 또는 진열장 안의 사용 전압이 400 [V] 이하인 저압 옥내 배선은 외부에서 보기 쉬운 곳에 한하여 단면적이 0.75 [ $\\text{mm}^2$ ] 이상의 코드 또는 캡타이어 케이블을 1 [m] 이하마다 시설할 수 있다.","img":null,"expImg":null},{"id":31,"text":"무대·무대마루 밑·오케스트라박스·영사실 기타 사람이나 무대 도구가 접촉할 우려가 있는 곳에 시설하는 저압 옥내배선·전구선 또는 이동전선은 사용전압이 몇 [V] 이하이어야 하는가?","opts":["100","200","300","400"],"answer":3,"exp":"(KEC 242.6조) 전시회, 쇼 및 공연장의 전기설비\n무대·무대마루 밑·오케스트라박스·영사실 기타 사람이나 무대 도구가 접촉할 우려가 있는 곳에 시설하는 저압 옥내배선·전구선 또는 이동전선은 사용전압이 400 [V] 이하일 것","img":null,"expImg":null},{"id":32,"text":"옥내의 네온방전등 공사에서 전선지지지점 간의 거리는 몇 [m] 이하로 하는가?","opts":["1","4","2","3"],"answer":0,"exp":"(KEC 234.12조) 네온방전등\n네온방전등을 옥내, 옥측 또는 옥외에 시설하는 경우 배선은 애자공사에 의할 것\n① 전선은 네온관용 전선\n② 전선은 조영재의 앞면 또는 아랫면에 붙일 것(전개된 장소+기술상 부득이한 경우 예외)\n③ 전선 지지점간의 거리는 1 [m] 이하\n④ 전선 상호간의 간격은 60 [mm] 이상","img":null,"expImg":null},{"id":33,"text":"변압기에 대하여 특고압 전로에 결합되는 고압전로에는 사용 전압의 3배 이하의 전압이 가하여진 경우에 방전하는 피뢰기를 어느 곳에 시설할 때, 방전장치를 생략할 수 있는가?","opts":["변압기의 단자","변압기 단자의 1극","고압전로의 모선의 각상","특고압 전로의 1극"],"answer":2,"exp":"(KEC 322.3조) 특고압과 고압의 혼촉 등에 의한 위험방지 시설\n변압기에 의하여 특고압전로에 결합되는 고압전로에는 사용전압의 3배 이하의 전압이 가하여진 경우에 방전하는 장치를 그 변압기의 단자에 가까운 1극에 설치하여야 한다. 다만, 사용전압의 3배 이하의 전압이 가하여진 경우에 방전하는 피뢰기를 고압전로의 모선의 각상에 시설하는 때에는 그러하지 아니하다.","img":null,"expImg":null},{"id":34,"text":"전로의 중성점 접지의 목적에 해당하지 않는 것은?","opts":["이상전압의 억제","보호장치의 확실한 동작의 확보","대지전압의 저하","손실전력의 감소"],"answer":3,"exp":"(KEC 322.5조) 전로의 중성점의 접지\n전로의 보호 장치의 확실한 동작의 확보, 이상 전압의 억제 및 대지 전압의 저하를 위하여 특히 필요한 경우에 전로의 중성점에 접지한다.","img":null,"expImg":null},{"id":35,"text":"고압 및 특별 고압용 개폐기의 시설기준이 틀린 것은?","opts":["전로 및 접지측 전선에는 과전류 차단기를 시설하여야 한다.","중력 등에 의하여 자연히 작동할 우려가 있는 것은 자물쇠 장치 기타 이를 방지하는 장치를 시설하여야 한다.","부하전류를 차단하기 위한 것이 아닌 개폐기는 부하전류가 통하고 있을 경우에는 회로가 열리지 않도록 시설하여야 한다.","그 작동에 따라 그 개폐 상태를 표시하는 장치가 되어 있는 것이어야 한다."],"answer":0,"exp":"(KEC 341.9조) 개폐기의 시설\n① 전로 중에 개폐기를 시설하는 경우에는 그곳의 각 극에 설치하여야 한다. 다만, 다음의 경우에는 그러하지 아니하다.\n\n    특고압 가공전선로서 다중 접기를 한 중성선을 가지는 것의 그 중성선 이외의 각 극에 개폐기를 시설하는 경우\n\n    제어회로 등에 조작용 개폐기를 시설하는 경우\n    ② 고압용 또는 특고압용의 개폐기는 그 작동에 따라 그 개폐 상태를 표시하는 장치가 되어 있는 것이어야 한다.\n    ③ 고압용 또는 특고압용의 개폐기로서 중력 등에 의하여 자연히 작동할 우려가 있는 것은 자물쇠 장치 기타 이를 방지하는 장치를 시설하여야 한다.\n    ④ 고압용 또는 특고압용의 개폐기로서 부하전류를 차단하기 위한 것이 아닌 개폐기는 부하전류가 통하고 있을 경우에는 개로 할 수 없도록 시설하여야 한다.","img":null,"expImg":null},{"id":36,"text":"특고압을 직접 저압으로 변성하는 변압기를 시설할 수 없는 것은?","opts":["교류식 전기철도용 신호회로에 전기를 공급하기 위한 변압기","전기록 등 전류가 큰 전기를 소비하기 위한 변압기","발전소 변전소 개폐소 또는 이에 준하는 곳의 소내용 변압기","사용전압 100 [kV]를 초과하는 변압기로서 특고압측과 저압측 권선사이에 접지공사를 한 금속제의 혼촉방지판이 없는 것"],"answer":3,"exp":"(KEC 341.3조) 특고압을 직접 저압으로 변성하는 변압기의 시설\n특고압을 직접 저압으로 변성하는 변압기는 다음의 것 이외에는 시설하여서는 아니된다.\n① 전기록 등 전류가 큰 전기를 소비하기 위한 변압기\n② 발전소·변전소·개폐소 또는 이에 준하는 곳의 소내용 변압기\n③ 특고압 전선로에 접속하는 변압기\n④ 사용전압이 35 [kV] 이하인 변압기로서 그 특고압측 권선과 저압측 권선이 혼촉한 경우에 자동으로 변압기를 전로로부터 차단하기 위한 장치를 설치한 것\n⑤ 사용전압이 100 [kV] 이하인 변압기로서 그 특고압측 권선과 저압측 권선사이에 접지공사(접지저항 값이 10 [ $\\Omega$ ] 이하인 것)를 한 금속제의 혼촉방지판이 있는 것\n⑥ 교류식 전기철도용 신호회로에 전기를 공급하기 위한 변압기","img":null,"expImg":null},{"id":37,"text":"과전류차단기를 설치하지 아니할 곳은?","opts":["수용가의 인입선 부분","고압 배전선로의 인출장소","직접 접지계통에 설치한 변압기의 접지도체","역률조정용 고압 병렬콘덴서 뱅크의 분기선"],"answer":2,"exp":"(KEC 341.11조) 과전류차단기의 시설 제한\n① 각종 접지공사의 접지도체\n② 다선식 전로의 중성선\n③ 전로의 일부에 접지공사를 한 저압가공 전선로의 접지 측 전선","img":null,"expImg":null},{"id":38,"text":"아크가 발생하는 고압용 차단기는 목재의 벽 또는 천장 기타의 가연성 물체로부터 몇 [m] 이상 이격하여야 하는가?","opts":["0.5","1","1.5","2"],"answer":1,"exp":"(KEC 341.7조) 아크를 발생하는 가구의 시설\n\n    고압용 - 1 [m] 이상\n\n    특고압 - 2 [m] 이상","img":null,"expImg":null},{"id":39,"text":"피뢰기를 반드시 시설하지 않아도 되는 것은?","opts":["발전소·변전소의 가공전선의 인출구","가공전선로와 지중전선로가 접속되는 곳","고압 가공전선로로부터 수전하는 차단기 2차측","특고압 가공전선로로부터 공급을 받는 수용장소의 인입구"],"answer":2,"exp":"(KEC 341.13조) 피뢰기의 시설\n고압 및 특고압의 전로 중 다음 각 호에 열거하는 곳 또는 이에 근접한 곳에는 피뢰기를 시설하여야 한다.\n① 발전소, 변전소 또는 이에 준하는 장소의 가공전선 인입구 및 인출구\n② 가공전선로에 접속하는 배전용 변압기의 고압측 및 특고압측\n③ 고압 및 특고압 가공전선로로부터 공급을 받는 수용장소의 인입구\n④ 가공전선로와 지중전선로가 접속되는 곳","img":null,"expImg":null},{"id":40,"text":"고압 및 특고압의 전로에 시설하는 피뢰기 접지저항 값은 몇 [ $\\Omega$ ] 이하로 하여야 하는가?(단, 주어진 조건은 고려하지 않는다)","opts":["10","20","30","50"],"answer":0,"exp":"(KEC 142.2조) 피뢰기의 접지\n고압 및 특고압의 전로에 시설하는 피뢰기의 접지저항은 10 [ $\\Omega$ ] 이하로 할 것","img":null,"expImg":null}];
const title=" 전기산업기사_파이널_273p~284p";
let Q=QS,cur=0,score=0,round=1,ans=new Array(Q.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+Q.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=Q[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===Q.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+Q.length+(round>1?' · 오답 '+(round-1)+'차':'')+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===Q[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function wrongIdx(){
  const r=[];
  for(let i=0;i<Q.length;i++){ if(ans[i]===null||!ans[i].ok) r.push(i); }
  return r;
}
function result(){
  const total=Q.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100);
  const wrong=wrongIdx(),skipped=total-done,retryMode=round>1;
  const pass=pct>=60;
  const col=retryMode?(wrong.length===0?'#3fb950':'#58a6ff'):(pass?'#3fb950':'#f85149');
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  let rt,sub;
  if(retryMode){
    rt=wrong.length===0?'🎉 오답 정복 완료!':'📝 오답 재풀이 '+(round-1)+'차 결과';
    sub=total+'문제 중 '+score+'문제 정답'+(wrong.length?' · 아직 '+wrong.length+'문제 남았어요':'');
  } else {
    rt=pass?'🎉 합격!':'😥 불합격';
    sub=pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다';
  }
  let note='';
  if(wrong.length){
    note='<div class="res-note">다시 볼 문제: '+wrong.map(i=>'Q'+String(Q[i].id).padStart(2,'0')).join(' ')+(skipped?'<br>안 푼 문제 '+skipped+'개도 다시 풀기에 포함돼요':'')+'</div>';
  }
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+col+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+rt+'</div>'+
    '<div class="res-sub">'+sub+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div>'+note+
    (wrong.length?'<button class="retry wrong" onclick="retryWrong()">❌ '+(skipped?'오답·미풀이 ':'오답 ')+wrong.length+'문제만 다시 풀기</button>':'')+
    '<button class="retry'+(wrong.length?' sub':'')+'" onclick="restart()">🔄 '+(retryMode?'전체 문제 처음부터 다시 풀기':'처음부터 다시 풀기')+'</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function retryWrong(){
  const w=wrongIdx(); if(!w.length) return;
  Q=w.map(i=>Q[i]); round++;
  cur=0; score=0; ans=new Array(Q.length).fill(null); cache={}; render();
}
function restart(){Q=QS;round=1;cur=0;score=0;ans=new Array(Q.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/Q.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
</body>
</html>
