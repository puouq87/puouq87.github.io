<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>25년 2회 산업기사 01~50</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>

<script>
const QS=[{"id":1,"text":"패러데이 관에 대한 설명으로 틀린 것은?","opts":["패러데이 관내의 전속수는 일정하다.","패러데이 관의 밀도는 전속 밀도와 같다.","패러데이 관 진전하가 있는 점에서 연속이다.","패러데이 관 양단에 양(+), 음(-)의 단위전하가 있다."],"answer":2,"exp":"패러데이관의 양단에는 양 또는 음의 단위 진전하 존재\n패러데이관의 밀도 = 전속밀도\n진전하가 없는 곳에서는 연속","img":null,"expImg":null},{"id":2,"text":"B-H 곡선을 자세히 관찰하면 매끈한 곡선이 아니라 B가 계단적으로 증가 또는 감소함을 알 수 있다. 이러한 현상을 무엇이라 하는가?","opts":["퀴리점(Curie point)","자기여자효과(magnetic after effect)","자왜현상(magneto-striction effect)","바크하우젠 효과(Barkhausen effect)"],"answer":3,"exp":"바크하우젠 효과(Barkhausen effect)\n$B - H$ 곡선에서 $B$가 계단적으로 증감하는 것\n자성체 내에서 임의의 방향으로 배열되었던 자구가 외부자장의 힘이 일정치 이상이 되면 순간적으로 회전하여 자장의 방향으로 배열되기 때문에 자속밀도가 증가하는 현상\n","img":null,"expImg":null},{"id":3,"text":"유전체 중의 전계의 세기를 $E$ [ V / m ], 유전율을 $\\varepsilon$ [ F / m ]이라 하면 전기변위 [ C / $\\text{m}^2$ ]는?","opts":["$\\varepsilon E$","$\\varepsilon E^2$","$\\frac{\\varepsilon}{E}$","$\\frac{E}{\\varepsilon}$"],"answer":0,"exp":"전기변위는 전속밀도와 같으므로 $D = \\varepsilon E$ [ C / $\\text{m}^2$ ] ","img":null,"expImg":null},{"id":4,"text":"원점 주위의 전류밀도가 $J = \\frac{2}{r} a_r$ [ A / $\\text{m}^2$ ] 의 분포를 가질 때 반지름 $5$ [ cm ] 의 구면을 지나는 전전류는?","opts":["$0.1\\pi$","$0.2\\pi$","$0.3\\pi$","$0.4\\pi$"],"answer":3,"exp":"전류 $I = \\oint_{S} J \\cdot ds = \\oint_{S} \\frac{2}{r} a_r \\cdot a_r ds$ ( 단, $a_r \\cdot a_r = 1$ )\n$= \\frac{2}{r} \\oint_{S} ds = \\frac{2}{r} s = \\frac{2}{r} 4\\pi r^2 = 8\\pi r$\n$= 8\\pi \\times 0.05 = 0.4\\pi$ [ A ] \n","img":null,"expImg":null},{"id":5,"text":"강자성체의 자화에 관한 설명으로 틀린 것은?","opts":["강자성체의 자화의 세기는 자계의 세기에 비례한다.","강자성체의 자계를 변화시키면 히스테리시스현상이 나타난다.","강자성체의 히스테리시스손은 히스테리시스 곡선의 면적과 같다.","강자성체의 자속밀도 B는 자계의 세기 H에 비례하지 않는다."],"answer":3,"exp":"자속밀도 $B = \\mu H$ 이므로 강자성체의 자속밀도 B는 자계의 세기 H에 비례한다.","img":null,"expImg":null},{"id":6,"text":"자계의 세기가 $1,000$ [ AT / m ] 이고, 자속밀도가 $0.1$ [ Wb / $\\text{m}^2$ ] 인 재질의 투자율 [ H / m ] 은?","opts":["$10^{-3}$ [ H / m ]","$10^3$ [ H / m ]","$10^{-4}$ [ H / m ]","$10^4$ [ H / m ]"],"answer":2,"exp":"자속밀도 $B = \\mu H$ 에서\n투자율 $\\mu = \\fr  - a}$","$\\frac{2\\pi\\epsilon_0 a b}{b - a}$","$\\frac{4\\pi\\epsilon_0}{b - a}$","$\\frac{2\\pi\\epsilon_0}{b - a}$"],"answer":0,"exp":"동심구 정전용량\n정전용량 $C = \\frac{Q}{V} = \\frac{Q}{\\frac{Q}{4\\pi\\epsilon_0} \\left( \\frac{1}{a} - \\frac{1}{b} \\right)} = \\frac{4\\pi\\epsilon_0}{\\frac{1}{a} - \\frac{1}{b}} = \\frac{4\\pi\\epsilon_0 a b}{b - a}$ [ F ] 에서","img":null,"expImg":null},{"id":21,"text":"송전계통에서 안정도 증진과 관계없는 것은?","opts":["고속 재폐로 방식 채용","계통의 직렬 리액턴스 감소","속응 여자 방식의 채용","선로의 회선수 감소"],"answer":3,"exp":"안정도 향상 대책\n직렬 리액턴스 ( $X$ ) 를 작게 한다.\n① 발전기나 변압기의 리액턴스를 작게 한다.\n② 선로의 병행 회선수를 늘리거나 복도체 또는 다도체 방식을 사용한다.\n③ 직렬 콘덴서를 삽입하여 선로의 리액턴스를 보상한다.\n전압 변동을 작게 한다.\n① 속응 여자 방식의 채용\n② 계통 연계를 한다.\n중간 조상 방식을 채용한다.\n고장 전류를 줄이고 고장 구간을 신속하게 차단한다.\n① 적당한 중성점 접지 방식을 채용하여 지락 전류를 줄인다.\n② 고속도 계전기, 고속도 차단기를 채용한다.\n③ 고속도 재폐로 방식을 채용한다.\n선로의 회선수는 감소가 아니라 병행 회선수를 증가시켜야 리액턴스가 감소하여 안정도가 증진된다.","img":null,"expImg":null},{"id":22,"text":"연간 최대 수용전력이 $60$ [ kW ], $75$ [ kW ], $80$ [ kW ], $105$ [ kW ] 인 4 개의 수용가를 합성한 연간 최대 수용 전력이 $250$ [ kW ] 이다. 이 수용가의 부등률은 얼마인가?","opts":["$1.2$","$1.3$","$1.4$","$1.5$"],"answer":1,"exp":"부등률 = $\\frac{\\text{개개의 최대수용전력의 합}}{\\text{합성 최대수용 전력}}$\n$= \\frac{60 + 75 + 80 + 105}{250} = 1.28$","img":null,"expImg":null},{"id":23,"text":"급수의 엔탈피 $130$ [ kcal / kg ], 보일러 출구(터빈의 입구) 과열 증기 엔탈피 $970$ [ kcal / kg ], 터빈 출구 엔탈피 $550$ [ kcal / kg ]인 랭킨 사이클의 열사이클 효율은?","opts":["$0.2$","$0.4$","$0.5$","$0.8$"],"answer":1,"exp":"$n_c = \\frac{H_e}{i_1 - i_f}$\n여기서, $n_c$ : 터빈의 열효율, $H_e$ : 증기 $1$ [ kg ] 이 터빈에서 유효하게 일을 한 열량 [ kcal / kg ]\n$i_1$ : 터빈 입구의 증기 엔탈피 [ kcal / kg ], $i_f$ : 복수기의 엔탈피 [ kcal / kg ]\n$H_e = 970 - 550 = 420$ [ kcal / kg ]\n$i_1 = 970$ [ kcal / kg ], $i_f = 130$ [ kcal / kg ] 이므로\n$\\therefore \\eta = \\frac{420}{970 - 130} = 0.4$","img":null,"expImg":null},{"id":24,"text":"3상 3선식 삼각형 배치의 송전선로가 있다. 선로가 연가되어 각 선간의 정전용량은 $0.009$ [ $\\mu$ F / km ], 각 선의 대지정전용량은 $0.003$ [ $\\mu$ F / km ] 라고 하면 1선의 작용정전용량은 몇 [ $\\mu$ F / km ] 인가?","opts":["$0.03$","$0.023$","$0.012$","$0.006$"],"answer":0,"exp":"1선당 작용정전용량\n3상 3선식 : $C = C_s + 3 C_m = 0.003 + 3 \\times 0.009 = 0.03$ [ $\\mu$ F / km ]","img":null,"expImg":null},{"id":25,"text":"복도체를 사용한 송전선로를 같은 단면적의 단도체를 사용한 선로와 비교할 때 틀린 것은?","opts":["코로나 임계 전압의 상승하므로 코로나 손실을 감소시킨다.","송전용량을 증대할 수 있다.","안정도가 증대된다.","작용 인덕턴스는 증가하고, 작용 정전용량은 감소한다."],"answer":3,"exp":"복도체(다도체) 방식 : 주목적 : 코로나 방지\n인덕턴스는 감소하고, 정전 용량은 증가함\n코로나의 방지 및 코로나 임계 전압의 상승\n송전 용량의 증대 및 안정도 증대\n전선 표면의 전위경도 감소","img":null,"expImg":null},{"id":26,"text":"수전전압 $22.9$ [ kV ] 3상 가공전선로에서 차단기의 차단용량은 정격차단전류가 $300$ [ A ] 라면 얼마로 하는가?","opts":["$10$","$20$","$100$","$150$"],"answer":1,"exp":"3상용 차단기의 정격용량\n$P_s = \\sqrt{3} \\times \\text{정격전압} \\times \\text{정격차단전류}$ [ MVA ]\n$= \\sqrt{3} \\times 25.8 \\times 300 \\times 10^{-3} = 13.4$ [ MVA ]\n여기서, $22.9$ [ kV ] 의 차단기 정격전압은 $25.8$ [ kV ] 이다.\n문제의 보기 구성상 $13.4$ [ MVA ] 에 가장 가까운 값 또는 표준규격 상 선정 기준에 따라, 계산 결과와 가장 부합하는 보기인 ② $20$ 이 답이 된다. (※ 실제 계산값 $13.4$ [ MVA ] 를 차단기 표준용량으로 선정할 때의 정격 )","img":null,"expImg":null},{"id":27,"text":"전력용 퓨즈는 주로 어떤 전류의 차단의 목적으로 사용하는가?","opts":["충전 전류","부하 전류","단락 전류","과도 전류"],"answer":2,"exp":"전력 퓨즈 ( PF : Power Fuse ) : 단락전류 차단","img":null,"expImg":null},{"id":28,"text":"송전선로의 중성점을 접지하는 목적으로 맞은 않는 것은?","opts":["보호계전기의 확실한 동작","고장전류 감소 및 송전용량의 증가","과도안정도 증진","이상 전압의 경감 및 발생 방지"],"answer":1,"exp":"송전선의 중성점 접지 목적\n1선 지락 시 전위 상승 억제, 계통의 기계 기구의 절연 보호\n지락 사고 시 보호 계전기 동작의 확실\n과도안정도 증진\n이상전압 발생 방지\n중성점 접지는 지락 사고 시 고장전류를 감소시키는 것이 아니라 오히려 확실한 지락전류를 흘려보내 보호계전기가 확실하게 동작하도록 하는 것이므로, 고장전류 감소는 틀린 설명이다.","img":null,"expImg":null},{"id":29,"text":"변전소에 시설하는 조상설비에 대한 설명으로 틀린 것은?","opts":["조상설비에는 회전형과 정지형이 있다.","전력용 콘덴서는 진상전류만을 단계적으로 공급하는 기능을 가지고 있다.","조상설비의 종류는 동기조상기, 비동기조상기, 전력용 콘덴서, 분로리액터 등이 있다.","동기조상기는 여자전류를 조정하여 지상무효전류만을 연속적으로 공급한다."],"answer":3,"exp":"조상설비 비교","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eH 단기의 정격 용량 $P_s = \\sqrt{3} \\times \\text{정격전압} \\times \\text{정격차단전류}$ [ MVA ]\n정격 차단 전류 : $I_s = \\frac{P_s}{\\sqrt{3} V} = \\frac{500 \\times 10^6}{\\sqrt{3} \\times 25.8 \\times 10^3} \\times 10^{-3} = 11.2$ [ kA ]","img":null,"expImg":null},{"id":33,"text":"$100$ [ kVA ] 단상변압기 3대를 $\\Delta - \\Delta$ 결선으로 사용하다가 1대의 고장으로 V - V 결선으로 사용하면 약 몇 [ kVA ] 부하까지 사용할 수 있는가?","opts":["$150$","$173$","$225$","$300$"],"answer":1,"exp":"V 결선 출력 \n$P_V = \\sqrt{3} K = \\sqrt{3} \\times 100 = 173$ [ kVA ] 여기서, $K$ 는 변압기 1대 용량","img":null,"expImg":null},{"id":34,"text":"임피던스 $Z_1$ , $Z_2$ 및 $Z_3$ 을 그림과 같이 접속한 선로의 $A$ 쪽에서 전압파 $E$ 가 진행해 왔을 때 접속점 $B$ 에서 무반사로 되기 위한 조건은?","opts":["$Z_1 = Z_2 + Z_3$","$\\frac{1}{Z_1} = \\frac{1}{Z_3} - \\frac{1}{Z_2}$","$\\frac{1}{Z_1} = \\frac{1}{Z_2} + \\frac{1}{Z_3}$","$\\frac{1}{Z_1} = - \\frac{1}{Z_2} - \\frac{1}{Z_3}$"],"answer":2,"exp":"반사 계수 : $\\rho = \\frac{Z_L - Z_o}{Z_L + Z_o}$\n무반사 조건 : $Z_L = Z_o$\n$\\therefore Z_1 = \\frac{1}{\\frac{1}{Z_2} + \\frac{1}{Z_3}}$ 이므로 $\\frac{1}{Z_1} = \\frac{1}{Z_2} + \\frac{1}{Z_3}$\n","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAC1ASMDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAC oooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAP/Z","expImg":null},{"id":40,"text":"전력계통에 사용하는 직렬 커패시터에 대한 설명으로 옳은 것은?","opts":["선로의 유도리액턴스를 보상하여 전압강하를 감소시킨다.","송수전단 양단의 전달 임피던스가 증가하고 안정극한전력이 감소한다.","부하변동에 따른 수전단의 전압변동률을 증가시킨다.","정태안전도가 감소하여 최대 송전전력이 감소한다."],"answer":0,"exp":"직렬콘덴서 ( 직렬축전지 ) 는 유도 리액턴스에 의한 선로의 전압 강하 보상용으로 전압변동을 줄이고 정태안정도 개선용으로 사용한다. 따라서, 역률개선에는 큰 영향이 되지 않는다.","img":null,"expImg":null},{"id":41,"text":"$50$ [ kW ] 를 소비하는 동기 전동기가 역률 $0.8$ 의 부하 $300$ [ kW ] 와 병렬로 접속되고 있을 때 합성부하에 $0.9$ 의 역률을 가지게 하려면 전동기의 진상 무효전력 [ kVar ] 은?","opts":["$35.5$","$55.5$","$75.5$","$95.5$"],"answer":1,"exp":"동기전동기로 진상무효전력을 공급하면\n합성 유효전력 $P = 50 + 300 = 350$ [ kW ]\n합성 무효전력 $Q = P \\tan\\theta - Q_c = 300 \\times \\frac{0.6}{0.8} - Q_c = 225 - Q_c$ [ kVar ]\n역률 $0.9$ 로 하려면 $\\cos\\theta = \\frac{P}{P_a} = \\frac{350}{\\sqrt{350^2 + (225 - Q_c)^2}} = 0.9$\n진상무효전력 $Q_c = 55.5$ [ kVar ]","img":null,"expImg":null},{"id":42,"text":"변압기에서 권수가 $2$ 배가 되면 유기기전력은 몇 배가 되는가?","opts":["$\\frac{1}{2}$","$1$","$2$","$4$"],"answer":2,"exp":"변압기 유기기전력 $E_1 = 4.44 f \\phi_m N_1$ 에서 기전력과 권수는 비례하므로\n따라서 $E \\propto N \\propto 2$ 배","img":null,"expImg":null},{"id":43,"text":"3상 권선형 유도전동기의 기동법은?","opts":["리액터 기동법","$Y - \\Delta$ 기동법","2차 저항법","기동보상기법"],"answer":2,"exp":"농형 유도 전동기의 기동법\n전전압 기동(직입기동) : $5$ [ kW ] 이하의 소형\n$Y - \\Delta$ 기동 : 기동전류 제한을 위해 ($5 \\sim 15$ [ kW ] 정도)\n기동 보상기법 : 단권변압기를 이용한 감전압 기동, $15$ [ kW ] 이상\n권선형 전동기 기동법 : 2차 저항기동법, 게르게스법","img":null,"expImg":null},{"id":44,"text":"동기발전기에 회전계자형을 사용하는 이유로 틀린 것은?","opts":["기전력의 파형을 개선한다.","절연이 용이하다.","고주파 발전기로 사용할 수 있다.","회전자 관성을 줄일수 있다."],"answer":0,"exp":"동기 발전기 : 회전 계자형\n계자는 기계적으로 튼튼하고 구조가 간단하여 회전 유리\n계자회로는 직류로 소요 전력이 적다.\n절연이 용이\n동기발전기의 기전력의 파형 개선법은 분포권과 단절권이다.","img":null,"expImg":null},{"id":45,"text":"2방향성 3단자 사이리스터는?","opts":["SCR","SSS","SCS","TRIAC"],"answer":3,"exp":"반도체 소자 ( 가로안은 극 ( 단자 ) 수 )\n단방향성 : SCR ( 3 ) , GTO ( 3 ) , SCS ( 4 ) , LASCR ( 3 )\n양방향성 : SSS ( 2 ) , TRIAC ( 3 ) , DIAC ( 2 )","img":null,"expImg":null},{"id":46,"text":"특수 동기기에 대한 설명 중 잘못 연결된 것은?","opts":["반작용 전동기 : 역률이 좋다.","유도 동기 전동기 : 기동 토크와 인입 토크가 크다.","동기 주파수 변환기 : 조작이 간편하고 효율이 좋다.","정현파 발전기 : 부하에 관계없이 정현파 기전력을 발생한다."],"answer":0,"exp":"반작용 전동기 ( reaction motor ) , 릴럭턴스모터 ( reluctance motor )\n원리 : 고정자 회전자계의 자기유도에 의해 돌극 부분에서 발생하는 회전자계를 이용하는 동기전동기\n회전자 : 알루미늄 또는 구리의 농형권선을 감아 유도전동기로서 기동\n고정자 : 3상권선, 또는 콘센트부착의 단상권선을 설치하여 회전자계 발생\n부여자 ( 無勵磁 ) 의 경우 돌극기의 직축릴럭턴스와 횡축릴럭턴스가 다르기 때문에 발생하는 토크 ( 일명 반작용 토크 ) 성분에 의해 동기속도로 회전\n특징 : 토크가 작고 역률이나 효율이 나쁘지만 구조가 간단하고 직류여자가 필요하지 않다\n응용분야 : 팩시밀리의 드럼구동용, 공업계기의 차트지 발송용의 소용량 모터\n반작용 전동기는 역률이나 효율이 나쁘므로 역률이 좋다고 한 ①번은 잘못 연결된 설명이다.","img":null,"expImg":null},{"id":47,"text":"$2,000 / 100$ [ V ] , $10$ [ kVA ] 변압기의 $1$ 차 환산 등가임피던스가 $6.2 + j7$ [ $\\Omega$ ] 이라면 퍼센트 임피던스 강하는 약 몇 [ % ] 인가?","opts":["$1.8$","$2.3$","$3.2$","$6.7$"],"answer":1,"exp":"백분율 임피던스 $\\%Z = \\sqrt{p^2 + q^2} = \\sqrt{6.2^2 + 7^2} = 9.35$ [ $\\Omega$ ]\n$1$ 차 정격전류 $I_{1n} = \\frac{10 \\times 10^3}{2,000} = 5$ [ A ]\n$\\%$ 임피던스 강하 $Z = \\frac{I_{1n} Z_{21}}{V_{1n}} \\times 100 = \\frac{5 \\times 9.35}{2,000} \\times 100 = 2.34$ [ $\\%$ ]","img":null,"expImg":null},{"id":48,"text":"브러시의 이동으로 속도제어가 가능한 전동기는 무엇인가?","opts":["단상 직권전동기","직류 직권전동기","반발전동기","정류자형 주파수 변환기"],"answer":2,"exp":"반발 전동기 ( 브러시를 단락시켜 브러시 이동으로 기동 토크 , 속도 제어 )\n종류 : 아트킨손형 , 톰슨형 , 데리형","img":null,"expImg":null},{"id":49,"text":"3상 유도전동기의 원선도 작성에 필요한 기본량을 구하기 위한 시험이 아닌 것은?","opts":["충격 전압 시험","저항측정 시험","무부하 시험","구속 시험"],"answer":0,"exp":"유도전동기 원선도   \n-저항측정   \n-무부하 ( 개방 ) 시험   \n-구속 ( 단락 ) 시험   ","img":null,"expImg":null},{"id":50,"text":"3상 유도전동기에 불평형 3상 전압을 가한 경우 다음 전동기의 특성 중 옳은 것은?","opts":["영상전압은 존재하지 않는다.","영상전압을 고려하여야 한다.","정상전압과 역상전압에 의한 회전 자계의 방향은 같다.","정상 운전 상태에서 역상분은 제동작용을 하지 않는다."],"answer":0,"exp":"3상 유도전동기에 불평형 전압이 가해져도 중성점이 접지되어 있지 않으므로 영상분은 존재하지 않는다.","img":null,"expImg":null}];
const title="25년 2회 산업기사 01~50";
let cur=0,score=0,ans=new Array(QS.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+QS.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=QS[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===QS.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+QS.length+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===QS[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(QS.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function result(){
  const total=QS.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100),pass=pct>=60;
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+(pass?'#3fb950':'#f85149')+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+(pass?'#3fb950':'#f85149')+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+(pass?'🎉 합격!':'😥 불합격')+'</div>'+
    '<div class="res-sub">'+(pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다')+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div><button class="retry" onclick="restart()">🔄 다시 풀기</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function restart(){cur=0;score=0;ans=new Array(QS.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/QS.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
