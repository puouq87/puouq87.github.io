<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>25년 3회 산업기사 01~50</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>

  <div class="hdr-info">
    <div class="hdr-title">25년 3회 산업기사 01~50</div>
    <div class="prog-bar"><div class="prog-fill" id="pf" style="width:0%"></div></div>
  </div>
  <div class="score-chip" id="sc">0점</div>
</div>
<div class="main" id="main"></div>

<script>
const QS=[{"id":1,"text":"맥스웰 전자방정식에 대한 설명으로 틀린 것은?","opts":["폐곡면을 통해 나오는 전속은 폐곡면 내의 전하량과 같다.","폐곡면을 통해 나오는 자속은 폐곡면 내의 자극의 세기와 같다.","폐곡선에 따른 전계의 선적분은 폐곡선 내를 통하는 자속의 시간 변화율과 같다.","폐곡선에 따른 자계의 선적분은 폐곡선 내를 통하는 전류와 전속의 시간적 변화율을 더한 것과 같다."],"answer":1,"exp":"① 가우스 법칙 (전계에 대한 가우스 법칙): 임의의 폐곡면을 통과하는 총 전속은 그 폐곡면 내부에 존재하는 총 자유 전하량과 같다. (적분형: $\\oint_S \\mathbf{D} \\cdot d\\mathbf{S} = Q$)\n② 자계에 대한 가우스 법칙: 자하(Magnetic monopole)는 존재하지 않으므로, 임의의 폐곡면을 통과하는 총 자속은 항상 $0$ 이다. 따라서 폐곡면 내의 자극의 세기와 같다는 설명은 틀렸으며, 자속의 총합은 언제나 $0$ 이 된다. (적분형: $\\oint_S \\mathbf{B} \\cdot d\\mathbf{S} = 0$)\n③ 패러데이 유도 법칙: 폐곡선에 따른 전계의 선적분(유도 기전력)은 폐곡선을 통과하는 자속의 시간적 변화율과 크기가 같고 방향이 반대이다. (적분형: $\\oint_C \\mathbf{E} \\cdot d\\mathbf{l} = -\\frac{d}{dt} \\int_S \\mathbf{B} \\cdot d\\mathbf{S}$)\n④ 앙페르-맥스웰 법칙: 폐곡선에 따른 자계의 선적분은 폐곡선을 통과하는 전도 전류와 변위전류(전속의 시간적 변화율)의 합과 같다. (적분형: $\\oint_C \\mathbf{H} \\cdot d\\mathbf{l} = I + \\int_S \\frac{\\partial \\mathbf{D}}{\\partial t} \\cdot d\\mathbf{S}$)","img":null},{"id":2,"text":"점전하 $Q\\text{[C]}$ 에 대한 무한평면도체의 영상전하로 옳은 것은?","opts":["$Q$ 와 같다.","$Q$ 보다 작다.","$Q$ 보다 크다.","$-Q$ 와 같다"],"answer":3,"exp":"무한 평면 도체 앞에 점전하 $+Q\\text{[C]}$ 가 존재할 때, 영상전하법(Method of Image Charges)에 의해 도체 평면에 유도되는 전하 분포 효과는 도체 반대편 대칭되는 위치에 반대 부호의 점전하 $-Q\\text{[C]}$ 가 존재하는 것과 동일하다.","img":null},{"id":3,"text":"유전체의 초전효과(pyroelectric effect)에 대한 설명이 아닌 것은?","opts":["온도변화에 관계없이 일어난다.","자발 분극을 가진 유전체에서 생긴다.","초전효과가 있는 유전체를 공기 중에 놓으면 중화된다.","열에너지를 전기에너지로 변화시키는 데 이용된다."],"answer":0,"exp":" 온도 변화와의 관계: 초전효과는 유전체의 온도 변화($\\Delta T$)에 반응하여 전하가 발생하는 현상이므로, '온도변화에 관계없이 일어난다'는 설명은 틀렸다. (온도가 일정한 상태로 유지되면 더 이상 전하 변화가 일어나지 않는다.)","img":null},{"id":4,"text":"철심이 들어있는 환상코일에 1차 코일의 권수 $N_{1} = 100$ 회일 때 자기 인덕턴스는 $0.01\\text{[H]}$ 이다. 이 철심에 2차 코일 $N_{2} = 200$ 회를 감았을 때 1, 2차 코일의 상호인덕턴스는 몇 $\\text{[H]}$ 인가? (단, 결합계수 $k = 1$ 로 한다)","opts":["$0.01$","$0.02$","$0.03$","$0.04$"],"answer":1,"exp":"환상 솔레노이드(환상코일)에서 자기 인덕턴스 $L$ 은 권수 $N$ 의 제곱에 비례하고, 상호 인덕턴스 $M$ 은 두 코일의 권수의 곱 $N_{1} N_{2}$ 에 비례한다.1차 코일의 자기 인덕턴스 $L_{1}$ 과 상호 인덕턴스 $M$ 의 관계식은 다음과 같다.$$L_{1} = \\frac{\\mu A}{l} N_{1}^2$$$$M = k \\frac{\\mu A}{l} N_{1} N_{2}$$따라서 결합계수 $k = 1$ 일 때, 상호 인덕턴스 $M$ 과 1차 자기 인덕턴스 $L_{1}$ 의 비는 권수의 비와 같다.$$M = L_{1} \\times \\frac{N_{2}}{N_{1}}$$주어진 값을 식에 대입하면 다음과 같다.$$M = 0.01 \\times \\frac{200}{100} = 0.01 \\times 2 = 0.02\\text{[H]}$$","img":null},{"id":5,"text":"다음 중 전류의 연속방정식을 나타낸 식은?","opts":["$J = 0$","$\\nabla \\cdot J = 0$","$J = -\\frac{\\partial \\rho_v}{\\partial t}$","$\\nabla \\cdot J = -\\frac{\\partial \\rho_v}{\\partial t}$"],"answer":1,"exp":"정상 전류가 흐르는 경우의 연속방정식은 다음과 같이 표현됩니다.$$\\nabla \\cdot J = 0$$","img":null},{"id":6,"text":"무손실 유전체에서 평면 전자파의 전계 $E$ 와 자계 $H$ 사이 관계식으로 옳은 것은?① $H = \\sqrt{\\frac{\\epsilon}{\\mu}} E$","opts":["$H = \\sqrt{\\frac{\\mu}{\\epsilon}} E$","$H = \\frac{\\epsilon}{\\mu} E$","$H = \\frac{\\mu}{\\epsilon} E$","$H = \\frac{\\mu}{\\epsilon} E$"],"answer":0,"exp":"1. 파동 임피던스 (고유 임피던스 $\\eta$ )의 정의\n평면 전자파에서 전계 $E$ 와 자계 $H$ 의 비를 파동 임피던스 $\\eta$ 라 하며, 매질의 유전율 $\\epsilon$ 과 투자율 $\\mu$ 로 다음과 같이 나타냅니다.$$\\eta = \\frac{E}{H} = \\sqrt{\\frac{\\mu}{\\epsilon}}$$2. 자계 $H$ 에 관한 식으로 정리\n위 식에서 $H$ 에 대해 정리하면 다음과 같습니다.$$H = \\frac{E}{\\eta} = \\frac{E}{\\sqrt{\\frac{\\mu}{\\epsilon}}} = \\sqrt{\\frac{\\epsilon}{\\mu}} E$$","img":null},{"id":7,"text":"접지 구도체와 점전하 간에 작용하는 힘은?","opts":["항상 흡인력이다.","항상 반발력이다.","조건적 흡인력이다.","조건적 반발력이다."],"answer":0,"exp":"$$Q' = - \\frac{a}{d} Q$$\n$Q$ 와 $Q'$ 은 서로 반대 부호를 가집니다.따라서 두 전하 사이에는 부호가 서로 다르므로 항상 끌어당기는 힘(흡인력)이 작용","img":null},{"id":8,"text":"자극의 세기가 $8 \\times 10^{-6} \\, [\\text{Wb}]$ 이고, 길이가 $30 \\, [\\text{cm}]$ 인 막대자석을 $120 \\, [\\text{AT/m}]$ 평등자계 내에 자력선과 $30^\\circ$ 의 각도로 놓았다면 자석이 받는 회전력은 몇 $[\\text{N} \\cdot \\text{m}]$ 인가?","opts":["$1.44 \\times 10^{-4}$","$1.44 \\times 10^{-5}$","$2.88 \\times 10^{-4}$","$2.88 \\times 10^{-5}$"],"answer":0,"exp":" 자석이 받는 회전력(토크 $T$ ) 공식\n자계 $H$ 내에서 자기 능률 $M$ 을 가진 막대자석이 기울어져 있을 때 받는 회전력 $T$ 는 다음과 같습니다.$$T = M H \\sin\\theta = m l H \\sin\\theta$$$m$ : 자극의 세기 $= 8 \\times 10^{-6} \\, [\\text{Wb}]$$l$ : 막대자석의 길이 $= 30 \\, [\\text{cm}] = 0.3 \\, [\\text{m}]$$H$ : 자계의 세기 $= 120 \\, [\\text{AT/m}]$$\\theta$ : 자력선과 자석이 이루는 각도 $= 30^\\circ$2. 수치 대입 및 계산$$T = (8 \\times 10^{-6}) \\times 0.3 \\times 120 \\times \\sin(30^\\circ)$$$\\sin(30^\\circ) = 0.5$ 이므로,$$T = 8 \\times 10^{-6} \\times 0.3 \\times 120 \\times 0.5$$$$T = 1.44 \\times 10^{-4} \\, [\\text{N} \\cdot \\text{m}]$$","img":null},{"id":9,"text":"감자율(Demagnetization factor)이 “0”인 자성체로 가장 알맞은 것은?","opts":["환상 솔레노이드","굵고 짧은 막대 자성체","가느다랗고 긴 막대 자성체","가늘고 짧은 막대 자성체"],"answer":0,"exp":"감자력과 감자율 (Demagnetization factor $N$ )\n자성체를 외부 자계에 놓으면 자성체 양 끝에 자극이 형성되어, 외부 자계와 반대 방향의 감자력(감자계 $H_d$ )이 발생합니다.$$H_d = N J$$$H_d$ : 감자력$N$ : 감자율 (자성체의 형상에 따라 결정되는 정수)$J$ : 자화의 세기2. 자성체 형상에 따른 감자율 $N$환상 솔레노이드 (環狀 solenoid, 무한히 긴 자성체): 자극이 외부로 노출되지 않고 폐자회로를 형성하므로 자극에 의한 반대 자계가 생기지 않아 감자율이  $N = 0$  이 됩니다.구형 자성체: $N = \\frac{1}{3 \\mu_0}$ (또는 공기 중에서 $\\frac{1}{3}$)가늘고 긴 막대 자성체: $N \\approx 0$ 에 가깝지만, 완전히 $0$ 은 아닙니다.","img":null},{"id":10,"text":"한 변의 길이가 $a \\, [\\text{m}]$ 인 정육각형의 각 정점에 각각 $Q \\, [\\text{C}]$ 의 전하를 놓았을 때 정육각형의 중심에서 전계의 세기는 몇 $[\\text{V/m}]$ 인가?","opts":["$0$","$\\frac{Q}{2\\pi\\epsilon_0 a}$","$\\frac{Q}{4\\pi\\epsilon_0 a}$","$\\frac{Q}{8\\pi\\epsilon_0 a}$"],"answer":0,"exp":"1. 대칭성에 의한 전계의 합산\n정육각형의 중심을 기준으로 각 정점에 배치된 같은 크기의 점전하 $Q$ 들은 서로 대칭적으로 마주보고 있습니다.2. 마주보는 전하에 의한 전계의 상쇄한 정점에 있는 전하 $Q$ 에 의해 중심에 생기는 전계의 방향과, 그 정반대편 정점에 있는 전하 $Q$ 에 의해 중심에 생기는 전계의 방향은 크기가 같고 방향이 반대($180^\\circ$)입니다.따라서 마주보는 두 전하에 의한 전계의 벡터합은 서로 상쇄되어 $0$ 이 됩니다.3. 전체 전계의 세기\n정육각형의 6개 정점에 놓인 모든 전하에 의한 전계를 벡터적으로 합성하면 대칭성에 의해 중심에서의 합성 전계의 세기는 완전히 $0$ 이 됩니다.","img":null},{"id":11,"text":"간격 $d [\\text{m}]$ 인 무한히 넓은 평행판의 단위 면적당 정전용량은 몇 $[\\text{F/m}^2]$ 인가?","opts":["$\\frac{\\epsilon_0}{d}$","$\\frac{\\epsilon_0}{d^2}$","$\\frac{4\\pi\\epsilon_0}{d}$","$\\frac{1}{4\\pi\\epsilon_0 d}$"],"answer":0,"exp":"1. 평행판 콘덴서의 정전용량 공식\n면적이 $S \\, [\\text{m}^2]$ 이고 간격이 $d \\, [\\text{m}]$ 인 평행판 콘덴서의 정전용량 $C$ 는 다음과 같습니다.$$C = \\frac{\\epsilon_0 S}{d} \\, [\\text{F}]$$2. 단위 면적당 정전용량 계산\n문제에서 요구한 것은 단위 면적당 정전용량이므로, 전체 정전용량 $C$ 를 면적 $S$ 로 나누어 줍니다 ($S = 1 \\, \\text{m}^2$ 대입).$$C_0 = \\frac{C}{S} = \\frac{\\epsilon_0}{d} \\, [\\text{F/m}^2]$$","img":null},{"id":12,"text":"전자석에서 사용하는 연철(soil iron)은 다음 어느 성질을 갖는가?","opts":["보자력이 크고 잔류자기가 작다.","보자력과 히스테리시스 곡선의 면적이 모두 작다.","보자력이 크고 히스테리시스 곡선의 면적이 작다.","잔류자기, 보자력이 모두 크다."],"answer":1,"exp":"1. 연철(Soft Iron)과 영구자석 재료의 특징 비교\n전자석의 철심으로 사용되는 연철은 전류를 흘렸을 때 자화가 잘 되고, 전류를 차단했을 때 자기가 쉽게 사라져야 합니다.\n\n    전자석(연철): 잔류자기가 크고, 보자력이 작으며, 히스테리시스 손실(곡선 면적)이 작아야 함\n\n    영구자석(강철): 잔류자기가 크고, 보자력이 크며, 히스테리시스 곡선 면적이 커야 함\n\n2. 보기 분석\n\n    전자석용 연철은 외부 자계를 제거했을 때 자기를 없애기 위한 힘인 보자력이 작아야 하며, 에너지 손실을 나타내는 히스테리시스 곡선의 면적도 작아야 합니다.","img":null},{"id":13,"text":"그림에서 $2 \\, [\\mu\\text{F}]$ 에 $100 \\, [\\mu\\text{C}]$ 의 전하가 충전되어 있었다면 $3 \\, [\\mu\\text{F}]$ 의 양단의 전위차는 몇 $[\\text{V}]$ 인가?","opts":["$50$","$100$","$200$","$260$"],"answer":0,"exp":"그림에서 $1, 2, 3 \\, [\\mu\\text{F}]$ 의 콘덴서 3개는 서로 병렬로 연결되어 있습니다.병렬로 연결된 회로에서는 각 콘덴서 양단에 걸리는 전압(전위차)이 모두 동일합니다.$2 \\, [\\mu\\text{F}]$ 콘덴서에 $Q = 100 \\, [\\mu\\text{C}]$ 의 전하가 충전되어 있을 때 양단의 전압 $V$ 는 다음과 같이 계산됩니다.$$V = \\frac{Q}{C} = \\frac{100 \\, [\\mu\\text{C}]}{2 \\, [\\mu\\text{F}]} = 50 \\, [\\text{V}]$$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCACIAN4DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJm a5/2E2/8ARUdbVYvhf/j61z/sJt/6KjraoAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAAUUCigAooooAx77/kctK/68rv/wBDgrYqnqelabqYjGo2Ntd+WSU82MNtz1xnp2ql/wAIp4a/6AWn/wDfhaANmqeu5/sS/wAZz9mk6f7pql/winhr/oBaf/34WqWueFvDa6JfMND08EW0hB8hf7poA429eT/hnrwa4kk3sPDuWDHcc3NpnJ6nPf1r1ivItVWGf9nDwek4R4pU8OqwbkMGubQYPrnNeif8Ip4a/wCgFp//AH4WgDZorG/4RTw1/wBALT/+/C0f8Ip4a/6AWn/9+FoATwx/x9a5/wBhNv8A0VFW1VbTrCy063+zWFpDaw7i2yJAoyepwO9WaACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigApHVXQo6hlYYIIyCKKKAITZ2ZtI7Q2kBt4tnlxeWNibCCuF6DBAI9MCp6KKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAP/9k="},{"id":14,"text":"권수 $500$ 회이고 자기인덕턴스가 $0.05 \\, [\\text{H}]$ 인 코일이 있을 때 여기에 전류 $5 \\, [\\text{A}]$ 를 흘리면 쇄교 자속수는 몇 $[\\text{Wb} \\cdot \\text{T}]$ 인가?","opts":["$0.15$","$0.25$","$15$","$25$"],"answer":1,"exp":"1. 쇄교 자속수(Flux Linkage)의 정의 및 관계식\n쇄교 자속수 $N\\phi$ 는 자기인덕턴스 $L$ 과 전류 $I$ 의 곱과 같습니다.$$N\\phi = L I$$$N$ : 권수 $= 500$ 회$L$ : 자기인덕턴스 $= 0.05 \\, [\\text{H}]$$I$ : 전류 $= 5 \\, [\\text{A}]$2. 수치 대입 및 계산$$N\\phi = 0.05 \\times 5 = 0.25 \\, [\\text{Wb} \\cdot \\text{T}]$$","img":null},{"id":15,"text":"자속밀도 B=0.4ax​[Wb/m2] 안에서 길이 5[m] 인 30[A] 의 선전류가 z 축의 (−) 방향으로 흐를 때 선전류에 작용하는 전자력 F 는 몇 [N] 인가?","opts":["0","−60","−60ax​","−60ay​"],"answer":3,"exp":"1. 전자력(플레밍의 왼손 법칙)의 벡터 공식\n자계 $B$ 내에서 전류 $I$ 가 흐르는 길이 $\\mathbf{l}$ 의 도선이 받는 전자력 $\\mathbf{F}$ 는 외적(cross product)을 이용하여 다음과 같이 구합니다.$$\\mathbf{F} = I (\\mathbf{l} \\times \\mathbf{B})$$2. 주어진 조건 정리자속밀도 $\\mathbf{B} = 0.4 a_x \\, [\\text{Wb/m}^2]$전류 $I = 30 \\, [\\text{A}]$길이 벡터 $\\mathbf{l} = 5 (-a_z) = -5 a_z \\, [\\text{m}]$ ($z$ 축의 $(-)$ 방향)3. 수치 대입 및 벡터 외적 계산$$\\mathbf{F} = 30 \\times [(-5 a_z) \\times (0.4 a_x)]$$$$\\mathbf{F} = 30 \\times (-5 \\times 0.4) \\times (a_z \\times a_x)$$단위 벡터의 외적 $a_z \\times a_x = a_y$ 이므로,$$\\mathbf{F} = 30 \\times (-2) \\times a_y = -60 a_y \\, [\\text{N}]$$","img":null},{"id":16,"text":"동심구에서 내부 도체의 반지름이 $a$, 절연체의 반지름이 $b$, 외부 도체의 반지름이 $c$ 이다. 내부 도체에만 전하 $Q \\, [\\text{C}]$ 를 주었을 때 내부 도체의 전위는?(단, 절연체의 유전율은 $\\epsilon_0$ 이다)","opts":["$\\frac{Q}{4\\pi\\epsilon_0 a} (\\frac{1}{a} + \\frac{1}{b})$","$\\frac{Q}{4\\pi\\epsilon_0} (\\frac{1}{a} - \\frac{1}{b})$","$\\frac{Q}{4\\pi\\epsilon_0} (\\frac{1}{a} - \\frac{1}{b} - \\frac{1}{c})$","$\\frac{Q}{4\\pi\\epsilon_0} (\\frac{1}{a} - \\frac{1}{b} + \\frac{1}{c})$"],"answer":3,"exp":"1. 동심구 케이블의 전위 계산 개요\n동심구 구조에서 내부 도체($r = a$), 절연체 경계($r = b$), 외부 도체($r = c$ )가 존재할 때, 내부 도체에 전하 $+Q$ 를 주면 외부 도체 내면에는 유도전하 $-Q$, 외면에는 다시 $+Q$ 가 유도되는 복합 매질(또는 도체계) 전위 계산 문제입니다.2. 각 영역별 전위차 및 전위 구성가우스 법칙을 이용해 각 구간에서의 전계의 세기를 구한 뒤, 전위는 전계를 적분하여 구합니다.내부 도체 표면의 전위 $V_a$ 는 각 구간별 전위차의 합으로 표현됩니다.내부 도체와 외부 도체 사이의 전위 분포를 고려하면, 도체계의 전위 공식 및 경계 조건에 의해 최종적으로 다음과 같은 형태의 전위 식이 유도됩니다.$$V = \\frac{Q}{4\\pi\\epsilon_0} \\left( \\frac{1}{a} - \\frac{1}{b} + \\frac{1}{c} \\right)$$","img":null},{"id":17,"text":"표면 전하밀도 $\\sigma \\, [\\text{C/m}^2]$ 으로 대전된 도체 내부의 전속밀도는 몇 $[\\text{C/m}^2]$ 인가?","opts":["$0$","$\\sigma$","$\\frac{\\sigma}{\\epsilon_0}$","$\\epsilon_0 E$"],"answer":0,"exp":". 도체 내부의 전계 성질\n정전기적 평형 상태에 있는 도체 내부에는 자유전하가 이동하여 내부에 전계가 존재하지 않으므로, 도체 내부의 전계의 세기는  $0$  이 됩니다.2. 전속밀도 계산\n전속밀도 $\\mathbf{D}$ 와 전계 $\\mathbf{E}$ 의 관계식은 다음과 같습니다.$$\\mathbf{D} = \\epsilon \\mathbf{E}$$","img":null},{"id":18,"text":"대전된 도체구를 반지름이 2배가 되는 대전이 되지 않은 도체구에 가느다란 도선으로 연결할 때 원래의 에너지에 대해 손실된 에너지의 비율은 얼마나 되는가? (단, 도체구는 충분히 떨어져 있다고 한다)","opts":["$\\frac{1}{2}$","$\\frac{1}{3}$","$\\frac{2}{3}$","$\\frac{2}{5}$"],"answer":2,"exp":"1. 초기 에너지 계산\n처음 대전된 도체구의 반지름을 $a$ , 정전용량을 $C_1 = 4\\pi\\epsilon_0 a$ 라 하고, 충전된 전하량을 $Q$ 라 하면 초기 정전에너지 $W_1$ 은 다음과 같습니다.$$W_1 = \\frac{1}{2} \\frac{Q^2}{C_1}$$2. 도선으로 연결한 후의 전하 재분배\n반지름이 $2a$ 인 대전되지 않은 도체구의 정전용량은 $C_2 = 4\\pi\\epsilon_0 (2a) = 2C_1$ 입니다. 두 도체구를 도선으로 연결하면 두 도체구의 전위가 같아지도록 전하가 재분배됩니다.총 전하량은 보존되므로 $Q_1' + Q_2' = Q$ 입니다.전위가 같으므로 $\\frac{Q_1'}{C_1} = \\frac{Q_2'}{C_2}$ 가 성립하며, $C_2 = 2C_1$ 이므로 $Q_2' = 2Q_1'$ 이 됩니다.따라서 각각의 전하량은 다음과 같습니다.$$Q_1' = \\frac{1}{3} Q$$$$Q_2' = \\frac{2}{3} Q$$3. 나중 에너지 계산\n연결 후의 총 정전에너지 $W_2$ 는 다음과 같습니다.$$W_2 = \\frac{1}{2} \\frac{(Q_1')^2}{C_1} + \\frac{1}{2} \\frac{(Q_2')^2}{C_2} = \\frac{1}{2 C_1} \\left[ \\left(\\frac{1}{3}Q\\right)^2 + \\frac{\\left(\\frac{2}{3}Q\\right)^2}{2} \\right]$$$$W_2 = \\frac{1}{2 C_1} \\left[ \\frac{1}{9}Q^2 + \\frac{2}{9}Q^2 \\right] = \\frac{1}{2 C_1} \\left( \\frac{3}{9}Q^2 \\right) = \\frac{1}{3} \\left( \\frac{1}{2} \\frac{Q^2}{C_1} \\right) = \\frac{1}{3} W_1$$4. 손실된 에너지의 비율\n에너지 손실 $\\Delta W$ 와 원래 에너지에 대한 비율은 다음과 같습니다.$$\\Delta W = W_1 - W_2 = W_1 - \\frac{1}{3} W_1 = \\frac{2}{3} W_1$$$$\\frac{\\Delta W}{W_1} = \\frac{\\frac{2}{3} W_1}{W_1} = \\frac{2}{3}$$","img":null},{"id":19,"text":"평행판 콘덴서의 판 사이에 비유전율 $\\epsilon_s$ 의 유전체를 삽입하였을 때의 정전용량은 진공일 때보다 어떻게 되는가?","opts":["$\\epsilon_s$ 배로 증가","$\\pi\\epsilon_s$ 배로 증가","$\\frac{1}{\\epsilon_s}$ 로 감소","$(\\epsilon_s + 1)$ 배로 증가"],"answer":0,"exp":"1. 진공 상태에서의 정전용량\n극판의 면적이 $S \\, [\\text{m}^2]$ 이고 간격이 $d \\, [\\text{m}]$ 인 평행판 콘덴서의 진공 중 정전용량 $C_0$ 는 다음과 같습니다.$$C_0 = \\frac{\\epsilon_0 S}{d} \\, [\\text{F}]$$2. 비유전율 $\\epsilon_s$ 인 유전체를 채웠을 때의 정전용량\n유전율이 $\\epsilon = \\epsilon_0 \\epsilon_s$ 인 유전체를 삽입하면 정전용량 $C$ 는 다음과 같이 변합니다.$$C = \\frac{\\epsilon S}{d} = \\frac{\\epsilon_0 \\epsilon_s S}{d} = \\epsilon_s C_0 \\, [\\text{F}]$$","img":null},{"id":20,"text":"단면적 $3 \\, [\\text{cm}^2]$, 자로의 길이 $30 \\, [\\text{cm}]$, 코일의 권수 $3,000$ 회의 환상 솔레노이드가 있을 때 철심의 비투자율 $\\mu_s = 1,000$ 이라면 자기 인덕턴스 $[\\text{H}]$ 는 약 얼마인가?","opts":["$9.3$","$10.3$","$11.3$","$12.3$"],"answer":2,"exp":"1. 환상 솔레노이드의 자기 인덕턴스 공식\n환상 솔레노이드의 자기 인덕턴스 $L$ 은 다음과 같이 구합니다.$$L = \\frac{\\mu N^2 S}{l} = \\frac{\\mu_0 \\mu_s N^2 S}{l} \\, [\\text{H}]$$진공의 투자율 $\\mu_0 = 4\\pi \\times 10^{-7} \\, [\\text{H/m}]$비투자율 $\\mu_s = 1,000$권수 $N = 3,000$ 회단면적 $S = 3 \\, [\\text{cm}^2] = 3 \\times 10^{-4} \\, [\\text{m}^2]$자로의 길이 $l = 30 \\, [\\text{cm}] = 0.3 \\, [\\text{m}]$2. 수치 대입 및 계산$$L = \\frac{(4\\pi \\times 10^{-7}) \\times 1000 \\times (3000)^2 \\times (3 \\times 10^{-4})}{0.3}$$$$L = \\frac{(4\\pi \\times 10^{-7}) \\times 10^3 \\times (9 \\times 10^6) \\times (3 \\times 10^{-4})}{0.3}$$$$L = \\frac{4\\pi \\times 10^{-7} \\times 2.7 \\times 10^6}{0.3}$$$$L = 4\\pi \\times 10^{-7} \\times 9 \\times 10^6 = 36\\pi \\times 10^{-1} = 3.6\\pi$$$$L = 3.6 \\times 3.14159 \\approx 11.3097 \\, [\\text{H}]$$","img":null},{"id":21,"text":"자가용 수전설비에서 변압기 1차 측 차단기의 정격차단용량을 결정할 때 가장 밀접한 관계가 있는 것은?","opts":["수전계약 용량","부하의 부하율","부하설비 용량","공급측의 단락용량"],"answer":3,"exp":"","img":null},{"id":22,"text":"선로의 길이가 $5,280 \\, [\\text{m}]$ 인 3상 3선식 배전선로가 있다. 수전단에 $6 \\, [\\text{kV}]$, $1,800 \\, [\\text{kW}]$, 역률 $0.8$ 의 3상 집중부하에 전력을 공급하는 경우, 전력 손실률을 $10 \\, [\\%]$ 이하로 하려면 사용전선(경동선)의 굵기 $[\\text{mm}^2]$ 는?","opts":["$38$","$45$","$55$","$75$"],"answer":3,"exp":"1. 3상 3선식 전력 손실률 공식\n3상 3선식 배전선로에서 전력 손실률 $p$ 를 구하는 공식은 다음과 같습니다.$$p = \\frac{P_L}{P} \\times 100 = \\frac{3 I^2 R}{P} \\times 100 \\, [\\%]$$여기서 선로의 한 가닥 저항 $R$ 은 $R = \\frac{\\rho l}{A}$ 이므로, 이를 대입하면 전선 굵기 $A$ 에 관한 식으로 정리할 수 있습니다.경동선의 고유저항 $\\rho = \\frac{1}{55} \\, [\\Omega \\cdot \\text{mm}^2/\\text{m}]$수전전력 $P = 1,800 \\, [\\text{kW}] = 1.8 \\times 10^6 \\, [\\text{W}]$선로의 길이 $l = 5,280 \\, [\\text{m}]$전압 $V = 6 \\, [\\text{kV}] = 6,000 \\, [\\text{V}]$역률 $\\cos\\theta = 0.8$전력 손실률 $p = 10 \\, [\\%]$2. 전선 굵기 $A$ 공식 유도 및 계산$$A = \\frac{100 \\cdot P \\cdot \\rho \\cdot l}{V^2 \\cdot \\cos^2\\theta \\cdot p}$$","img":null},{"id":23,"text":"초고압 장거리 송전선로에 접속되는 1차 변전소에 병렬 리액터를 설치하는 목적은?","opts":["코로나손실 경감","전압강하 경감","선로손실 경감","페란티효과 방지"],"answer":3,"exp":"","img":null},{"id":24,"text":"단상 2선식 저압 배전선로를 같은 전선으로 단상 3선식으로 변경하였다. 전압강하율은 변경 전에 비해서 어떻게 되는가? (단, 단상 2선식 전압과 단상 3선식 상전압은 같고, 단상 3선식에서 각 상의 부하는 동일하다. 부하의 역률은 1.0이고, 선로의 리액턴스는 무시한다)","opts":["$\\frac{1}{2}$","$\\frac{1}{3}$","$\\frac{1}{4}$","$\\frac{1}{9}$"],"answer":2,"exp":"1. 조건 정리같은 전선 사용 $\\rightarrow$ 선로 1가닥의 저항 $R$ 동일공급 전력 $P$ 가 일정하다고 가정단상 2선식 전압 $V_1 = V$단상 3선식 상전압 $V_2 = V$ (부하에 걸리는 전압)2. 단상 2선식 전압강하율 ($\\delta_1$)\n단상 2선식에서 부하 전류 $I_1 = \\frac{P}{V}$\n전압강하 $e_1 = 2 I_1 R = 2 \\frac{P}{V} R$\n전압강하율 $\\delta_1 = \\frac{e_1}{V} = \\frac{2 P R}{V^2}$3. 단상 3선식 전압강하율 ($\\delta_2$)\n단상 3선식에서 양 상에 균등하게 부하가 분배되므로 각 상당 부하 전력은 $\\frac{P}{2}$\n중성선에는 전류가 흐르지 않으므로 각 선의 전류 $I_2 = \\frac{P/2}{V} = \\frac{P}{2V}$\n전압강하 $e_2 = I_2 R = \\frac{P}{2V} R$\n전압강하율 $\\delta_2 = \\frac{e_2}{V} = \\frac{P R}{2 V^2}$4. 전압강하율 비교$$\\frac{\\delta_2}{\\delta_1} = \\frac{\\frac{P R}{2 V^2}}{\\frac{2 P R}{V^2}} = \\frac{1}{4}$$","img":null},{"id":25,"text":"송전단 전압이 $3,300 \\, [\\text{V}]$ 이고, 수전단 전압이 $3,000 \\, [\\text{V}]$ 이다. 수전단의 부하를 차단한 경우, 수전단 전압이 $3,200 \\, [\\text{V}]$ 라면 이 회로의 전압 변동률은 약 몇 $[\\%]$ 인가?","opts":["$3.25$","$4.28$","$5.67$","$6.67$"],"answer":3,"exp":"1. 전압 변동률 공식\n송전단과 수전단 사이의 전압 변동률 $\\epsilon$ 은 수전단 부하의 유무에 따른 수전단 전압의 변화를 나타내며, 공식은 다음과 같습니다.$$\\epsilon = \\frac{V_{r0} - V_r}{V_r} \\times 100$$$V_{r0}$ : 무부하 시 수전단 전압(부하를 차단한 경우) $= 3,200 \\, [\\text{V}]$$V_r$ : 정격 부하 시 수전단 전압 $= 3,000 \\, [\\text{V}]$2. 수치 대입 및 계산$$\\epsilon = \\frac{3,200 - 3,000}{3,000} \\times 100$$$$\\epsilon = \\frac{200}{3,000} \\times 100 = \\frac{200}{30} = \\frac{20}{3} \\approx 6.67 \\, [\\%]$$","img":null},{"id":26,"text":"$\\Delta$ 결선의 3상 3선식 배전선로가 있다. 1선이 지락되는 경우 건전상의 전위상상은 지락 전의 몇 배인가?","opts":["$1$","$\\sqrt{2}$","$\\sqrt{3}$","$\\frac{\\sqrt{3}}{2}$"],"answer":2,"exp":". 지락 전 건전상의 대지전위\n비접지방식인 $\\Delta$ 결선의 3상 3선식 선로에서 평소(지락 전) 대지전위는 상전압 $E$ 와 같습니다. (선간전압 $V = \\sqrt{3} E$)2. 1선 지락 고장 발생 시 건전상의 대지전위\n1선이 지락되어 대지(0V)와 접촉하면, 사고가 난 상의 대지전위는 $0 \\, [\\text{V}]$ 가 되고, 나머지 사고가 나지 않은 2개의 건전상 대지전위는 상전압 $E$ 에서 선간전압 $V$ 로 상승하게 됩니다.3. 전위상승 배수 계산\n지락 후 건전상의 전위는 $V = \\sqrt{3} E$ 가 되므로, 지락 전 전위($E$)에 비해 다음과 같이 상승합니다.$$\\frac{\\text{지락 후 건전상 전위}}{\\text{지락 전 건전상 전위}} = \\frac{\\sqrt{3} E}{E} = \\sqrt{3} \\text{배}$$","img":null},{"id":27,"text":"변압기 결선에서 1차 측 전압에 제3고조파가 있을 때 2차 측 전압에 제3고조파가 나타나는 결선은?","opts":["Δ−Δ","Y−Y","Δ−Y","Y−Δ"],"answer":1,"exp":"① $\\Delta - \\Delta$ 결선: 양측 모두 델타 결선이므로 제3고조파가 내부에 흡수되어 외부나 2차 측으로 나타나지 않습니다.② $Y - Y$ 결선: 1차 측에 제3고조파가 존재하면 순환전류가 흐르는 통로($\\Delta$ 회로)가 없어, 2차 측 전압에 제3고조파가 그대로 나타납니다.③ $\\Delta - Y$ 및 ④ $Y - \\Delta$ 결선: 한쪽 이상에 $\\Delta$ 결선이 포함되어 있으므로 제3고조파의 통과가 억제됩니다.","img":null},{"id":28,"text":"수력발전소에서 조압수조를 설치하는 목적은?","opts":["토사의 제거","유량의 조절","수격작용의 완화","부유물의 제거"],"answer":2,"exp":"","img":null},{"id":29,"text":"동기조상기에 대한 설명으로 틀린 것은?","opts":["전압조정이 연속적이다.","경부하시에는 부족여자로 운전하여 뒤진전류를 취한다.","중부하시에는 과여자로 운전하여 앞선전류를 취한다.","선로의 시충전이 불가능하다."],"answer":3,"exp":"","img":null},{"id":30,"text":"송전선로에서 4단자정수 $A$ , $B$ , $C$ , $D$ 사이의 관계는?","opts":["$BC - AD = 1$","$AC - BD = 1$","$AB - CD = 1$","$AD - BC = 1$"],"answer":3,"exp":"","img":null},{"id":31,"text":"3상 1회선 송전 선로에 전력을 공급하는 변압기의 중성점을 위한 소호리액터의 용량은?","opts":["선로 충전 용량과 같다.","3선 일괄의 대지 충전 용량과 같다.","선간 충전 용량의 $\\frac{1}{2}$ 이다.","1선과 중성점 사이의 충전 용량과 같다."],"answer":1,"exp":"","img":null},{"id":32,"text":"전선에 흐르는 전류가 3배가 되면 전력손실은 몇 배가 되는가?","opts":["$\\frac{1}{3}$ 배","$3$ 배","$9$ 배","$\\frac{1}{9}$ 배"],"answer":2,"exp":"1. 전력손실 공식\n저항 $R$ 이 일정한 전선에 전류 $I$ 가 흐를 때 발생하여 열로 손실되는 전력 $P_l$ 은 줄의 법칙에 의해 다음과 같이 전류의 제곱에 비례합니다.$$P_l = I^2 R$$2. 전류 변화에 따른 전력손실 비례 관계\n전류가 원래의 $3$ 배가 되면 변경된 전력손실 $P_l'$ 은 다음과 같습니다.$$P_l' = (3 I)^2 R = 9 I^2 R = 9 P_l$$","img":null},{"id":33,"text":"3상 3선식 송전선로를 연가하는 목적으로 볼 수 없는 것은?","opts":["선로 정수의 평형","코로나 감소","통신선의 유도 장애의 방지","직렬 공진의 방지"],"answer":1,"exp":"","img":null},{"id":34,"text":"발전소의 발전기 정격전압 $[\\text{kV}]$ 으로 사용되는 것은?","opts":["$6.6$","$33$","$66$","$154$"],"answer":0,"exp":"","img":null},{"id":35,"text":"무부하 송전선로의 충전전류를 차단하는 경우 차단기의 개폐에 의한 이상전압의 크기는 대지전압의 몇 배 정도인가?","opts":["$2$","$4$","$8$","$10$"],"answer":1,"exp":"","img":null},{"id":36,"text":"그림과 같은 선로에서 점 F에서의 1선 지락이 발생한 경우 영상 임피던스는?","opts":["$Z_{TS} + Z_n + 3Z_o$","$Z_{TS} + 3Z_n + Z_o$","$Z_{TS} + Z_n + Z_o \\frac{L_f}{L}$","$Z_{TS} + 3Z_n + Z_o \\frac{L_f}{L}$"],"answer":3,"exp":"1. 1선 지락 고장 시 영상 회로의 구성\n대칭좌표법을 이용한 1선 지락 고장 시, 고장점에서 바라본 임피던스는 영상 회로, 정상 회로, 역상 회로가 직렬로 연결된 합성 임피던스가 됩니다.2. 각 성분별 임피던스 분석송전단 변압기의 영상 임피던스 ($Z_{TS}$): 송전단 측의 영상 임피던스가 직렬로 포함됩니다.접지 임피던스 ($3Z_n$): 중성점 접지 회로에 임피던스 $Z_n$ 이 존재할 경우, 영상 회로에서는 3상 전류가 합쳐져 흐르기 때문에 $3Z_n$ 의 값이 됩니다.선로의 영상 임피던스 ($Z_o \\frac{L_f}{L}$): 전체 선로 길이 $L$ 중에서 고장점까지의 거리 $L_f$ 에 해당하는 구간의 임피던스가 반영되므로, 선로의 전체 영상 임피던스 $Z_o$ 에 비율 $\\frac{L_f}{L}$ 을 곱한 값이 됩니다.3. 합성 영상 임피던스 ($Z_0$ 또는 $Z_f$ )\n이들을 모두 더하면 고장점에서 본 전체 영상 임피던스 식이 완성됩니다.$$Z_{TS} + 3Z_n + Z_o \\frac{L_f}{L}$$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCADCAYMDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAMnxeNefw9dQ+GWto9WlUR281yMxwFiAZWX+LaCW2/xEAZGc15j4n1vxkPFum/D3wj4tutS8RkJc61fzWVt9l0y0z950WP/WP0SPdnqxOBz0Pxk8fzeGIrLw54dFpdeMNbJi0y3uJAsUCj79zMT0iQZPqxAUcmqPw2m8IeDL608E6ZrMfiPxXqrvf6xdRypJcStj95czkH5EztRV91AHU0AenxKyRqjSNIwUAuwALH1OOPyp1cyfGVgNT+z/Zrj7J/aQ0v7Zxs+1YzsxnOM/Lu6buPeumoAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACq+p3trpunXOo306QWtrE000rnCoijJJ+gFWKp61dadZaTdXmrzW8OnwRNLcyXBAjRFGSWzxgAUAcTffFfS9P8FSeMNV8OeJNM0dEVxJeW8UMjhiAgWNpN5LEgBcZORxXbaLff2npNrqP2O7sxcxLKILqMJNGCM4dcnDeozxXlPhSym+KniWz+IviS3ktvCemSeb4X0y5Gzz26DUJ1Pcg/u1P3Qd3Uiu38ZeM18N+fI+hapewQGBHmhEaq0s0ixxxJvZd7EsuccAEc54oA6uiudbxO0SpFdaPeWt9NemytraV4x57CMy7lcMV27AxznPykYzxWnoeovqVvNJLp93YSQzvA8VwBklT94FSQVIwQfQ9ulAGRf+N9HtNVu9NFrrV3PZuI5zZ6TcXCIxVXC70QrnaynGe9Rf8ACeaX/wBAjxT/AOE  $I$, $R$, $X$, $\\theta$ 는 각각 수전단 전류, 선로저항, 리액턴스 및 수전단 전류의 위상각이다.)","opts":["$I ( R \\cos\\theta + X \\sin\\theta )$","$2I ( R \\cos\\theta + X \\sin\\theta )$","$\\sqrt{3} I ( R \\cos\\theta + X \\sin\\theta )$","$3I ( R \\cos\\theta + X \\sin\\theta )$"],"answer":2,"exp":"1. 1상당 전압강하 (상전압 기준)\n송전선로 한 가닥(1상)에서 발생하는 전압강하 $e$ 는 수전단 전류 $I$ 와 저항 $R$, 리액턴스 $X$, 역률각 $\\theta$ 에 의해 다음과 같이 표현됩니다.$$e = I ( R \\cos\\theta + X \\sin\\theta )$$2. 3상 3선식에서 선간 전압강하\n3상 교류 선로에서 선간 전압강하($e_l$)는 1상당 전압강하($e$)의 $\\sqrt{3}$ 배가 됩니다.$$e_l = \\sqrt{3} e = \\sqrt{3} I ( R \\cos\\theta + X \\sin\\theta )$$","img":null},{"id":38,"text":"전선 4개의 도체가 정사각형으로 배치되어 있을 때 각 도체간의 거리를 $D$ 라고 하면 소도체간 기하 평균거리는?","opts":["$D$","$\\sqrt[3]{2} D$","$4D$","$\\sqrt[6]{2} D$"],"answer":3,"exp":"1. 소도체 간 거리의 구성\n4분도체(4개의 소도체)가 한 변의 길이가 $D$ 인 정사각형의 각 꼭짓점에 배치되어 있을 때, 하나의 소도체에서 다른 3개의 소도체까지의 거리는 다음과 같습니다.이웃한 2개의 소도체까지의 거리: $D$, $D$대각선에 위치한 1개의 소도체까지의 거리: $\\sqrt{2} D$2. 기하 평균거리($D_s$) 계산\n4개의 소도체에서 임의의 한 도체를 기준으로 다른 도체들과의 거리 곱에 대해 기하평균을 구합니다. (총 3개의 거리가 존재하므로 3제곱근을 취합니다.)$$D_s = \\sqrt[3]{D \\times D \\times \\sqrt{2} D}$$$$D_s = \\sqrt[3]{\\sqrt{2} D^3} = \\sqrt[3]{2^{1/2}} \\times D$$지수 법칙에 의해 $(2^{1/2})^{1/3} = 2^{1/6} = \\sqrt[6]{2}$ 이므로 다음과 같이 정리됩니다.$$D_s = \\sqrt[6]{2} D$$","img":null},{"id":39,"text":"외뢰(外雷)에 대한 주 보호장치로서 송전계통의 절연협조의 기본이 되는 것은?","opts":["애자","변압기","차단기","피뢰기"],"answer":3,"exp":"","img":null},{"id":40,"text":"송전선로에서 초호환(arcing ring)의 설치 목적은?","opts":["선로의 섬락시 애자 보호","송전전력 증가","누설전류에 의한 편열 방지","전력손실 감소"],"answer":0,"exp":"","img":null},{"id":41,"text":"$A$, $B$ 두 대의 직류발전기를 병렬운전 하고 있다.$A$ 기의 유효전력 분담을 늘리기 위한 방법으로 옳은 것은?","opts":["B기의 계자 증대","A기의 계자 증대","B기의 속도 증대","A기의 속도 증대"],"answer":1,"exp":"1. 직류발전기의 부하분담 원리\n병렬운전 중인 두 직류발전기에서 특정 발전기($A$ 기)의 부하 전류(전력) 분담을 늘리기 위해서는 그 발전기의 기전력 $E_A$ 를 상대적으로 크게 해주어야 합니다.$$I_A = \\frac{E_A - V}{R_A}$$$E_A$ : $A$ 기의 유도 기전력$V$ : 모선 전압(공통 단자전압)$R_A$ : $A$ 기의 전기자 저항2. 계자 전류 조정과 유도 기전력\n직류발전기의 유도 기전력은 $E = k \\phi N$ ( $\\phi$ : 자속, $N$ : 회전수)으로 나타냅니다.\n계자 저항을 줄여 계자 전류를 늘리면(계자 증대), 자속 $\\phi$ 가 증가하여 유도 기전력 $E_A$ 가 상승하게 됩니다.","img":null},{"id":42,"text":"포화하고 있지 않은 직류발전기의 회전수가 $\\frac{1}{2}$ 로 감소되었을 때 기전력을 속도 변화 전과 같은 값으로 하려면 여자전류를 전과 비교하여 얼마로 해야 하는가?","opts":["$1$ 배","$2$ 배","$4$ 배","$8$ 배"],"answer":1,"exp":"1. 직류발전기의 유도기전력 공식\n직류발전기의 유도기전력 $E$ 는 다음과 같습니다.$$E = k \\phi N$$$E$ : 유도기전력$\\phi$ : 자속$N$ : 회전수2. 포화하지 않은 조건에서의 자속과 여자전류의 관계\n자기회로가 포화하지 않을 때 자속 $\\phi$ 는 여자전류 $I_f$ 에 비례하므로($\\phi \\propto I_f$), 기전력 식은 다음과 같이 나타낼 수 있습니다.$$E = k' I_f N$$3. 조건 대입 및 계산\n기전력을 속도 변화 전과 같은 값으로 유지하려고 하므로, 회전수 $N$ 이 $\\frac{1}{2}$ 배로 감소했을 때 여자전류 $I_f$ 는 다음과 같이 변화해야 합니다.$$I_{f1} \\times N = I_{f2} \\times \\frac{1}{2} N$$$$I_{f2} = 2 I_{f1}$$","img":null},{"id":43,"text":"유도전동기의 슬립이 $s > 1$ 인 영역을 갖는 것은?","opts":["회생제동","역상제동","회전제동","발전제동"],"answer":1,"exp":"","img":null},{"id":44,"text":"전력용반도체 중 2단자 양방향성 저항소자이며, TRIAC, SCR의 게이트 트리거용에 적합한 소자는?","opts":["LASCR","UJT","DIAC","SUS"],"answer":2,"exp":"","img":null},{"id":45,"text":"3상 동기 발전기에서 그림과 같이 1상의 권선을 서로 똑같은 2조로 나누어서 그 1조의 권선전압을 $E \\, [\\text{V}]$, 각 권선의 전류를 $I \\, [\\text{A}]$ 라 하고 2중 Y형 (double star)으로 결선한 경우 선간전압 $[\\text{V}]$, 선전류 $[\\text{A}]$, 피상전력 $[\\text{W}]$ 은?","opts":["$3E , I , 5.19 EI$","$\\sqrt{3} E , 2I , 6EI$","$E , 2\\sqrt{3} I , 6EI$","$\\sqrt{3} E , \\sqrt{3} I , 5.19 EI$"],"answer":1,"exp":"1. 2중 Y형 (Double Star) 결선 특징1상의 권선을 2조로 나누어 각각 Y결선 형태로 병렬 연결한 구조입니다.상전압(권선전압)이 $E$ 이므로, 병렬로 연결된 두 조가 합쳐져 전체 상전압은 여전히  $E$  가 됩니다.2. 선간전압 구하기\nY결선의 특성에 따라 선간전압 $V_l$ 은 상전압 $E$ 의 $\\sqrt{3}$ 배가 됩니다.$$V_l = \\sqrt{3} E$$3. 선전류 구하기\n각 권선의 전류가 $I$ 이고, 동일한 상에 2조의 권선이 병렬로 연결되어 있으므로 선전류 $I_l$ 은 각 권선 전류의 2배가 됩니다.$$I_l = 2I$$4. 피상전력 $P_a$ 구하기\n3상 피상전력 공식 $P_a = \\sqrt{3} V_l I_l$ 에 구한 값을 대입합니다.$$P_a = \\sqrt{3} \\times (\\sqrt{3} E) \\times (2I) = 3 \\times E \\times 2I = 6EI$$따라서 선간전압은 $\\sqrt{3} E$, 선전류는 $2I$, 피상전력은 $6EI$ 이므로 정답은 ②번입니다.","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2 KKKACiiigCOeCG4j8ueKOVM52uoYZ+hp6gKoUAADgAdqWigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigCPyYRObgRR+cV2mTaN2PTPXFSUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQB/9k="},{"id":46,"text":"20 [ kVA ] 의 단상변압기가 역률 $1$ 일 때 전부하 효율이 $97 [ \\% ]$ 이다. $3 / 4$ 부하일 때 이 변압기는 최고 효율을 나타낸다. 전부하에서 철손( $P_i$ )과 동손( $P_c$ )은 각각 몇 [ W ] 인가?","opts":["$P_i = 222 , P_c = 396$","$P_i = 222 , P_c = 528$","$P_i = 619 , P_c = 528$","$P_i = 619 , P_c = 396$"],"answer":0,"exp":"1. 최대 효율 조건 이용\n변압기의 최고 효율(최대 효율)은 철손( $P_i$ )과 동손( $P_c$ )이 같아지는 조건($P_i = m^2 P_c$)에서 발생합니다.문제에서 $\\frac{3}{4}$ 부하($m = \\frac{3}{4}$)일 때 최고 효율을 나타낸다고 하였으므로, 전부하 동손을 $P_c$ 라 할 때 다음 식이 성립합니다.$$P_i = \\left( \\frac{3}{4} \\right)^2 P_c = \\frac{9}{16} P_c$$즉, $P_c = \\frac{16}{9} P_i$ 입니다.2. 전부하 효율 식 이용\n정격 용량 $P_a = 20 \\, [\\text{kVA}] = 20,000 \\, [\\text{W}]$ (역률 $\\cos\\theta = 1$ ), 효율 $\\eta = 0.97$ 일 때의 전부하 효율 공식은 다음과 같습니다.$$\\eta = \\frac{P_a \\cos\\theta}{P_a \\cos\\theta + P_i + P_c}$$$$0.97 = \\frac{20,000}{20,000 + P_i + \\frac{16}{9} P_i}$$3. 철손( $P_i$ ) 계산\n분모를 정리합니다.$$20,000 + \\frac{25}{9} P_i = \\frac{20,000}{0.97}$$$$\\frac{25}{9} P_i = \\frac{20,000}{0.97} - 20,000 = 20,000 \\left( \\frac{1 - 0.97}{0.97} \\right) = 20,000 \\times \\frac{0.03}{0.97} = \\frac{600}{0.97} \\approx 618.557$$$$P_i = 618.557 \\times \\frac{9}{25} \\approx 222.68 \\, [\\text{W}] \\approx 222 \\, [\\text{W}]$$4. 동손( $P_c$ ) 계산$$P_c = \\frac{16}{9} P_i = \\frac{16}{9} \\times 222.68 \\approx 395.88 \\, [\\text{W}] \\approx 396 \\, [\\text{W}]$$","img":null},{"id":47,"text":"어떤 IGBT의 열용량은 $0.02 \\, [\\text{J}/\\text{℃}]$, 열저항은 $0.625 \\, [\\text{℃}/\\text{W}]$ 이다. 이 소자에 직류 $25 \\, [\\text{A}]$ 가 흐를 때 전압강하는 $3 \\, [\\text{V}]$ 이다. 몇 $[\\text{℃}]$ 의 온도상승이 발생하는가?","opts":["$1.5$","$1.7$","$47$","$52$"],"answer":2,"exp":"1. 손실 전력 $P$ 계산\n소자에 흐르는 전류와 전압강하를 곱하여 발생 손실 전력을 구합니다.$$P = V \\times I = 3 \\, [\\text{V}] \\times 25 \\, [\\text{A}] = 75 \\, [\\text{W}]$$2. 온도상승 $\\Delta T$ 계산\n정상 상태에서의 온도상승은 손실 전력과 열저항 $R_{th}$ 의 곱으로 구해집니다.$$\\Delta T = P \\times R_{th} = 75 \\, [\\text{W}] \\times 0.625 \\, [\\text{℃}/\\text{W}] = 46.875 \\, [\\text{℃}] \\approx 47 \\, [\\text{℃}]$$","img":null},{"id":48,"text":"동기발전기가 난조를 일으키는 원인으로 틀린 것은?","opts":["부하가 급격히 변화하는 경우","회전자의 관성 모멘트가 작은 경우","발전기의 전기적 저항이 작은 경우","원동기의 토크에 고조파가 포함되어 있는 경우"],"answer":2,"exp":"","img":null},{"id":49,"text":"유도전동기에 전력용 커패시터를 사용하는 주된 목적은?","opts":["역률 개선을 위하여","이상전압을 막기 위하여","과부하를 막기 위하여","과전류를 막기 위하여"],"answer":0,"exp":"","img":null},{"id":50,"text":"3상 유도전동기를 기동할 때 슬롯수가 적당하지 않을 때 발생되는 기자력의 고조파 성분에 의해 발생되는 현상은?","opts":["크롤링 현상","게르게스 현상","토크 증가 현상","제동 토크의 증가 현상"],"answer":0,"exp":"","img":null}];
const title="25년 3회 산업기사 01~50";
let cur=0,score=0,ans=new Array(QS.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return '해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+QS.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=QS[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div></div>';
  const isLast=cur===QS.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+QS.length+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===QS[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(QS.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function result(){
  const total=QS.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100),pass=pct>=60;
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+(pass?'#3fb950':'#f85149')+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+(pass?'#3fb950':'#f85149')+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+(pass?'🎉 합격!':'😥 불합격')+'</div>'+
    '<div class="res-sub">'+(pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다')+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div><button class="retry" onclick="restart()">🔄 다시 풀기</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function restart(){cur=0;score=0;ans=new Array(QS.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/QS.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
