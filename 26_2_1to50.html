<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>26년 2회 산업기사 1~50</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.retry.wrong{background:linear-gradient(135deg,#f85149,#d29922);color:#fff;}
.retry.sub{background:#21262d;color:#8b949e;border:1px solid #30363d;margin-top:8px;}
.res-note{font-size:12px;color:#8b949e;line-height:1.7;margin:-12px 0 20px;word-break:keep-all;}
</style>

    <div class="hdr-title">26년 2회 산업기사 1~50</div>
    <div class="prog-bar"><div class="prog-fill" id="pf" style="width:0%"></div></div>
  </div>
  <div class="score-chip" id="sc">0점</div>
</div>
<div class="main" id="main"></div>

<script>
const QS=[{"id":1,"text":"10[mH] 인덕터가 2개 있다. 결합계수를 0.1로부터 0.9까지 변화시킬 수 있다면 2개의 인덕터를 직렬 접속시켰을 수 있는 합성인덕터의 최대값[mH]은?","opts":["2","18","22","38"],"answer":3,"exp":"직렬 연결시 합성인덕턴스\n $$L = L_1 + L_2 + 2M$$\n\n직렬접속이라 $M$의 값이 가장 클 때 최대값 → 결합계수가 가장 클 때($k = 0.9$)의 상호인덕턴스\n$$M = k \\sqrt{L_1 L_2} = 0.9 \\times \\sqrt{10 \\times 10} = 9\\text{ [mH]}$$\n\n$k = 0.9$ 일 때, 전체 합성인덕터 \n$$L = 10 + 10 + 2 \\times 9 = 38\\text{ [mH]}$$","img":null,"expImg":null},{"id":2,"text":"자기회로의 자기저항에 대한 설명으로 옳은 것은?","opts":["단면적에 반비례하고 길이의 제곱에 비례한다.","자기회로의 단면적에 비례한다.","자기회로의 길이에 비례한다.","자기회로의 투자율에 비례한다."],"answer":2,"exp":"$$R_m = \\frac{l}{\\mu S}$$\n\n$l$: 자로의 길이 [m]\n$\\mu$: 자성체의 투자율 ($\\mu = \\mu_0 \\mu_r$) [H/m]\n$S$: 자로의 단면적 [m²]","img":null,"expImg":null},{"id":3,"text":"비투자율 $\\mu_s$인 자성체의 자속밀도가 $B$[Wb/$m^2$]일 때 자성체의 자화의 세기 $J$[Wb/$m^2$]는?","opts":["$(\\mu_s - 1) \\frac{\\mu_s}{B}$","$(\\mu_s\\mu_r - 1)B$","$(\\mu_s - 1)\\frac{B}{\\mu_s}$","$\\mu_0(\\mu_s - 1)B$"],"answer":2,"exp":"자속 밀도 $$B = \\mu_0 H + J$$\n자화의 세기 $$J = B - \\mu_0 H$$\n비투자율 이 $\\mu_s$니까 자기장 $H$는 $H = \\frac{B}{\\mu_0 \\mu_s}$, 위 식에 대입하면\n$$J = B - \\mu_0 \\left(\\frac{B}{\\mu_0 \\mu_s}\\right) = B - \\frac{B}{\\mu_s}$$\n\n따라서, $$J = \\frac{\\mu_s - 1}{\\mu_s} B$$ = $\\mu_0(\\mu_s - 1)B$","img":null,"expImg":null},{"id":4,"text":"정전계에 대한 설명으로 틀린 것은?","opts":["전계의 세기는 전위의 경도로 구할 수 있다.","전계의 세기에 유전율을 곱하면 전속밀도를 구할 수 있다.","도체 표면에서의 전계의 세기는 표면에 대해 법선 방향이다.","전위의 경도는 미분 연산이다."],"answer":2,"exp":"도체 표면에서의 전계의 세기는 표면에 대해 항상 수직이다.","img":null,"expImg":null},{"id":5,"text":"질량이 $m$[kg]인 작은 물체가 전하 $Q$[C]를 가지고 중력 방향과 직각인 무한도체평면 아래쪽 $d$[m]의 거리에 놓여 있다. 정전력이 중력과 같게 되는 데 필요한 $Q$[C]의 크기는","opts":["$\\pm \\frac{d}{2} \\sqrt{\\pi\\varepsilon_0 mg}$","$\\pm 4d \\sqrt{\\pi\\varepsilon_0 mg}$","$\\pm d \\sqrt{\\pi\\varepsilon_0 mg}$","$\\pm 2d \\sqrt{\\pi\\varepsilon_0 mg}$"],"answer":1,"exp":"평면 아래쪽 $d$ 거리에 전하 $Q$가 있으면, 평면 위쪽 대칭되는 위치에 크기가 반대인 영상전하 $-Q$가 존재, 이때 실제 전하와 영상전하 사이의 거리는 $2d$가 되며, 둘 사이에 작용하는 흡인력의 크기는..\n$$F = \\frac{1}{4\\pi\\varepsilon_0} \\frac{Q^2}{(2d)^2} = \\frac{Q^2}{16\\pi\\varepsilon_0 d^2}$$\n이 정전력은 중력과 같으므로,\n$$\\frac{Q^2}{16\\pi\\varepsilon_0 d^2} = mg$$\n이 때 $Q^2$으로 식을 정리\n$$Q^2 = 16\\pi\\varepsilon_0 m g d^2$$\n$$Q = 4d \\sqrt{\\pi\\varepsilon_0 m g}$$","img":null,"expImg":null},{"id":6,"text":"두 개의 도체에서 전위 및 전하가 각각 $V_1, Q_1$ 및 $V_2, Q_2$일 때, 이 도체계가 갖는 에너지는 얼마인가?","opts":["$V_1Q_1 + V_2Q_2$","$\\frac{1}{2}(V_1Q_1 + V_2Q_2)$","$\\frac{1}{2}(Q_1 + Q_2)(V_1 + V_2)$","$(Q_1 + Q_2)(V_1 + V_2)$"],"answer":1,"exp":"도체계가 갖는 정전에너지는 각 도체의 전하와 전위를 곱한 값들을 다 더한 것의 절반\n$$W = \\frac{1}{2} (Q_1 V_1 + Q_2 V_2)$$","img":null,"expImg":null},{"id":7,"text":"어떤 TV 방송 전파의 주파수가 190[MHz]의 정현파일 때 비유전율이 80, 비투과율이 1인 흠속에서의 전파속도 $v$[m/s]와 파장 $\\lambda$[m]은 약 얼마인가?","opts":["$v = 37.5 \\times 10^6, \\lambda = 0.190$","$v = 33.5 \\times 10^6, \\lambda = 0.176$","$v = 2.33 \\times 10^6, \\lambda = 0.210$","$v = 3.35 \\times 10^6, \\lambda = 0.176$"],"answer":1,"exp":"전파속도 $v$는...\n$$v = \\frac{c}{\\sqrt{\\mu_r \\varepsilon_r}} = \\frac{3 \\times 10^8}{\\sqrt{1 \\times 80}} = \\frac{3 \\times 10^8}{4\\sqrt{5}} \\approx 3.35 \\times 10^7\\text{ [m/s]}$$\n파장 $\\lambda$는 속도를 주파수 $f$로 나눠서 구할 수 있다.\n$$\\lambda = \\frac{v}{f} = \\frac{3.35 \\times 10^7}{190 \\times 10^6} \\approx 0.18\\text{ [m]}$$","img":null,"expImg":null},{"id":8,"text":"투자율이 각각 $\\mu_1, \\mu_2$인 두 자성체의 경계면에 대한 입사각과 굴절각을 각각 $\\theta_1, \\theta_2$라 할 때 성립되는 관계식은?","opts":["$\\frac{\\tan\\theta_1}{\\tan\\theta_2} = \\frac{\\mu_1}{\\mu_2}$","$\\frac{\\cos\\theta_1}{\\cos\\theta_2} = \\frac{\\mu_1}{\\mu_2}$","$\\frac{\\cot\\theta_1}{\\cot\\theta_2} = \\frac{\\mu_1}{\\mu_2}$","$\\frac{\\sin\\theta_1}{\\sin\\theta_2} = \\frac{\\mu_1}{\\mu_2}$"],"answer":0,"exp":"경계면을 통과할 때 자속밀도의 법선성분은 연속이고($B_{1n} = B_{2n}$)\n$$B_1 \\cos\\theta_1 = B_2 \\cos\\theta_2$$\n자기장의 접선성분은 연속($H_{1t} = H_{2t}$)\n$$H_1 \\sin\\theta_1 = H_2 \\sin\\theta_2 \\implies \\frac{B_1}{\\mu_1} \\sin\\theta_1 = \\frac{B_2}{\\mu_2} \\sin\\theta_2$$\n\n$$\\frac{\\frac{B_1 \\sin\\theta_1}{\\mu_1}}{B_1 \\cos\\theta_1} = \\frac{\\frac{B_2 \\sin\\theta_2}{\\mu_2}}{B_2 \\cos\\theta_2}$$$B_1, B_2$가 싹 약분되고 $\\sin / \\cos = \\tan$이 되니까:$$\\frac{\\tan\\theta_1}{\\mu_1} = \\frac{\\tan\\theta_2}{\\mu_2}$$\n\n$$\\frac{\\tan\\theta_1}{\\tan\\theta_2} = \\frac{\\mu_1}{\\mu_2}$$\n","img":null,"expImg":null},{"id":9,"text":"내구의 반지름이 6[cm], 외구의 반지름이 8[cm]인 동심구 콘덴서의 외구를 접지하고 내구에 전위 1,800[V]를 가했을 경우 내구에 충전된 전기량은 몇 [C]인가?","opts":["$2.8 \\times 10^{-8}$","$3.8 \\times 10^{-8}$","$4.8 \\times 10^{-8}$","$5.8 \\times 10^{-8}$"],"answer":2,"exp":"$Q = CV$ 에서, 콘덴서의 정전용량 $C$\n$$C = 4\\pi\\varepsilon_0 \\frac{ab}{b - a}$$\n내구의 반지름(a)=0.06, 외구의 반지름(b)=0.08로 $\\frac{ab}{b - a}$의 값은 \n$$\\frac{0.06 \\times 0.08}{0.08 - 0.06} = \\frac{0.0048}{0.02} = 0.24\\text{ m}$$\n$\\frac{1}{4\\pi\\varepsilon_0} = 9 \\times 10^9\\text{ m/F}$ 이므로, 정전용량 $C$는\n$$C = \\frac{0.24}{9 \\times 10^9}\\text{ [F]}$$\n최초 $Q = CV$에서, $V = 1800\\text{V}$ 이므로\n$$Q = \\frac{0.24}{9 \\times 10^9} \\times 1800 = 0.24 \\times \\frac{1800}{9 \\times 10^9} = 0.24 \\times 2 \\times 10^{-7} = 4.8 \\times 10^{-8}\\text{ [C]}$$","img":null,"expImg":null},{"id":10,"text":"자장 중에서 도선에 발생되는 유기 기전력의 방향은 어떤 법칙에 의하여 설명되는가","opts":["암페어의 오른나사 법칙","패러데이의 법칙","가우스의 법칙","렌츠의 법칙"],"answer":3,"exp":"암페어의 오른나사 법칙: 전류가 흐를 때 주변에 생기는 자기장의 방향은 오른주먹에서 엄지손가락을 펼친 방향과 같다.\n패러데이의 법칙: 코일을 지나는 자속이 변할 때, 그 변화율에 비례해서 유도기전력이 발생한다.\n$$E = N \\frac{d\\Phi}{dt}$$\n가우스의 법칙: 임의의 폐곡면을 통과하는 총 전속은 그 면 내부의 총 전하량과 같다.\n$$\\oint_S D \\cdot dS = Q$$\n렌츠의 법칙: 유도 전류는 항상 자속의 변화를 방해하는 방향으로 흐른다.\n$$e = -N \\frac{d\\Phi}{dt}$$","img":null,"expImg":null},{"id":11,"text":"동심구형 콘덴서의 내외 반지름을 각각 2배로 하면 정전용량은 몇 배로 되는가?","opts":["1","2","4","8"],"answer":1,"exp":"동심구형 콘덴서 정전용량 공식\n$$C = 4\\pi\\varepsilon_0 \\frac{ab}{b - a}$$\n내구와 외구의 반지름을 각각 2배($2a, 2b$)로..\n$$C' = 4\\pi\\varepsilon_0 \\frac{(2a)(2b)}{2b - 2a} = 4\\pi\\varepsilon_0 \\frac{4ab}{2(b - a)} = 2 \\times \\left( 4\\pi\\varepsilon_0 \\frac{ab}{b - a} \\right) = 2C$$\n\n$$C \\propto \\frac{ab}{b - a}$$","img":null,"expImg":null},{"id":12,"text":"그림과 같이 유전체 경계면에서 $\\varepsilon_1 < \\varepsilon_2$이었을 때 $E_1$과 $E_2$의 관계식 중 옳은 것은?","opts":["$E_1 > E_2$","$E_1 < E_2$","$E_1 = E_2$","$E_1\\cos\\theta_1 = E_2\\cos\\theta_2$"],"answer":0,"exp":"조건에서 $\\varepsilon_1 < \\varepsilon_2$라고 주어졌으므로, 우변인 $\\frac{\\varepsilon_1}{\\varepsilon_2} < 1$.따라서 $\\tan\\theta_1 < \\tan\\theta_2$가 되어 각도의 크기는 다음과 같다.$$\\theta_1 < \\theta_2$$\n\n접선성분 식을 변형하여 두 전계의 비를 구하면..\n$$\\frac{E_1}{E_2} = \\frac{\\sin\\theta_2}{\\sin\\theta_1}$$\n$\\theta_1 < \\theta_2$인 범위에서 $\\sin\\theta_1 < \\sin\\theta_2$이므로, $\\frac{\\sin\\theta_2}{\\sin\\theta_1} > 1$이 성립\n$$E_1 > E_2$$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAJkAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LHSiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigANFFFAAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRR ($\\varepsilon_s$ + 1)배 증가"],"answer":0,"exp":"$$C = \\varepsilon_s C_0$$","img":null,"expImg":null},{"id":16,"text":"전자기유도 현상에서 유도기전력 크기에 관한 법칙은?","opts":["패러데이의 법칙","암페어의 법칙","쿨롱의 법칙","렌츠의 법칙"],"answer":0,"exp":"패러데이의 법칙: 코일을 지나는 자속이 변할 때, 그 변화율에 비례해서 유도기전력이 발생한다.\n$$E = N \\frac{d\\Phi}{dt}$$\n암페어의 법칙: 폐회로를 따라 자기장을 한 바퀴 쭉 적분한 값($\\oint H \\cdot dl$)이 그 회로 내부를 통과하는 총 전류($I$)와 같다\n$$\\oint H \\cdot dl = I$$\n쿨롱의 법칙: 두 점전하 사이에 작용하는 정전기력의 크기를 구하는 법칙\n$$F = \\frac{1}{4\\pi\\varepsilon_0} \\frac{q_1 q_2}{r^2}$$\n렌츠의 법칙: 유도 전류는 항상 자속의 변화를 방해하는 방향으로 흐른다.\n$$e = -N \\frac{d\\Phi}{dt}$$","img":null,"expImg":null},{"id":17,"text":"진공 내에서 전위가 $V = x^2 + y$로 주어질 때 $0 \\le x \\le 1, 0 \\le y \\le 1, 0 \\le z \\le 1$인 공간에 저장되는 에너지[J]는?","opts":["$\\frac{5}{3}\\varepsilon_0$","$\\frac{7}{6}\\varepsilon_0$","$\\frac{3}{2}\\varepsilon_0$","$\\frac{5}{7}\\varepsilon_0$"],"answer":1,"exp":"유도식이 있으나, 저장되는 에너지는 $\\frac{7}{6}\\varepsilon_0\\text{ [J]}$로 외울것.","img":null,"expImg":null},{"id":18,"text":"그림과 같이 각 반지름이 $a, b, c(a < b < c)$인 무한히 긴 동축 원통도체가 있다. 내외 도체에 전류 $I$를 서로 반대 방향으로 균일한 밀도로 흘릴 때 각 부분의 자계를 설명한 것으로 옳은 것은?","opts":["외부 도체 내의 자계의 세기는 중심축으로부터의 거리에 반비례한다.","두 원통 도체 외부 공간의 자계의 세기는 중심축으로부터의 거리에 반비례한다.","내부 도체 내의 자계의 세기는 중심축으로부터의 거리의 제곱에 비례한다.","양 도체 사이의 자계의 세기는 중심축으로부터의 거리에 반비례한다."],"answer":3,"exp":"$H = \\frac{I}{2\\pi r}$ 이므로 거리 $r$에 반비례","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAEQATADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRM 3[$\\mu$F/km]라고 하면 1선의 작용정전용량은 몇 [$\\mu$F/km]인가?","opts":["0.03","0.023","0.012","0.006"],"answer":0,"exp":"삼각형 배치로 연가된 3상 3선식 송전선로에서 1선의 작용정전용량($C_0$)을 구하는 공식\n$$C_0 = C_s + 3C_m$$","img":null,"expImg":null},{"id":35,"text":"급수의 엔탈피 130[kcal/kg], 보일러 출구(터빈의 입구) 과열 증기 엔탈피 970[kcal/kg], 터빈 출구 엔탈피 550[kcal/kg]인 랭킨 사이클의 열사이클 효율은?","opts":["0.2","0.4","0.5","0.8"],"answer":2,"exp":"랭킨 사이클의 열사이클 효율 = 0.5 (50%)","img":null,"expImg":null},{"id":36,"text":"복도체를 사용한 송전선로를 같은 단면적의 단도체를 사용한 선로와 비교할 때 틀린 것은?","opts":["코로나 임계 전압이 상승하므로 코로나 손실을 감소시킨다.","송전용량을 증대할 수 있다.","안정도가 증대된다.","작용 인덕턴스는 증가하고, 작용 정전용량은 감소한다."],"answer":3,"exp":"작용 인덕턴스는 [감소]하고, 작용 정전용량은 [증가]한다.","img":null,"expImg":null},{"id":37,"text":"3상 Y결선된 발전기가 무부하 상태로 운전 중 3상 단락고장이 발생하였을 때 나타나는 현상으로 적합하지 않은 것은?","opts":["영상분 전류는 흐르지 않는다.","역상분 전류는 흐르지 않는다.","정상분 전류는 영상분 및 역상분 임피던스에 무관하고 정상분 임피던스에 반비례한다.","3상 단락전류는 정상분 전류의 3배가 흐른다."],"answer":3,"exp":"3상 단락 → 정상분만 존재하며, 3상 단락전류와 정상분 전류의 크기는 같다.\n","img":null,"expImg":null},{"id":38,"text":"3상 발전기의 1선이 지락 한 경우 지락 전류는? 단, $Z_0$ : 영상 임피던스, $Z_1$ : 정상 임피던스, $Z_2$ : 역상 임피던스이다.","opts":["$\\frac{E_s}{Z_0 + Z_1 + Z_2}$","$\\frac{3E_s}{Z_0 + Z_1 + Z_2}$","$\\frac{-Z_i E_s}{Z_0 + Z_1 + Z_2}$","$\\frac{\\sqrt{3} E_s}{Z_0 + Z_1 + Z_2}$"],"answer":1,"exp":"1선 지락 시 지락 전류 → 분자가 3인 보기 찾기","img":null,"expImg":null},{"id":39,"text":"연간 최대 수용전력이 60[kW], 75[kW], 80[kW], 105[kW]인 4개의 수용가를 합성한 연간 최대 수용 전력이 250[kW]이다. 이 수용가의 부등률은 얼마인가?","opts":["1.2","1.3","1.4","1.5"],"answer":1,"exp":"각 수용가 최대수용전력의 합: 60 + 75 + 80 + 105 = 320 [kW]\n부등률 계산: 320 / 250 = 1.28","img":null,"expImg":null},{"id":40,"text":"송전선로의 중성점을 접지하는 목적으로 맞지 않는 것은?","opts":["보호계전기의 확실한 동작","고장전류 감소 및 송전용량의 증가","과도안정도 증진","이상 전압의 경감 및 발생 방지"],"answer":1,"exp":"송전용량의 증가와는 관련이 없다.","img":null,"expImg":null},{"id":41,"text":"변압기에서 권수가 2배가 되면 유기기전력은 몇 배가 되는가?","opts":["$\\frac{1}{2}$","1","2","4"],"answer":2,"exp":"$E = 4.44 f N \\Phi_m$에서, 권수가 2배가 되면 유기기전력도 똑같이 2배","img":null,"expImg":null},{"id":42,"text":"2방향성 3단자 사이리스터는?","o const title="26년 2회 산업기사 1~50";
let Q=QS,cur=0,score=0,round=1,ans=new Array(Q.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+Q.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=Q[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===Q.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+Q.length+(round>1?' · 오답 '+(round-1)+'차':'')+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===Q[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function wrongIdx(){
  const r=[];
  for(let i=0;i<Q.length;i++){ if(ans[i]===null||!ans[i].ok) r.push(i); }
  return r;
}
function result(){
  const total=Q.length,done=ans.filter(a=>a!==null).length;

    rt=pass?'🎉 합격!':'😥 불합격';

    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div>'+note+
    (wrong.length?'<button class="retry wrong" onclick="retryWrong()">❌ '+(skipped?'오답·미풀이 ':'오답 ')+wrong.length+'문제만 다시 풀기</button>':'')+
    '<button class="retry'+(wrong.length?' sub':'')+'" onclick="restart()">🔄 '+(retryMode?'전체 문제 처음부터 다시 풀기':'처음부터 다시 풀기')+'</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function retryWrong(){
  const w=wrongIdx(); if(!w.length) return;
  Q=w.map(i=>Q[i]); round++;
  cur=0; score=0; ans=new Array(Q.length).fill(null); cache={}; render();
}
function restart(){Q=QS;round=1;cur=0;score=0;ans=new Array(Q.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/Q.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
</body>
</html>
