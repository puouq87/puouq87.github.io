<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>23년 3회 산업기사 01~50</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.retry.wrong{background:linear-gradient(135deg,#f85149,#d29922);color:#fff;}
.retry.sub{background:#21262d;color:#8b949e;border:1px solid #30363d;margin-top:8px;}
.res-note{font-size:12px;color:#8b949e;line-height:1.7;margin:-12px 0 20px;word-break:keep-all;}
</style>

<script>
const QS=[{"id":1,"text":"비투자율 $\\mu_r$ 인 자성체의 자속밀도가 $B[\\mathrm{Wb/m^2}]$ 일 때 자성체의 자화의 세기 $J[\\mathrm{Wb/m^2}]$ 는?","opts":["$\\left(\\mu_0 - \\frac{1}{\\mu_r}\\right)\\frac{\\mu_r}{B}$","$(\\mu_0\\mu_r - 1)B$","$(\\mu_r - 1)\\frac{B}{\\mu_r}$","$\\mu_0(\\mu_r - 1)B$"],"answer":2,"exp":"자화의 세기 : 단위 체적당 자기 모멘트\n$J = \\mu_0(\\mu_r - 1)H = \\left(1 - \\frac{1}{\\mu_r}\\right)B = (\\mu_r - 1)\\frac{B}{\\mu_r}[\\mathrm{Wb/m^2}]$","img":null,"expImg":null},{"id":2,"text":"도체 내 정전계의 성질에 대한 설명으로 틀린 것은?","opts":["도체 내부의 전위는 등전위이다.","도체 내부의 전계는 $0$ 이 아니다.","도체 표면의 전하밀도는 곡률이 클수록 크다.","전하는 도체 표면에만 존재한다."],"answer":1,"exp":"도체는 등전위체이며 대전도체에 인가된 전하는 도체 표면에만 분포한다. 또한, 도체 표면에서의 전하밀도는 곡률이 크고 곡률반경이 작을수록 높다. 전계는 등전위면에 수직이므로 도체 표면에 수직이며 도체 내부는 등전위체이므로 전계(전기력선)가 존재하지 않는다.","img":null,"expImg":null},{"id":3,"text":"전자유도 현상에서 유도기전력 크기에 관한 법칙은?","opts":["패러데이의 법칙","암페어의 법칙","쿨롱의 법칙","렌츠의 법칙"],"answer":0,"exp":"패러데이-렌츠의 법칙 : $e = -N\\frac{d\\phi}{dt} = -L\\frac{di}{dt}$\n패러데이 법칙(Faraday's Law) : 유기기전력의 크기를 결정\n패러데이 법칙(Faraday's Law) : 유기기전력의 크기를 결정","img":null,"expImg":null},{"id":4,"text":"와전류손과 히스테리시스손은 각각 최대 자속밀도의 몇 승에 비례하는가?","opts":["와전류손: $1.8$, 히스테리시스손: $1.8$","와전류손: $1.6$, 히스테리시스손: $2.0$","와전류손: $2.0$, 히스테리시스손: $1.6$","와전류손: $3.0$, 히스테리시스손: $1.0$"],"answer":2,"exp":"히스테리시스 손실 $P_h = \\eta f B_m^{1.6}[\\mathrm{W}]$ : 최대자속밀도의 $1.6$ 승에 비례와전류손 $P_e = \\sigma_e(tfk_f B_m)^2$ : 최대자속밀도의 $2$ 승에 비례","img":null,"expImg":null},{"id":5,"text":"질량이 $m[\\mathrm{kg}]$ 인 작은 물체가 전하 $Q[\\mathrm{C}]$ 를 가지고 중력 방향과 직각인 무한도체평면 아래쪽 $d[\\mathrm{m}]$ 의 거리에 놓여 있다. 정전력이 중력과 같게 되는 데 필요한 $Q[\\mathrm{C}]$ 의 크기는?","opts":["$\\pm\\frac{d}{2}\\sqrt{\\pi\\varepsilon_0 mg}$","$\\pm 4d\\sqrt{\\pi\\varepsilon_0 mg}$","$\\pm d\\sqrt{\\pi\\varepsilon_0 mg}$","$\\pm 2d\\sqrt{\\pi\\varepsilon_0 mg}$"],"answer":1,"exp":"영상법을 이용하여 아래 그림과 같은 형태로 바꾸어 생각하면\n영상력 $F = \\frac{Q(-Q)}{4\\pi\\varepsilon_0 d^2} = -\\frac{Q^2}{4\\pi\\varepsilon_0(2d)^2} = -\\frac{Q^2}{16\\pi\\varepsilon_0 d^2}[\\mathrm{N}]$\n단, 여기서 $(-)$ 부호는 흡인력을 의미한다 \frac{1}{2}\\epsilon_0 \\times \\left[\\frac{7}{3}z\\right]_0^1 = \\frac{1}{2}\\epsilon_0 \\times \\frac{7}{3} = \\frac{7}{6}\\epsilon_0 \\, [\\text{J}]$$","img":null,"expImg":null},{"id":12,"text":"비유전율이 $2.8$ 인 유전체에서의 전속밀도가 $D = 3.0 \\times 10^{-7}[\\mathrm{C/m^2}]$ 일 때 분극의 세기 $P$ 는 약 몇 $[\\mathrm{C/m^2}]$ 인가?","opts":["$1.93 \\times 10^{-7}$","$2.93 \\times 10^{-7}$","$3.50 \\times 10^{-7}$","$4.07 \\times 10^{-7}$"],"answer":0,"exp":"분극의 세기\n$P = \\varepsilon_0(\\varepsilon_s - 1)E = \\left(1 - \\frac{1}{\\varepsilon_s}\\right)D$\n$= \\left(1 - \\frac{1}{2.8}\\right) \\times 3 \\times 10^{-7} = 1.93 \\times 10^{-7}[\\mathrm{C/m^2}]$","img":null,"expImg":null},{"id":13,"text":"평행판 콘덴서의 판 사이에 비유전율 $\\varepsilon_s$ 의 유전체를 삽입하였을 때의 정전용량은 진공일 때보다 어떻게 되는가?","opts":["$\\varepsilon_s$ 배로 증가","$\\pi\\varepsilon_s$ 배로 증가","$\\frac{1}{\\varepsilon_s}$ 로 감소","$(\\varepsilon_s + 1)$ 배로 증가"],"answer":0,"exp":"$C = \\varepsilon_s C_0$ 이므로\n유전체를 삽입하면 정전용량은 $\\varepsilon_s$ 배 증가한다.","img":null,"expImg":null},{"id":14,"text":"동심구형 콘덴서의 내외 반지름을 각각 $2$ 배로 하면 정전용량은 몇 배로 되는가?","opts":["$1$","$2$","$4$","$8$"],"answer":1,"exp":"동심구의 정전용량\n$C' = \\frac{4\\pi\\varepsilon_0 ab}{b - a} = \\frac{4\\pi\\varepsilon_0 \\cdot (2a \\times 2b)}{2b - 2a} = \\frac{2 \\cdot 4\\pi\\varepsilon_0 ab}{b - a} = 2C$","img":null,"expImg":null},{"id":15,"text":"투자율이 각각 $\\mu_1$, $\\mu_2$ 인 두 자성체의 경계면에 대한 입사각과 굴절각을 각각 $\\theta_1$, $\\theta_2$ 라 할 때 성립되는 관계식은?","opts":["$\\frac{\\tan\\theta_1}{\\tan\\theta_2} = \\frac{\\mu_1}{\\mu_2}$","$\\frac{\\cos\\theta_1}{\\cos\\theta_2} = \\frac{\\mu_1}{\\mu_2}$","$\\frac{\\cot\\theta_1}{\\cot\\theta_2} = \\frac{\\mu_1}{\\mu_2}$","$\\frac{\\sin\\theta_1}{\\sin\\theta_2} = \\frac{\\mu_1}{\\mu_2}$"],"answer":0,"exp":"자성체의 경계조건경계조건 : $\\frac{\\tan\\theta_1}{\\tan\\theta_2} = \\frac{\\mu_1}{\\mu_2}$","img":null,"expImg":null},{"id":16,"text":"그림과 같이 각 반지름이 $a$, $b$, $c(a < b < c)$ 인 무한히 긴 동축 원통도체가 있다. 내외 도체에 전류 $I$ 를 서로 반대 방향으로 균일한 밀도로 흘릴 때 각 부분의 자계를 설명한 것으로 옳은 것은?","opts" TfE//ACLWqf8AXnN/6Aa8y/Y1/wCTavCH/XG4/wDSmWgD16iiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAFFAooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigDO8T/APItap/15zf+gGvMv2Nf+TavCH/XG4/9KZa9bnijnheGZFeORSrqeQwIwQaqaBo+laBpEGkaJp9tp2n24IhtreMJHGCSxwo4GSSfxoAvUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAf/Z","expImg":null},{"id":18,"text":"자기회로의 자기저항에 대한 설명으로 옳은 것은?","opts":["단면적에 반비례하고 길이의 제곱에 비례한다.","자기회로의 단면적에 비례한다.","자기회로의 길이에 비례한다.","자기회로의 투자율에 비례한다."],"answer":2,"exp":"자기저항 $R_m = \\frac{l}{\\mu_0 \\mu_s S}[\\mathrm{AT/Wb}]$\n자기저항은 길이에 비례하고 투자율과 단면적에 반비례한다.","img":null,"expImg":null},{"id":19,"text":"어떤 $\\mathrm{TV}$ 방송 전자파의 주파수가 $190[\\mathrm{MHz}]$ 의 정현파일 때 비유전율이 $80$, 비투자율이 $1$ 인 물속에서의 전파속도 $v[\\mathrm{m/s}]$ 와 파장 $\\lambda[\\mathrm{m}]$ 은 약 얼마인가?","opts":["$v = 37.5 \\times 10^6$, $\\lambda = 0.190$","$v = 33.5 \\times 10^6$, $\\lambda = 0.176$","$v = 2.33 \\times 10^6$, $\\lambda = 0.210$","$v = 3.35 \\times 10^6$, $\\lambda = 0.176$"],"answer":1,"exp":"전파 속도 $v = \\frac{1}{\\sqrt{\\varepsilon\\mu}} = \\frac{3 \\times 10^8}{\\sqrt{\\varepsilon_s\\mu_s}} = \\frac{3 \\times 10^8}{\\sqrt{80 \\times 1}} = 0.335 \\times 10^8 = 33.5 \\times 10^6[\\mathrm{m/sec}]$\n전파 속도 $v = f\\lambda$ 에서\n파장 $\\lambda = \\frac{v}{f} = \\frac{33.5 \\times 10^6}{190 \\times 10^6} = 0.176[\\mathrm{m}]$","img":null,"expImg":null},{"id":20,"text":"철심에 코일을 $N$ 회 감은 환상 솔레노이드가 있다. 철심의 투자율이 일정하다고 하면, 이 솔레노이드의 자기 인덕턴스 $L$ 은?(단, $R_m$ 는 철심의 자기 저항이다)","opts":["$L = \\frac{N^2}{R_m}$","$L = \\frac{N}{R_m}$","$L = \\frac{R_m}{N^2}$","$L = R_m N^2$"],"answer":0,"exp":"자기인덕턴스\n$L = \\frac{N^2}{R_m} = \\frac{\\mu SN^2}{l}[\\mathrm{H}]$","img":null,"expImg":null},{"id":21,"text":"$\\mathrm{SF_6}$ 가스를 이용한 가스차단기에 대한 특징으로 틀린 것은?","opts":["설치면적이 적게 소요된다.","소음이 적다.","$\\mathrm{SF_6}$ 가스에 의한 화재의 우려가 있다.","차단능력이 대단히 우수하다."],"answer":2,"exp":"$\\mathrm{SF_6}$(육불화황)가스\n무색, 무취, 무독성 기체\n불연성, 불활성 기체\n아크 소호능력은 공기의 $100 \\sim 200$ 배\n절연내력은 공기의 $2 \\sim 3$ 배 이상\n따라서 가스차단기( $\\mathrm{GCB}$ )는 밀폐구조이며 신뢰성이 우수","img":null,"expImg":null},{"id":22,"text":"송전선로에서 코로나 임계전압이 높아지는 경우는?","opts":["상대공기밀도가 작을 경우","기압이 낮은 경우","전선의 지름이 큰 경우","온도가 높아지는 경우"],"answer":2,"exp":"코로나 임계 전압 $E = 24.3 m_0 m_1 \\delta d \\log_{10}\\frac{D}{r}[\\mathrm{kV}]$\n$m_0$ : 전선의 표면 상태\n$m_1$ : 전후 계수\n$\\delta$ : 상대 공기 밀도 $= \\frac{0.386 b}{273 + t}$ ( $b$ : 기압, $t$ : 온도)\n$d$ : 전선의 지름\n따라서 코로나 임계전압이 높아지려면 상대 공기밀도가 높고, 전선의 직경이 커야한다.\n또한, 맑은 날, 기압이 높고, 온도가 낮은 경우에 임계전압이 높다.","img":null,"expImg":null},{"id":23,"text":"$1$ 회선의 $4$ 단자 정수가 $A$, $B$, $C$, $D$ 인 $3$ 상 $2$ 회선 송전선의 합성 $4$ 단자 정수가 $A_0$, $B_0$, $C_0$, $D_0$ 일 때 합성 $4$ 단자 정수로 옳은 것은?","opts":["$A_0 = 2A$, $B_0 = \\frac{1}{2}B$, $C_0 = 2C$, $D_0 = 2D$","$A_0 = A$, $B_0 = 2B$, $C_0 = C$, $D_0 = D$","$A_0 = 2A$, $B_0 = 2B$, $C_0 = \\frac{1}{2}C$, $D_0 = D$","$A_0 = A$, $B_0 = \\frac{1}{2}B$, $C_0 = 2C$, $D_0 = D$"],"answer":3,"exp":"선로의 병렬(병행)운전( $2$ 회선 이상 방식, 다회선 방식) → 해설 이미지 참조\n단자정수의 변화는 다음과 같다\n.$A_0 = A$\n$B_0 = \\frac{B}{2}$\n$C_0 = 2C$\n$D_0 = D$\n","img":null,"expImg":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAFPAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAA 면적) $A \\propto \\frac{1}{(V \\times \\cos\\theta)^2}$","img":null,"expImg":null},{"id":25,"text":"대용량 화력발전소의 위치를 선정할 때 실질적으로 고려하지 않아도 되는 것은?","opts":["지질","용수","부하와의 거리","운전 조건"],"answer":3,"exp":"화력 발전소 위치 선정 시 고려사항\n\n    전력 수요지에 가까울 것\n\n    풍부한 용수와 냉각수가 얻어질 것\n\n    연료의 운반과 저장이 편리할 것\n\n    지반이 견고할 것","img":null,"expImg":null},{"id":26,"text":"어떤 공장의 저압 간선의 부하설비 용량이 $100[\\mathrm{kW}]$, $150[\\mathrm{kW}]$, $200[\\mathrm{kW}]$ 이고, 수용률이 모두 $50[\\%]$ 이고, 각 저압 간선 사이의 부등률이 $1.2$ 일 때 이 공장의 수전설비(변압기)의 최소 용량은 약 몇 $[\\mathrm{kVA}]$ 인가?(단, 평균 부하 역률은 $80[\\%]$ 이다)","opts":["$235$","$160$","$470$","$355$"],"answer":0,"exp":"변압기 용량 $[\\mathrm{kVA}] = \\frac{\\text{설비용량} \\times \\text{수용률}}{\\text{부등률} \\times \\text{역률}}$\n$= \\frac{(100 + 150 + 200) \\times 0.5}{1.2 \\times 0.8} = 234.38[\\mathrm{kVA}]$","img":null,"expImg":null},{"id":27,"text":"저압 뱅킹배전방식에서 저압선의 고장에 의하여 건전한 변압기의 일부 또는 전부로 사고가 확대되는 현상은?","opts":["아킹","밸런서","캐스케이딩","플리커"],"answer":2,"exp":"저압 뱅킹 방식 : 부하가 밀집된 시가지(부하증가에 대한 탄력성)\n\n    장점 : 전압 강하와 전력 손실이 적다.\n    변압기의 용량 및 저압선 용량 감소\n    플리커 현상 감소\n\n    단점 : 캐스케이딩 현상 발생\n    (저압선의 일부 고장으로 건전한 변압기의 일부 또는 전부가 차단되는 현상)","img":null,"expImg":null},{"id":28,"text":"$3$ 상 $3$ 선식 계통에서 수전단전압 $60[\\mathrm{kV}]$, 전류 $200[\\mathrm{A}]$, 선로저항 $7.61[\\Omega]$, 리액턴스 $11.85[\\Omega]$ 일 때 전압강하율은 약 몇 $[\\%]$ 인가?(단, 수전단 역률은 $0.8$ 이다)","opts":["$7.62$","$6.61$","$8.42$","$9.43$"],"answer":0,"exp":"전압강하율 $\\epsilon = \\frac{V_s - V_r}{V_r} \\times 100 = \\frac{\\sqrt{3} I(R\\cos\\theta + X\\sin\\theta)}{V_r} \\times 100$\n$= \\frac{\\sqrt{3} \\times 200(7.61 \\times 0.8 + 11.85 \\times 0.6)}{60,000} \\times 100 = 7.62[\\%]$","img":null,"expImg":null},{"id":29,"text":"$3$ 상 $1$ 회선 전선로에서 대지정전용량은 $C_s$ 이고 선간정전용량을 $C_m$ 이라 할 때, 작용정전용량 $C_n$ 은?","opts":["$C_s + C_m$","$C_s + 2C_m$","$C_s + 3C_m$","$2C_s + C_m$"],"answer":2,"exp":"$1$ 선당 작용 정전용량\n단상 $2$ 선식 : $C = C_s + 2C_m$\n$3$ 상 $3$ 선식 : $C = C_s + 3C_m$","img":null,"expImg":null},{"id":30,"text":"$\\%$ 임피던스에 대한 설명 중 옳은 것은?","opts":["터빈 발전기의 $\\%$ 임피던스는 수차의 $\\%$ 임피던스보다 작다.","전기기계의 $\\%$ 임피던스가 크면 차단용량이 작아지며 플리커현상이 심해진다.","$\\%$ 임피던스는 $\\%$ 리액턴스보다 작다.","직렬 리액터는 $\\%$ 임피던스를 크게 하여 차단기의 용량이 커지게 된다."],"answer":1,"exp":"터빈 발전기의 $\\%$ 임피던스는 수차의 $\\%$ 임피던스보다 크다.\n(터빈의 단락비는 수차의 단락비보다 작으며 단락비와 $\\%$ 임피던스는 반비례한다)\n차단용량 $P_s = \\frac{100}{\\%Z} P_n$, $P_s \\propto \\frac{1}{\\%Z}$\n$\\%Z > \\%X$\n직렬 리액터는 $\\%$ 임피던스를 크게 하여 차단기 용량을 감소시킨다.","img":null,"expImg":null},{"id":31,"text":"전력용 커패시터와 직렬로 연결하는 직렬리액터는 어떤 고조파를 제거하기 위해서 설치하는가?","opts":["제 $2$ 고조파","제 $3$ 고조파","제 $4$ 고조파","제 $5$ 고조파"],"answer":3,"exp":"직렬 리액터 : 제 $5$ 고조파를 제거하여 파형을 개선하기 위해 사용한다.","img":null,"expImg":null},{"id":32,"text":"전로에서 역률의 개선효과가 없는 것은?","opts":["분로리액터","전력용 커패시터","성형변압기","동기조상기"],"answer":2,"exp":"조상설비 : 무효전력조절(역률조정)","img":null,"expImg":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAFPAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooA xt{선식}}{\\text{3상 } 3\\text{선식}} = \\frac{\\frac{3}{8}}{\\frac{3}{4}} = \\frac{1}{2}$","img":null,"expImg":null},{"id":37,"text":"유효낙차 $50[\\mathrm{m}]$, 최대 사용 수량 $50[\\mathrm{m^3/s}]$, 수차 및 발전기의 합성효율이 $80[\\%]$ 인 수력발전소의 최대출력은 약 몇 $[\\mathrm{kW}]$ 인가?","opts":["$11,760$","$23,520$","$19,600$","$15,680$"],"answer":2,"exp":"수력발전소 출력 $P = 9.8 QH\\eta_t\\eta_g[\\mathrm{kW}]$\n$P = 9.8 \\times 50 \\times 50 \\times 0.8 = 19,600[\\mathrm{kW}]$\n","img":null,"expImg":null},{"id":38,"text":"$3,300/220[\\mathrm{V}]$ 의 단상 승압기를 그림과 같이 접속하여 $60[\\mathrm{kW}]$, 역률 $0.85$ 의 부하에 공급하는 전압을 상승시킬 경우 승압기의 용량은 약 몇 $[\\mathrm{kVA}]$ 인가?","opts":["$6$","$5$","$4$","$3$"],"answer":1,"exp":"승압기\n$\\frac{V_s}{V_r} = \\frac{n_1 + n_2}{n_1} = \\left(1 + \\frac{1}{a}\\right)$\n$V_s = \\left(1 + \\frac{1}{a}\\right)V_r = 3,000\\left(1 + \\frac{220}{3,300}\\right) = 3,200[\\mathrm{V}]$\n$\\frac{\\text{자기용량}}{\\text{부하용량}} = \\frac{e_2}{V_s} = \\frac{V_s - V_r}{V_s}$\n따라서 자기용량 $[\\mathrm{kVA}] =$ 부하용량 $[\\mathrm{kVA}] \\times \\frac{e_2}{V_s} = \\frac{60}{0.85} \\times \\frac{220}{3,200} = 4.85[\\mathrm{kVA}]$\n따라서 승압기의 자기용량은 $5[\\mathrm{kVA}]$ 로 정한다.","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAHAAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD mg":null},{"id":45,"text":"유도 발전기에 대한 설명으로 틀린 것은?","opts":["농형 회전자를 사용할 수 있으므로 구조가 간단하고 가격이 싸다.","선로에 단락이 생기면 여자가 없어지므로 동기 발전기에 비해 단락 전류가 적다.","공극이 크고 역률이 동기기에 비해 좋다.","유도 발전기는 여자기로서 동기 발전기가 필요하다."],"answer":2,"exp":"유도발전기\n\n고정자 권선을 전원에 연결하고 회전자를 원동기로 회전시키면 회전자 속도가 회전자계 속도( $N_s$ )보다 빠르게 회전하여 발전기로 동작\n\n슬립 $s = \\frac{n_s - n}{n_s}$ 에서 $n_s < n$ 인 경우 $s < 0$ (여기서, $n$ : 회전자 속도, $n_s$ : 회전자계 속도)\n문제에서, 유도 발전기는 동기기(동기기는 역률 $1$ 로 운전 가능)에 비하여 효율, 역률이 나쁘다.","img":null,"expImg":null},{"id":46,"text":"동기전동기의 특징으로 틀린 것은?","opts":["속도가 일정하다.","역률을 조정할 수 없다.","직류전원을 필요로 한다.","난조를 일으킬 염려가 있다."],"answer":1,"exp":"동기전동기의 특징","img":null,"expImg":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCACVAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD37xFq9poWjXGrXxkFvbqGfYu5sEgcDvya4Y/GbwfjITVCO3+jD/4qtn4ykj4a6wV6+Wn/AKMWvl8E9Oh+nFAH0E3xq8Jg8WmsMPUW6f8AxdNb42eFR92w1tjnoII//jlfPuOc5yeuT+FAOTk4P4YoA+gP+F3eGMf8grXf+/MP/wAdqN/jj4aXaf7F8QHPpDBx/wCRa8GLZfBKkjrgig/dGegFAHu4+OfhvZuOgeIh7eVb/wDx6mD47eHS2B4c8Sn/ALZ23/x+vCmYquPug8c85poO35sgcdRzQB7yPjp4cLAf8I/4j56/u7fj6/vqVfjp4dPXw94jHOP9Xb//AB6vBwxYZODilDAjHUjr7UAe8/8AC8vDn/QB8Q9evl2/H/kak/4Xn4e4/wCKf8Rf9+7f/wCPV4QHwMBxkdqVSR/F0HA9KAPeF+OXhxjj+w/EA57xwf8Ax2j/AIXl4b3Ef2H4g4OP9XB+f+trwgnacsMHpmk+csSCpxyDigD const title="23년 3회 산업기사 01~50";
let Q=QS,cur=0,score=0,round=1,ans=new Array(Q.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+Q.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=Q[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===Q.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+Q.length+(round>1?' · 오답 '+(round-1)+'차':'')+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===Q[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function wrongIdx(){
  const r=[];
  for(let i=0;i<Q.length;i++){ if(ans[i]===null||!ans[i].ok) r.push(i); }
  return r;
}
function result(){
  const total=Q.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100);
  const wrong=wrongIdx(),skipped=total-done,retryMode=round>1;
  const pass=pct>=60;
  const col=retryMode?(wrong.length===0?'#3fb950':'#58a6ff'):(pass?'#3fb950':'#f85149');
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  let rt,sub;
  if(retryMode){
    rt=wrong.length===0?'🎉 오답 정복 완료!':'📝 오답 재풀이 '+(round-1)+'차 결과';
    sub=total+'문제 중 '+score+'문제 정답'+(wrong.length?' · 아직 '+wrong.length+'문제 남았어요':'');
  } else {
    rt=pass?'🎉 합격!':'😥 불합격';
    sub=pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다';
  }
  let note='';
  if(wrong.length){
    note='<div class="res-note">다시 볼 문제: '+wrong.map(i=>'Q'+String(Q[i].id).padStart(2,'0')).join(' ')+(skipped?'<br>안 푼 문제 '+skipped+'개도 다시 풀기에 포함돼요':'')+'</div>';
  }
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+col+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+rt+'</div>'+
    '<div class="res-sub">'+sub+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div>'+note+
    (wrong.length?'<button class="retry wrong" onclick="retryWrong()">❌ '+(skipped?'오답·미풀이 ':'오답 ')+wrong.length+'문제만 다시 풀기</button>':'')+
    '<button class="retry'+(wrong.length?' sub':'')+'" onclick="restart()">🔄 '+(retryMode?'전체 문제 처음부터 다시 풀기':'처음부터 다시 풀기')+'</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function retryWrong(){
  const w=wrongIdx(); if(!w.length) return;
  Q=w.map(i=>Q[i]); round++;
  cur=0; score=0; ans=new Array(Q.length).fill(null); cache={}; render();
}
function restart(){Q=QS;round=1;cur=0;score=0;ans=new Array(Q.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/Q.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
