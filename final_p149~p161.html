<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title> 전기산업기사_파이널_149p~161p</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>

0 \\times 10^3}{2,000} = 5 [\\text{A}]$\n% 리액턴스 강하 $q = \\frac{I_n x_1}{V_{1n}} \\times 100 = \\frac{5 \\times 7}{2,000} \\times 100 = 1.75 [\\%]$","img":null,"expImg":null},{"id":12,"text":"$3,300/210 [\\text{V}], 5 [\\text{kVA}]$ 단상변압기의 퍼센트 저항강하는 $2.4 [\\%]$, 퍼센트 리액턴스강하는 $1.8 [\\%]$ 이다. 임피던스 와트 $[\\text{W}]$ 는?","opts":["90","120","240","320"],"answer":1,"exp":"저항강하 $p = \\frac{I_n r_1}{V_{1n}} \\times 100 = \\frac{I_n^2 r_1}{V_{1n} I_n} \\times 100 = \\frac{P_c}{P_n} \\times 100 [\\%]$\n동손(임피던스 와트) $P_c = \\frac{\\%p \\times P_n}{100} = \\frac{2.4 \\times 5 \\times 10^3}{100} = 120 [\\text{W}]$","img":null,"expImg":null},{"id":13,"text":"임피던스 전압강하 $4 [\\%]$ 의 변압기가 운전 중 단락되었을 때 단락전류는 정격전류의 몇 배가 흐르는가?","opts":["15","20","25","30"],"answer":2,"exp":"단락전류 $I_s = \\frac{100}{\\%Z} I_n = \\frac{100}{4} \\times I_n = 25 I_n$","img":null,"expImg":null},{"id":14,"text":"어떤 변압기의 백분율 저항 강하가 2 [%], 백분율 리액턴스 강하가 3 [%] 라 한다. 이 변압기로 역률이 80 [%] 인 부하에 전력을 공급하고 있다. 이 변압기의 전압변동률은 몇 [%] 인가?","opts":["2.4","3.4","3.8","4.0"],"answer":1,"exp":"$\\epsilon = \\frac{V_{2s} - V_2}{V_{2s}} \\times 100 = p \\cos \\theta \\pm q \\sin \\theta$ (지상 : $+$, 진상 : $-$)\n$= 2 \\times 0.8 + 3 \\times 0.6 = 3.4 [\\%]$","img":null,"expImg":null},{"id":15,"text":"변압기의 병렬운전 조건에 해당하지 않는 것은?","opts":["각 변압기의 극성이 같을 것","각 변압기의 정격출력이 같을 것","각 변압기의 백분율 임피던스 강하가 같을 것","각 변압기의 권수비가 같고 1차 및 2차의 정격전압이 같을 것"],"answer":1,"exp":"변압기 병렬운전 조건\n\n    극성, 권수비, 1, 2차 정격전압이 같을 것(용량은 무관)\n\n    각 변압기의 저항과 리액턴스의 비가 같을 것\n\n    내부저항과 리액턴스의 비가 같을 것","img":null,"expImg":null},{"id":16,"text":"3상-2상간 상수 변환이 가능한 변압기 결선 방식이 아닌 것은?","opts":["메이어 결선","우드브리지 결선","T결선","포크 결선"],"answer":3,"exp":"변압기 상수 변환법\n3상에서 2상변환 : scott 결선(=T결선), Meyer 결선, wood bridge 결선\n3상에서 6상변환 : Fork 결선, 2중 상형 환상 결선, 대각 결선, 2중 $\\Delta$ 결선","img":null,"expImg":null},{"id":17,"text":"단상변압기 2대를 사용하여 3,150 [V] 의 평형 3상에서 210 [V] 의 평형 2상으로 변환하는 경우에 각 변압기의 1차 전압과 2차 전압은 얼마인가?","opts":["주좌 변압기 : 1차 3,150 [V], 2차 210 [V], T좌 변압기 : 1차 3,150 [V], 2차 210 [V]","주좌 변압기 : 1차 3,150 [V], 2차 210 [V], T좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [V], 2차 210 [V]","주좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [V], 2차 210 [V], T좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [V], 2차 210 [V]","주좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [V], 2차 210 [V], T좌 변압기 : 1차 3,150 [V], 2차 210 [V]"],"answer":1,"exp":"스코트 결선(T결선) T좌 변압기의 권수비 : $a_T = \\frac{\\sqrt{3}}{2} a$\n주좌 변압기 : 1차 $3,150$ [V], 2차 210 [V]\nT좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [V], 2차 210 [V]","img":null,"expImg":null},{"id":18,"text":"$\\Delta$ 결선 변압기의 한 대가 고장으로 제거되어 V결선으로 공급할 때 공급할 수 있는 전력은 고장 전 전력에 대하여 몇 [%] 인가?","opts":["57.7","66.7","75.0","86.3"],"answer":0,"exp":"V결선 출력비 = $\\frac{\\text{V결선의 출력}}{\\Delta \\text{결선의 출력}} = \\frac{\\sqrt{3} K}{3K} = \\frac{\\sqrt{3}}{3} \\times 100 = 0.577 \\times 100 = 57.7 [\\%]$","img":null,"expImg":null},{"id":19,"text":"용량 1 [kVA], 3,000/220 [V] 의 단상변압기를 단권변압기로 연결해서 승압기로 사용할 때, 1차 측에 3,000 [V] 를 가할 경우 부하용량은 약 몇 [kVA] 인가?","opts":["1","10","15","16"],"answer":2,"exp":"승압된 전압 $V_h = V_l \\left( 1 + \\frac{e_2}{e_1} \\right) = 3,000 \\left( 1 + \\frac{220}{3,000} \\right) = 3,220$ [V]\n자기용량 $\\frac{e_2}{V_h} = \\frac{V_h - V_l}{V_h}$\n부하용량 = $\\frac{V_h}{e_2} \\times \\text{자기용량}$$= \\frac{3,220}{220} \\times 1 = 14.64$ [kVA]","img":null,"expImg":null},{"id":20,"text":"와전류손을 줄이기 위한 대책으로 틀린 것은?","opts":["고유 저항이 높은 철심을 사용한다.","자속밀도를 낮게 한다.","주파수를 크게 한다.","철판 두께를 얇게 한다."],"answer":2,"exp":"와류손 $P_e = \\sigma_e (t \\cdot f \\cdot K_f \\cdot B_m)^2$ 여기서, $t$ : 철심의 두께, $K_f$ 는 파형률\n와류손은 주파수에 비례하므로, 와류손을 줄이려면 주파수를 작게 해야 한다.","img":null,"expImg":null},{"id":21,"text":"변압기의 표유 부하손이란?","opts":["부하전류 중 누전에 의한 손실","무부하시 여자전류에 의한 동손","누설자속에 의하여 외함, 기타 철물에 생기는 손실","1차, 2차 권선 간의 누설자속에 의하여 생기는 손실"],"answer":2,"exp":"변압기의 부하손\n\n    동손 : 권선에 의한 손실\n\n    표유 부하손 : 권선 이외 부분의 누설자속에 의한 손실","img":null,"expImg":null},{"id":22,"text":"변압기의 부하가 증가할 때의 현상으로서 틀린 것은?","opts":["동손이 증가한다.","온도가 상승한다.","철손이 증가한다.","여자전류는 변함없다."],"answer":2,"exp":"변압기의 손실\n\n    부하손 : 동손\n\n    무부하손 : 철손(히스테리시스손 + 와류손)\n    부하가 증가하면 동손은 증가하지만 철손은 무부하이므로 변함없다.","img":null,"expImg":null},{"id":23,"text":"용량 150 [kVA] 의 단상 변압기의 철손이 1 [kW], 전부하 동손이 4 [kW] 이다. 이 변압기의 최대효율은 몇 [kVA] 에서 나타나는가?","opts":["50","75","100","150"],"answer":1,"exp":"$\\frac{1}{m}$ 부하의 경우 최대 효율이 된다고 하면 $\\left( \\frac{1}{m} \\right)^2 P_c = P_i$\n$\\therefore \\frac{1}{m} = \\sqrt{\\frac{P_i}{P_c}} = \\sqrt{\\frac{1}{4}} = \\frac{1}{2}$ 이므로\n변압기의 최대효율이 걸리는 부하는 $150 \\times \\frac{1}{2} = 75$ [kVA]","img":null,"expImg":null},{"id":24,"text":"변압기의 내부고장으로 압력이 증가할 때 동작하는 계전기로서 가장 적당한 것은?","opts":["과전류 계전기","과전압 계전기","비율차동 계전기","부흐홀츠 계전기"],"answer":3,"exp":"변압기 내부 고장 보호용\n\n    전기적인 보호 : 비율 차동 계전기\n\n    기계적인 보호 : 부흐홀츠 계전기, 유온계(온도 계전기), 유위계, 충격압력 계전기","img":null,"expImg":null},{"id":25,"text":"변압기 온도시험을 하는 데 가장 좋은 방법은?","opts":["실 부하법","반환 부하법","단락 시험법","내전압 시험법"],"answer":1,"exp":"변압기 온도시험\n\n    실 부하법\n\n    반환 부하법 : 일반적인 방법(효율 우수), 홉킨스법, 블론델법, 카프법","img":null,"expImg":null},{"id":26,"text":"주상 변압기의 고압측에 설치하는 탭의 용도는?","opts":["단차고장의 예비","선로의 역률개선","선로전류의 조정","선로전압조정"],"answer":3,"exp":"변압기 탭(tap)조정\n\n    변압기 2차 측의 전압조정을 위하여 1차측 탭을 조정","img":null,"expImg":null},{"id":27,"text":"변압기의 정격을 정의한 것 중 옳은 것은?","opts":["전부하의 경우 1차 단자전압을 정격 1차 전압이라 한다.","정격 2차 전압은 명판에 기재되어 있는 2차 권선의 단자 전압이다.","정격 2차 전압을 2차 권선의 저항으로 나눈 것이 정격 2차 전류이다.","2차 단자 간에서 얻을 수 있는 유효전력을 [kW] 로 표시한 것이 정격출력이다."],"answer":1,"exp":"변압기의 정격 : 변압기 명판에 기재되어 있는 사항","img":null,"expImg":null},{"id":28,"text":"유도전동기 슬립 $s$ 의 범위는?","opts":["$1 < s$","$s < -1$","$-1 < s < 0$","$0 < s < 1$"],"answer":3,"exp":"슬립 $s = \\frac{N_s - N}{N_s}$\n$0 < s < 1$ : 유도 전동기\n$1 < s < 2$ : 유도 제동기\n$s < 0$ : 유도 발전기(비돌기 발전기)","img":null,"expImg":null},{"id":29,"text":"주파수 60 [Hz], 슬립 3 [%], 회전수 1,164 [rpm] 인 유도전동기의 극수는?","opts":["4","6","8","10"],"answer":1,"exp":"회전자 속도 $N = (1 - s) N_s$ 에서 고정자 속도 $N_s = \\frac{N}{1 - s} = \\frac{1,164}{1 - 0.03} = 1,200$ [rpm]\n$N_s = \\frac{120 f}{p}$ 에서 극수 $p = \\frac{120 f}{N_s} = \\frac{120 \\times 60}{1,200} = 6$","img":null,"expImg":null},{"id":30,"text":"60 [Hz], 4극 유도전동기의 슬립이 4 [%] 인 때의 회전수 [rpm] 는?","opts":["1,728","1,738","1,748","1,758"],"answer":0,"exp":"고정자 속도 $N_s = \\frac{120 f}{p} = \\frac{120 \\times 60}{4} = 1,800$ [rpm]\n회전자 속도 $N = (1 - s) N_s$ 에서\n$N = (1 - 0.04) \\times 1,800 = 1,728$ [rpm]","img":null,"expImg":null},{"id":31,"text":"4극 3상 유도전동기를 60 [Hz] 의 전원에 접속하여 운전하고 있다. 회전자의 주파수가 3 [Hz] 일 때 회전자 속도 [rpm] 는?","opts":["1,700","1,710","1,720","1,730"],"answer":1,"exp":"회전 시 주파수 $f_2 = s f_1$ 에서 슬립 $s = \\frac{f_2}{f_1} = \\frac{3}{60} = 0.05$\n$N = (1 - s) N_s = (1 - s) \\frac{120 f}{p} = (1 - 0.05) \\times \\frac{120 \\times 60}{4} = 1,710$ [rpm]","img":null,"expImg":null},{"id":32,"text":"슬립이 5 [%] 인 유도전동기의 등가 부하저항은 2차 저항의 몇 배인가?","opts":["36","25","19","20"],"answer":2,"exp":"등가저항 $R' = \\frac{1 - s}{s} r_2' = \\frac{1 - 0.05}{0.05} \\times r_2' = 19 [\\Omega]$","img":null,"expImg":null},{"id":33,"text":"3상 유도전동기의 슬립이 $s$, 2차 입력이 $P_2$ 일 때 2차 동손은?","opts":["$\\frac{P_2}{s}$","$s P_2$","$\\frac{(1 - s) P_2}{s}$","$(1 - s) P_2$"],"answer":1,"exp":"2차 동손 $P_{c2} = s P_2$","img":null,"expImg":null},{"id":34,"text":"220 [V], 60 [Hz], 8극, 15 [kW] 의 3상 유도전동기에서 전부하 회전수가 864 [rpm] 이면 이 전동기의 2차 동손은 몇 [W] 인가?","opts":["435","537","625","723"],"answer":2,"exp":"고정자 속도 $N_s = \\frac{120 f}{p} = \\frac{120 \\times 60}{8} = 900$ [rpm]\n슬립 $s = \\frac{N_s - N}{N_s} = \\frac{900 - 864}{900} = 0.04$$P_2 = (1 - s) P_o$ 에서 $P_o = \\frac{P_2}{1 - s}$\n2차 동손 $P_{c2} = s P_2$ 이므로\n따라서 2차 동손 $P_{c2} = \\frac{s}{1 - s} P_o = \\frac{0.04}{1 - 0.04} \\times 15,000 = 625$ [W]","img":null,"expImg":null},{"id":35,"text":"220 [V] 3상 유도전동기의 전부하 슬립이 4 [%] 이다. 공급 전압이 10 [%] 저하된 경우의 전부하 슬립은?","opts":["4 [%]","5 [%]","6 [%]","7 [%]"],"answer":1,"exp":"슬립과 전압과의 관계 $s \\propto \\frac{1}{V^2}$\n$s \\propto \\frac{1}{V^2}$$s' = s \\times \\left( \\frac{V}{V'} \\right)^2 = s \\times \\left( \\frac{V}{1 \\times 0.9} \\right)^2 = 0.04 \\times \\left( \\frac{220}{220 \\times 0.9} \\right)^2 = 0.05 = 5 [\\%]$","img":null,"expImg":null},{"id":36,"text":"3상 유도전동기의 운전 중 전압을 80 [%] 로 낮추면 부하 회전력은 몇 [%] 로 감소되는가?","opts":["94","80","72","64"],"answer":3,"exp":"유도전동기의 토크는 전압의 제곱에 비례 : $T \\propto V^2$\n$T \\propto V^2$$T' \\propto (0.8)^2 = 0.64 T$","img":null,"expImg":null},{"id":37,"text":"유도전동기를 6극에서 운전할 때 토크를 $\\tau$ 라 하면 12극으로 운전할 때의 토크( $\\tau$ )는?","opts":["$\\tau$","$2\\tau$","$0.5\\tau$","$4\\tau$"],"answer":1,"exp":"$N_s = \\frac{120 f}{p}$$\\tau = 0.975 \\times \\frac{P_2}{N_s} = 0.975 \\times \\frac{P_2}{\\frac{120 f}{p}}$ 이므로 $\\tau \\propto p$\n토크는 극수에 비례하므로 극수가 2배가 되면 토크도 2배가 된다.","img":null,"expImg":null},{"id":38,"text":"3상 유도전동기의 전원주파수와 전압의 비가 일정하고 정격속도 이하로 속도를 제어하는 경우 전동기의 출력 $P$ 와 주파수 $f$ 와의 관계는?","opts":["$P \\propto f$","$P \\propto \\frac{1}{f}$","$P \\propto f^2$","$P$ 는 $f$ 에 무관"],"answer":0,"exp":"유도전동기 토크 $T = \\frac{P_o}{\\omega} = \\frac{P_o}{\\frac{2\\pi}{60} N} = \\frac{P_o}{\\frac{2\\pi}{60} (1 - s) N_s} = \\frac{P_o}{(1 - s) \\frac{2\\pi}{60} \\times \\frac{120}{p} f}$\n$= \\frac{P_o}{(1 - s) \\frac{4\\pi f}{p}} [\\text{N}\\cdot\\text{m}] = 0.975 \\frac{P_o}{N} [\\text{kg}\\cdot\\text{m}]$\n출력 $P_o = (1 - s) \\frac{4\\pi f}{p} T$ 이므로 $P \\propto f$","img":null,"expImg":null},{"id":39,"text":"4극 60 [Hz] 인 3상 유도전동기가 있다. 2차 1상의 저항을 $0.15 [\\Omega]$, 전동기 정지 시 2차 1상의 리액턴스를 $0.5 [\\Omega]$ 이라 한다면 이 유도전동기가 최대토크를 발생하게 되는 회전속도 [rpm] 는?","opts":["1,260","1,345","1,475","1,420"],"answer":0,"exp":"최대 토크를 발생하는 슬립 $s_m = \\frac{r_2'}{\\sqrt{r_1^2 + (x_1 + x_2')^2}} = \\frac{r_2}{x_2} = \\frac{0.15}{0.5} = 0.3$\n회전속도 $N = (1 - s_m) N_s = (1 - 0.3) \\times \\frac{120 \\times 60}{4} = 1,260$ [rpm]","img":null,"expImg":null},{"id":40,"text":"3상 유도전동기의 2차 저항을 $n$ 배로 하면 동일하게 $n$ 배로 되는 것은?","opts":["역률","전류","슬립","토크"],"answer":2,"exp":"비례추의 원리 : 권선형 유도전동기\n\n    최대 토크는 불변, 최대 토크의 발생 슬립은 변화\n    (2차 저항이 증가하면 토크 곡선 등이 슬립이 증가하는 방향으로 2차 저항에 비례하여 이동)\n\n    기동 전류는 감소하고, 기동 토크는 증가\n$\\frac{r_2}{s} = \\frac{r_2 + R}{s'}$","img":null,"expImg":null},{"id":41,"text":"권선형 유도전동기에서 2차 저항을 변화시켜서 속도제어를 하는 경우 최대 토크는?","opts":["항상 일정하다.","2차 저항에만 비례한다.","최대 토크가 생기는 점의 슬립에 비례한다.","최대 토크가 생기는 점의 슬립에 반비례한다."],"answer":0,"exp":"비례추의 원리 : 권선형 유도전동기\n\n    최대 토크는 불변\n\n    기동 전류는 감소하고, 기동 토크는 증가\n$\\frac{r_2}{s} = \\frac{r_2 + R}{s'}$","img":null,"expImg":null},{"id":42,"text":"3상 유도전동기의 원선도 작성에 필요한 기본량이 아닌 것은?","opts":["저항 측정","슬립 측정","구속 시험","무부하 시험"],"answer":1,"exp":"유도전동기 원선도\n\n    저항측정\n\n    무부하(개방) 시험\n\n    구속(단락) 시험","img":null,"expImg":null},{"id":43,"text":"유도 전동기 원선도에서 원의 지름은? (단, $E$ 를 1차 전압, $r_1$ 은 1차로 환산한 저항, $x$ 를 1차로 환산한 누설 리액턴스라 한다)","opts":["$r$ 에 비례","$r$ 에 비례","$\\frac{E}{r}$ 에 비례","$\\frac{E}{x}$ 에 비례"],"answer":3,"exp":"유도전동기 원선도 : 전류에 의한 궤적\n$I_{2s} = \\frac{E_{2s}}{Z_{2s}} = \\frac{s E_2}{r_2 + j s x_2} = \\frac{E_2}{\\sqrt{\\left( \\frac{r_2}{s} \\right)^2 + x_2^2}} \\fallingdotseq \\frac{E_2}{x_2} \\quad \\therefore \\text{지름}$\n지름 $\\propto \\frac{E}{x}$","img":null,"expImg":null},{"id":44,"text":"3상 유도전동기를 가동할 때 슬롯수가 적당하지 않을 때 발생되는 기자력의 고조파 성분에 의해 발생되는 현상은?","opts":["크롤링 현상","게르제스 현상","토크 증가 현상","제동 토크의 증가 현상"],"answer":0,"exp":"크롤링 현상\n3상 유도전동기에서 고조파에 의해 기동 시 낮은 속도의 어느 점에서 회전자가 걸려 안정되게 되어 더 이상 가속이 되지 않는 현상을 크롤링(Crawling)이라고 한다. 주로 슬롯수가 적고 용량이 낮은 농형유도전동기에서 발생하기 쉬우며, 사구 슬롯수를 사용하여 예방할 수 있다.","img":null,"expImg":null}];
const title=" 전기산업기사_파이널_149p~161p";
let cur=0,score=0,ans=new Array(QS.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+QS.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=QS[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===QS.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+QS.length+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===QS[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(QS.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function result(){
  const total=QS.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100),pass=pct>=60;
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+(pass?'#3fb950':'#f85149')+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+(pass?'#3fb950':'#f85149')+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+(pass?'🎉 합격!':'😥 불합격')+'</div>'+
    '<div class="res-sub">'+(pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다')+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div><button class="retry" onclick="restart()">🔄 다시 풀기</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function restart(){cur=0;score=0;ans=new Array(QS.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/QS.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
