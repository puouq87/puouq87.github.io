<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title> 전기산업기사_파이널_115p~130p</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>

"],"answer":2,"exp":"유량 $Q [\\text{m}^3/\\text{sec}] = A [\\text{m}^2] \\times v [\\text{m/sec}]$\n$Q = A v = \\pi r^2 v = \\pi \\left( \\frac{D}{2} \\right)^2 v = \\frac{\\pi}{4} D^2 \\cdot v [\\text{m}^3/\\text{s}]$","img":null,"expImg":null},{"id":9,"text":"저수지에서 취수구에 제수문을 설치하는 목적은?","opts":["낙차를 높인다.","어족을 보호한다.","수차를 조절한다.","유량을 조절한다."],"answer":3,"exp":"제수문의 설치 목적 : 취수구에 설치하여 유량을 조절하기 위함","img":null,"expImg":null},{"id":10,"text":"수력발전소에서 조압수조를 설치하는 목적은?","opts":["토사의 제거","유량의 조절","수격작용의 완화","부유물의 제거"],"answer":2,"exp":"조압 수조(surge tank)\n부하 변동 시 수압(수격작용)을 완화시켜 수압 철관을 보호하기 위한 수조","img":null,"expImg":null},{"id":11,"text":"반동수차의 일종으로 주요부분은 러너, 안내날개, 스피드링 및 흡출관 등으로 되어 있으며 $50 \\sim 500 [\\text{m}]$ 정도의 중낙차 발전소에 사용되는 수차는?","opts":["카플란 수차","프란시스 수차","펠턴 수차","튜블러 수차"],"answer":1,"exp":"프란시스(Francis) 수차\n\n    대표적인 반동수차\n\n    유지보수가 용이하고 공사비가 저렴\n\n    중낙차에 사용","img":null,"expImg":null},{"id":12,"text":"다음 중 특유 속도가 가장 작은 수차는?","opts":["프로펠러 수차","프란시스 수차","펠턴 수차","카플란 수차"],"answer":2,"exp":"특유 속도는 $N_s = N \\frac{\\sqrt{P}}{H^{\\frac{5}{4}}}$ 이며( $N$ : 회전속도, $P$ : 출력, $H$ : 낙차)\n따라서 낙차가 높을수록 특유 속도는 낮으며\n펠턴 수차가 낙차가 가장 높으므로 특유 속도가 최소가 된다.","img":null,"expImg":null},{"id":13,"text":"$1 [\\text{BTU}]$ 는 몇 $[\\text{cal}]$ 인가?","opts":["232","242","252","262"],"answer":2,"exp":"$1 [\\text{J}] = 0.24 [\\text{kcal}]$\n$1 [\\text{kWh}] = 860 [\\text{kcal}]$\n$1 [\\text{BTU}] = 0.252 [\\text{kcal}] = 252 [\\text{cal}]$\n여기서, $[\\text{BTU}]$ 는 British Thermal Unit으로 질량 1파운드의 물을 $1 [\\text{atm}]$ 하에 $60.5 [^\\circ\\text{F}]$ 에서 $61.5 [^\\circ\\text{F}]$ 까지 온도를 올리는데 필요한 열량","img":null,"expImg":null},{"id":14,"text":"그림과 같은 열 사이클의 명칭은?","opts":["랭킨 사이클","재생 사이클","재열 사이클","재생재열 사이클"],"answer":1,"exp":"재생 사이클 : 단열 팽창도중 증기의 일부를 추기하여 보일러 급수를 가열하여 복수 열손실을 회수하는 사이클로서 급수 가열기가 있는 시스템\n\n재열 사이클 : 고압 터빈을 돌리고 나온 증기를 전부 추출해서 보일러의 재열기로 증기를 다시 최초의 과열 증기 온도 부근까지 가열시켜서 터빈 저압단에 공급하는 것으로 재열기가 있는 시스템\n\n재생재열 사이클 : 재생 사이클과 재열 사이클의 결합(재열기+급수 가열기)","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQA 향은?","opts":["계자 전류의 방향과 같다.","계자 전류의 방향과 반대이다.","전기자 전류의 방향과 같다.","전기자 전류의 방향과 반대이다."],"answer":3,"exp":"보상권선의 전류 방향 : 전기자 전류의 방향과 반대","img":null,"expImg":null},{"id":27,"text":"직류기에서 양호한 정류를 얻는 조건으로 틀린 것은?","opts":["정류 주기를 크게 한다.","브러시의 접촉 저항을 크게 한다.","전기자 권선의 인덕턴스를 작게 한다.","평균 리액턴스 전압을 브러시 접촉면 전압 강하보다 크게 한다."],"answer":3,"exp":"양호한 정류를 얻는 방법\n\n    보극 설치\n\n    접촉저항이 큰 탄소 브러시 사용\n\n    리액턴스 전압을 적게 한다(평균 리액턴스전압 < 브러시 접촉전압 강하).\n\n    인덕턴스를 작게 한다.\n\n    정류 주기를 길게 한다.","img":null,"expImg":null},{"id":28,"text":"$10$ 극인 직류 발전기의 전기자 도체수가 $600$, 단중 파권이고 매극의 자속수가 $0.01 [\\text{Wb}]$, $600 [\\text{rpm}]$ 일 때의 유도기전력 $[V]$ 은?","opts":["150","200","250","300"],"answer":3,"exp":"직류 발전기 유기기전력 $E = \\frac{P}{a} Z \\Phi \\frac{N}{60}$\n$E = \\frac{P}{a} \\frac{N}{60} Z \\Phi = \\frac{10}{2} \\times \\frac{600}{60} \\times 0.01 \\times \\frac{600}{60} = 300 [V]$","img":null,"expImg":null},{"id":29,"text":"포화하고 있지 않은 직류발전기의 회전수가 $1/2$ 로 감소되었을 때 기전력을 속도 변화 전과 같은 값으로 하려면 여자러뉴를 전과 비교하여 얼마로 해야 하는가?","opts":["1배","2배","4배","8배"],"answer":1,"exp":"직류발전기 유기기전력 $E = K \\Phi N$ 에서\n기전력이 일정하므로 회전수가 $\\frac{1}{2}$ 로 되면, 여자전류(자속) $\\Phi$ 가 2배가 되어야 한다.","img":null,"expImg":null},{"id":30,"text":"자여자 발전기의 전압확립 조건으로 틀린 것은?","opts":["회전방향에 무관할 것","무부하 포화곡선은 자기포화를 가질 것","잔류자기가 존재할 것","계자저항이 임계저항 이하일 것"],"answer":0,"exp":"자여자 발전기 전압확립 조건\n\n    무부하 포화곡선은 자기포화를 가질 것\n\n    잔류자기가 존재할 것\n\n    계자저항이 임계저항 이하일 것","img":null,"expImg":null},{"id":31,"text":"단자전압 $220 [\\text{V}]$, 부하전류 $48 [\\text{A}]$, 계자전류 $2 [\\text{A}]$, 전기자 저항 $0.2 [\\Omega]$ 인 직류 분권발전기의 유도기전력 $[V]$ 은?(단, 전기자 반작용은 무시한다)","opts":["210","220","230","240"],"answer":2,"exp":"분권발전기 $I_a = I + I_f = 48 + 2 = 50$\n유기기전력 $E = V + I_a R_a = 220 + 50 \\times 0.2 = 230 [\\text{V}]$","img":null,"expImg":null},{"id":32,"text":"유도기전력 $210 [\\text{V}]$, 단자전압 $200 [\\text{V}]$ 인 $10 [\\text{kW}]$ 의 분권발전기가 있다. 계자저항이 $50 [\\Omega]$ 이면 전기자 저항은 몇 $[\\Omega]$ 인가?","opts":["$0.12$","$0.19$","$0.22$","$0.35$"],"answer":1,"exp":"분권 발전기 $I_a = I + I_f = \\frac{P}{V} + \\frac{V}{R_f} = \\frac{10 \\times 10^3}{200} + \\frac{200}{50} = 54 [\\text{A}]$\n유기기전력 $E = V + I_a R_a$\n전기자 저항 $R_a = \\frac{E - V}{I_a} = \\frac{210 - 200}{54} = 0.19 [\\Omega]$","img":null,"expImg":null},{"id":33,"text":"직류기에서 전압변동률이 $(-)$ 로 표시되는 발전기는?","opts":["분권발전기","평복권발전기","과복권발전기","타여자발전기"],"answer":2,"exp":"전압변동률 $\\varepsilon = \\frac{V_0 - V}{V} \\times 100 = \\frac{E - V}{V} \\times 100 = \\frac{I_a R_a}{V} \\times 100 [\\%]$ 에서\n$\\varepsilon (+)$ : 분권, 타여자 발전기( $V_0 > V$ )\n$\\varepsilon (0)$ : 평복권( $V_0 = V$ : 무부하 전압=정격전압)\n$\\varepsilon (-)$ : 과복권 발전기( $V_0 < V$ )","img":null,"expImg":null},{"id":34,"text":"그림은 복권발전기의 외부특성곡선이다. 이 중 과복권을 나타내는 곡선은?","opts":["A","B","C","D"],"answer":0,"exp":"과복권 발전기 : 직권계자의 기자력을 크게 하여 유도기전력이 전기자 내부의 전압강하보다 크도록 설계하여 전부하전압이 무부하전압보다 크게 하는 특성(그림에서 A)","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAJkAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LHSiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooo const title=" 전기산업기사_파이널_115p~130p";
let cur=0,score=0,ans=new Array(QS.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+QS.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=QS[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===QS.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+QS.length+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===QS[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(QS.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function result(){
  const total=QS.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100),pass=pct>=60;
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+(pass?'#3fb950':'#f85149')+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+(pass?'#3fb950':'#f85149')+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+(pass?'🎉 합격!':'😥 불합격')+'</div>'+
    '<div class="res-sub">'+(pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다')+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div><button class="retry" onclick="restart()">🔄 다시 풀기</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function restart(){cur=0;score=0;ans=new Array(QS.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/QS.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
