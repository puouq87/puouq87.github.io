 var ri=h('input',{class:'term',readonly:'readonly',value:F.cr||'',placeholder:'자동 계산','aria-label':'계산 결과'});
 function recalc(){var r=evalExpr(F.cn,pv)/evalExpr(F.cd,pv);F.cr=isFinite(r)?r.toFixed(dec):'';ri.value=F.cr}
 out.push(h('div',{class:'fx'},h('b',{},'계산 :'),
  fraction([iw(cin(F.cn,'분자 식',function(v){F.cn=v;recalc()}),'cn')],[iw(cin(F.cd,'분모 식',function(v){F.cd=v;recalc()}),'cd')],'wide'),
  '=',iw(ri,'cr'),ut),
  palette((q.syms||'').split(/\s+/).filter(Boolean)));
 if(q.piVal&&(q.ansNum+q.ansDen).indexOf('π')>=0)out.push(h('div',{class:'pihint'},'※ π = '+q.piVal+' 로 계산'));
 if(showKey)out.push(h('div',{class:'fx key'},'정답 :',fraction([q.ansNum.replace(/\*/g,'×')],[q.ansDen.replace(/\*/g,'×')]),'= '+(evalExpr(q.ansNum,pv)/evalExpr(q.ansDen,pv)).toFixed(dec)+(ut?' '+ut:'')));
 var tb=String(q.table||'').split(/[\s,]+/).filter(Boolean),si;
 if(tb.length){
  si=h('input',{class:'term',readonly:'readonly',value:F.cs||'',placeholder:'표에서 선택','aria-label':'선정 값'});
  var cells=tb.map(function(v){return h('button',{type:'button',class:'tc'+(F.cs===v?' sel':''),onclick:function(){F.cs=v;si.value=v;cells.forEach(function(c,i){c.className='tc'+(tb[i]===F.cs?' sel':'')})}},v)});
  out.push(h('div',{class:'ttab'},h('div',{class:'cap'},(q.tableTitle||'선정 표')+(su?' '+su:'')),h('div',{class:'cells'},cells)));
 }else si=cin(F.cs,'',function(v){F.cs=v},'term');
 out.push(h('div',{class:'fx'},h('b',{},'답 :'),iw(si,'cs'),su));
 if(showKey)out.push(h('div',{class:'key'},'정답: '+q.sel+(su?' '+su:'')))}
function calcCard(p){
 var out=[p.banner&&h('div',{class:'banner'},p.banner),p.text&&h('p',{class:'ins'},p.text),p.note&&h('p',{class:'note'},p.note),
  p.img&&h('img',{class:'pimg',src:p.img,style:'max-width:'+(p.imgW||70)+'%'})],pts=0,max=0;
 partsOf(p).forEach(function(q,i){var F=ans[keyOf(p,i)],g=graded?gradePart(q,F):null;partUI(q,F,g,out,p.type==='light');if(g){pts+=g.pts;max+=g.max}});
 if(graded)out.push(h('div',{class:'score'},'점수 '+pts+' / '+max));
 return h('section',{class:'card q'},out)}
function hiAnswer(e){var o=[];String(e).split(/(\[[^\]]+\])/).forEach(function(t){if(/^\[[^\]]+\]$/.test(t))o.push(h('b',{},t.slice(1,-1).split('|').join('/')));else if(t)o.push(t)});return o}
function textPart(p,q,F,g,out){
 var kw=modeOf(p,q)==='kw',n=q.answers.length,slots=h('div',{class:'slots'},q.answers.map(function(_,j){
  var inp=h(kw?'textarea':'input',{value:(F.a&&F.a[j])||'',rows:kw?2:null,'aria-label':'답 '+(j+1),placeholder:n>1?'답 '+(j+1):'답',oninput:function(e){F.a[j]=e.target.value}});
  var box=h('div',{class:'slot'},inp);
  if(g){var ok=g.ok[j];inp.className=ok?'ok':'ng';
   box.append(h('span',{class:'mark '+(ok?'okm':'ngm')},ok?'✓':'✗'),h('button',{type:'button',class:'x',onclick:function(){F.ov[j]=!ok;render()}},ok?'틀림으로 변경':'맞음으로 변경'))}
  return box}));
 var key=showKey?h('div',{class:'key'},'정답: ',q.answers.map(function(a,j){return h('div',{},n>1?(j+1)+') ':'',kw?hiAnswer(a):a)})):null;
 if(p.type==='spec'){
  if(q.img)out.push(h('img',{class:'pimg',src:q.img,style:'max-width:'+(q.imgW||70)+'%'}));
  out.push(h('div',{class:'pair'},h('div',{class:'k kk'},(q.title?q.title+' ':'')+q.label),h('div',{class:'r'},slots,key)));
 }else{
  if(q.title)out.push(h('h3',{class:'pt'},q.title));
  if(q.img)out.push(h('img',{class:'pimg',src:q.img,style:'max-width:'+(q.imgW||70)+'%'}));
  if(q.desc)out.push(h('p',{class:'ins'},q.desc));
  out.push(slots);if(key)out.push(key)}}
function textCard(p){
 var out=[p.banner&&h('div',{class:'banner'},p.banner),p.text&&h('p',{class:'ins'},p.text),p.note&&h('p',{class:'note'},p.note),
  p.img&&h('img',{class:'pimg',src:p.img,style:'max-width:'+(p.imgW||70)+'%'})],pts=0,max=0;
 p.parts.forEach(function(q,i){var F=ans[p.id+':'+i],g=graded?gradeText(p,q,F):null;textPart(p,q,F,g,out);if(g){pts+=g.pts;max+=g.max}});
 if(graded)out.push(h('div',{class:'score'},'점수 '+pts+' / '+max));
 return h('section',{class:'card q'},out)}
function render(){app.innerHTML='';
 P.forEach(function(p,i){app.append(isCalc(p)?calcCard(p):isText(p)?textCard(p):matchCard(p,i))});
 dock.innerHTML='';var tot='';
 if(graded){var a=0,b=0;P.forEach(function(p){var r=gradeAny(p);a+=r[0];b+=r[1]});tot='합계 '+a+' / '+b}
 dock.append(h('div',{class:'in'},
  h('button',{class:'pri',onclick:function(){graded=true;render()}},'채점'),
  graded&&h('button',{onclick:function(){showKey=!showKey;render()}},showKey?'정답지 숨기기':'정답지 보기'),
  h('span',{class:'tot'},tot),h('button',{onclick:start},'다시 풀기')))}
