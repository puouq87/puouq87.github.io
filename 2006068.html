<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>전기기능사 CBT 편집기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface2: #f8f9fa;
  --border: #dee2e6;
  --accent: #2563eb;
  --accent-light: #eff6ff;
  --ok: #16a34a;
  --ok-light: #f0fdf4;
  --danger: #dc2626;
  --text: #111827;
  --text2: #6b7280;
  --text3: #9ca3af;
  --radius: 10px;
  --shadow: 0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Noto Sans KR', sans-serif; min-height: 100vh; }

/* ── HEADER ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 32px;
  height: 60px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,.06);
}
.header-left { display: flex; align-items: center; gap: 14px; }
.logo { font-size: 18px; font-weight: 900; color: var(--accent); letter-spacing: -0.5px; }
.exam-title-input {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 14px; font-size: 14px; font-family: inherit;
  color: var(--text); background: var(--surface2);
  width: 260px; outline: none;
  transition: border-color .15s;
}
.exam-title-input:focus { border-color: var(--accent); background: #fff; }
.header-right { display: flex; gap: 10px; align-items: center; }
.btn {
  padding: 8px 18px; border-radius: 8px; border: none;
  font-family: inherit; font-size: 13px; font-weight: 700;
  cursor: pointer; transition: all .15s; white-space: nowrap;
}
.btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: var(--border); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-success { background: var(--ok); color: #fff; font-size: 14px; padding: 9px 22px; }
.btn-success:hover { background: #15803d; }
.q-count { font-size: 13px; color: var(--text2); font-family: 'JetBrains Mono'; }

/* ── LAYOUT ── */
.container { display: flex; height: calc(100vh - 60px); }

/* ── SIDEBAR ── */
.sidebar {
  width: 200px; flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto; padding: 16px 10px;
}
.sidebar-title { font-size: 11px; font-weight: 700; color: var(--text3); letter-spacing: 1px; padding: 0 6px 10px; }
.q-btn {
  width: 100%; padding: 8px 10px; border-radius: 8px;
  border: none; background: none; cursor: pointer;
  font-family: inherit; font-size: 13px; text-align: left;
  display: flex; align-items: center; gap: 8px;
  color: var(--text2); transition: all .12s; margin-bottom: 2px;
}
.q-btn:hover { background: var(--surface2); color: var(--text); }
.q-btn.active { background: var(--accent-light); color: var(--accent); font-weight: 700; }
.q-btn.done { color: var(--ok); }
.q-btn.done .q-dot { background: var(--ok); }
.q-btn.active .q-dot { background: var(--accent); }
.q-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); flex-shrink: 0; }
.add-q-btn {
  width: 100%; margin-top: 10px; padding: 9px;
  border-radius: 8px; border: 1px dashed var(--border);
  background: none; cursor: pointer; font-family: inherit;
  font-size: 13px; color: var(--text3); transition: all .15s;
}
.add-q-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

/* ── EDITOR ── */
.editor { flex: 1; overflow-y: auto; padding: 28px 32px; }
.editor-card {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 28px 32px; max-width: 760px; margin: 0 auto 20px;
  box-shadow: var(--shadow);
}
.card-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.card-qnum { font-size: 13px; font-weight: 700; color: var(--accent); font-family: 'JetBrains Mono'; }
.card-del { background: none; border: none; cursor: pointer; color: var(--text3); font-size: 18px; padding: 2px 6px; border-radius: 4px; transition: all .12s; }
.card-del:hover { background: #fef2f2; color: var(--danger); }

.field-label { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.5px; }
.field { margin-bottom: 16px; }

textarea, input[type=text] {
  width: 100%; border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 14px; font-size: 14px; font-family: inherit;
  color: var(--text); background: var(--surface2);
  outline: none; transition: border-color .15s;
  resize: vertical;
}
textarea:focus, input[type=text]:focus { border-color: var(--accent); background: #fff; }
.q-text-area { min-height: 80px; }
.exp-area { min-height: 60px; }

/* 선택지 */
.opts-grid { display: flex; flex-direction: column; gap: 8px; }
.opt-row { display: flex; align-items: center; gap: 10px; }
.opt-label-num {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--surface2); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; flex-shrink: 0;
  font-family: 'JetBrains Mono'; color: var(--text2);
  cursor: pointer; transition: all .12s;
}
.opt-label-num.selected { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt-input { flex: 1; min-height: unset; resize: none; }

/* 정답 안내 */
.answer-hint { font-size: 12px; color: var(--text3); margin-top: 4px; }
.answer-badge {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 700; margin-left: 8px;
  background: var(--ok-light); color: var(--ok); border: 1px solid #bbf7d0;
}

/* 이미지 업로드 */
.img-upload-area {
  border: 2px dashed var(--border); border-radius: 8px;
  padding: 20px; text-align: center; cursor: pointer;
  transition: all .15s; background: var(--surface2);
  position: relative;
}
.img-upload-area:hover { border-color: var(--accent); background: var(--accent-light); }
.img-upload-area input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.img-preview { max-width: 100%; max-height: 200px; border-radius: 6px; margin-top: 10px; }
.img-remove { font-size: 12px; color: var(--danger); cursor: pointer; margin-top: 6px; display: inline-block; }
.upload-icon { font-size: 24px; color: var(--text3); }
.upload-text { font-size: 13px; color: var(--text2); margin-top: 6px; }

/* 빈 상태 */
.empty-state { text-align: center; padding: 80px 32px; color: var(--text3); }
.empty-icon { font-size: 48px; margin-bottom: 16px; }
.empty-text { font-size: 16px; font-weight: 700; color: var(--text2); margin-bottom: 8px; }
.empty-sub { font-size: 14px; }

/* 미리보기 패널 */
.preview-panel {
  width: 340px; flex-shrink: 0;
  background: #1a1d27;
  border-left: 1px solid #2e3248;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.preview-header {
  padding: 14px 20px; border-bottom: 1px solid #2e3248;
  font-size: 11px; font-weight: 700; color: #8b90a7;
  letter-spacing: 2px; display: flex; align-items: center; gap: 8px;
}
.preview-dot { width: 8px; height: 8px; border-radius: 50%; background: #4f8ef7; }
.preview-body { flex: 1; overflow-y: auto; padding: 16px; }
.preview-q {
  background: #22263a; border: 1px solid #2e3248;
  border-radius: 12px; padding: 16px; margin-bottom: 10px;
}
.preview-qnum { font-size: 10px; color: #8b90a7; font-family: 'JetBrains Mono'; margin-bottom: 6px; }
.preview-text { font-size: 13px; color: #e8eaf0; line-height: 1.7; margin-bottom: 10px; }
.preview-opt {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border-radius: 8px;
  background: #2e3248; margin-bottom: 5px;
  font-size: 12px; color: #8b90a7;
}
.preview-opt-lbl {
  width: 22px; height: 22px; border-radius: 50%;
  background: #3a3f5c; display: flex; align-items: center;
  justify-content: center; font-size: 10px; font-weight: 700;
  flex-shrink: 0; color: #8b90a7; font-family: 'JetBrains Mono';
}
.preview-opt.answer { background: rgba(34,197,94,.1); border: 1px solid #22c55e; }
.preview-opt.answer .preview-opt-lbl { background: #22c55e; color: #0d1117; }
.preview-opt.answer { color: #e8eaf0; }
.preview-img { max-width: 100%; border-radius: 6px; margin-bottom: 10px; }
.preview-empty { color: #8b90a7; font-size: 12px; text-align: center; padding: 40px 0; }

/* 완료 모달 */
.modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.5); z-index: 200;
  align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: 16px;
  padding: 32px; max-width: 420px; width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,.2);
  text-align: center;
}
.modal-icon { font-size: 48px; margin-bottom: 16px; }
.modal-title { font-size: 20px; font-weight: 900; margin-bottom: 8px; }
.modal-sub { font-size: 14px; color: var(--text2); margin-bottom: 24px; line-height: 1.6; }
.modal-btns { display: flex; gap: 10px; justify-content: center; }

/* 스크롤바 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">⚡ CBT 편집기</div>
    <input class="exam-title-input" id="examTitle" placeholder="시험 제목 (예: 2024년 제1회 전기기능사)" value="2024년 제1회 전기기능사 CBT">
  </div>
  <div class="header-right">
    <span class="q-count" id="qCount">0 / 60문제</span>
    <button class="btn btn-secondary" onclick="loadSample()">샘플 불러오기</button>
    <button class="btn btn-secondary" onclick="saveJSON()">💾 저장</button>
    <button class="btn btn-secondary" onclick="loadJSON()">📂 불러오기</button>
    <input type="file" id="loadFile" accept=".json" style="display:none" onchange="onLoadFile(event)">
    <button class="btn btn-success" onclick="generateCBT()">🚀 CBT 생성</button>
  </div>
</div>

<div class="container">
  <!-- 사이드바 -->
  <div class="sidebar">
    <div class="sidebar-title">문제 목록</div>
    <div id="sidebarList"></div>
    <button class="add-q-btn" onclick="addQuestion()">+ 문제 추가</button>
  </div>

  <!-- 에디터 -->
  <div class="editor" id="editor">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📝</div>
      <div class="empty-text">문제를 추가해보세요</div>
      <div class="empty-sub">좌측 하단 "+ 문제 추가" 또는 아래 버튼을 클릭하세요</div>
      <br>
      <button class="btn btn-primary" onclick="addQuestion()" style="margin-top:8px">+ 첫 번째 문제 추가</button>
    </div>
    <div id="questionCards"></div>
  </div>

  <!-- 미리보기 -->
  <div class="preview-panel">
    <div class="preview-header"><div class="preview-dot"></div>미리보기 (모바일)</div>
    <div class="preview-body" id="previewBody">
      <div class="preview-empty">문제를 입력하면 여기에 미리보기가 표시됩니다</div>
    </div>
  </div>
</div>

<!-- 완료 모달 -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-icon">🎉</div>
    <div class="modal-title">CBT 생성 완료!</div>
    <div class="modal-sub" id="modalSub">문제 60개가 포함된 CBT 파일이 생성되었습니다.<br>카카오톡, 이메일 등으로 전달하면 모바일에서 바로 풀 수 있습니다.</div>
    <div class="modal-btns">
      <button class="btn btn-secondary" onclick="closeModal()">닫기</button>
    </div>
  </div>
</div>

<script>
let questions = [];
let activeIdx = -1;

// ── 초기화 ──
function init() {
  renderSidebar();
  renderCards();
  updateCount();
}

// ── 문제 추가 ──
function addQuestion() {
  const q = {
    id: questions.length + 1,
    text: '',
    opts: ['', '', '', ''],
    answer: -1,
    exp: '',
    img: null  // base64
  };
  questions.push(q);
  activeIdx = questions.length - 1;
  renderSidebar();
  renderCards();
  updateCount();
  // 스크롤
  setTimeout(() => {
    const el = document.getElementById('qcard-' + (questions.length - 1));
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 100);
}

// ── 삭제 ──
function deleteQuestion(idx) {
  if(!confirm(`문제 ${idx+1}번을 삭제하시겠습니까?`)) return;
  questions.splice(idx, 1);
  questions.forEach((q, i) => q.id = i + 1);
  if(activeIdx >= questions.length) activeIdx = questions.length - 1;
  renderSidebar();
  renderCards();
  updateCount();
}

// ── 사이드바 렌더 ──
function renderSidebar() {
  const list = document.getElementById('sidebarList');
  list.innerHTML = questions.map((q, i) => {
    const done = q.text.trim() && q.opts.every(o=>o.trim()) && q.answer >= 0;
    const cls = (i === activeIdx ? 'active ' : '') + (done ? 'done' : '');
    const label = q.text.trim() ? q.text.slice(0,18)+(q.text.length>18?'…':'') : '(미입력)';
    return `<button class="q-btn ${cls}" onclick="scrollTo(${i})">
      <span class="q-dot"></span>
      <span>Q${String(i+1).padStart(2,'0')} ${label}</span>
    </button>`;
  }).join('');
}

function scrollTo(idx) {
  activeIdx = idx;
  renderSidebar();
  const el = document.getElementById('qcard-' + idx);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

// ── 카드 렌더 ──
function renderCards() {
  const container = document.getElementById('questionCards');
  const empty = document.getElementById('emptyState');
  if(questions.length === 0) {
    empty.style.display = 'block';
    container.innerHTML = '';
    updatePreview();
    return;
  }
  empty.style.display = 'none';

  container.innerHTML = questions.map((q, i) => `
    <div class="editor-card" id="qcard-${i}" onclick="setActive(${i})">
      <div class="card-header">
        <span class="card-qnum">Q${String(i+1).padStart(2,'0')}</span>
        <button class="card-del" onclick="deleteQuestion(${i})" title="삭제">✕</button>
      </div>

      <div class="field">
        <div class="field-label">문제</div>
        <textarea class="q-text-area" placeholder="문제를 입력하세요" oninput="updateQ(${i},'text',this.value)">${escHtml(q.text)}</textarea>
      </div>

      <div class="field">
        <div class="field-label">이미지 (선택)</div>
        <div class="img-upload-area" id="imgArea-${i}">
          <input type="file" accept="image/*" onchange="uploadImg(${i}, event)">
          ${q.img
            ? `<img src="${q.img}" class="img-preview"><br><span class="img-remove" onclick="removeImg(${i}, event)">✕ 이미지 제거</span>`
            : `<div class="upload-icon">🖼️</div><div class="upload-text">클릭하거나 파일을 끌어다 놓으세요</div>`
          }
        </div>
      </div>

      <div class="field">
        <div class="field-label">선택지 <span style="color:var(--text3);font-weight:400">(번호 클릭 = 정답 설정)</span>
          ${q.answer >= 0 ? `<span class="answer-badge">정답: ①②③④[${q.answer+1}]</span>` : ''}
        </div>
        <div class="opts-grid">
          ${['①','②','③','④'].map((lbl,j) => `
            <div class="opt-row">
              <div class="opt-label-num ${q.answer===j?'selected':''}" onclick="setAnswer(${i},${j})" title="클릭하면 정답으로 설정">${lbl}</div>
              <textarea class="opt-input" rows="1" placeholder="${lbl} 선택지" oninput="updateOpt(${i},${j},this.value)">${escHtml(q.opts[j]||'')}</textarea>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="field">
        <div class="field-label">해설</div>
        <textarea class="exp-area" placeholder="해설을 입력하세요 (선택)" oninput="updateQ(${i},'exp',this.value)">${escHtml(q.exp)}</textarea>
      </div>
    </div>
  `).join('');

  updatePreview();
}

function setActive(idx) { activeIdx = idx; renderSidebar(); }
function escHtml(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── 데이터 업데이트 ──
function updateQ(idx, key, val) {
  questions[idx][key] = val;
  renderSidebar();
  updatePreview();
  updateCount();
}
function updateOpt(idx, j, val) {
  questions[idx].opts[j] = val;
  renderSidebar();
  updatePreview();
}
function setAnswer(idx, j) {
  questions[idx].answer = (questions[idx].answer === j) ? -1 : j;
  renderCards();
}
function uploadImg(idx, e) {
  const file = e.target.files[0];
  if(!file) return;
  // 모바일 호환 위해 1000px 이하로 리사이즈
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const maxW = 600;
      let w = img.width, h = img.height;
      if(w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      questions[idx].img = canvas.toDataURL('image/jpeg', 0.85);
      renderCards();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
function removeImg(idx, e) {
  e.stopPropagation();
  questions[idx].img = null;
  renderCards();
}

// ── 미리보기 ──
function updatePreview() {
  const body = document.getElementById('previewBody');
  if(questions.length === 0) {
    body.innerHTML = '<div class="preview-empty">문제를 입력하면 미리보기가 표시됩니다</div>';
    return;
  }
  const show = questions.slice(0, 3);
  body.innerHTML = show.map((q, i) => `
    <div class="preview-q">
      <div class="preview-qnum">Q${String(i+1).padStart(2,'0')}</div>
      <div class="preview-text">${q.text || '(문제 미입력)'}</div>
      ${q.img ? `<img src="${q.img}" class="preview-img">` : ''}
      ${['①','②','③','④'].map((l,j) => `
        <div class="preview-opt ${q.answer===j?'answer':''}">
          <div class="preview-opt-lbl">${l}</div>
          <span>${q.opts[j]||'(미입력)'}</span>
        </div>
      `).join('')}
    </div>
  `).join('') + (questions.length > 3 ? `<div class="preview-empty" style="padding:12px">… 외 ${questions.length-3}문제</div>` : '');
}

function updateCount() {
  const done = questions.filter(q => q.text.trim() && q.opts.every(o=>o.trim()) && q.answer>=0).length;
  document.getElementById('qCount').textContent = `${done} / ${questions.length}문제 완성`;
}

// ── 저장/불러오기 ──
function saveJSON() {
  const data = { title: document.getElementById('examTitle').value, questions };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (data.title || 'cbt_data') + '.json';
  a.click();
}
function loadJSON() { document.getElementById('loadFile').click(); }
function onLoadFile(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if(data.title) document.getElementById('examTitle').value = data.title;
      questions = data.questions || [];
      questions.forEach((q,i) => { q.id = i+1; if(!q.img) q.img = null; });
      activeIdx = 0;
      renderSidebar(); renderCards(); updateCount();
    } catch(err) { alert('파일을 읽을 수 없습니다.'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── 샘플 ──
function loadSample() {
  if(questions.length > 0 && !confirm('현재 작업을 덮어씁니다. 계속하시겠습니까?')) return;
  questions = [
    { id:1, text:'변압기의 원리는 어느 작용을 이용한 것인가?', opts:['발열작용','화학작용','자기유도작용','전자유도작용'], answer:3, exp:'변압기의 원리: 1차 코일에서 발생한 자속이 2차 코일과 쇄교하면서 발생되는 유도 기전력을 이용한 기기(전자유도작용)', img:null },
    { id:2, text:'정전용량 6[μF], 3[μF]을 직렬로 접속한 경우 합성 정전용량[μF]은?', opts:['2','2.4','1.2','12'], answer:0, exp:'직렬 합성용량: C₀ = C₁C₂/(C₁+C₂) = (6×3)/(6+3) = 2[μF]', img:null },
    { id:3, text:'전선의 굵기가 6[mm²] 이하인 가는 단선의 전선 접속은?', opts:['브리타니아 접속','쥐꼬리 접속','트위스트 접속','슬리브 접속'], answer:2, exp:'단면적 6[mm²] 이하: 트위스트 접속\n단면적 10[mm²] 이상: 브리타니아 접속', img:null },
  ];
  document.getElementById('examTitle').value = '샘플 시험';
  activeIdx = 0;
  renderSidebar(); renderCards(); updateCount();
}

// ── CBT 생성 ──
function generateCBT() {
  const incomplete = questions.filter(q => !q.text.trim() || q.opts.some(o=>!o.trim()) || q.answer < 0);
  if(incomplete.length > 0) {
    if(!confirm(`미완성 문제가 ${incomplete.length}개 있습니다.\n계속 생성하시겠습니까?`)) return;
  }
  if(questions.length === 0) { alert('문제를 1개 이상 입력해주세요.'); return; }

  const title = document.getElementById('examTitle').value || '전기기능사 CBT';
  const html = buildCBT(title, questions);
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = title.replace(/\s+/g,'_') + '.html';
  a.click();

  document.getElementById('modalSub').innerHTML =
    `<b>${questions.length}문제</b>가 포함된 CBT 파일이 다운로드되었습니다.<br>카카오톡/이메일로 공유하면 모바일에서 바로 풀 수 있어요!`;
  document.getElementById('modal').classList.add('show');
}
function closeModal() { document.getElementById('modal').classList.remove('show'); }

// ── CBT HTML 빌더 ──
function buildCBT(title, qs) {
  const qsJSON = JSON.stringify(qs.map(q => ({
    id: q.id,
    text: q.text,
    opts: q.opts,
    answer: q.answer,
    exp: q.exp,
    img: q.img || null
  })));

  return `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>${title}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>
</head>
<body>
<div class="hdr">
  <div class="hdr-info">
    <div class="hdr-title">${title}</div>
    <div class="prog-bar"><div class="prog-fill" id="pf" style="width:0%"></div></div>
  </div>
  <div class="score-chip" id="sc">0점</div>
</div>
<div class="main" id="main"></div>

<script>
const QS=${qsJSON};
const title=${JSON.stringify(title)};
let cur=0,score=0,ans=new Array(QS.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\\n\\n'+
      String(msg)+'\\n(줄 '+line+', 칸 '+col+')\\n\\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return '해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+QS.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=QS[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div></div>';
  const isLast=cur===QS.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+QS.length+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el)el.textContent=t;});
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===QS[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(QS.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function result(){
  const total=QS.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100),pass=pct>=60;
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+(pass?'#3fb950':'#f85149')+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+(pass?'#3fb950':'#f85149')+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+(pass?'🎉 합격!':'😥 불합격')+'</div>'+
    '<div class="res-sub">'+(pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다')+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div><button class="retry" onclick="restart()">🔄 다시 풀기</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function restart(){cur=0;score=0;ans=new Array(QS.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/QS.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
render();
<\/script>
</body>
</html>`;
}

init();
</script>
</body>
</html>
