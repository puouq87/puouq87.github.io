<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>24년 3회 001~050</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.retry.wrong{background:linear-gradient(135deg,#f85149,#d29922);color:#fff;}
.retry.sub{background:#21262d;color:#8b949e;border:1px solid #30363d;margin-top:8px;}
.res-note{font-size:12px;color:#8b949e;line-height:1.7;margin:-12px 0 20px;word-break:keep-all;}
.wb{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:9px;background:rgba(210,153,34,.18);color:#d29922;font-size:10px;letter-spacing:0}
.dot.hot{box-shadow:0 0 0 2px #d29922}
</style>

,"expImg":null},{"id":7,"uid":7,"text":"전자파의 진행방향으로 옳은 것은?","opts":["$V \\times E$의 방향과 같다.","자계 $H$의 방향과 같다.","전계 $E$의 방향과 같다.","$E \\times H$의 방향과 같다."],"answer":3,"exp":"전자파의 성질\n전자파는 전계와 자계가 동시에 존재\n포인팅 벡터 $P = E \\times H$ 이므로 전자파의 진행 방향은 $E \\times H$의 방향과 같다.","img":null,"expImg":null},{"id":8,"uid":8,"text":"면적이 $S[\\text{m}^2]$, 극판 사이의 거리가 $d[\\text{m}]$, 유전체의 비유전율이 $\\epsilon_s$ 인 평행 평판콘덴서의 정전용량[F]은?","opts":["$\\frac{\\epsilon_0 \\epsilon_s S}{d}$","$\\frac{\\epsilon_0 \\epsilon_s d}{S}$","$\\frac{\\epsilon_0 S}{d}$","$\\frac{\\epsilon_0 d}{S}$"],"answer":0,"exp":"평행판 콘덴서의 정전용량 : $C = \\frac{\\epsilon_0 \\epsilon_s S}{d}[\\text{F}]$","img":null,"expImg":null},{"id":9,"uid":9,"text":"맥스웰 전자방정식의 물리적 의미 중 틀린 것은?","opts":["전하에서 전속선이 발산한다.","자계의 시간적 변화에 따라 전계의 회전이 발생한다.","전도전류와 변위전류는 자계를 발생시킨다.","고립된 자극이 존재한다."],"answer":3,"exp":"맥스웰 전자계 기초 방정식\n$\\text{rot } E = -\\frac{\\partial B}{\\partial t}$ (패러데이 법칙의 미분형) : 전계의 회전은 자속밀도의 시간적 감소율과 같다.\n$\\text{rot } H = i + \\frac{\\partial D}{\\partial t}$ (앙페르 주회법칙의 미분형) : 전도전류와 변위전류는 회전하는 자계를 발생한다.\n$\\text{div } D = \\rho$ : 단위체적 당 발산 전속수는 단위체적 당 공간전하 밀도와 같다.\n$\\text{div } B = 0$ : 자계는 발산하지 않으며, 고립된 자극은 존재하지 않는다\n","img":null,"expImg":null},{"id":10,"uid":10,"text":"공극의 자속밀도를 $B$ 라 할 때 전자석의 흡인력은?","opts":["$B^2$에 비례","$B^{0.5}$에 비례","$B^{1.6}$에 비례","$B$에 비례"],"answer":0,"exp":"자성체 면적당 힘 $f = \\frac{1}{2}\\mu H^2 = \\frac{B^2}{2\\mu} = \\frac{1}{2}BH[\\text{N/m}^2]$에서\n흡인력 $F = f \\times S = \\frac{B^2}{2\\mu}S \\propto B^2[\\text{N}]$","img":null,"expImg":null},{"id":11,"uid":11,"text":"반지름 $a[\\text{m}]$의 반구형 도체를 반구면이 고유저항 $\\rho[\\Omega \\cdot \\text{m}]$의 대지에 묻었을 때 접지저항[ $\\Omega$ ]은?","opts":["$\\frac{a}{2\\pi\\rho}$","$\\frac{1}{2\\pi\\rho a}$","$2\\pi\\rho a$","$\\frac{\\rho}{2\\pi a}$"],"answer":3,"exp":"반구의 정전용량 $C = \\frac{4\\pi\\epsilon_0 a}{2} = 2\\pi\\epsilon_0 a[\\text{F}]$\n$RC = \\rho\\epsilon$ 에서\n접지저항 $R = \\frac{\\rho\\epsilon}{C} = \\frac{\\rho\\epsilon}{2\\pi\\epsilon a} = \\frac{\\rho}{2\\pi a}$","img":null,"expImg":null},{"id":12,"uid":12,"text":"진공 중에 놓인 반지름 $2[\\text{m}]$의 도체구에 전하 $Q[\\text{C}]$가 있다면 그 표면에 있어서의 전속밀도 $D$는 몇 $[\\text{C/m}^2]$인가?","opts":["$Q$","$\\frac{Q}{4\\pi}$","$\\frac{Q}{16\\pi}$","$\\frac{Q}{8\\pi}$"],"answer":2,"exp":"구도체 전속밀도 $D = \\epsilon E = \\epsilon \\times \\frac{Q}{4\\pi\\epsilon r^2} = \\frac{Q}{4\\pi r^2}[\\text{C/m}^2]$\n따라서 $D = \\frac{Q}{4\\pi r^2} = \\frac{Q}{4\\pi \\times 2^2} = \\frac{Q}{16\\pi}$","img":null,"expImg":null},{"id":13,"uid":13,"text":"액체 유전체를 넣은 콘덴서의 용량이 $20[\\mu\\text{F}]$이다. 여기에 $500[\\text{kV}]$의 전압을 가하면 누설전류는 약 몇 [A]인가?(단, 비유전율 $\\epsilon_s = 2.2$, 고유저항 $\\rho = 10^{11}[\\Omega \\cdot \\text{m}]$이다)","opts":["$4.2$","$5.14$","$54.5$","$61.0$"],"answer":1,"exp":"$RC = \\rho\\epsilon$ 에서 접지저항 $R = \\frac{\\rho\\epsilon}{C}[\\Omega]$\n누설전류 $I = \\frac{V}{R} = \\frac{CV}{\\rho\\epsilon}$\n$= \\frac{20 \\times 10^{-6} \\times 500 \\times 10^3}{10^{11} \\times 8.855 \\times 10^{-12} \\times 2.2} = 5.14[\\text{A}]$","img":null,"expImg":null},{"id":14,"uid":14,"text":"반경 $a$ 인 비접지 구도체의 중심에서 $d(>a)$ 만큼 떨어진 위치에 점전하 $Q$ 가 존재할 때 공간에서의 전계를 구하고자 한다. 이 문제를 영상전하법으로 풀 때 필요한 영상전하의 개수 및 영상 전하의 총합은?","opts":["1개, $-\\frac{a}{d}Q$","2개, $0$","2개, $-\\frac{a}{2d}Q$","3개, $\\frac{a}{d}Q$"],"answer":1,"exp":"비접지 도체구\n영상전하 : $Q' = -\\frac{a}{d}Q$ 이므로 도체 내에도 반대전하인 $Q' + \\frac{a}{d}Q$ 가 유도된다.\n따라서 전하의 총합은 $0$이다.","img":null,"expImg":null},{"id":15,"uid":15,"text":"저항 및 저항률에 관한 설명 중 틀린 것은?","opts":["저항의 역수는 컨덕턴스이다.","저항률의 역수는 도전율이다.","저항률의 단위는 $[\\Omega \\cdot \\text{m}^2]$이다.","도체의 저항은 온도가 올라가면 그 값이 증가한다."],"answer":2,"exp":"컨덕턴스 $G = \\frac{1}{R}$ : 저항의 역수\n도전율 $\\kappa = \\frac{1}{\\rho}$ : 저항률의 역수\n저항온도계수 : 도체는 온도가 올라가면 저항이 증가한다.\n저항률 단위 : $[\\Omega \\cdot \\text{m}]$\n저항 $R = \\rho \\frac{l}{A}$ 에서 저항률 $\\rho = R \\frac{A}{l}[\\Omega \\cdot \\text{m}]$","img":null,"expImg":null},{"id":16,"uid":16,"text":"진공 중의 평등자계 $H_0$ 중에 놓인 투자율 $\\mu$ 인 구자성체의 감자율은?","opts":["$\\frac{1}{2}$","$\\frac{1}{3}$","$\\frac{1}{5}$","$\\frac{1}{9}$"],"answer":1,"exp":"자기감자력 $H' = NI$ : 자화의 세기($J$)에 비례\n여기서, $N$ 은 감자율로서 구자성체는 $\\frac{1}{3}$, 환상솔레노이드는 $0$이다.","img":null,"expImg":null},{"id":17,"uid":17,"text":"자속밀도 $100[\\text{Wb/m}^2]$인 평등자계 내에 한 변이 $10[\\text{cm}]$인 정사각형 회로가 자계 방향과 직각인 중심축 둘레로 매분 $3,600$회 회전할 때 이 회로에 유기되는 기전력의 최대값은 몇 [V]인가?(단, 권선수는 $10$이다)","opts":["$30\\pi$","$60\\pi$","$180\\pi$","$120\\pi$"],"answer":3,"exp":"코일과 쇄교하는 자속 $\\phi = \\Phi_m \\sin\\omega t = BS\\sin\\omega t$\n유기기전력 $e = -n \\frac{d\\phi}{dt} = -n \\frac{d}{dt} BS\\sin\\omega t = -n\\omega BS\\cos\\omega t$\n따라서 유기기전력의 최대값 $E_m = n\\omega BS = 2\\pi \\times \\frac{3,600}{60} \\times 1 \\times 100 \\times 0.1 \\times 0.1 = 120\\pi[\\text{V}]$","img":null,"expImg":null},{"id":18,"uid":18,"text":"환상철심에 권수 $20$회의 A코일과 권수 $80$회의 B코일이 있을 때, A코일의 자기 인덕턴스가 $5[\\text{mH}]$라면 두 코일의 상호 인덕턴스[mH]는?(단, 결합계수 $k = 1$이다)","opts":["$20$","$40$","$60$","$80$"],"answer":0,"exp":"상호인덕턴스 : $M =  \\frac{N_1 N_2}{R_m} = \\frac{N_2}{N_1} {L_1} = \\frac{80}{20} \\times 5 = 20[\\text{mH}]$","img":null,"expImg":null},{"id":19,"uid":19,"text":"반지름이 $9[\\text{cm}]$인 도체구 A에 $8[\\text{C}]$의 전하가 균일하게 분포되어 있다. 이 도체구에 반지름 $3[\\text{cm}]$인 도체구 B를 접촉시켰을 때 도체구 B로 이동한 전하는 약 몇 [C]인가?","opts":["$1$","$2$","$3$","$4$"],"answer":1,"exp":"두 개의 도체 구를 접촉하면 중화 현상으로 인해 전체 전기량 $Q = 8[\\text{C}]$이 되며, 전하는 도체구의 크기에 비례하므로\n반지름 $3[\\text{cm}]$의 도체 구에 남는 전기량 $Q_1 = \\frac{3}{9 + 3} \\times 8 = 2[\\text{C}]$","img":null,"expImg":null},{"id":20,"uid":20,"text":"두 유전체의 경계면에 대한 설명 중 잘못 것은?","opts":["유전율이 작은 쪽에서 전계가 입사할 때 입사각은 굴절각보다 작다.","전계가 경계면에 수직으로 입사하면 두 유전체 내의 전계의 세기는 같다.","경계면에 작용하는 맥스웰 변형력은 유전율이 큰 쪽에서 작은 쪽으로 끌려가는 힘을 받는다.","전계나 전속밀도가 경계면에 수직으로 입사하면 굴절하지 않는다."],"answer":1,"exp":"전계가 경계면에 수직($\\theta = 0^{\\circ}$)이면 전계는 불연속($E_1 \\ne E_2$)\n전속밀도는 불변이므로 $D_1\\cos\\theta = D_2\\cos\\theta$ 에서 $D_1 = D_2$ 이고 $\\epsilon_1 E_1 = \\epsilon_2 E_2$\n따라서 $\\frac{E_2}{E_1} = \\frac{\\epsilon_1}{\\epsilon_2}$ 이 된다.\n전기력선과 전속은 굴절하지 않는다.\nMaxwell 응력 : 유전체에 작용하는 힘의 방향은 유전율이 큰 쪽에서 작은 쪽으로 향한다.\n","img":null,"expImg":null},{"id":21,"uid":21,"text":"첨두부하가 커지면 부하율은 어떻게 되는가?(단, 평균전력은 동일하다)","opts":["변하지 않고 일정하다.","낮아진다.","높아진다.","부하의 종류에 따라 달라진다."],"answer":1,"exp":"부하율 $= \\frac{\\text{평균 전력}}{\\text{최대 전력}} \\times 100[\\text{\\%}]$ 에서\n첨두부하이 커지면 즉, 최대전력은 커지고 평균전력은 변화가 크지 않은 경우 부하율은 낮아진다.","img":null,"expImg":null},{"id":22,"uid":22,"text":"역상전류가 각 상전류에 의하여 바르게 표시된 것은?","opts":["$I_2 = aI_a + I_b + a^2 I_c$","$I_2 = I_a + I_b + I_c$","$I_2 = \\frac{1}{3} (I_a + a^2 I_b + aI_c)$","$I_2 = 3(I_a + aI_b + a^2 I_c)$"],"answer":2,"exp":"대칭좌표법\n$\\begin{bmatrix} I_0 \\\\ I_1 \\\\ I_2 \\end{bmatrix} = \\frac{1}{3} \\begin{bmatrix} 1 & 1 & 1 \\\\ 1 & a & a^2 \\\\ 1 & a^2 & a \\end{bmatrix} \\begin{bmatrix} I_a \\\\ I_b \\\\ I_c \\end{bmatrix}$ 에서 역상전류 $I_2 = \\frac{1}{3} (I_a + a^2 I_b + aI_c)$","img":null,"expImg":null},{"id":23,"uid":23,"text":"송전선의 중성점을 접지하는 이유가 아닌 것은?","opts":["코로나 방지","지락사고의 차단","이상전압의 방지","전선로 및 기기의 절연레벨 경감"],"answer":0,"exp":"송전 계통의 중성점 접지의 목적\n\n    1선 지락 시 전위 상승 억제, 계통의 기계 기구의 절연 보호(절연레벨 경감)\n\n    지락 사고 시 보호 계전기 동작의 확실\n\n    과도안정도 증진\n\n    이상전압의 발생 방지 및 지락아크 소멸","img":null,"expImg":null},{"id":24,"uid":24,"text":"수력발전소의 댐 설계 및 저수지 용량 등을 결정하는 데 가장 적합하게 사용되는 것은?","opts":["유황곡선","유량도","수위-유량곡선","적산유량곡선"],"answer":3,"exp":"적산 유량 곡선 : 매일의 수량을 차례로 적산해서 가로축에 일수를, 세로축에 적산 수량을 그린 그림\n수력 발전소의 댐(Dam)의 설계 및 저수지의 용량 등을 결정하는 데 사용","img":null,"expImg":null},{"id":25,"uid":25,"text":"배전선로의 손실경감과 관계없는 것은?","opts":["배전 전압의 승압","역률 개선","대용량 변압기 채용","배전 선로의 전류 밀도 평형"],"answer":2,"exp":"배전선로 전력 손실 경감대책\n\n    역률 개선(전력용 콘덴서의 설치)\n    승압\n    부하 불평형 방지(배전 선로의 전류 밀도 평형)","img":null,"expImg":null},{"id":26,"uid":26,"text":"송전선로로 전압을 $3,000[\\text{V}]$에서 $5,200[\\text{V}]$로 높이면 송전전력이 같다고 할 때 전력 손실은 약 몇 [%]로 되는가?(단, 역률은 일정하다)","opts":["$100$","$25$","$33.3$","$57.7$"],"answer":2,"exp":"전력(선로)손실 : $P_l \\propto \\frac{1}{V^2} = \\left( \\frac{5,200}{3,000} \\right)^2 \\times 100 = 33.3[\\text{\\%}]$","img":null,"expImg":null},{"id":27,"uid":27,"text":"송전선로의 특성임피던스를 $Z_0$ , 전파속도를 $v$ 라 할 때 이 송전선의 단위길이에 대한 인덕턴스 $L$은?","opts":["$L = \\frac{V}{Z_0}$","$L = \\sqrt{Z_0} V$","$L = \\frac{Z_0^2}{V}$","$L = \\frac{Z_0}{V}$"],"answer":3,"exp":"파동 임피던스 $Z_0 = \\sqrt{\\frac{L}{C}}$ , 전파속도 $v = \\frac{1}{\\sqrt{LC}}$\n","img":null,"expImg":null},{"id":28,"uid":28,"text":"피뢰기의 구비조건으로 틀린 것은?","opts":["속류 차단능력이 충분할 것","방전내량이 작으면서 제한전압이 높을 것","상용주파 방전개시전압이 높을 것","충격 방전개시전압이 낮을 것"],"answer":1,"exp":"피뢰기의 구비조건\n\n    상용주파 방전개시전압이 높을 것\n\n    충격방전 개시전압이 낮을 것\n\n    제한전압이 낮을 것\n\n    속류차단능력이 우수할 것","img":null,"expImg":null},{"id":29,"uid":29,"text":"복도체를 사용한 가공송전방식을 같은 단면적의 단도체를 사용하는 경우와 비교했을 때 틀린 것은?","opts":["안정도를 증대시킬 수 있다.","송전용량을 증대시킬 수 있다.","인덕턴스는 증가하고 정전용량은 감소한다.","코로나 개시전압이 높아지므로 코로나 손실을 줄일 수 있다."],"answer":2,"exp":"복도체(다도체) 방식 : 주목적은 코로나 방지\n\n    인덕턴스는 감소, 정전 용량은 증가\n\n    코로나의 방지, 코로나 임계 전압의 상승\n\n    송전 용량의 증대\n\n    안정도 증가","img":null,"expImg":null},{"id":30,"uid":30,"text":"조력발전소에 대한 설명으로 옳은 것은?","opts":["원만한 해안선을 이루고 있는 지점에 설치한다.","간만의 차가 작은 해안에 설치한다.","지형의 조건에 따라 수로식과 양수식이 있다.","만조로 되는 동안 바닷물을 받아들여 발전한다."],"answer":3,"exp":"조력 발전\n조수 간만의 차를 이용하여 발전하며, 만조 시에 저수하여 간조 시에 발전한다","img":null,"expImg":null},{"id":31,"uid":31,"text":"송전선로의 안정도 향상 대책으로 볼 수 없는 것은?","opts":["제페로 방식이나 복도체방식을 채용한다.","단락비가 작은 발전기를 사용한다.","속응 여자 방식을 채용한다.","고속차단기를 사용한다."],"answer":2,"exp":"안정도 향상 대책\n\n1. 직렬 리액턴스($X$)를 작게 한다.\n\n - 발전기나 변압기의 리액턴스를 작게 한다.\n\n - 선로의 병행 회선수를 늘리거나 복도체 또는 다도체 방식을 사용한다.\n\n - 직렬 콘덴서를 삽입하여 선로의 리액턴스를 보상한다.\n\n2. 전압 변동률을 작게 한다.\n\n - 속응여자방식의 채용\n\n - 계통 연계를 한다.\n\n3. 중간 조상 방식을 채용한다.\n\n4. 고장 전류를 줄이고 고장 구간을 신속하게 차단한다.\n\n - 적당한 중성점 접지방식을 채용하여 지락전류를 줄인다.\n\n - 고속도 계전기, 고속도 차단기를 채용한다.\n\n - 고속도 재폐로 방식을 채용한다.","img":null,"expImg":null},{"id":32,"uid":32,"text":"단상 2선식 교류 배전선로가 있다. 전선의 1가닥 저항이 $0.15[\\Omega]$이고, 리액턴스는 $0.25[\\Omega]$이다. 부하는 순저항부하고 $100[\\text{V}], 3[\\text{kW}]$이다. 급전점의 전압[V]은 약 얼마인가?","opts":["$105$","$109$","$115$","$124$"],"answer":1,"exp":"송전단 전압 $V_s = V_r + 2I(R\\cos\\theta + X\\sin\\theta)$ 에서 무부하선($\\cos\\theta = 1$)이므로\n$V_s = V_r + 2I(R\\cos\\theta + X\\sin\\theta) = 100 + 2 \\times \\frac{3,000}{100} \\times 0.15 = 109[\\text{V}]$","img":null,"expImg":null},{"id":33,"uid":33,"text":"여러 회선의 비접지 3상 3선식 배전선로에 선택지락계전기를 사용하여 선택지락보호를 하려고 할 때 필요한 것은?","opts":["PT와 CT","GPT와 CT","GPT와 ZCT","PT와 ZCT"],"answer":2,"exp":"GPT(Ground Potential Transformer) : 접지형 계기용 변압기, 지락 사고 시 영상전압 검출\n영상변류기(ZCT) : 영상(지락)전류 검출, 지락(접지)계전기와 연결","img":null,"expImg":null},{"id":34,"uid":34,"text":"과도 안정 극한 전력을 올바르게 설명한 것은?","opts":["부하가 서서히 증가할 때의 극한 전력","부하가 변하지 않을 때의 극한 전력","부하가 갑자기 증가하였을 때의 극한 전력","부하가 서서히 감소할 때의 극한 전력"],"answer":2,"exp":"정태 안정도 : 송전 계통이 불변 부하 또는 극히 서서히 증가하는 부하에 대하여 계속적으로 송전할 수 있는 능력(정태안정 극한전력)\n\n과도 안정도 : 부하의 급변 또는 사고가 발생해서 계통에 큰 충격을 주었을 경우에도 탈조하지 않고 새로운 평형 상태를 회복하여 송전을 계속할 수 있는 능력\n\n동태 안정도 : AVR이나 조속기 등이 갖는 제어효과까지도 고려한 안정도","img":null,"expImg":null},{"id":35,"uid":35,"text":"배전 계통에서 콘덴서를 설치하는 주된 목적과 관계없는 것은?","opts":["전력손실 감소","기기의 보호","전압강하 보상","송전용량 증가"],"answer":1,"exp":"전력용 콘덴서 설치 : 역률 개선\n\n    전력 손실 경감\n\n    전압 강하 경감\n\n    설비 용량의 여유분 증가\n\n    전력 요금의 절약","img":null,"expImg":null},{"id":36,"uid":36,"text":"3상 송전선로의 선간전압을 $100[\\text{kV}], 3$상 기준 용량을 $10,000[\\text{kVA}]$로 할 때 선로 리액턴스(1선당) $100[\\Omega]$을 $\\%$임피던스로 환산하면 얼마인가?","opts":["$0.5[\\text{\\%}]$","$1[\\text{\\%}]$","$5[\\text{\\%}]$","$10[\\text{\\%}]$"],"answer":3,"exp":"$\\%Z = \\frac{PZ}{10V^2} = \\frac{10,000 \\times 100}{10 \\times 100^2} = 10[\\text{\\%}]$\n여기서, $V$ : 정격전압[kV], $P$ : 기준용량[kVA]","img":null,"expImg":null},{"id":37,"uid":37,"text":"피뢰기의 정격전압이란?","opts":["속류를 차단할 수 있는 최고의 교류전압","충격방전전류를 통하고 있을 때 단자전압","방전을 개시할 때 단자전압의 순간값","상용주파수의 방전개시전압"],"answer":0,"exp":"피뢰기 정격전압 : 상용주파 최대 허용전압, 속류를 차단할 수 있는 최고의 교류전압","img":null,"expImg":null},{"id":38,"uid":38,"text":"저항 $10[\\Omega]$, 리액턴스 $15[\\Omega]$인 3상 송전선로가 있다. 수전단 전압이 $60[\\text{kV}],$ 부하역률이 $0.8$, 수전단 전류가 $100[\\text{A}]$라 할 때 송전단 전압은 약 몇 [kV]인가?","opts":["$33$","$42$","$58$","$63$"],"answer":3,"exp":"송전단 전압 $V_s = V_r + \\sqrt{3}I(R\\cos\\theta + X\\sin\\theta)$\n$= 60,000 + \\sqrt{3} \\times 100(10 \\times 0.8 + 15 \\times 0.6) = 62,944 \\fallingdotseq 63[\\text{kV}]$","img":null,"expImg":null},{"id":39,"uid":39,"text":"3상 차단기의 정격차단용량을 나타낸 것은?","opts":["$\\frac{1}{\\sqrt{3}} \\times \\text{정격전압} \\times \\text{정격전류}$","$\\sqrt{3} \\times \\text{정격전압} \\times \\text{정격전류}$","$\\frac{1}{\\sqrt{3}} \\times \\text{정격전압} \\times \\text{정격차단전류}$","$\\sqrt{3} \\times \\text{정격전압} \\times \\text{정격차단전류}$"],"answer":3,"exp":"고장용 차단기의 정격용량 $P_s = \\sqrt{3} \\times \\text{정격전압} \\times \\text{정격차단전류}[\\text{MVA}]$","img":null,"expImg":null},{"id":40,"uid":40,"text":"역률 $0.6$, 출력 $240[\\text{kW}]$인 유도부하에 병렬로 전력용 콘덴서를 설치하여 합성역률을 $0.8$로 개선고자 한다. 이 때 전력용 콘덴서 용량은 약 몇 [kVA]인가?","opts":["$48$","$100$","$140$","$192$"],"answer":2,"exp":"역률 개선용 콘덴서의 용량 $Q = P(\\tan\\theta_1 - \\tan\\theta_2) = 240 \\times \\left( \\frac{0.8}{0.6} - \\frac{0.6}{0.8} \\right) = 140[\\text{kVA}]$","img":null,"expImg":null},{"id":41,"uid":41,"text":"출력 $15[\\text{HP}],$ 회전수 $800[\\text{rpm}]$인 전동기의 토크는 약 몇 $[\\text{N} \\cdot \\text{m}]$인가?","opts":["$102.2$","$122.1$","$133.6$","$153.6$"],"answer":2,"exp":"전동기 토크 $\\tau = \\frac{P_o}{\\omega} = \\frac{P_o}{2\\pi \\frac{N}{60}} = \\frac{15 \\times 746}{2\\pi \\times \\frac{800}{60}} = 133.6[\\text{N} \\cdot \\text{m}]$","img":null,"expImg":null},{"id":42,"uid":42,"text":"동기발전기의 병렬운전조건이 아닌 것은?","opts":["기전력의 크기","기전력의 임피던스","기전력의 주파수","기전력의 위상"],"answer":1,"exp":"동기발전기 병렬 운전 조건","img":null,"expImg":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAFPAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytL ozQAUUUZoAKKKM0AFFGaM0AFFGaM0AFFGaM0AFFGaM0AFFGaM0AFFGaM0AFFGaM0AFFGaM0AFFFGaACijNGaACijNGaACijNGaACijNGaACijNGaACijNGaACijNGaACijNGaACiijNABRRRQAUUUUAf/2Q=="},{"id":43,"uid":43,"text":"직류 초퍼제어 방식이 아닌 것은?","opts":["펄스 주파수 제어","펄스 파고 제어","펄스 폭 제어","시비율 제어"],"answer":1,"exp":"직류 초퍼 제어 방식\n\n    펄스 주파수 제어\n\n    펄스 폭 제어\n\n    순시값 제어\n\n여기서, 시비율은 듀티비 $D = \\frac{T_{\\text{ON}}}{T}$ 으로 초퍼제어에 기본으로 사용된다.","img":null,"expImg":null},{"id":44,"uid":44,"text":"3상 유도전동기에서 기본파 회전자계와 비교하여 제5고조파에 의한 기자력의 회전방향과 속도는?","opts":["기본파와 반대 방향이고 $1/7$배의 속도","기본파와 같은 방향이고 $1/7$배의 속도","기본파와 반대 방향이고 $1/5$배의 속도","기본파와 같은 방향이고 $5$배의 속도"],"answer":2,"exp":"고조파\n$h = 2mn + 1$ : 기본파와 동일한 방향의 회전자계 발생 (7차, 13차, ...), $1/h$ 의 속도 \n$h = 2mn - 1$ : 기본파와 반대 방향의 회전자계 발생 (5차, 11차, ...), $1/h$ 의 속도\n$h = 2mn$ : 회전자계 발생하지 않는다 (2차, 6차, ...)","img":null,"expImg":null},{"id":45,"uid":45,"text":"단상 유도전동기의 기동방법에서 기동 토크의 크기가 가장 큰 것은?","opts":["분상 기동형","반발 기동형","반발 유도형","콘덴서 기동형"],"answer":1,"exp":"단상유도전동기(기동 토크가 큰 순서)\n반발 기동형 > 반발 유도형 > 콘덴서 기동형 > 분상 기동형 > 셰이딩코일형 > 모노사이클릭형","img":null,"expImg":null},{"id":46,"uid":46,"text":"출력 $P[\\text{kW}]$를 발생하는 직류 발전기와 직결된 3상 유도전동기의 입력[kVA]은? (단, $\\eta_g$ : 발전기 효율, $\\eta_m$ : 전동기 효율, $\\cos\\theta$ : 전동기 역률이다)","opts":["$\\frac{P\\eta_m}{\\eta_g \\cos\\theta}$","$\\frac{P\\eta_g}{\\eta_m \\cos\\theta}$","$\\frac{P}{\\eta_g \\eta_m \\cos\\theta}$","$\\frac{P\\cos\\theta}{\\eta_g \\eta_m}$"],"answer":2,"exp":"문제에서는 직류발전기와 3상 유도전동기를 연결한 내용이므로 전동기의 출력 = 발전기의 입력\n발전기의 효율 $\\eta_g = \\frac{\\text{출력}(P)}{\\text{입력}}$ 에서 입력[kVA] $= \\frac{P}{\\eta_g \\times \\cos\\theta}$\n전동기의 입력을 구하면 $\\eta_m = \\frac{\\text{출력}}{\\text{입력}}$ 에서\n전동기의 입력 $= \\frac{\\text{출력}}{\\eta_m} = \\frac{1}{\\eta_m} \\times \\frac{P}{\\eta_g \\cos\\theta} = \\frac{P}{\\eta_g \\eta_m \\cos\\theta}[\\text{kVA}]$","img":null,"expImg":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4e const title="24년 3회 001~050";
const META={"hubUrl":"","lastUid":50};
const TK={K:'cbtHub.records.v1',wm:null,
load(){try{const d=JSON.parse(localStorage.getItem(this.K)||'null');if(d&&d.exams)return d}catch(e){}return{exams:{}}},
id(){const p=decodeURIComponent(location.pathname).split('/').pop(),i=p.lastIndexOf('.');return i>0?p.slice(0,i):p},
wc(q){if(!this.wm){const e=this.load().exams[this.id()];this.wm=(e&&e.wrong)||{}}return this.wm[q]||0},
rec(ids,total,score){try{const d=this.load(),k=this.id(),e=d.exams[k]||(d.exams[k]={attempts:0,wrong:{}}),pct=total?Math.round(score/total*100):0;
e.attempts++;e.total=total;e.last=Date.now();e.lastScore=pct;e.best=Math.max(e.best||0,pct);
ids.forEach(q=>{e.wrong[q]=(e.wrong[q]||0)+1});localStorage.setItem(this.K,JSON.stringify(d));this.wm=null}catch(e){}}};
let Q=QS,cur=0,score=0,round=1,ans=new Array(Q.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+Q.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(TK.wc(Q[i].uid||Q[i].id)>=2?' hot':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=Q[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===Q.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+Q.length+(round>1?' · 오답 '+(round-1)+'차':'')+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+(TK.wc(q.uid||q.id)?' <span class="wb">'+TK.wc(q.uid||q.id)+'회 틀림</span>':'')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===Q[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function wrongIdx(){
  const r=[];
  for(let i=0;i<Q.length;i++){ if(ans[i]===null||!ans[i].ok) r.push(i); }
  return r;
}
function result(){
  const total=Q.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100);
  const wrong=wrongIdx(),skipped=total-done,retryMode=round>1;if(round===1&&!window._tr){window._tr=1;TK.rec(wrong.map(i=>Q[i].uid||Q[i].id),total,score)}
  const pass=pct>=60;
  const col=retryMode?(wrong.length===0?'#3fb950':'#58a6ff'):(pass?'#3fb950':'#f85149');
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  let rt,sub;
  if(retryMode){
    rt=wrong.length===0?'🎉 오답 정복 완료!':'📝 오답 재풀이 '+(round-1)+'차 결과';
    sub=total+'문제 중 '+score+'문제 정답'+(wrong.length?' · 아직 '+wrong.length+'문제 남았어요':'');
  } else {
    rt=pass?'🎉 합격!':'😥 불합격';
    sub=pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다';
  }
  let note='';
  if(wrong.length){
    note='<div class="res-note">다시 볼 문제: '+wrong.map(i=>'Q'+String(Q[i].id).padStart(2,'0')).join(' ')+(skipped?'<br>안 푼 문제 '+skipped+'개도 다시 풀기에 포함돼요':'')+'</div>';
  }
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+col+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+rt+'</div>'+
    '<div class="res-sub">'+sub+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div>'+note+
    (wrong.length?'<button class="retry wrong" onclick="retryWrong()">❌ '+(skipped?'오답·미풀이 ':'오답 ')+wrong.length+'문제만 다시 풀기</button>':'')+
    '<button class="retry'+(wrong.length?' sub':'')+'" onclick="restart()">🔄 '+(retryMode?'전체 문제 처음부터 다시 풀기':'처음부터 다시 풀기')+'</button>'+(META.hubUrl?'<button class="retry sub" onclick="location.href=META.hubUrl">🏠 허브로 돌아가기</button>':'')+'</div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function retryWrong(){
  const w=wrongIdx(); if(!w.length) return;
  Q=w.map(i=>Q[i]); round++;
  cur=0; score=0; ans=new Array(Q.length).fill(null); cache={}; render();
}
function restart(){window._tr=0;Q=QS;round=1;cur=0;score=0;ans=new Array(Q.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/Q.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
