<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>26년 2회 산업기사 51~100</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.retry.wrong{background:linear-gradient(135deg,#f85149,#d29922);color:#fff;}
.retry.sub{background:#21262d;color:#8b949e;border:1px solid #30363d;margin-top:8px;}
.res-note{font-size:12px;color:#8b949e;line-height:1.7;margin:-12px 0 20px;word-break:keep-all;}
</style>

<script>
const QS=[{"id":1,"text":"2,000/100[V], 10[kVA] 변압기의 1차 환산 등가임피던스가 $6.2 + j7[\\Omega]$이라면 %임피던스 강하는 약 몇 [%]인가?","opts":["1.8","2.3","3.2","6.7"],"answer":1,"exp":"임피던스($Z$) 크기 계산\n$$Z = \\sqrt{6.2^2 + 7^2} = \\sqrt{38.44 + 49} = \\sqrt{87.44} \\approx 9.351\\text{ [$\\Omega$]}$$\n\n$I_n = \\frac{p}{V_n}$에서, $V_n$: 1차 정격전압 = $2,000\\text{ [V]}$\n1차 정격전류 $I_n = \\frac{S}{V_n} = \\frac{10,000}{2,000} = 5\\text{ [A]}$\n\n퍼센트 임피던스(%Z) 계산\n$$\\%Z = \\frac{I_n \\cdot Z}{V_n} \\cdot 100 = \\frac{5 \\times 9.351}{2,000} \\cdot 100 = \\frac{46.755}{2,000} \\cdot 100 \\approx 2.338\\text{ [\\%]}$$\n\n","img":null,"expImg":null},{"id":2,"text":"다이오드를 사용하는 단상반파 정류회로에서 입력 교류전압 대비 출력 직류전압 평균치는 얼마인가?","opts":["0.5배","0.45배","1/0.45배","1/0.5배"],"answer":1,"exp":"단상 반파: $V_d = \\frac{V_m}{\\pi} = \\frac{\\sqrt{2}}{\\pi} V \\approx 0.45 V$\n단상 전파: $V_d = \\frac{2V_m}{\\pi} = \\frac{2\\sqrt{2}}{\\pi} V \\approx 0.90 V$\n3상 반파: $V_d = \\frac{3\\sqrt{3}V_m}{2\\pi} = \\frac{3\\sqrt{6}}{2\\pi} V \\approx 1.17 V$\n3상 전파: $V_d = \\frac{3\\sqrt{3}V_m}{\\pi} = \\frac{3\\sqrt{6}}{\\pi} V \\approx 2.34 V$ (선간전압 시 $V_L = \\sqrt{3}V$로 1.35)","img":null,"expImg":null},{"id":3,"text":"자여자 발전기의 전압확립 조건으로 틀린 것은?","opts":["회전방향에 무관할 것","무부하 포화곡선은 자기포화를 가질 것","잔류자기가 존재할 것","계자저항이 임계저항 이하일 것"],"answer":0,"exp":"자여자 발전기 → 잔류자기에 의한 발전기\n회전방향을 바꾸면 잔류자기가 소멸되므로 1번","img":null,"expImg":null},{"id":4,"text":"특수 동기기에 대한 설명 중 잘못 연결된 것은?","opts":["반작용 전동기 : 역률이 좋다.","유도 등기 전동기 : 기동 토크와 인입 토크가 크다.","등기 주파수 변환기 : 조작이 간편하고 효율이 좋다.","정현파 발전기 : 부하에 관계없이 정현파 기전력을 발생"],"answer":0,"exp":"반작용 전동기: 직류여자기가 없음 → 역률이 나쁘다.","img":null,"expImg":null},{"id":5,"text":"직류발전기에서 자속을 끊어 기전력을 유기시키는 부분을 무엇이라 하는가?","opts":["계자","전기자","정류자","계철"],"answer":1,"exp":"","img":null,"expImg":null},{"id":6,"text":"용량 1[kVA], 3,000/200[V]의 단상 변압기를 단권변압기로 결선해서 3,000/3,200[V]의 승압기로 사용할 때 그 부하 용량[kVA]은?","opts":["16","15","10","1"],"answer":0,"exp":"부하 용량($P_L$)은 부하 전압을 승압 전압으로 나눈 값에 자기용량을 곱함.\n변압기 자기용량 ($P_s$): 1[kVA]\n승압된 전압 ($e$): $3,200 - 3,000 = 200[V]$\n부하 전압 ($V_2$): 3,200[V]\n$$P_L = \\frac{3,200}{200} \\times 1 = 16\\text{ [kVA]}$$","img":null,"expImg":null},{"id":7,"text":"동기발전기를 회전계자형으로 하는 이유로 옳은 것은?","opts":["절연이 용이하다.","고주파 발전기로 사용할 수 있다.","회전자 관성을 줄일 수 있다.","기전력의 파형을 개선한다."],"answer":0,"exp":"","img":null,"expImg":null},{"id":8,"text":"브러시의 이동으로 속도제어가 가능한 전동기는 무엇인가?","opts":["단상 직권전동기","직류 직권전동기","반발전동기","정류자형 주파수 변환기"],"answer":2,"exp":"","img":null,"expImg":null},{"id":9,"text":"3상 유도전동기의 원선도 작성에 필요한 기본량을 구하기 위한 시험이 아닌 것은?","opts":["충격 전압 시험","저항측정 시험","무부하 시험","구속 시험"],"answer":0,"exp":"","img":null,"expImg":null},{"id":10,"text":"50[kW]를 소비하는 동기 전동기가 역률 0.8의 부하 300[kW]와 병렬로 접속되고 있을 때 합성부하에 0.9의 역률을 가지게 하려면 전동기의 진상 무효전력[kVar]은?","opts":["35.5","55.5","75.5","95.5"],"answer":1,"exp":"역률 0.8일 때, 무효율은 0.6 ($\\sin\\theta_1 = 0.6$)\n* 무효전력 $Q_L = 300 \\times \\frac{0.6}{0.8} = 225\\text{ [kVar]}$\n\n합성 유효전력($P$) = 부하 유효전력 + 전동기 유효전력\n$P = 300 + 50 = 350\\text{ [kW]}$\n\n역률 0.9일 때 필요한 전체 무효전력($Q_{total}$)\n$Q_{total} = 350 \\times \\frac{\\sqrt{1 - 0.9^2}}{0.9} \\approx 169.51\\text{ [kVar]}$\n\n전동기의 진상 무효전력($Q_c$) \n부하 무효전력 - 합성 후 필요한 무효전력 = 전동기가 부담할 진상 무효전력\n$Q_c = 225 - 169.51 = 55.49\\text{ [kVar]}$","img":null,"expImg":null},{"id":11,"text":"그림과 같이 접속된 회로의 단자 a, b에서 본 등가 임피던스는 어떻게 표현되는가? 단, M[H]는 두 코일 $L_1, L_2$ 사이의 상호 인덕턴스이다.","opts":["$R_1+R_2+j\\omega(L_1+L_2)$","$R_1-R_2+j\\omega(L_1-L_2)$","$R_1+R_2+j\\omega(L_1+L_2+2M)$","$R_1+R_2+j\\omega(L_1+L_2-2M)$"],"answer":3,"exp":"저항 성분: 직렬로 연결되어 있으므로 저항은 단순히 합산된다 ($R_1 + R_2$)\n그림에서 두 코일 $L_1, L_2$의 상단에 점(Dot)이 표시 → 차동접속($R_1 + R_2 + j\\omega(L_1 + L_2 - 2M)$)\n*등가 임피던스 $Z$\n $$Z = R_1 + R_2 + j\\omega(L_1 + L_2 - 2M)$$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCALBAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFB p":"바깥쪽에 연결된 각 변의 저항은 $6[\\Omega]$인 $\\Delta$결선\n이를 Y결선으로 변환하면 각 가지의 저항은 $\\Delta$결선 값의 $\\frac{1}{3}$이 되므로, $6 \\times \\frac{1}{3} = 2[\\Omega]$이 된다.\n\n회로 내부에는 이미 각각 $2[\\Omega]$인 Y결선 저항이 존재\n방금 변환한 Y결선(각 가지 $2[\\Omega]$)과 기존의 Y결선(각 가지 $2[\\Omega]$)이 서로 병렬로 연결된다.\n따라서 합성된 최종 Y결선의 각 가지 저항은 다음과 같다:$$2[\\Omega] \\parallel 2[\\Omega] = 1[\\Omega]$$\n\n단자 $a$에 연결된 $3[\\Omega]$ 저항을 통과해 상단 꼭짓점으로 들어간다.상단 꼭짓점과 연결된 Y결선의 상단 가지($1[\\Omega]$)를 거쳐 중성점으로 모이고, 중성점에서 다시 단자 $b$가 연결된 좌측 꼭짓점의 가지($1[\\Omega]$)로 빠져나간다. (우측 가지는 전류가 흐르지 않는 열린 경로가 됨)따라서 최종 합성저항 $R_{ab}$는 직렬 연결된 저항들의 합이 된다:$$R_{ab} = 3[\\Omega] \\text{ (외곽 직렬저항)} + 1[\\Omega] \\text{ (Y 상단 가지)} + 1[\\Omega] \\text{ (Y 좌측 가지)} = 5[\\Omega]$$\n","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAGhAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LA4ooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKBRQAUUUUAFFFFABRRRQAUUUUAFFFFAB )$$\n\n기서 $e^{-10}$은 매우 작은 값이므로 0으로 근사하면,$$I_{av} \\approx -0.1 \\times (0 - 1) = 0.1 \\times 1 = 1[\\text{A}]$$\n","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAFJAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7KFLQKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooqK7nitbWW5nYLFEhd2PYAZJoAloqj4e1ay13Q7LWdOk8yzvYVmhf1VhkVeoAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooABRRRQAUUUUAFFFFABRRRQAUVX1K+s9Nspb2/uYra2iG55ZWCqo9ya434dWHhqbV/EHjbQfEl5rCatMFnD3ZkhtjEMGNE/gx1OeefTFAHWX2r6dY39nYXN0iXV6xW3h6tJgZJAHYevSr1eX/B6YeIZNZ+Jur4X7bPLBpxkPFtYxMVXHOBuKlyfcelYGqfF3Sbz476NoWneMdOh0C30+Se+dJlKTzuwWOLd69Tgc0AeyWOp2F7dXVra3Uck9o4juIwfmjJGRkfSvMP2t/GB8G/A/W7qGTZd30f2G2wcHdJwSPoMn8Kv/FW4i8K+JPDvjeBhDHJex6bqRXpLDKcISO5ViCPqa+eP+Cj3ilZLzw74QglP7pXvbhR0yflXP60Aes/sMeKR4g+Bdlp8km6fRpns2B67M7l/RsfhXvNfCf8AwTp8VrY+OtY8Jzy4TU7b7RAp7yR9f/HSfyr7soAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKK AUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAf//Z","expImg":null},{"id":19,"text":"$R=3[\\Omega], \\omega L=4[\\Omega]$인 R-L 직렬회로에 $v(t)=100\\sqrt{2}\\sin\\omega t+30\\sqrt{2}\\sin 3\\omega t$[V]의 전압을 가했을 때, 전류의 실효값[A]은 얼마인가?","opts":["18.15","22.15","20.15","24.15"],"answer":2,"exp":"기본 성분과 고조파 성분의 임피던스 계산\n저항 $R = 3[\\Omega]$\n기본파($n=1$)일 때\n유도성 리액턴스 $X_{L1} = 1 \\times \\omega L = 4[\\Omega]$\n임피던스 $Z_1 = \\sqrt{3^2 + 4^2} = 5[\\Omega]$\n\n제3고조파($n=3$)일 때\n유도성 리액턴스 $X_{L3} = 3 \\times \\omega L = 3 \\times 4 = 12[\\Omega]$\n임피던스 $Z_3 = \\sqrt{3^2 + 12^2} = \\sqrt{9 + 144} = \\sqrt{153}[\\Omega]$\n\n각 성분별 전류의 실효값 계산\n기본파 전류의 실효값 ($I_1$)\n$V_1 = 100[\\text{V}]$\n$I_1 = \\frac{100}{5} = 20[\\text{A}]$ (제곱하면 $400[\\text{A}^2]$)\n제3고조파 전류의 실효값 ($I_3$)\n$V_3 = 30[\\text{V}]$\n$I_3 = \\frac{30}{\\sqrt{153}}[\\text{A}]$ (제곱하면 $\\frac{900}{153} = \\frac{100}{17} \\approx 5.88[\\text{A}^2]$)\n\n전체 전류의 실효값 ($I$) 계산\n$I = \\sqrt{I_1^2 + I_3^2} = \\sqrt{20^2 + \\left(\\frac{30}{\\sqrt{153}}\\right)^2} = \\sqrt{400 + \\frac{900}{153}}$","img":null,"expImg":null},{"id":20,"text":"정현파 교류전압의 평균값은 최대값의 약 몇 [%]인가?","opts":["50.1","63.7","70.7","90.1"],"answer":1,"exp":"$$V_{av} = \\frac{2}{\\pi} V_m \\approx 0.636 V_m$$","img":null,"expImg":null},{"id":21,"text":"그림과 같은 회로의 출력전압 $e_2(t)$의 위상은 입력전압 $e_1(t)$의 위상보다 어떻게 되는가?","opts":["앞선다.","뒤진다.","동상이다.","90°앞선다."],"answer":1,"exp":"직렬로 인덕터($L$), 병렬로 저항($R$)이 연결된 $R-L$ 직렬회로(또는 전압분배 회로) 형태이다.\n$R-L$ 회로에서는 인덕턴스 때문에 전류의 위상이 전압보다 뒤처진다.\n저항 $R$ 양단의 전압($V_R = I \\times R$)은 전류와 위상이 동상이다.\n전류가 전압보다 뒤처지므로, 저항 전압인 출력전압 $e_o(t)$ 역시 입력전압 $e_i(t)$보다 위상이 뒤지게 된다. ","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAHBAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDK  다음과 같다.\n$$I = I'' - I' = 4[\\text{A}] - 2[\\text{A}] = 2[\\text{A}]$$\n\n옴의 법칙에 의해 $1[\\Omega]$ 저항 양단에 걸리는 전압\n$$V = I \\times 1[\\Omega] = 2[\\text{A}] \\times 1[\\Omega] = 2[\\text{V}]$$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCACiAP4DASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6tpV607A9KKACmt1p1IRmgBtFLt96NvvQAlFLt96dgelADKKUrzxSEY9KACikDKSQGBI6jPSjcu7buG7GcZ5oAWiiigAopy9KaetABRRRg+lABSgetOooAKKKUCgBKKdRQA2lHSlooAKKKKAAUtFFABSGlooAjyaWnUUANop1FADaKdSUAJRQSPWjI9aACuL+K9xp8GjNFea4mlzXkEtra+bOIk8xwMSZPJKdRg/zrs8j1FYPjHVLHTYrFruxjvPPu0hAYKfLBPzPz2UcmgDz/UJrVPENho+t6qyabd6lNFO/2gwtdSpbRmMMykHaTuOBxkCtr4cXAuIdEZbs30O3UVtbky+azW4nURBn6k7dvJ54rat7zR18SavZHT41ayiW6edlBDuR8+3PQqoTP+8Kt+EHstT0qx1qPS/7PmaFlEBwDDlsupA4zkc/SgDdP0pVPFKfWigBahNzbef5Bmj83+5uG78qmwcdK4O60USfEiC9bXLL7VFcG8jsQQJfINv5Jyuckbjnd7gdqAO9HSlpoNBNABQKXNGRQAUtJn60ZoAWikzRmgBaSjNFABSio4pYpt/lOr7GKNg5ww6j61KKACjNFFABRRRQA3HvRj3pcUYoATHvRS4oxQAlZeu2lvfTWMF1EJYjMSUJ4PyNjPrWriqV6P8AiYWI/wCmjH/xw0AUz4Y0E/8AMKtR/wAAoHhjQhyumW4+gxWzRQBkjw9pAGBZgD0DsP61Fc+GtLa2uFhtFWaSF41csWK7hg4yeK26KAODj0DXZdE0c3MEA1GWYrqx8zIWKQgyhT3+4gAq/aaBdv4o1FrvzU0kYks1huXTMj8y7gpHQqMf7xrraKAMk6Bp2OPtgPtezD/2amnw/p5/ivh/2/z/APxdbFFAGOfDumkcm/z/ANhCf/4uuBPwl8NH42HxsLvWFv8A+zPLMYvpAhP3N2 const title="26년 2회 산업기사 51~100";
let Q=QS,cur=0,score=0,round=1,ans=new Array(Q.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+Q.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=Q[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===Q.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+Q.length+(round>1?' · 오답 '+(round-1)+'차':'')+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===Q[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function wrongIdx(){
  const r=[];
  for(let i=0;i<Q.length;i++){ if(ans[i]===null||!ans[i].ok) r.push(i); }
  return r;
}
function result(){
  const total=Q.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100);
  const wrong=wrongIdx(),skipped=total-done,retryMode=round>1;
  const pass=pct>=60;
  const col=retryMode?(wrong.length===0?'#3fb950':'#58a6ff'):(pass?'#3fb950':'#f85149');
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  let rt,sub;
  if(retryMode){
    rt=wrong.length===0?'🎉 오답 정복 완료!':'📝 오답 재풀이 '+(round-1)+'차 결과';
    sub=total+'문제 중 '+score+'문제 정답'+(wrong.length?' · 아직 '+wrong.length+'문제 남았어요':'');
  } else {
    rt=pass?'🎉 합격!':'😥 불합격';
    sub=pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다';
  }
  let note='';
  if(wrong.length){
    note='<div class="res-note">다시 볼 문제: '+wrong.map(i=>'Q'+String(Q[i].id).padStart(2,'0')).join(' ')+(skipped?'<br>안 푼 문제 '+skipped+'개도 다시 풀기에 포함돼요':'')+'</div>';
  }
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+col+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+rt+'</div>'+
    '<div class="res-sub">'+sub+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div>'+note+
    (wrong.length?'<button class="retry wrong" onclick="retryWrong()">❌ '+(skipped?'오답·미풀이 ':'오답 ')+wrong.length+'문제만 다시 풀기</button>':'')+
    '<button class="retry'+(wrong.length?' sub':'')+'" onclick="restart()">🔄 '+(retryMode?'전체 문제 처음부터 다시 풀기':'처음부터 다시 풀기')+'</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function retryWrong(){
  const w=wrongIdx(); if(!w.length) return;
  Q=w.map(i=>Q[i]); round++;
  cur=0; score=0; ans=new Array(Q.length).fill(null); cache={}; render();
}
function restart(){Q=QS;round=1;cur=0;score=0;ans=new Array(Q.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/Q.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
</body>
</html>
