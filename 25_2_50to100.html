<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>25년 2회 산업기사 51~100</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.retry.wrong{background:linear-gradient(135deg,#f85149,#d29922);color:#fff;}
.retry.sub{background:#21262d;color:#8b949e;border:1px solid #30363d;margin-top:8px;}
.res-note{font-size:12px;color:#8b949e;line-height:1.7;margin:-12px 0 20px;word-break:keep-all;}
</style>

<script>
const QS=[{"id":1,"text":"스텝각이 $3^\\circ$ , 스테핑주파수 ( pulse rate ) 가 $1,200$ [ rps ] 인 스테핑모터의 축속도 [ rps ] 는?","opts":["$8$","$10$","$12$","$14$"],"answer":1,"exp":"스텝각 $3^\\circ$ 라면 $1$ 회전 시 $120$ 개의 펄스가 필요하므로 $120$ [ Hz ] = $120$ [ rps ] 이며 \n따라서 $1,200$ [ rps ] 라면 초 당 $10$ 회전되므로 $10$ [ rps ] 가 된다.","img":null,"expImg":null},{"id":2,"text":"용량 $1$ [ kVA ] , $3,000 / 200$ [ V ] 의 단상 변압기를 단권변압기로 결선해서 $3,000 / 3,200$ [ V ] 의 승압기로 사용할 때 그 부하 용량 [ kVA ] 은?","opts":["$16$","$15$","$10$","$1$"],"answer":0,"exp":"자기용량 / 부하용량 = $\\frac{e_2 I_2}{V_h I_2} = \\frac{e_2}{V_h} \\fallingdotseq \\frac{V_h - V_l}{V_h}$\n부하용량 = $\\frac{V_h}{e_2} \\times \\text{자기용량} = \\frac{3,200}{200} \\times 1 = 16$ [ kVA ]","img":null,"expImg":null},{"id":3,"text":"직류발전기에서 자속을 끊어 기전력을 유기시키는 부분을 무엇이라 하는가?","opts":["계자","전기자","정류자","계철"],"answer":1,"exp":"직류기의 3요소\n전기자 : 유기전력 발생\n계자 : 자속을 공급\n정류자 : 교류를 직류로 변환","img":null,"expImg":null},{"id":4,"text":"변압기의 정격을 정의한 것 중 옳은 것은?","opts":["전부하의 경우 $1$ 차 단자전압을 정격 $1$ 차 전압이라 한다.","정격 $2$ 차 전압은 명판에 기재되어 있는 $2$ 차 권선의 단자 전압이다.","정격 $2$ 차 전압을 $2$ 차 권선의 저항으로 나눈 것이 정격 $2$ 차 전류이다.","$2$ 차 단자 간에서 얻을 수 있는 유효전력을 [ kW ] 로 표시한 것이 정격출력이다."],"answer":1,"exp":"변압기의 정격 : 변압기 명판에 기재되어 있는 사항","img":null,"expImg":null},{"id":5,"text":"자여자 발전기의 전압확립 조건으로 틀린 것은?","opts":["회전방향에 무관할 것","무부하 포화곡선은 자기포화를 가질 것","잔류자기가 존재할 것","계자저항이 임계저항 이하일 것"],"answer":0,"exp":"","img":null,"expImg":null},{"id":6,"text":"직류기에서 전압변동률이 ( - ) 로 표시되는 발전기는?","opts":["분권발전기","평복권발전기","과복권발전기","타여자발전기"],"answer":2,"exp":"전압변동률 $\\epsilon = \\frac{V_0 - V}{V} \\times 100 = \\frac{E - V}{V} \\times 100 = \\frac{I_a R_a}{V} \\times 100$ [ $\\%$ ] 에서\n$\\epsilon ( + )$ : 분권 , 타여자 발전기 ( $V_0 > V$ )\n$\\epsilon ( 0 )$ : 평복권 ( $V_0 = V$ : 무부하 전압 = 정격전압 ) \n$\\epsilon ( - )$ : 과복권 발전기 ( $V_0 < V$ )","img":null,"expImg":null},{"id":7,"text":"3상 유도전동기의 회전자 입력이 $P_2$ , 슬립이 $s$ 일 때 2차 동손은?","opts":["$\\frac{P_2}{s}$","$s P_2$","$( 1 - s ) P_2$","$\\frac{1 - s}{s} P_2$"],"answer":1,"exp":"2차 동손 $P_{c2} = s P_2$","i ull},{"id":13,"text":"전압 $v = 10 \\sin 10t + 20 \\sin 20t$ [ V ] 이고, 전류 $i = 20 \\sin 10t + 10 \\sin 20t$ [ A ] 일 때 소비전력은 몇 [ W ] 인가?","opts":["$141$","$200$","$300$","$400$"],"answer":1,"exp":"유효전력 ( 평균전력 ) 은 주파수가 같을 때만 발생되므로\n$P = V_1 I_1 \\cos \\theta_1 + V_2 I_2 \\cos \\theta_2$ 에서\n$P = \\frac{10}{\\sqrt{2}} \\times \\frac{20}{\\sqrt{2}} \\cos 0^\\circ + \\frac{20}{\\sqrt{2}} \\times \\frac{10}{\\sqrt{2}} \\cos 0^\\circ = 200$ [ W ]","img":null,"expImg":null},{"id":14,"text":"저항 $R = 6$ [ $\\text{k}\\Omega$ ] 인덕턴스 $L = 90$ [ mH ] 커패시턴스 $C = 0.01$ [ $\\mu\\text{F}$ ] 인 직렬회로에 $t = 0$ 에서 직류전압 $E = 100$ [ V ] 를 가했다. 흐르는 전류의 최대값 [ mA ] 구하면?","opts":["$11.8$","$12.3$","$14.7$","$15.6$"],"answer":1,"exp":"R - L - C 직렬회로에서\n$R^2 = ( 6 \\times 10^3 )^2 = 36 \\times 10^6$ 이며 $4\\frac{L}{C} = 4 \\times \\frac{90 \\times 10^{-3}}{0.01 \\times 10^{-6}} = 36 \\times 10^6$ 이므로\n$R^2 = \\frac{4L}{C}$ , 즉 임계제동이 되며\n이때, 전류는 $i ( t ) = \\frac{E}{L} t \\cdot e^{-\\frac{R}{2L} t}$ 에서\n전류가 최대로 되는 시간은\n$\\frac{d i ( t )}{d t} = \\frac{E}{L} \\cdot e^{-\\frac{R}{2L} t} - \\frac{R}{2L} \\cdot \\frac{E}{L} t e^{-\\frac{R}{2L} t} = 0$\n$1 = \\frac{R}{2L} t$ \n$\\therefore t = \\frac{2L}{R} = \\frac{2 \\times 90 \\times 10^{-3}}{6 \\times 10^3} = 30 \\times 10^{-6} = 30$ [ $\\mu\\text{s}$ ]\n전류 $i ( t ) = \\frac{E}{L} t \\cdot e^{-\\frac{R}{2L} t} = \\frac{100}{90 \\times 10^{-3}} \\times 30 \\times 10^{-6} \\times e^{-\\frac{6 \\times 10^3}{2 \\times 90 \\times 10^{-3}} \\times 30 \\times 10^{-6}} = 12.3$ [ mA ] ","img":null,"expImg":null},{"id":15,"text":"비정현파 전압 $v = 100 \\sqrt{2} \\sin \\omega t + 50 \\sqrt{2} \\sin 2 \\omega t + 30 \\sqrt{2} \\sin 3 \\omega t ( V )$ 의 왜형률은 약 얼마인가?","opts":["$0.36$","$0.58$","$0.87$","$1.0$"],"answer":1,"exp":"왜형률 = $\\frac{\\text{각 고조파의 실효값의 합}}{\\text{기본파의 실효값}}$\n= $\\frac{\\sqrt{V_2^2 + V_3^2}}{V_1} = \\frac{\\sqrt{50^2 + 30^2}}{100} = 0.58$","img":null,"expImg":null},{"id":16,"text":"코일의 권수 $N = 1,000$ 회이고, 코일의 저항 $R = 10$ [ $\\Omega$ ] 이다. 전류 $I = 10$ [ A ] 를 흘릴 때 코일의 권수 1회에 대한 자속이 $\\phi = 3 \\times 10^{-2}$ [ Wb ] 이라면 이 회로의 시정수 [ s ] 는?","opts":["$0.3$","$0.4$","$3.0$","$4.0$"],"answer":0,"exp":"R - L 직렬회로의 시정수 $\\tau = \\frac{L}{R}$ 에서\n인덕턴스 $L = \\frac{N \\phi}{I} = \\frac{1,000 \\times 3 \\times 10^{-2}}{10} = 3$ [ H ]\n$\\therefore \\tau = \\frac{L}{R} = \\frac{3}{10} = 0.3$ [ sec ]","img":null,"expImg":null},{"id":17,"text":"$30$ [ $\\Omega$ ] 의 저항과 $40$ [ $\\Omega$ ] 의 유도성 리액턴스가 병렬로 연결되어 있다. 이 $R - L$ 병렬 회로에 $v = 220 \\sqrt{2} \\sin 377t$ [ V ] 의 전압을 가할 때 전원에 흐르는 전류 [ A ] 는 약 얼마인가?","opts":["$i = 12.96 \\sin ( 377t - 36.87^\\circ )$","$i = 9.17 \\sin ( 377t - 36.87^\\circ )$","$i = 12.96 \\angle -36.87^\\circ$","$i = 10.37 + j7.78$"],"answer":0,"exp":"$R - L$ 병렬회로  \n전체 전류 $I = I_R - j I_L$ \n저항에 흐르는 전류 $I_R = \\frac{E}{R} = \\frac{220}{30} = 7.33$ [ A ]\n인덕터에 흐르는 전류 $I_L = \\frac{E}{j X_L} = \\frac{220}{j 40} = -j 5.5$ [ A ]\n전체 전류 $I = I_R - j I_L = 7.33 - j 5.5$\n따라서 전류 $\\vert{} I \\vert{} = \\sqrt{7.33^2 + 5.5^2} = 9.16$ [ A ] 위상 $\\theta = \\tan^{-1} \\frac{R}{\\omega L} = \\tan^{-1} \\frac{30}{40} = 36.87^\\circ$\n따라서, 전류의 순시값 $i = \\sqrt{2} \\times 9.16 \\sin ( 377t - 36.87^\\circ ) = 12.96 \\sin ( 377t - 36.87^\\circ )$","img":null,"expImg":null},{"id":18,"text":"3상 평형회로에서 선간전압이 $200$ [ V ] 이고 각 상의 임피던스가 $24 + j7$ [ $\\Omega$ ] 인 Y결선 3상 부하의 유효전력은 약 몇 [ W ] 인가?","opts":["$192$","$512$","$1,536$","$4,608$"],"answer":2,"exp":"3상 유효전력은 $P = 3 V_p I_p \\cos \\theta = 3 I_p^2 R$ [ Var ] \nY결선이므로 $I_l = I_p$ \n여기서, 상전류는 $I_p = \\frac{V_p}{Z} = \\frac{\\frac{200}{\\sqrt{3}}}{24 + j7} = \\frac{\\frac{200}{\\sqrt{3}}}{\\sqrt{24^2 + 7^2}}$ [ A ] \n3상 유효전력은 $P = 3 I_p^2 R = 3 \\times \\left( \\frac{\\frac{200}{\\sqrt{3}}}{\\sqrt{24^2 + 7^2}} \\right)^2 \\times 24 = 1,536$ [ W ]","img":null,"expImg":null},{"id":19,"text":"인덕턴스가 $L$ 인 유도기에 $i = \\sqrt{2} I \\sin \\omega t$ [ A ] 의 전류가 흐를 때 유도기에 축적되는 에너지 [ J ] 는?","opts":["$\\frac{1}{2} L I^2 \\sin^2 \\omega t$","$\\frac{1}{2} L I^2 ( 1 - \\cos 2 \\omega t )$","$\\frac{1}{2} L I^2 \\cos 2 \\omega t$","$\\frac{1}{2} L I^2 \\sin 2 \\omega t$"],"answer":1,"exp":"순시에너지\n$W = \\frac{1}{2} L i^2 = \\frac{1}{2} L ( \\sqrt{2} I \\sin \\omega t )^2 = \\frac{1}{2} L ( 2 I^2 \\sin^2 \\omega t ) = L I^2 \\frac{1 - \\cos 2 \\omega t}{2}$\n$= \\frac{1}{2} L I^2 ( 1 - \\cos 2 \\omega t )$ [ J ]","img":null,"expImg":null},{"id":20,"text":"$F ( t ) = \\sin t \\cdot \\cos t$ 를 라플라스 변환하면?","opts":["$\\frac{1}{s + 4}$","$\\frac{1}{s^2 + 4}$","$\\frac{1}{( s + 2 )^2}$","$\\frac{1}{( s + 4 )^2}$"],"answer":1,"exp":"삼각함수 2배각 공식 $\\sin 2\\alpha = 2 \\sin \\alpha \\cos \\alpha$ 에서\n$\\sin t \\cos t = \\frac{1}{2} \\sin 2t$ 이므로\n$F ( s ) = \\mathcal{L} [ \\sin t \\cos t ] = \\mathcal{L} \\left[ \\frac{1}{2} \\sin 2t \\right] = \\frac{1}{2} \\cdot \\frac{2}{s^2 + 2^2} = \\frac{1}{s^2 + 2^2} = \\frac{1}{s^2 + 4}$","img":null,"expImg":null},{"id":21,"text":"T형 4단자 회로망에서 영상 임피던스가 $Z_{01} = 75$ [ $\\Omega$ ] , $Z_{02} = 3$ [ $\\Omega$ ] 이고, 전달 정수가 $0$ 일 때 이 회로의 4단자 정수 $D$ 의 값은?","opts":["$2$","$3$","$4$","$5$"],"answer":3,"exp":"영상임피던스와 4단자 정수와의 관계\n$Z_{01} Z_{02} = \\frac{B}{C}$ , $\\frac{Z_{01}}{Z_{02}} = \\frac{A}{D}$\n영상전달정수 $\\theta = \\log_e ( \\sqrt{AD} + \\sqrt{BC} )$ \n$= \\cosh^{-1} \\sqrt{AD} = \\sinh^{-1} \\sqrt{BC}$\n따라서, $A = \\sqrt{\\frac{Z_{01}}{Z_{02}}} \\cosh \\theta$\n$B = \\sqrt{Z_{01} Z_{02}} \\sinh \\theta$\n$C = \\frac{1}{\\sqrt{Z_{01} Z_{02}}} \\sinh \\theta$ \n$D = \\sqrt{\\frac{Z_{02}}{Z_{01}}} \\cosh \\theta$\n여기서, $A = \\sqrt{\\frac{Z_{01}}{Z_{02}}} \\cosh \\theta = \\sqrt{\\frac{75}{3}} \\cosh 0 = 5$","img":null,"expImg":null},{"id":22,"text":"3상 회로에 $\\Delta$ 결선된 평형 순저항 부하를 사용하는 경우 선간전압 $220$ [ V ], 상전류가 $3.67$ [ A ]라면 1상의 부하저항은 약 몇 [ $\\Omega$ ]인가?","opts":["$80$","$60$","$45$","$30$"],"answer":1,"exp":"$\\Delta$ 결선 $V_l = V_p$ 에서\n임피던스 $Z = \\frac{V_p}{I_p} = \\frac{220}{3.67} = 60$ [ $\\Omega$ ]","img":null,"expImg":null},{"id":23,"text":"그림에서 단자 a, b에 나타나는 전압 $V_{ab}$ 는 몇 [ V ] 인가?","opts":["$3.4$","$4.3$","$5.7 swer":2,"exp":"(KEC 334.2조) 지중함의 시설\n폭발성 또는 연소성의 가스가 침입할 우려가 있는 것에 시설하는 지중함으로서 그 크기가 1[ $\\text{m}^3$ ] 이상인 것에는 통풍장치 기타 가스를 방산시키기 위한 적당한 장치를 시설할 것","img":null,"expImg":null},{"id":32,"text":"저압전선로를 다리의 윗면에 시설하는 경우 전선의 높이를 다리의 노면 상 몇 [ m ] 이상으로 하여 시설하는가?","opts":["$6.5$","$3$","$4$","$5$"],"answer":3,"exp":"(KEC 335.6조) 교량에 시설하는 전선로\n교량의 윗면에 시설하는 것 : 전선의 높이는 교량의 노면상 5 [ m ] 이상","img":null,"expImg":null},{"id":33,"text":"옥내전로의 대지전압에 대한 내용이다. ( )안에 알맞은 숫자를 바르게 나열한 것은?","opts":["㉠ : $1$, ㉡ : $500$","㉠ : $1$, ㉡ : $300$","㉠ : $3$, ㉡ : $300$","㉠ : $3$, ㉡ : $500$"],"answer":2,"exp":"(KEC 231.6조) 옥내전로의 대지 전압의 제한\n주택의 전로 인입구에는 「전기용품 및 생활용품 안전관리법」에 적용을 받는 감전보호용 누전차단기를 시설하여야 한다. 다만, 전로의 전원측에 정격용량이 3 [ kVA ] 이하인 절연변압기(1차 전압이 저압이고 2차 전압이 300 [ V ] 이하인 것에 한한다)를 사람이 쉽게 접촉할 우려가 없도록 시설하고 또한 그 절연변압기의 부하측 전로를 접지하지 않는 경우에는 예외로 한다.","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCABVAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6N8I+DtN1DwppF/d6p4oe4ubGGaVh4lv13O0aknAmwOSeBWr/AMIHo3/QR8U/+FNqH/x6r3gD/kRPD/8A2C7b/wBFLWtdytBayzrDLOY0LiKIDe+BnauSBk9Bkit6lWam0m9znpUoOEW0tjyO/wBd+FFhqA0+78VeL4rppHiSI6rrJLsudwXDfNgAnjPHNaV63w4sfDln4ivvFHia00y9nNvbzT+INUjLyfP8u1pAwP7t+o7VxmuQx32tWEvjXSPiDeeJbyV4tCubWG0tRp7qDK32VFnYI+xPmaQvvC7T8p21qePNN8W+IfhxpV1 7c0z/n4f8A78v/AIUf25pn/Pw//fl/8K0dq/3R+VG1f7o/Ki9Ps/v/AOAHLW/mX3P/ADM7+3NM/wCfh/8Avy/+FH9uaZ/z8P8A9+X/AMK0dq/3R+VG1f7o/Ki9Ps/v/wCAHLW/mX3P/Mzv7c0z/n4f/vy/+FH9uaZ/z8P/AN+X/wAK0dq/3R+VG1f7o/Ki9Ps/v/4Actb+Zfc/8zO/tzTP+fh/+/L/AOFX4ZUmiWWM5RxlTgjI/GnbV/uj8qUDFTJx+yv6+4uCqL4mn6K36sKKKKg0CiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooA//9k="},{"id":47,"text":"전차선의 가선방식 중 표준으로 사용하는 방식이 아닌 것은?","opts":["가공방식","강체방식","제3레일방식","급전방식"],"answer":3,"exp":"(KEC 402조) 전기철도의 용어 정의\n전기철도차량에 전력을 공급하는 전차선의 가선방식은 가공식, 강체식, 제3궤조식으로 분류한다.","img":null,"expImg":null},{"id":48,"text":"고압 가공전선로의 가공지선에 사용하는 나경동선은 지름 몇 [ mm ] 이상의 것을 사용하여야 하는가?","opts":["$5.0$","$2.0$","$3.0$","$4.0$"],"answer":3,"exp":"(KEC 332.6조) 고압 가공전선로의 가공지선\n고압 가공전선로에 사용하는 가공지선은 인장강도 $5.26$ [ kN ] 이상의 것 또는 지름 $4$ [ mm ] 이상의 나경동선 사용","img":null,"expImg":null},{"id":49,"text":"저압 가공전선으로 사용할 수 없는 것은?","opts":["케이블","절연전선","다심형 전선","나동복 전선"],"answer":3,"exp":"(KEC 222.5조) 저압 가공전선의 굵기 및 종류\n저압 가공전선은 나전선(중성선 또는 다중접지된 접지측 전선으로 사용하는 전선에 한한다), 절연전선, 다심형 전선 또는 케이블을 사용하여야 한다.","img":null,"expImg":null},{"id":50,"text":"주택의 시설하는 전기저장장치는 이차전지에서 전력변환장치에 이르는 옥내 직류전로에 지락이 생겼을 때 자동으로 전로를 차단하는 장치를 시설할 경우 옥내전로의 대지전압은 직류 몇 [ $V$ ] 까지 적용할 수 있는가?","opts":["$110$","$300$","$600$","$1,000$"],"answer":2,"exp":"(KEC 511.3조) 전기저장장치 옥내전로의 대지전압 제한\n주택의 전기저장장치의 축전지에 접속하는 부하 측 옥내배선을 다음에 따라 시설하는 경우에 주택의 옥내전로의 대지전압은 직류 $600$ [ $V$ ] 까지 적용할 수 있다.","img":null,"expImg":null}];
const title="25년 2회 산업기사 51~100";
let Q=QS,cur=0,score=0,round=1,ans=new Array(Q.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+Q.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=Q[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===Q.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+Q.length+(round>1?' · 오답 '+(round-1)+'차':'')+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===Q[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function wrongIdx(){
  const r=[];
  for(let i=0;i<Q.length;i++){ if(ans[i]===null||!ans[i].ok) r.push(i); }
  return r;
}
function result(){
  const total=Q.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100);
  const wrong=wrongIdx(),skipped=total-done,retryMode=round>1;
  const pass=pct>=60;
  const col=retryMode?(wrong.length===0?'#3fb950':'#58a6ff'):(pass?'#3fb950':'#f85149');
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  let rt,sub;
  if(retryMode){
    rt=wrong.length===0?'🎉 오답 정복 완료!':'📝 오답 재풀이 '+(round-1)+'차 결과';
    sub=total+'문제 중 '+score+'문제 정답'+(wrong.length?' · 아직 '+wrong.length+'문제 남았어요':'');
  } else {
    rt=pass?'🎉 합격!':'😥 불합격';
    sub=pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다';
  }
  let note='';
  if(wrong.length){
    note='<div class="res-note">다시 볼 문제: '+wrong.map(i=>'Q'+String(Q[i].id).padStart(2,'0')).join(' ')+(skipped?'<br>안 푼 문제 '+skipped+'개도 다시 풀기에 포함돼요':'')+'</div>';
  }
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+col+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+rt+'</div>'+
    '<div class="res-sub">'+sub+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div>'+note+
    (wrong.length?'<button class="retry wrong" onclick="retryWrong()">❌ '+(skipped?'오답·미풀이 ':'오답 ')+wrong.length+'문제만 다시 풀기</button>':'')+
    '<button class="retry'+(wrong.length?' sub':'')+'" onclick="restart()">🔄 '+(retryMode?'전체 문제 처음부터 다시 풀기':'처음부터 다시 풀기')+'</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function retryWrong(){
  const w=wrongIdx(); if(!w.length) return;
  Q=w.map(i=>Q[i]); round++;
  cur=0; score=0; ans=new Array(Q.length).fill(null); cache={}; render();
}
function restart(){Q=QS;round=1;cur=0;score=0;ans=new Array(Q.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/Q.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
