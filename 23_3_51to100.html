<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>23년 3회 산업기사 51~100</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.retry.wrong{background:linear-gradient(135deg,#f85149,#d29922);color:#fff;}
.retry.sub{background:#21262d;color:#8b949e;border:1px solid #30363d;margin-top:8px;}
.res-note{font-size:12px;color:#8b949e;line-height:1.7;margin:-12px 0 20px;word-break:keep-all;}
.wb{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:9px;background:rgba(210,153,34,.18);color:#d29922;font-size:10px;letter-spacing:0}
.dot.hot{box-shadow:0 0 0 2px #d29922}
</style>

<script>
const QS=[{"id":1,"uid":1,"text":"중부하에서도 기동하도록 하고 회전계자형의 동기전동기에 고정자인 전기자 부분이 회전자의 주위를 회전할 수 있도록 2중 베어링의 구조를 가지고 있는 전동기는?","opts":["반작용 전동기","유도자형 전동기","유도 동기 전동기","초동기 전동기"],"answer":3,"exp":"초동기 전동기\n중부하에서도 기동되도록 하고 회전계자형의 동기전동기에 고정자인 전기자 부분이 회전자의 주위를 회전할 수 있도록 2중 베어링의 구조","img":null,"expImg":null},{"id":2,"uid":2,"text":"변압기의 병렬운전 조건에 해당되지 않는 것은?","opts":["각 변압기의 극성이 같을 것","각 변압기의 권수비가 같고 1차 및 2차의 정격전압이 같을 것","상회전 방향 및 위상 변위가 같을 것","각 변압기의 정격출력이 같을 것"],"answer":3,"exp":"변압기 병렬운전 조건\n\n    극성, 권수비, 1, 2차 정격전압이 같을 것(용량은 무관)\n\n    각 변압기의 저항과 리액턴스비가 같을 것\n\n    부하 분담 시 용량에 비례하고 %임피던스 강하에는 반비례할 것\n\n    상회전 방향과 각 변위가 같을 것(3상 변압기)","img":null,"expImg":null},{"id":3,"uid":3,"text":"어느 전동기가 입력 $20[\\mathrm{kW}]$ 로 운전하여 $25[\\mathrm{HP}]$ 의 출력을 달성하고 있을 때 손실 $[\\mathrm{kW}]$ 은?","opts":["$23.5$","$1.35$","$13.5$","$2.35$"],"answer":1,"exp":"$\\text{손실} = \\text{입력} - \\text{출력} = 20 \\times 10^3 - 25 \\times 746 = 1,350 \\times 10^{-3} = 1.35[\\mathrm{kW}]$","img":null,"expImg":null},{"id":4,"uid":4,"text":"유도전동기의 제동법이 아닌 것은?","opts":["회생제동","발전제동","역전제동","3상제동"],"answer":3,"exp":"유도전동기 제동법\n\n    발전제동 : 전동기를 발전기로 적용하여 생긴 유기기전력을 저항을 통하여 열로 소비하는 제동법\n\n    회생제동 : 유도전동기를 유도발전기로 적용하여 생긴 유기기전력을 전원을 궤환시키는 제동법\n\n    역상제동(역전제동) : 3선 중 2선의 접속을 변경하여 역토크에 의해 제동하는 것","img":null,"expImg":null},{"id":5,"uid":5,"text":"직류발전기의 병렬운전 조건으로 틀린 것은?","opts":["극성을 같게 할 것","단자전압이 같을 것","유도기전력의 크기가 같을 것","외부특성곡선이 수하특성일 것"],"answer":2,"exp":"직류발전기 병렬 운전 조건\n\n    정격 전압 및 극성이 같을 것\n\n    외부 특성 곡선이 어느 정도 수하 특성일 것\n\n    용량이 다를 경우 % 부하전류로 나타낸 외부 특성 곡선이 거의 일치할 것","img":null,"expImg":null},{"id":6,"uid":6,"text":"교류전동기에서 브러시 이동으로 속도변화가 용이한 전동기는?","opts":["3상 농형 유도전동기","시라게 전동기","2중 농형 유도전동기","동기전동기"],"answer":1,"exp":"시라게 전동기(Schrage Motor)\n\n    권선형 유도 전동기로서 브러시 간격을 조정하여 속도 제어\n\n    3상 분권 정류자 전동기(직류 분권전동기와 특성이 유사)\n\n    정속도 전동기","img":null,"expImg":null},{"id":7,"uid":7,"text":"여자 전류 및 단자 전압이 일정한 비돌극형 동기발전기의 출력과 부하각 $\\delta$ 와의 관계를 나타낸 것은?(단, 전기자 저항은 무시한다)","opts":["$\\delta$ 에 반비례","$\\delta$ 에  로 승압할 때 역률 $80[\\%]$ 의 부하 용량 $[\\mathrm{kVA}]$ 은?(단, 변압기의 손실은 없다)","opts":["$176$","$220$","$156$","$196$"],"answer":1,"exp":"$\\frac{\\text{자기용량}}{\\text{부하용량}} = \\frac{e_2}{V_h} = \\frac{V_h - V_l}{V_h}$\n따라서 $\\text{부하용량}[\\mathrm{kVA}] = \\text{자기용량}[\\mathrm{kVA}] \\times \\frac{V_h}{V_h - V_l} = 20 \\times \\frac{6,600}{6,600 - 6,000} = 220[\\mathrm{kVA}]$","img":null,"expImg":null},{"id":11,"uid":11,"text":"$F(s) = \\frac{s+1}{s^2+2s}$ 의 라플라스 역변환은?","opts":["$\\frac{1}{2}(1+e^{-2t})$","$\\frac{1}{2}(1-e^{-2t})$","$\\frac{1}{2}(1+e^t)$","$\\frac{1}{2}(1-e^{-t})$"],"answer":0,"exp":"부분분수 전개로 역라플라스 변환하면\n$F(s) = \\frac{s+1}{s^2+2s} = \\frac{s+1}{s(s+2)} = \\frac{k_1}{s} + \\frac{k_2}{s+2}$\n\n여기서, $k_1 = \\lim_{s \\to 0} \\frac{(s+1)}{(s+2)} = \\frac{1}{2}$\n\n$k_2 = \\lim_{s \\to -2} \\frac{(s+1)}{s} = \\frac{-1}{-2} = \\frac{1}{2}$\n\n따라서 $\\mathcal{L}^{-1} \\left[ \\frac{1}{2}\\frac{1}{s} + \\frac{1}{2}\\frac{1}{s+2} \\right] = \\frac{1}{2}(1+e^{-2t})$","img":null,"expImg":null},{"id":12,"uid":12,"text":"$r[\\Omega]$ 인 6개의 저항을 그림과 같이 접속하고 평형 3상 전압 $E$ 를 가했을 때 전류 $I$ 는 몇 $[\\mathrm{A}]$ 인가? 단, $R=3[\\Omega]$ , $E=60[\\mathrm{V}]$ 이다.","opts":["$8.66$","$9.56$","$10.8$","$12.6$"],"answer":0,"exp":"$\\Delta \\to \\mathrm{Y}$ 변환 : 저항은 $\\frac{1}{3}$ 이 되므로 $\\frac{r}{3}$\n따라서 전체 1상의 저항은 $R = r + \\frac{r}{3} = \\frac{4}{3}r$\n\n$I_l = \\frac{V_p}{Z} = \\frac{\\frac{E}{\\sqrt{3}}}{\\frac{4}{3}r} = \\frac{3E}{4\\sqrt{3}r} = \\frac{\\sqrt{3}E}{4r}$ 이므로\n\n선전류 $I = \\frac{\\sqrt{3}E}{4r} = \\frac{60\\sqrt{3}}{4 \\times 3} = 8.66[\\mathrm{A}]$\n","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAHAAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVF mg":null},{"id":21,"uid":21,"text":"3대의 단상변압기를 $\\Delta$ 결선으로 하여 운전하던 중 변압기 1대를 고장으로 제거하여 $\\mathrm{V}$ 결선으로 한 경우 공급할 수 있는 전력은 고장 전 전력의 몇 $[\\%]$ 인가?","opts":["$57.7$","$50.0$","$63.3$","$67.7$"],"answer":0,"exp":"$\\mathrm{V}$ 결선 변압기 $P_v = \\sqrt{3}K$ $\\qquad$ 여기서, $K$ 는 변압기 1대 용량\n$\\Delta$ 결선 변압기 $P_\\Delta = 3K$\n\n출력비 $= \\frac{P_v}{P_\\Delta} = \\frac{\\sqrt{3}K}{3K} = \\frac{\\sqrt{3}}{3} \\times 100 = 57.7[\\%]$","img":null,"expImg":null},{"id":22,"uid":22,"text":"저항 $R_1 = 10[\\Omega]$ 과 $R_2 = 40[\\Omega]$ 이 직렬로 접속된 회로에 $100[\\mathrm{V}]$ , $60[\\mathrm{Hz}]$ 인 정현파 교류전압을 인가할 때, 이 회로에 흐르는 전류로 옳은 것은?","opts":["$\\sqrt{2}\\sin 377t[\\mathrm{A}]$","$2\\sqrt{2}\\sin 377t[\\mathrm{A}]$","$\\sqrt{2}\\sin 422t[\\mathrm{A}]$","$2\\sqrt{2}\\sin 422t[\\mathrm{A}]$"],"answer":1,"exp":"각주파수 $\\omega = 2\\pi f = 2\\pi \\times 60 = 377$\n합성저항 $R = R_1 + R_2 = 10 + 40 = 50[\\Omega]$\n전압 $v = V_m \\sin\\omega t = \\sqrt{2}V\\sin\\omega t = 100\\sqrt{2}\\sin 377t[\\mathrm{V}]$\n전류 $i = \\frac{v}{R} = \\frac{100\\sqrt{2}\\sin 377t}{50} = 2\\sqrt{2}\\sin 377t[\\mathrm{A}]$","img":null,"expImg":null},{"id":23,"uid":23,"text":"콘덴서 양단의 전위차와 콘덴서에 축적되는 에너지와의 관계는?","opts":["전위차가 클수록 에너지는 작다.","전위차가 클수록 에너지는 크다.","전위차에 관계없이 에너지는 항상 일정하다.","에너지량에 관계없이 전위차는 항상 일정하다."],"answer":1,"exp":"콘덴서에서의 에너지\n$W = \\frac{1}{2}QV = \\frac{Q^2}{2C} = \\frac{1}{2}CV^2 \\; [\\mathrm{J}]$\n콘덴서에서의 에너지는 전위차가 클수록 크다.","img":null,"expImg":null},{"id":24,"uid":24,"text":"시정수 $\\tau$ 를 갖는 $RL$ 직렬회로에 직류전압을 가할 때 $t = 3\\tau$ 가 되는 시점에 회로에 흐르는 전류는 정상상태 전류의 약 몇 $[\\%]$ 가 되는가?","opts":["$98$","$86$","$63$","$95$"],"answer":3,"exp":"$R-L$ 직렬회로에서 직류 기전력 인가 시의 전류\n$i(t) = \\frac{E}{R}(1 - e^{-\\frac{R}{L}t}) \\; [\\mathrm{A}]$\n\n","img":null,"expImg":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCACVAlgDASIAAhEBAxEB/8QAHwA $","$f(t) = b_0 + \\sum_{n=2}^{\\infty} a_n \\sin n\\omega t + \\sum_{n=2}^{\\infty} b_n \\cos n\\omega t$","$f(t) = a_0 + \\sum_{n=1}^{\\infty} a_n \\cos n\\omega t + \\sum_{n=1}^{\\infty} b_n \\sin n\\omega t$","$f(t) = \\sum_{n=1}^{\\infty} a_n \\cos n\\omega t + \\sum_{n=1}^{\\infty} b_n \\cos n\\omega t$"],"answer":2,"exp":"푸리에 급수\n비정현파 $=$ 직류분 $+$ 기본파 $+$ 고조파\n$f(t) = a_0 + \\sum_{n=1}^{\\infty} a_n \\cos n\\omega t + \\sum_{n=1}^{\\infty} b_n \\sin n\\omega t$","img":null,"expImg":null},{"id":30,"uid":30,"text":"그림과 같은 순저항으로 된 회로에 대칭 3상 전압을 가했을 때 각 선에 흐르는 전류가 같으려면 $R[\\Omega]$ 의 값은?","opts":["$20$","$25$","$30$","$35$"],"answer":1,"exp":"상전압을 가하여 각 선전류를 같게 하려면 $\\mathrm{Y}$ 결선하여야 하며 $\\Delta$ 결선의 저항을 $\\mathrm{Y}$ 결선 저항으로 변환하면 그림과 같다.\n따라서 $R + 25 = 50[\\Omega]$ $\\quad \\therefore R = 50 - 25 = 25[\\Omega]$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAHAAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LHSigUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUU t":"금속관공사에 의한 저압 옥내배선의 시설방법으로 틀린 것은?","opts":["전선은 절연전선일 것","관의 두께는 콘크리트에 매입하는 것은 $1.2[\\mathrm{mm}]$ 이상일 것","전선은 $16[\\mathrm{mm}^2]$ 경동단선일 것","전선은 금속관 안에서 접속점이 없도록 할 것"],"answer":2,"exp":"(KEC 232.12조) 금속관공사\n(1) 전선은 절연전선(옥외용 비닐절연전선을 제외한다)일 것\n(2) 전선은 연선일 것. 다만, 다음의 것은 적용하지 않는다.\n① 짧고 가는 금속관에 넣은 것\n② 단면적 $10[\\mathrm{mm}^2]$ (알루미늄선은 단면적 $16[\\mathrm{mm}^2]$ ) 이하의 것\n(3) 전선은 금속관 안에서 접속점이 없도록 할 것\n(4) 관의 두께는 다음에 의할 것\n① 콘크리트에 매설하는 것은 $1.2[\\mathrm{mm}]$ 이상\n② 콘크리트에 매설하는 것 이외의 것은 $1[\\mathrm{mm}]$ 이상","img":null,"expImg":null},{"id":38,"uid":38,"text":"수소냉각식 발전기 및 이에 부속하는 수소냉각방식의 시설에 대한 설명으로 틀린 것은?","opts":["발전기 안의 수소의 밀도를 계측하는 장치를 시설할 것","발전기 안의 수소의 순도가 $85[\\%]$ 로 이하로 저하한 경우에 이를 경보하는 장치를 시설할 것","발전기 안의 수소의 압력을 계측하는 장치 및 그 압력이 현저히 변동한 경우에 이를 경보하는 장치를 시설할 것","발전기는 기밀구조의 것이고 또한 수소가 대기압에서 폭발하는 경우에 생기는 압력에 견디는 강도를 가지는 것일 것"],"answer":0,"exp":"(KEC 351.10조) 수소냉각식 발전기 등의 시설\n수소냉각식의 발전기 $\\cdot$ 무효전력 보상장치 또는 이에 부속하는 수소 냉각 장치는 다음 각 호에 따라 시설하여야 한다.\n① 발전기 또는 무효전력 보상장치는 기밀구조의 것이고 또한 수소가 대기압에서 폭발하는 경우에 생기는 압력에 견디는 강도를 가지는 것일 것\n② 발전기축의 밀봉부에는 질소 가스를 봉입할 수 있는 장치 또는 발전기 축의 밀봉부로부터 누설된 수소 가스를 안전하게 외부에 방출할 수 있는 장치를 시설할 것\n③ 발전기 내부 또는 무효전력 보상장치 내부의 수소의 순도가 $85[\\%]$ 이하로 저하한 경우에 이를 경보하는 장치를 시설할 것\n④ 발전기 내부 또는 무효전력 보상장치 내부의 수소의 압력을 계측하는 장치 및 그 압력이 현저히 변동한 경우에 이를 경보하는 장치를 시설할 것\n⑤ 발전기 내부 또는 무효전력 보상장치 내부의 수소의 온도를 계측하는 장치를 시설할 것","img":null,"expImg":null},{"id":39,"uid":39,"text":"정격용량이 몇 $[\\mathrm{kVA}]$ 이상인 무효전력 보상장치에는 그 내부에 고장이 있는 경우에 자동으로 이를 전로로부터 차단하는 보호장치를 하여야 하는가?","opts":["$10,000$","$15,000$","$20,000$","$25,000$"],"answer":1,"exp":"(KEC 351.5조) 조상설비의 보호장치","img":null,"expImg":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAB4AlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q m}^2]$ ) 이하의 것\n\n③ 전선은 합성수지관 안에서 접속점이 없도록 할 것","img":null,"expImg":null},{"id":43,"uid":43,"text":"사람이 상시 통행하는 터널 안의 교류 $220[\\mathrm{V}]$ 배선을 애자사용 공사에 의하여 시설할 경우 전선은 노면상 몇 $[\\mathrm{m}]$ 이상의 높이로 시설하여야 하는가?","opts":["$1.8$","$2.0$","$2.5$","$3.5$"],"answer":2,"exp":"(KEC 335.1조) 터널 안 전선로의 시설\n\n저압전선 - 지름 $2.6[\\mathrm{mm}]$ 경동선 이상, 애자사용공사에 의할 때 레일면상 또는 노면상 $2.5[\\mathrm{m}]$ 이상의 높이에 시설 합성수지관공사, 금속관공사, 금속제 가요전선관공사, 케이블공사에 의해 시설\n\n고압전선 - 지름 $4[\\mathrm{mm}]$ 경동선 이상\n애자공사 시 레일면상 또는 노면상 $3[\\mathrm{m}]$ 이상의 높이","img":null,"expImg":null},{"id":44,"uid":44,"text":"아크 용접기의 시설 기준으로 틀린 것은?","opts":["용접변압기의 1차측 전로의 대지전압은 $300[\\mathrm{V}]$ 이하일 것","전로는 용접 시 안전을 위해 흐르는 전류를 통과하지 못하게 하여 시설할 것","용접변압기는 절연변압기일 것","용접변압기 1차측 전로에는 용접변압기에 가까운 곳에 쉽게 개폐할 수 있는 개폐기를 시설할 것"],"answer":1,"exp":"(KEC 241.10조) 아크 용접기\n① 변압기는 1차 대지전압 $300[\\mathrm{V}]$ 이하의 절연 변압기일 것\n② 용접 변압기로부터 용접 전극에 이르는 부분 및 용접 변압기로부터 피용접재에 이르는 부분의 전선은 용접용 케이블이나 1종 이외의 캡타이어 케이블을 사용한다.\n③ 전로는 용접 시 흐르는 전류를 안전하게 통할 수 있는 것일 것","img":null,"expImg":null},{"id":45,"uid":45,"text":"제1종 특고압 보안공사로 시설하는 전선로의 지지물로 사용할 수 있는 것은?","opts":["목주","$\\mathrm{A}$ 종 철근 콘크리트주","철탑","$\\mathrm{A}$ 종 철주"],"answer":2,"exp":"(KEC 333.22조) 특고압 보안공사\n전선로의 지지물에는 $\\mathrm{B}$ 종 철주 $\\cdot$ $\\mathrm{B}$ 종 철근 콘크리트주 또는 철탑을 사용할 것(목주 $\\cdot$ $\\mathrm{A}$ 종 사용금지)","img":null,"expImg":null},{"id":46,"uid":46,"text":"임시 전선로 시설에서 건조물 상부 조영재의 옆쪽에 시설할 경우 이격거리는 몇 $[\\mathrm{m}]$ 까지 감할 수 있나?","opts":["$0.1$","$0.4$","$1$","$4$"],"answer":1,"exp":"(KEC 335.10조) 임시 전선로의 시설\n","img":null,"expImg":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCACQAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqK async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+Q.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(TK.wc(Q[i].uid||Q[i].id)>=2?' hot':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

  const q=Q[cur],a=ans[cur],done=a!==null;

    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+col+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+rt+'</div>'+
    '<div class="res-sub">'+sub+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div>'+note+
    (wrong.length?'<button class="retry wrong" onclick="retryWrong()">❌ '+(skipped?'오답·미풀이 ':'오답 ')+wrong.length+'문제만 다시 풀기</button>':'')+
    '<button class="retry'+(wrong.length?' sub':'')+'" onclick="restart()">🔄 '+(retryMode?'전체 문제 처음부터 다시 풀기':'처음부터 다시 풀기')+'</button>'+(META.hubUrl?'<button class="retry sub" onclick="location.href=META.hubUrl">🏠 허브로 돌아가기</button>':'')+'</div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function retryWrong(){
  const w=wrongIdx(); if(!w.length) return;
  Q=w.map(i=>Q[i]); round++;
  cur=0; score=0; ans=new Array(Q.length).fill(null); cache={}; render();
}
function restart(){window._tr=0;Q=QS;round=1;cur=0;score=0;ans=new Array(Q.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/Q.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
</body>
</html>
