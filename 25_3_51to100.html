<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title> 25년 3회 산업기사 51~100</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.retry.wrong{background:linear-gradient(135deg,#f85149,#d29922);color:#fff;}
.retry.sub{background:#21262d;color:#8b949e;border:1px solid #30363d;margin-top:8px;}
.res-note{font-size:12px;color:#8b949e;line-height:1.7;margin:-12px 0 20px;word-break:keep-all;}
</style>

<script>
const QS=[{"id":1,"text":"3상 직권 정류자 전동기의 중간 변압기는 고정자 권선과 회전자 권선 사이에 직렬로 접속되는데 이 중간 변압기를 사용하는 중요한 이유는?","opts":["경부하 시 속도의 급상승 방지를 위하여","주파수 변동으로 속도를 조정하기 위하여","회전자 상수를 감소하기 위하여","역회전을 방지하기 위하여"],"answer":0,"exp":"","img":null,"expImg":null},{"id":2,"text":"변압기의 부하가 증가할 때의 현상으로서 틀린 것은?","opts":["동손이 증가한다.","온도가 상승한다.","철손이 증가한다.","여자전류는 변함없다."],"answer":2,"exp":"철손 ( $P_c$ ): 전압과 주파수가 일정하면 부하의 크기(전류)와 상관없이 항상 일정하게 유지되는 고정손실입니다. 따라서 부하가 증가해도 철손은 증가하지 않고 변함이 없습니다.","img":null,"expImg":null},{"id":3,"text":"단락사고에 대한 전동기의 과전류 보호기기가 아닌 것은?","opts":["OCR","MC","PF","MCCB"],"answer":1,"exp":"MC (Magnetic Contactor, 전자접촉기)는 전동기 회로를 개폐(On/Off)하기 위한 스위치 역할을 하는 기기","img":null,"expImg":null},{"id":4,"text":"대형 변압기에서 변압기의 호흡작용으로 절연내력이 저하되는 절연열화를 방지할 목적으로 기름과 공기의 접촉을 방지하기 위해 봉입하는 기체는?","opts":["질소","탄산가스","오존","아르곤"],"answer":0,"exp":"대형 변압기에서는 부하의 변화 및 온도 상승·하강에 따른 호흡작용(변압기 내외부의 공기가 드나드는 현상)으로 인해 공기 중의 수분과 산소가 절연유와 접촉하여 절연유가 열화되고 절연내력이 저하되는 문제가 발생합니다.이를 방지하기 위해 기름 윗부분에 불활성 기체인 질소( $N_2$ ) 가스를 봉입하여 기름과 공기의 직접적인 접촉을 차단","img":null,"expImg":null},{"id":5,"text":"직류전동기 중에서 부하의 변화에 따른 속도 변화가 가장 많은 전동기는?","opts":["가동 복권전동기","타여자전동기","직권전동기","분권전동기"],"answer":2,"exp":"직권전동기는 부하전류가 계자권선을 모두 흐르기 때문에 부하 전류의 크기에 따라 자속이 크게 변합니다. 속도는 자속에 반비례하고 토크는 전류의 제곱에 비례하므로, 부하가 변할 때 속도 변동률이 가장 큰 특성을 가집니다.","img":null,"expImg":null},{"id":6,"text":"동기발전기를 병렬 운전하기 위해 동기화 회로로 구성하여 동기검등을 관찰할 때 완전히 두 발전기가 일치하는 순간을 바르게 표현한 것은?","opts":["전등불이 $L_1$, $L_2$, $L_3$ 순으로 밝게 된다.","모든 전등불이 ON, OFF를 반복한다.","전등불이 $L_1$, $L_3$, $L_2$ 순으로 밝게 된다.","전등불이 $L_1$은 꺼지고, $L_2$, $L_3$는 같은 밝기의 빛을 낸다."],"answer":3,"exp":"동기검등기(삼교차법 회로)에서 두 발전기의 전압, 주파수, 위상이 완전히 일치하여 병렬 운전이 가능한 동기 조건이 되었을 때는 다음과 같은 현상이 나타납니다.동기화 회로의 결선 특성상 두 전압이 완전히 일치하면 $L_1$에 걸리는 전위차가 $0$ 이 되어 $L_1$은 완전히 꺼지게(OFF) 됩니다.나머지 두 전등인 $L_2$와 $L_3$에는 동일한 전압이 대칭적으로 걸리므로 두 전등은 같은 밝기로 켜지게 됩니다.주파수가 약간 다를 때에는 전등이 순차적으로 켜지고 꺼지며 회전하는 현상(동기검등 작용)을 보이게 됩니다.","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCE null},{"id":7,"text":"직류 분권발전기의 브러시를 중성축에서 회전 방향 쪽으로 이동하면 전압은?","opts":["상승한다.","급격히 상승한다.","변화하지 않는다.","감소한다."],"answer":3,"exp":"직류 발전기에서 브러시를 중성축으로부터 회전 방향으로 이동시키면 전기자 반작용에 의해 감자작용이 발생하여 주자속이 감소하므로, 발전기의 유기기전력(전압)이 감소하게 됩니다.","img":null,"expImg":null},{"id":8,"text":"직류기에 탄소 브러시를 사용하는 주된 이유는?","opts":["접촉저항이 크기 때문에","마찰계수가 작기 때문에","고유저항이 작기 때문에","허용전류가 크기 때문에"],"answer":0,"exp":"직류기에서 탄소 브러시를 사용하는 주된 이유는 접촉저항이 크기 때문입니다. 접촉저항이 크면 정류 시 단락 코일에 흐르는 전류를 억제하여 불꽃(정류자 화염)을 방지하고 양호한 정류를 얻을 수 있습니다.","img":null,"expImg":null},{"id":9,"text":"단상변압기 2대를 사용하여 $3,150$ [ V ] 의 평형 3상에서 $210$ [ V ] 의 평형 2상으로 변환하는 경우에 각 변압기의 1차 전압과 2차 전압은 얼마인가?","opts":["주좌 변압기 : 1차 $3,150$ [ V ] , 2차 $210$ [ V ]","주좌 변압기 : 1차 $3,150$ [ V ] , 2차 $210$ [ V ]","주좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [ V ] , 2차 $210$ [ V ]","주좌 변압기 : 1차 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [ V ] , 2차 $210$ [ V ]"],"answer":1,"exp":"T결선(스코트 결선)을 사용하여 3상 전력을 2상 전력으로 변환할 때 두 변압기의 전압 특성은 다음과 같습니다.\n주좌 변압기 : 1차측에는 3상의 선간전압인 $3,150$ [ V ] 가 걸리고, 2차측에는 평형 2상 전압인 $210$ [ V ] 가 걸립니다.\nT좌 변압기 : 1차측에는 T결선의 특성에 따라 3상 선간전압의 $\\frac{\\sqrt{3}}{2}$ 배인 $3,150 \\times \\frac{\\sqrt{3}}{2}$ [ V ] 가 걸리고, 2차측에는 평형 2상 전압인 $210$ [ V ] 가 걸립니다.","img":null,"expImg":null},{"id":10,"text":"유도 전동기 원선도에서 원의 지름은? (단, $E$ 를 1차 전압, $r$ 는 1차로 환산한 저항, $x$ 를 1차로 환산한 누설 리액턴스라 한다)","opts":["$r E$ 에 비례","$r x E$ 에 비례","$\\frac{E}{r}$ 에 비례","$\\frac{E}{x}$ 에 비례"],"answer":3,"exp":"원의 지름 $D$ 는 다음과 같이 표현됩니다.$$D = \\frac{E}{x}$$","img":null,"expImg":null},{"id":11,"text":"그림에서 단자 ab에 나타나는 전압 $V_{AB}$ [ V ] 는 얼마인가?","opts":["$2.4$","$6$","$8$","$10$"],"answer":1,"exp":"밀만(Millman)의 정리를 이용하여 단자 $ab$ 간의 전압 $V_{AB}$ 를 구합니다.$$V_{AB} = \\frac{\\frac{E_1}{R_1} + \\frac{E_2}{R_2}}{\\frac{1}{R_1} + \\frac{1}{R_2}}$$주어진 회로에서 각 브랜치의 기전력과 저항 값은 다음과 같습니다.첫 번째 브랜치 : $E_1 = 3$ [ V ] , $R_1 = 3$ [ $\\Omega$ ]두 번째 브랜치 : $E_2 = 12$ [ V ] , $R_2 = 6$ [ $\\Omega$ ]값들을 공식에 대입하면 다음과 같습니다.$$V_{AB} = \\frac{\\frac{3}{3} + \\frac{12}{6}}{\\frac{1}{3} + \\frac{1}{6}} = \\fr 올바름)","img":null,"expImg":null},{"id":14,"text":"$R-L-C$ 직렬 회로에서 진동 조건은 어느 것인가?","opts":["$R < 2 \\sqrt{\\frac{L}{C}}$","$R < 2 \\sqrt{\\frac{C}{L}}$","$R < 2 \\sqrt{LC}$","$R < \\frac{1}{2 \\sqrt{LC}}$"],"answer":0,"exp":"$R-L-C$ 직렬 회로의 특성방정식은 다음과 같습니다.$$s^2 + \\frac{R}{L}s + \\frac{1}{LC} = 0$$이 2차 방정식의 근의 공식을 적용하면 특성근 $s$ 는 다음과 같이 유도됩니다.$$s = -\\frac{R}{2L} \\pm \\sqrt{\\left(\\frac{R}{2L}\\right)^2 - \\frac{1}{LC}}$$회로가 진동하기 위해서는 근호(루트) 안의 값이 음수가 되어 허근을 가져야 합니다. 즉, 허수 부분이 존재해야 진동 성분이 발생합니다.$$\\left(\\frac{R}{2L}\\right)^2 - \\frac{1}{LC} < 0$$$$\\left(\\frac{R}{2L}\\right)^2 < \\frac{1}{LC}$$양변에 제곱근을 취하면 다음과 같습니다.$$\\frac{R}{2L} < \\frac{1}{\\sqrt{LC}}$$양변에 $2L$ 을 곱하여 $R$ 에 대해 정리합니다.$$R < \\frac{2L}{\\sqrt{LC}} = 2 \\sqrt{\\frac{L^2}{LC}} = 2 \\sqrt{\\frac{L}{C}}$$따라서 $R-L-C$ 직렬 회로의 진동 조건은 $R < 2 \\sqrt{\\frac{L}{C}}$ 입니다.","img":null,"expImg":null},{"id":15,"text":"RC회로에 비정현파 전압을 가하여 흐르는 전류가 다음과 같을 때 이 회로의 역률은 약 [%]인가?","opts":["75.8","80.4","86.3","89.7"],"answer":1,"exp":"전압 $v(t)$ 성분:직류분: $V_0 = 20$ [ V ]기본파 실효값: $V_1 = 220$ [ V ]제3고조파 실효값: $V_3 = 40$ [ V ]전류 $i(t)$ 성분:직류분: $I_0 = 0$ [ A ] (콘덴서가 직류를 차단함)기본파 실효값: $I_1 = 2.2$ [ A ] , 위상각 $\\theta_1 = 36.87^{\\circ}$제3고조파 실효값: $I_3 = 0.49$ [ A ] , 위상각 $\\theta_3 = 14.04^{\\circ}$전압과 전류의 전체 실효값 $V$ , $I$ 구하기$$V = \\sqrt{{V_0}^2 + {V_1}^2 + {V_3}^2} = \\sqrt{20^2 + 220^2 + 40^2} = \\sqrt{400 + 48400 + 1600} = \\sqrt{50400} \\approx 224.5 \\text{ [ V ]}$$$$I = \\sqrt{{I_1}^2 + {I_3}^2} = \\sqrt{2.2^2 + 0.49^2} = \\sqrt{4.84 + 0.2401} = \\sqrt{5.0801} \\approx 2.254 \\text{ [ A ]}$$피상 전력 $S$ 구하기$$S = V \\times I = 224.5 \\times 2.254 \\approx 506.02 \\text{ [ VA ]}$$유효 전력 $P$ 구하기비정현파의 유효 전력은 같은 주파수 성분끼리의 유효 전력의 합과 같습니다.$$P = V_1 I_1 \\cos \\theta_1 + V_3 I_3 \\cos \\theta_3$$$\\cos( 36.87^{\\circ} ) \\approx 0.8$$\\cos( 14.04^{\\circ} ) \\approx 0.9701$$$P = ( 220 \\times 2.2 \\times 0.8 ) + ( 40 \\times 0.49 \\times 0.9701 ) = 387.2 + 19.014 = 406.214 \\text{ [ W ]}$$역률 $\\text{PF}$ 구하기$$\\text{PF} = \\frac{406.21 "text":"$\\mathcal{L}^{-1} \\left[ \\frac{\\omega}{s ( s^2 + \\omega^2 )} \\right]$ 은?","opts":["$\\frac{1}{\\omega} ( 1 - \\sin \\omega t )$","$\\frac{1}{\\omega} ( 1 - \\cos \\omega t )$","$\\frac{1}{2 \\omega} ( 1 - \\sin \\omega t )$","$\\frac{1}{2 \\omega} ( 1 - \\cos \\omega t )$"],"answer":1,"exp":"기본 라플라스 변환식에서 $\\mathcal{L} [ \\sin \\omega t ] = \\frac{\\omega}{s^2 + \\omega^2}$ 입니다.$s$ 로 나누는 것은 복도메인에서 시간 영역의 적분에 해당하므로:$$\\mathcal{L}^{-1} \\left[ \\frac{1}{s} \\cdot \\frac{\\omega}{s^2 + \\omega^2} \\right] = \\int_{0}^{t} \\sin \\omega \\tau \\, d\\tau$$위 적분을 계산하면:$$\\int_{0}^{t} \\sin \\omega \\tau \\, d\\tau = \\left[ -\\frac{1}{\\omega} \\cos \\omega \\tau \\right]_{0}^{t} = -\\frac{1}{\\omega} \\cos \\omega t - \\left( -\\frac{1}{\\omega} \\cos 0 \\right) = \\frac{1}{\\omega} ( 1 - \\cos \\omega t )$$","img":null,"expImg":null},{"id":20,"text":"그림과 같은 회로망에서 전류를 계산하는데 옳게 표시된 것은?","opts":["$I_1 + I_2 + I_3 + I_4 = 0$","$I_1 + I_2 - I_3 + I_4 = 0$","$I_1 + I_4 = I_2 + I_3$","$I_1 + I_2 - I_4 = I_3$"],"answer":1,"exp":"키르히호프의 전류 법칙(KCL)에 의하면, 회로망의 한 접속점에 유입하는 전류의 총합은 유출하는 전류의 총합과 같습니다.\n\n$$I_1 + I_4 = I_2 + I_3$$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCACFAPIDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxE .0 이다.","전파 정류파의 파형률은 1.11 이다.","반파 정류파의 파형률은 1.571 이다."],"answer":0,"exp":"$\\text{파형률} = \\frac{\\text{실효값}}{\\text{평균값}}$\n\n정현파:실효값은 $\\frac{I_m}{\\sqrt{2}}$ 이고, 평균값은 $\\frac{2}{\\pi} I_m$ \n파형률은 $\\frac{\\frac{I_m}{\\sqrt{2}}}{\\frac{2}{\\pi} I_m} = \\frac{\\pi}{2 \\sqrt{2}} \\approx \\frac{3.1415}{2 \\times 1.4142} \\approx 1.11$ ","img":null,"expImg":null},{"id":26,"text":"그림과 같은 순저항만의 회로에 평형 3상 전압을 가했을 때 각 선에 흐르는 전류가 같으려면 $R$ 의 값은 몇 [ $\\Omega$ ]인가?","opts":["$2.5$","$5$","$7.5$","$10$"],"answer":0,"exp":"각 선에 흐르는 전류가 같으려면 단자 a, b, c에서 바라본 각 상의 등가 저항이 $5$ [ $\\Omega$ ] 로 같아야 합니다.$\\Delta$ 부하 저항( $10$ [ $\\Omega$ ] , $10$ [ $\\Omega$ ] , $20$ [ $\\Omega$ ] )을 Y 결선으로 변환:a상 측 Y 저항 $R_a = \\frac{10 \\times 10}{10 + 10 + 20} = \\frac{100}{40} = 2.5$ [ $\\Omega$ ]b, c상 측 Y 저항 $R_b = R_c = \\frac{10 \\times 20}{40} = 5$ [ $\\Omega$ ]a상 전체 저항 균형 조건:$R + R_a = 5$ [ $\\Omega$ ]$R + 2.5 = 5 \\implies R = 2.5$ [ $\\Omega$ ]따라서 $R$ 의 값은 $2.5$ [ $\\Omega$ ] 입니다.","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCACxAVQDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LooFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUjEKpZjgAZJPavnjw/fXviHTNVuNH1HxJa65r+qXJ8MyXV3OtpbwRnarqWOyRSqNLsIJO4gDA4APoiimQLIsEazOJJAoDsBjcccnFZ3iHxFonh9IX1nU7ez89 ?","opts":["수력설비의 안전상 필요한 양수소 및 강수량 관측소와 수력발전소 간","동일 수계에 속하고 안전상 긴급 연락의 필요가 있는 수력발전소 상호 간","원격감시 제어가 되는 발전소 · 변전소, 전선로 및 이를 운용하는 급전소간","2개 이상의 급전소 상호 간과 이들을 통합 운용하는 급전소 간"],"answer":2,"exp":"","img":null,"expImg":null},{"id":37,"text":"전기온상의 발열선은 온도가 몇 [ $^\\circ\\text{C}$ ] 를 넘지 않도록 시설하여야 하는가?","opts":["$70$","$80$","$90$","$100$"],"answer":1,"exp":"","img":null,"expImg":null},{"id":38,"text":"발열선을 공중에 시설하는 전기온상 등에서 발열선을 애자로 지지하는 경우 지지점간의 거리는 몇 [ $\\text{m}$ ] 이하이어야 하는가? (단, 발열선의 상호간의 간격이 $0.06$ [ $\\text{m}$ ] 미만인 경우이다)","opts":["$1$","$0.6$","$1.5$","$3$"],"answer":0,"exp":"","img":null,"expImg":null},{"id":39,"text":"저압 가공전선 상호간의 접근 또는 교차하여 시설할 때 다음 ( )에 알맞은 것은?\n[ 저압 가공전선이 다른 저압 가공전선과 접근 상태로 시설되거나 교차하여 시설되는 경우 에는 저압 가공전선 상호 간의 이격거리는 ( ⓐ ) [ $\\text{m}$ ] (어느 한 쪽의 전선이 고압 절연전선, 특고압 절연전선 또는 케이블인 경우에는 $0.3$ [ $\\text{m}$ ] ) 이상, 하나의 저압 가공전선과 다른 저압 가공전선로의 지지물 사이의 이격거리 는 ( ⓑ ) [ $\\text{m}$ ] 이상이어야 한다. ]","opts":["ⓐ : $0.6$ ⓑ : $0.3$","ⓐ : $0.3$ ⓑ : $0.6$","ⓐ : $0.3$ ⓑ : $0.3$","ⓐ : $0.6$ ⓑ : $0.6$"],"answer":0,"exp":"","img":null,"expImg":null},{"id":40,"text":"주택용 배선차단기의 B형은 순스트립전류의 범위가 차단기 정격전류( $I_n$ )의 몇 배인가?","opts":["$1 I_n$ 초과 ~ $3 I_n$ 이하","$3 I_n$ 초과 ~ $5 I_n$ 이하","$5 I_n$ 초과 ~ $10 I_n$ 이하","$10 I_n$ 초과 ~ $20 I_n$ 이하"],"answer":1,"exp":"","img":null,"expImg":null},{"id":41,"text":"태양광 설비의 시설 기준 중 인버터, 절연변압기 및 계통 연계 보호장치 등 전력변환장치의 시설 기준으로 틀린 것은?","opts":["인버터는 실내 · 실외용을 구분할 것","각 직렬군의 태양전지 개방전압은","옥외에 시설하는 경우 방수등급은 IPX4 이상일 것","옥내에 시설하는 경우 방수등급은 IPX5 이상일 것"],"answer":3,"exp":"","img":null,"expImg":null},{"id":42,"text":"정류기에 접속하는 변압기 권선의 절연내력시험전압은 정류기 교류측 최대사용전압의 몇 배의 교류전압인가? (단, 정류기의 최대사용전압은 $60$ [ $\\text{kV}$ ] 를 초과하는 경우이다)","opts":["$1.1$","$0.92$","$0.64$","$0.72$"],"answer":0,"exp":"","img":null,"expImg":null},{"id":43,"text":"변압기에 의하여 특고압 전로에 결합되는 고압전로에는 사용 전압의 3배 이하의 전압이 가하여진 경우에 방전하는 피뢰기를 어느 곳에 시설할 때, 방전장치를 생략할 수 있는가?","opts":["변압기의 단자","변압기 단자의 1극","고압전로의 모선의 각상","특고압 전로의 1극"],"answer":2,"exp":"","img":null,"expImg":null},{"id":44,"text":"전력계통의 일부 const title=" 25년 3회 산업기사 51~100";
let Q=QS,cur=0,score=0,round=1,ans=new Array(Q.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+Q.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=Q[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===Q.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+Q.length+(round>1?' · 오답 '+(round-1)+'차':'')+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===Q[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function wrongIdx(){
  const r=[];
  for(let i=0;i<Q.length;i++){ if(ans[i]===null||!ans[i].ok) r.push(i); }
  return r;
}
function result(){
  const total=Q.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100);
  const wrong=wrongIdx(),skipped=total-done,retryMode=round>1;
  const pass=pct>=60;
  const col=retryMode?(wrong.length===0?'#3fb950':'#58a6ff'):(pass?'#3fb950':'#f85149');
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  let rt,sub;
  if(retryMode){
    rt=wrong.length===0?'🎉 오답 정복 완료!':'📝 오답 재풀이 '+(round-1)+'차 결과';
    sub=total+'문제 중 '+score+'문제 정답'+(wrong.length?' · 아직 '+wrong.length+'문제 남았어요':'');
  } else {
    rt=pass?'🎉 합격!':'😥 불합격';
    sub=pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다';
  }
  let note='';
  if(wrong.length){
    note='<div class="res-note">다시 볼 문제: '+wrong.map(i=>'Q'+String(Q[i].id).padStart(2,'0')).join(' ')+(skipped?'<br>안 푼 문제 '+skipped+'개도 다시 풀기에 포함돼요':'')+'</div>';
  }
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+col+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+rt+'</div>'+
    '<div class="res-sub">'+sub+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div>'+note+
    (wrong.length?'<button class="retry wrong" onclick="retryWrong()">❌ '+(skipped?'오답·미풀이 ':'오답 ')+wrong.length+'문제만 다시 풀기</button>':'')+
    '<button class="retry'+(wrong.length?' sub':'')+'" onclick="restart()">🔄 '+(retryMode?'전체 문제 처음부터 다시 풀기':'처음부터 다시 풀기')+'</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function retryWrong(){
  const w=wrongIdx(); if(!w.length) return;
  Q=w.map(i=>Q[i]); round++;
  cur=0; score=0; ans=new Array(Q.length).fill(null); cache={}; render();
}
function restart(){Q=QS;round=1;cur=0;score=0;ans=new Array(Q.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/Q.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
