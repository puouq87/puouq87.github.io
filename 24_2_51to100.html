<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>24년 2회 산업기사 51~100</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
.retry.wrong{background:linear-gradient(135deg,#f85149,#d29922);color:#fff;}
.retry.sub{background:#21262d;color:#8b949e;border:1px solid #30363d;margin-top:8px;}
.res-note{font-size:12px;color:#8b949e;line-height:1.7;margin:-12px 0 20px;word-break:keep-all;}
</style>

<script>
const QS=[{"id":1,"text":"$3$상 직권 정류자 전동기에 있어서 중간 변압기를 사용하는 목적은?","opts":["역회전 방지","실효권수비 조정","회전자 상수 감소","주파수 조정"],"answer":1,"exp":"$3$상 직권 정류자 전동기에서 중간 변압기를 사용하는 목적\n전원 전압의 크기에 관계없이 정류자 전압 조정\n중간 변압기의 권수비를 조정하여 전동기 특성을 조정\n경부하시 직권 특성( $$T \\propto I^2$$  $$T \\propto \\frac{1}{N^2}$$ ) 이므로 속도가 크게 상승할 수 있으므로 중간변압기를 사용하여 속도 상승을 억제\n실효 권수비 조정\n","img":null,"expImg":null},{"id":2,"text":"정격속도로 회전하고 있는 무부하의 분권발전기가 있다. 계자저항이 $40$ [ $\\Omega$ ], 계자전류가 $3$ [A], 전기자 저항이 $2$ [ $\\Omega$ ]일 때 유기기전력[V]은?","opts":["$114$","$132$","$120$","$126$"],"answer":3,"exp":"분권발전기\n단자전압 $V = R_f I_f = 40 \\times 3 = 120$ [V]\n전기자전류 $I_a = I + I_f = 0 + 3 = 3$ [A]\n유기기전력 $E = V + I_a R_a = 120 + 3 \\times 2 = 126$ [V]","img":null,"expImg":null},{"id":3,"text":"자기 용량 $20$ [kVA]의 단권변압기를 사용하여 배전선 전압 $6,000$ [V]를 $6,600$ [V]로 승압할 때 역률 $80$ [%]의 부하용량[kW]은?","opts":["$220$","$196$","$176$","$156$"],"answer":2,"exp":"자기용량 / 부하용량 $= \\frac{e_2 I_2}{V_h I_2} = \\frac{e_2}{V_h} \\fallingdotseq \\frac{V_h - V_l}{V_h}$\n부하용량 $= \\frac{V_h}{V_h - V_l} \\times \\text{자기용량} = \\frac{6,600}{6,600 - 6,000} \\times 20 \\fallingdotseq 220$ [kVA]\n부하전력 $P = P_a \\cos\\theta = 220 \\times 0.8 = 176$ [kW]","img":null,"expImg":null},{"id":4,"text":"슬립이 $5$ [%]인 유도전동기의 등가 부하저항은 2차 저항의 몇 배인가?","opts":["$36$","$25$","$19$","$20$"],"answer":2,"exp":"등가저항 $R' = \\frac{1 - s}{s} r_2 = \\frac{1 - 0.05}{0.05} \\times r_2' = 19$ [ $\\Omega$ ]","img":null,"expImg":null},{"id":5,"text":"변압기의 절연유로서 갖추어야 할 조건이 아닌 것은?","opts":["비열이 커서 냉각 효과가 클 것","절연저항 및 절연내력이 작을 것","인화점이 높고 응고점이 낮을 것","고온에서도 석출물이 생기거나 산화하지 않을 것"],"answer":1,"exp":"절연유의 구비조건(절연+냉각)\n\n    절연내력이 클 것\n    점도가 적고 비열이 커서 냉각 효과가 클 것\n    인화점은 높고, 응고점은 낮을 것\n    고온에서 산화하지 않고, 침전물이 생기지 않을 것","img":null,"expImg":null},{"id":6,"text":"회전 변류기의 전류비는 다음 중 어느 것인가? 단, $m$ 은 상수이고, $I_a$ 는 교류측 선전류, $I_d$ 는 직류측 선전류이다.","opts":["$\\frac{I_a}{I_d} = \\frac{2\\sqrt{2}}{m\\sin\\theta}$","$\\frac{I_a}{I_d} = \\frac{m\\cos\\theta}{2\\sqrt{2}}$","$\\frac{I_a}{I_d} = \\frac{2\\sqrt wDCO69x/wAXC8Q/+Amnf/ItB8N68f8AmoniMf8Abpp3/wAi0UUgI28L+IDx/wALK8TjPpaaZx/5KUw+E/ERP/JUPFY+lnpf/wAh0UUAKPCXiDPPxQ8Wn/t10v8A+Q6f/wAIpro6/EvxYf8At30z/wCQ6KKYCjwrrX/RSPFh/wC2Gm//ACJSjwrrPf4jeLP+/Onf/IlFFAB/wiesd/iL4rP/AGz0/wD+RaP+ET1b/ooniv8A74sP/kWiigC7oug3+n3wubjxdr2qIFI+z3gtRGc9/wB3AjZH1ooopMD/2Q=="},{"id":9,"text":"SCR에 관한 설명으로 틀린 것은?","opts":["$3$단자 소자이다.","전류는 에노드에서 캐소드로 흐른다.","소형의 전력을 다루고 고주파 스위칭을 요구하는 응용분야에 주로 사용된다.","도통 상태에서 순방향 에노드전류가 유지 전류 이하로 되면 SCR은 차단상태로 된다."],"answer":2,"exp":"SCR(Silicon Controlled Rectifier) : 실리콘 제어 정류기\n실리콘 정류 소자 역치 $3$단자, 대전력제어\n동작 최고온도가 가장 높다($200^{\\circ}\\text{C}$)\n정류기능의 단일 방향성 $3$단자 소자\n위상 제어\n역방향 내전압 : 약 500~1,00[V] (역방향 내전압이 가장 큼)","img":null,"expImg":null},{"id":10,"text":"다음 중 권선형 유도 전동기의 $2$차 여자 제어법으로 사용되는 제어 방식은?","opts":["세르비우스 방식","플러깅 방식","발전 방식","회생 방식"],"answer":0,"exp":"$2$차 여자법(슬립 제어)\n유도 전동기 회전자의 외부에서 슬립링을 통하여 슬립주파수 전압을 인가하여 회전자 슬립에 의해 속도를 제어하는 방식\n$E_s$ (슬립 주파수 전압)과 $E_r$ 과 같은 방향으로 인가 : 속도 증가\n$E_s$ (슬립 주파수 전압)과 $E_r$ 과 반대 방향으로 인가 : 속도 감소\n크라머(Kramer) 방법과 세르비우스(Scherbious) 방식이 있다.","img":null,"expImg":null},{"id":11,"text":"기본파의 $60$ [%]인 제 $3$고조파와 $80$ [%]인 제 $5$고조파를 포함하는 전압의 왜형률은?","opts":["$0.3$","$0.8$","$1$","$0.5$"],"answer":2,"exp":"왜형률 $= \\frac{\\text{고조파의 실효값의 합}}{\\text{기본파의 실효값}} = \\frac{\\sqrt{V_3^2 + V_5^2}}{V_1} = \\frac{\\sqrt{0.6^2 + 0.8^2}}{1} = 1$","img":null,"expImg":null},{"id":12,"text":"$v = 100\\sqrt{2}\\sin\\omega t + 50\\sqrt{2}\\sin \\left( 3\\omega t + \\frac{\\pi}{6} \\right)$ [V], $i = 40\\sqrt{2}\\sin \\left( 3\\omega t - \\frac{\\pi}{6} \\right) + 100\\sqrt{2}\\sin 5\\omega t$ [A]일 때, 이 회로에서 소비되는 전력은 약 몇 [kW]인가?","opts":["$2$","$4.9$","$5.2$","$1$"],"answer":3,"exp":"유효전력(평균전력)은 주파수가 같을 때만 발생되므로\n$P = V_3 I_3 \\cos\\theta_3 = 50 \\times 40 \\times \\cos 60^{\\circ} = 1 \\times 10^3 = 1[\\text{kW}]$","img":null,"expImg":null},{"id":13,"text":"다음의 회로에서 전류 $i(t)$ 를 나타낸 식은?","opts":["$i(t) = \\frac{q(t)v(t)}{C}$","$i(t) = C \\frac{dq(t)}{dt}$","$i(t) = \\frac{q(t)}{j\\omega C}$","$i(t) = C \\frac{v(t)}{dt}$"],"answer":3,"exp":"콘덴서에서의 전압, 전류\n전류 $i(t) = C \\frac{v(t)}{dt}$\n전압 $v(t) = \\frac{1}{C} \\int i(t) dt$","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAGOAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LHSiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKAAUUCigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooABRQKKACiiigAooooAKKKKAPAfjj488ba98SrX4M/Cm6istXktxc63q55/s2E4IA/usVIPr86AYzkU0/ZYsmiF/cfFLx5J4i8v5tSW+AHmY6hcFguf4d/Tv3qH4bTw6B+2z8Q9O1rbb3evWFvcaU8px9ojRE3KhPXo3A/55N6V9IUAfPvwW8a+OfCvxVm+C/wA 전력 보안통신 설비인 무선통신 안테나 또는 반사판을 지지하는 철근 콘크리트주 또는 철탑의 기초의 안전율은 얼마 이상이어야 하는가?","opts":["$1.2$","$1.3$","$1.5$","$2.2$"],"answer":2,"exp":"(KEC 364.1조) 무선통신 안테나 등을 지지하는 철탑 등의 시설\n전력 보안통신 설비인 무선통신용 안테나 또는 반사판을 지지하는 목주·철근·철근 콘크리트주 또는 철탑\n① 목주는 공중 하중에 대한 안전율은 $1.5$ 이상이어야 한다.\n② 철주·철근 콘크리트주 또는 철탑의 기초 안전율은 $1.5$ 이상이어야 한다.","img":null,"expImg":null},{"id":34,"text":"관등 회로에 대한 설명으로 옳은 것은?","opts":["분기점으로부터 안정기까지의 전로를 말한다.","스위치로부터 방전등까지의 전로를 말한다.","스위치로부터 안정기까지의 전로를 말한다.","방전등용 안정기 또는 방전등용 변압기로부터 발전전까지의 전로를 말한다."],"answer":3,"exp":"(KEC 112조) 용어 정의\n\"관등회로\"란 방전등용 안정기 또는 방전등용 변압기로부터 방전관까지의 전로를 말한다.","img":null,"expImg":null},{"id":35,"text":"빙설이 많은 지방 이외의 지방에서 저온계절에 어떤 풍압하중을 적용하는가?","opts":["갑종풍압하중","을종풍압하중","병종풍압하중","갑종풍압하중과 을종풍압하중 중 큰 것"],"answer":2,"exp":"(KEC 331.6조) 풍압 하중의 종별과 적용\n① 빙설이 많은 지방 이외의 지방에서는 고온계절에는 갑종 풍압하중, 저온계절에 을종 풍압하중\n② 빙설이 많은 지방에서는 고온계절에는 갑종 풍압하중, 저온계절에는 을종 풍압하중","img":null,"expImg":null},{"id":36,"text":"전력보안 통신용 전화설비의 시설장소로 적합하지 않은 것은?","opts":["수력설비의 안전상 필요한 양수소 및 강수량 관측소와 수력발전소 간","동일 수계에 속하고 안전상 긴급 연락의 필요가 있는 수력발전소 상호 간","원격감시 제어가 되는 발전소·변전소, 전선로 및 이를 운용하는 급전소간","2개 이상의 급전소 상호 간과 아들을 통합 운용하는 급전소 간"],"answer":2,"exp":"KEC 362조) 전력보안통신설비의 시설\n다음 각 호에 열거하는 곳에는 전력 보안통신용 전화 설비를 시설하여야 한다.\n① 원격감시 제어가 되지 아니하는 발전소·원격 감시제어가 되지 아니하는 변전소\n② 2개 이상의 급전소 상호 간과 이들을 통합 운용하는 급전소 간\n③ 수력설비 중 필요한 곳, 수력 설비의 안전상 필요한 양수소 및 강수량 관측소와 수력발전소 간\n④ 동일 수계에 속하고 안전상 긴급 연락의 필요가 있는 수력발전소 상호 간\n⑤ 동일 전력계통에 속하고 또한 안전상 긴급연락의 필요가 있는 발전소·변전소(이에 준하는 곳으로서 특고압의 전기를 변성하기 위한 곳을 포함한다)·발전제어소·변전제 어소 및 개폐소 상호 간","img":null,"expImg":null},{"id":37,"text":"전기온상의 발열선은 온도가 몇 [$^\\circ\\text{C}$]를 넘지 않도록 시설하여야 하는가?","opts":["$70$","$80$","$90$","$100$"],"answer":1,"exp":"(KEC 241.5조) 전기온상 등\n① 전로의 대지전압 : $300[\\text{V}]$ 이하\n② 발열선은 그 온도가 80도를 넘지 아니하도록 시설할 것","img":null,"expImg":null},{"id":38,"text":"발열선을 공중에 시설하는 전기온상 등에서 발열선을 애자로 지지하는 경우 지지점간의 거리는 몇 [m] 이하이어야 하는가?(단, 발열선의 상호간의 간격이 $0.06[\\text{m}]$ 미만인 경우이다)","opts":["$1$","$0.6$","$1.5$","$3$"],"answer":0,"exp":"발열선을 공중에 시설하는 전기온상 등에서 발열선을 애자로 지지하는 경우 방전압은 인버터 입력전압 범위 이내일 것\n③ 옥외에 시설하는 경우 방수등급은 IPX4 이상일 것","img":null,"expImg":null},{"id":42,"text":"정류기에 접속하는 변압기 권선의 절연내력시험전압은 정류기 교류측 최대사용전압의 몇 배의 교류 전압인가?(단, 정류기의 최대사용전압은 $60[\\text{kV}]$를 초과하는 경우이다)","opts":["$1.1$","$0.92$","$0.64$","$0.72$"],"answer":0,"exp":"(KEC 135조) 변압기 전로의 절연내력\n최대 사용전압이 $60[\\text{kV}]$를 초과하는 정류기에 접속 : $1.1$배","img":null,"expImg":null},{"id":43,"text":"변압기에 의하여 특고압 전로에 결합되는 고압전로에는 사용 전압의 3배 이하의 전압이 가하여진 경우에 방전하는 피뢰기를 어느 곳에 시설할 때, 방전장치를 생략할 수 있는가?","opts":["변압기의 단자","변압기 단자의 1극","고압전로의 모선의 각상","특고압 전로의 1극"],"answer":2,"exp":"(KEC 322.3조) 특고압과 고압의 혼촉 등에 의한 위험방지 시설\n변압기에 의하여 특고압전로에 결합되는 고압전로에는 사용전압의 3배 이하인 전압이 가하여진 경우에 방전하는 장치를 그 변압기의 단자에 가까운 1극에 설치하여야 한다. 다만, 사용전압의 3배 이하인 전압이 가하여진 경우에 방전하는 피뢰기를 고압전로의 모선의 각상에 시설하는 때에는 그러하지 아니하다.","img":null,"expImg":null},{"id":44,"text":"전력계통의 일부가 전력계통의 전원과 전기적으로 분리된 상태에서 분산형전원에 의해서만 가압되는 상태를 무엇이라 하는가?","opts":["계통연계","접속설비","단독운전","접근상태"],"answer":2,"exp":"독립형 전원(단독운전) : 전력계통의 일부가 전력계통의 전원과 전기적으로 분리된 상태\n계통연계형 전원 : 전력계통의 일부가 전력계통의 전원과 전기적으로 연결된 상태","img":null,"expImg":null},{"id":45,"text":"가공전선로의 지지물에 취급자가 오르고 내리는 데 사용하는 발판 볼트 등은 지표상 몇 [m] 미만에 시설하여서는 아니 되는가?","opts":["$1.2$","$1.5$","$1.8$","$2$"],"answer":2,"exp":"(KEC 331.4조) 가공 전로 지지물의 철탑오름 및 전주오름 방지\n가공전선로의 지지물에 취급자가 오르고 내리는 데 사용하는 발판 볼트 등은 지표상 $1.8[\\text{m}]$ 미만에 시설하여서는 아니 된다.","img":null,"expImg":null},{"id":46,"text":"교통 신호등 제어장의 2차측 배선의 최대사용전압은 몇 [V] 이하이어야 하는가?","opts":["$380$","$300$","$220$","$110$"],"answer":1,"exp":"(KEC 234.15조) 교통신호등\n교통신호등 제어장치의 2차측 배선의 최대사용전압은 $300[\\text{V}]$ 이하이어야 한다.","img":null,"expImg":null},{"id":47,"text":"저압가공전선의 높이는 도로를 횡단하는 경우와 철도를 횡단하는 경우에 각각 몇 [m] 이상이어야 하는가?","opts":["도로 : 지표상 $5[\\text{m}]$, 철도 : 레일면상 $6[\\text{m}]$","도로 : 지표상 $5[\\text{m}]$, 철도 : 레일면상 $6.5[\\text{m}]$","도로 : 지표상 $6[\\text{m}]$, 철도 : 레일면상 $6[\\text{m}]$","도로 : 지표상 $6[\\text{m}]$, 철도 : 레일면상 $6.5[\\text{m}]$"],"answer":3,"exp":"(KEC 332.5조) 저·고압 가공전선의 높이\n① 도로횡단 : $6[\\text{m}]$ 이상\n② 철도횡단 : 레일면상 $6.5[\\text{m}]$ 이상","img":null,"expImg":null},{"id":48,"text":"금속관공사로부터 애자공사로 옮기는 경우 절연부싱을 사용하는 가장 주된 목적은?","opts":["관의 끝이 터지는 것을 방지","관내 해충 및 이물질 출입 방지","관의 끝부분에서 조영재의 접촉 방지","관의 끝부분에서 전선 피복의 손상 방지"],"answer":3,"exp":"(KEC 232.12조) 금속관공사\n관의 끝 부분에는 전선의 피복을 손상하지 아니하도록 적당한 구조의 부싱을 사용할 것. 다만, 금속관공사로부터 애자사용공사로 옮기는 경우에는 그 부분의 관의 끝 부에는 절연부싱 또는 이와 유사한 것을 사용하여야 한다.","img":null,"expImg":null},{"id":49,"text":"전차선과 건조물 간의 최소 절연거리에 대한 표이다. 다음 (   ) 안에 들어갈 내용으로 옳은 것은?(단, 제시되어 있는 동적 최소 이격거리 이상을 확보하여야 한다)","opts":["$150$","$200$","$170$","$220$"],"answer":2,"exp":"(KEC 431.2조) 전차선로의 충전부와 건조물 간의 절연이격\n전차선로와 전차선, 급전선 및 전기철도차량 집전장치의 공기절연 이격거리는 표에 제시되어 있는 정적 및 동적 최소 절연이격거리 이상을 확보하여야 한다. 동적 절연이격의 경우 팬터그래프가 통과하는 동안의 일시적인 전선의 움직임 고려.","img":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCACVAlgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7BN4P+eZ/Ok+2/wDTP/x6qdFAFs3p/wCeY/Oj7a39wfnVVVZvuqT9BS7HB+435UAWPtj/ANwUn22T+4tV9jn+BvypRFJ/zzf8qAJzeSf3U/I0n2yX0T8qgKMOqEfhQEY9FP5UATG7m/2fypPtc394flUZR/7jflTSrf3T+VAE32qb+8PypPtU/wDf/QVFsc9FP5UFW/un8qAJPtU//PT9BSfaJv8Anoajw3oaXY/9xvyoAcZ5T/y0b86PNl/56P8A99GmFW/umlCt2U/lQAvmyf8APR/zo8x/77fnSFWB5U/lSYPoaAF3uf4m/OkJPqfzowewNGD6GgApKXBo2n0NACUtBz6Gk/A0AA4o7UYPoaMUAFFHPoaOfSgBc8UmaKMH0oAM96KMe1Az6UAFHelwfQ0YPoaAEpaMH0oAP900AJRS/nSYJ6A0AHag0u1vQ/lSYPvQAlBpQrE8 const title="24년 2회 산업기사 51~100";
let Q=QS,cur=0,score=0,round=1,ans=new Array(Q.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+Q.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=Q[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===Q.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+Q.length+(round>1?' · 오답 '+(round-1)+'차':'')+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===Q[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(Q.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function wrongIdx(){
  const r=[];
  for(let i=0;i<Q.length;i++){ if(ans[i]===null||!ans[i].ok) r.push(i); }
  return r;
}
function result(){
  const total=Q.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100);
  const wrong=wrongIdx(),skipped=total-done,retryMode=round>1;
  const pass=pct>=60;
  const col=retryMode?(wrong.length===0?'#3fb950':'#58a6ff'):(pass?'#3fb950':'#f85149');
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  let rt,sub;
  if(retryMode){
    rt=wrong.length===0?'🎉 오답 정복 완료!':'📝 오답 재풀이 '+(round-1)+'차 결과';
    sub=total+'문제 중 '+score+'문제 정답'+(wrong.length?' · 아직 '+wrong.length+'문제 남았어요':'');
  } else {
    rt=pass?'🎉 합격!':'😥 불합격';
    sub=pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다';
  }
  let note='';
  if(wrong.length){
    note='<div class="res-note">다시 볼 문제: '+wrong.map(i=>'Q'+String(Q[i].id).padStart(2,'0')).join(' ')+(skipped?'<br>안 푼 문제 '+skipped+'개도 다시 풀기에 포함돼요':'')+'</div>';
  }
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+col+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+col+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+rt+'</div>'+
    '<div class="res-sub">'+sub+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div>'+note+
    (wrong.length?'<button class="retry wrong" onclick="retryWrong()">❌ '+(skipped?'오답·미풀이 ':'오답 ')+wrong.length+'문제만 다시 풀기</button>':'')+
    '<button class="retry'+(wrong.length?' sub':'')+'" onclick="restart()">🔄 '+(retryMode?'전체 문제 처음부터 다시 풀기':'처음부터 다시 풀기')+'</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function retryWrong(){
  const w=wrongIdx(); if(!w.length) return;
  Q=w.map(i=>Q[i]); round++;
  cur=0; score=0; ans=new Array(Q.length).fill(null); cache={}; render();
}
function restart(){Q=QS;round=1;cur=0;score=0;ans=new Array(Q.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/Q.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
</body>
</html>
