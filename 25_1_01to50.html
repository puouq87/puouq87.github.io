<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>25년 1회 산업기사 01~50</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:16px;}

/* HEADER */
.hdr{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;gap:10px;position:fixed;top:0;left:0;right:0;z-index:100;}
.hdr-info{flex:1;min-width:0;}
.hdr-title{font-size:12px;font-weight:900;color:#58a6ff;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hdr-sub{font-size:10px;color:#8b949e;margin-top:1px;}
.prog-bar{height:3px;background:#30363d;border-radius:2px;overflow:hidden;margin-top:6px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#58a6ff,#a371f7);border-radius:2px;transition:width .3s;}
.score-chip{background:#21262d;border:1px solid #30363d;border-radius:16px;padding:4px 10px;font-size:12px;font-weight:700;color:#58a6ff;font-variant-numeric:tabular-nums;white-space:nowrap;}

/* MAIN */
.main{position:fixed;top:68px;left:0;right:0;bottom:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px;}

/* CARD */
.q-card{background:#161b22;border:1px solid #30363d;border-radius:14px;overflow:hidden;animation:up .2s ease;margin-bottom:10px;}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.q-tag{background:linear-gradient(90deg,#58a6ff,#a371f7);padding:7px 14px;font-size:10px;font-weight:700;letter-spacing:2px;color:#fff;}
.q-body{padding:14px;}
.q-num{font-size:10px;color:#8b949e;font-weight:700;margin-bottom:6px;letter-spacing:1px;}
.q-text{font-size:15px;line-height:1.75;font-weight:500;margin-bottom:12px;word-break:keep-all;}
.q-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto 12px;border:1px solid #30363d;}
.exp-img{width:100%;max-width:340px;border-radius:8px;display:block;margin:0 auto;border:1px solid #30363d;}
.exp-imgwrap{padding:0 13px 13px;background:#0d1117;}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{display:flex;align-items:flex-start;gap:10px;background:#21262d;border:1px solid #30363d;border-radius:11px;padding:11px 13px;cursor:pointer;transition:all .15s;color:#e6edf3;font-size:14px;line-height:1.5;width:100%;text-align:left;-webkit-appearance:none;appearance:none;}
.opt:active{transform:scale(.98);}
.opt-lbl{min-width:24px;height:24px;border-radius:50%;background:#30363d;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
.opt.ok{border-color:#3fb950;background:rgba(63,185,80,.1);}
.opt.ok .opt-lbl{background:#3fb950;color:#0d1117;}
.opt.ng{border-color:#f85149;background:rgba(248,81,73,.1);}
.opt.ng .opt-lbl{background:#f85149;color:#fff;}

/* EXPLANATION */
.exp{display:none;margin-top:12px;border-radius:10px;overflow:hidden;border:1px solid #30363d;}
.exp.show{display:block;animation:fi .25s ease;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.exp-hdr{background:#21262d;padding:8px 13px;font-size:10px;font-weight:700;letter-spacing:2px;color:#58a6ff;display:flex;align-items:center;gap:6px;}
.exp-dot{width:6px;height:6px;border-radius:50%;background:#58a6ff;}
.exp-body{padding:11px 13px;background:#0d1117;font-size:13px;line-height:1.8;color:#8b949e;white-space:pre-wrap;}
.ld{display:flex;gap:4px;align-items:center;}
.ld span{width:5px;height:5px;border-radius:50%;background:#58a6ff;animation:bk 1.2s infinite;}
.ld span:nth-child(2){animation-delay:.2s;}
.ld span:nth-child(3){animation-delay:.4s;}
@keyframes bk{0%,80%,100%{transform:scale(.5);opacity:.4}40%{transform:scale(1);opacity:1}}

/* NAV */
.nav{display:flex;gap:8px;margin-top:10px;}
.nav-btn{flex:1;padding:13px;border-radius:11px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;-webkit-appearance:none;}
.nav-btn.prev{background:#21262d;color:#8b949e;border:1px solid #30363d;}
.nav-btn.next{background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;}
.nav-btn:disabled{opacity:.3;pointer-events:none;}

/* DOTS */
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;padding-bottom:20px;}
.dot{width:28px;height:28px;border-radius:6px;background:#21262d;border:1px solid #30363d;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;color:#8b949e;}
.dot.cur{background:#58a6ff;border-color:#58a6ff;color:#0d1117;}
.dot.c-ok{background:rgba(63,185,80,.15);border-color:#3fb950;color:#3fb950;}
.dot.c-ng{background:rgba(248,81,73,.15);border-color:#f85149;color:#f85149;}

/* RESULT */
.result{text-align:center;padding:24px 16px;}
.ring{width:100px;height:100px;margin:0 auto 16px;position:relative;display:flex;align-items:center;justify-content:center;}
.ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg);}
.ring-pct{font-size:26px;font-weight:900;}
.res-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.res-sub{font-size:13px;color:#8b949e;margin-bottom:24px;}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:24px;}
.stat{background:#161b22;border:1px solid #30363d;border-radius:10px;padding:12px 8px;text-align:center;}
.stat-v{font-size:20px;font-weight:900;}
.stat-l{font-size:10px;color:#8b949e;margin-top:2px;}
.retry{width:100%;padding:14px;border-radius:11px;border:none;background:linear-gradient(135deg,#58a6ff,#a371f7);color:#0d1117;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;}
</style>

":null},{"id":13,"text":"공극을 가진 환상 솔레노이드에서 총 권수 $N$, 철심의 비투자율 $\\mu _r$, 단면적 $A$, 길이 $\\ell$ 이고 공극이 $\\delta$ 일 때, 공극부에 자속밀도 $B$ 를 얻기 위해서는 얼마의 전류를 몇 [ A ] 흘려야 하는가?","opts":["$\\frac{10^7 B}{2 \\pi N} \\left( \\frac{\\ell}{\\mu _r} + \\delta \\right)$","$\\frac{10^7 B}{2 \\pi N} \\left( \\frac{\\delta}{\\mu _r} + \\ell \\right)$","$\\frac{10^7 B}{4 \\pi N} \\left( \\frac{\\ell}{\\mu _r} + \\delta \\right)$","$\\frac{10^7 B}{4 \\pi N} \\left( \\frac{\\delta}{\\mu _r} + \\ell \\right)$"],"answer":2,"exp":"기자력 $F_m = N I = R_m \\phi$ 에서  \n자기저항 $R_m = R_i + R_g = \\frac{\\ell}{\\mu _0 \\mu _r A} + \\frac{\\delta}{\\mu _0 A} = \\frac{1}{\\mu _0 A} \\left( \\frac{\\ell}{\\mu _r} + \\delta \\right)$  \n전류 $I = \\frac{\\phi R_m}{N} = \\frac{(BA) R_m}{N} = \\frac{B}{\\mu _0 N} \\left( \\frac{\\ell}{\\mu _r} + \\delta \\right) = \\frac{10^7 B}{4 \\pi N} \\left( \\frac{\\ell}{\\mu _r} + \\delta \\right)$","img":null,"expImg":null},{"id":14,"text":"진공 중에 두 개의 무한히 긴 직선도체를 거리 $r$ [ m ] 간격으로 평행하게 놓고, 각각에 $I_1$, $I_2$ 의 전류를 흘렸을 때 단위 길이 당 작용하는 힘 [ N/m ] 은 어떻게 표현되는가?","opts":["$\\frac{I_1 I_2}{r} \\times 10^{-7}$","$\\frac{2 I_1 I_2}{r} \\times 10^{-7}$","$\\frac{I_1 I_2}{r^2} \\times 10^{-7}$","$\\frac{2 I_1 I_2}{r^2} \\times 10^{-7}$"],"answer":1,"exp":"평행도선 단위길이 당 작용하는 힘\n$F = \\frac{\\mu_0 I_1 I_2}{2 \\pi r} = \\frac{2 I_1 I_2}{r} \\times 10^{-7}$ [ N/m ]\n힘은 거리에 반비례하고 전류의 곱과 투자율에 비례한다. \n같은 방향(평행도선) : 흡인력\n다른 방향(왕복도선) : 반발력","img":null,"expImg":null},{"id":15,"text":"자기 인덕턴스 $L$ [ H ] 인 코일에 전류 $I$ [ A ] 를 흘렸을 때, 자계의 세기가 $H$ [ A/m ] 이다. 이 코일에 전류 $\\frac{I}{2}$ [ A ] 를 흘리면 저장되는 자기에너지 [ J ] 는 얼마인가?","opts":["$\\frac{1}{2} \\mu_0 H^2$","$\\frac{1}{8} \\mu_0 H^2$","$\\frac{1}{2} L I^2$","$\\frac{1}{8} L I^2$"],"answer":3,"exp":"자기 에너지 $W = \\frac{1}{2} L I^2$ [ J ]  \n에너지는 $W = \\frac{1}{2} L I^2 = \\frac{1}{2} L \\left( \\frac{1}{2} I^2 \\right) = \\frac{1}{8} L I^2$ [ J ]","img":null,"expImg":null},{"id":16,"text":"반지름 $a$ 인 비접지 구도체의 중심에서 $d ( > a )$ 만큼 떨어진 위치에 점전하 $Q$ 가 존재할 때 공간에서의 전계를 구하고자 한다. 이 문제를 영상전하법으로 풀 때 필요한 영상전하의 개수 및 영상 전하의 전하량의 총합은?","opts":["$1$ 개, $- \\frac{a}{d} Q$","$2$ 개, $0$","$2$ 개, $- \\frac{a}{2d} Q$","$3$ 개, $\\frac{a}{d} Q$"],"answer":0,"exp":"접지 도체구\n영상전하 : $Q' = - \\frac{a}{d} Q$ 이므로 $1$ 개가 유도된다.","img":null,"expImg":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCABmAMsDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LooooAKydX160sLlbGKK4v8AUXUMtnaKGl2nPzNkhUXg/M7KCRgEniquq6ld3+pSaFoUojmiwL+92hlswwBCKDw0zAghTwqkM3BRX0tF0my0m1MFnEQXbfLI7F5Jn7u7Hlm46n0A6CgDMFj4l1JSdQ1WLSIj0g01RJIMMfvTSLggrjhY1IOcMetTxeF9EVmae1kvS3J+3XElyB9BKzBfwxW1RQBkf8Ix4aH/ADL+k/8AgHH/AIUyXwvojMrQWslkV6fYbiS1z9REyhvxzW1RQBzpsPE2mqDp2rR6vGM5t9SURuSSMBZol+UAZ4aNyTjLDrVzSdetL66axmhuNP1FVLtZ3ahZCoIG5SCVdeRkozAZAODxWtVHWdKstWtBb3sW4K2+N1Yo8Tjo6MOVYZ6g0AXqK5bRdfNp4hfwpq94tzdooa2vFTAmUgkRyYG1J9oLbRjeo3qANyr1NABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAVjeJ9QuYIoNO0xk/tO/YxW5ZdwhUDLzMO6oOccAsUXI3A1s1z3h1DqGtanrsqnAlawswwwUjiYrIcHoWlD8jqqR+lAGpommWukabFY2isETJZmOXkdiWZ2P8TMxLE9SSTV2iigAooooAKKKbKpeJ0DFSykBh1HvQAkc0MjuiSozJw6qwJX6+lYutald3F4dE0Nl+24BuLhl3JZof4iP4nI+6n4njry3hjR9R8PvP4d0rWpdUv2it4ri9nhXbp8McSqB1JeVzukCsT80rM2AQG7fRtPstIs0sLU88uzO+6SVifmdieWYnkmgCovhnSh4fk0UxyNDId7ymQ+c0uQ3nb+vmbgGDdQQCMYFHhfULqZLjTNUdTqlgwSdgMC Wmf8g21/64p/IVYoooAKKKKAP/2Q=="},{"id":17,"text":"지름 $a$ [ m ] 되는 도체구의 표면전하밀도가 $\\sigma$ [ $\\text{C/m}^2$ ] 일 때, 도체표면의 전위와 전계의 관계식은? (단, $V$ 는 전위이며 전계 $E = \\frac{\\sigma}{\\epsilon_o}$ [ V/m ] 이다)","opts":["$V = E a$","$V = E a^2$","$V = \\frac{E}{a}$","$V = \\frac{E}{a^2}$"],"answer":0,"exp":"구도체  \n전계 $E = \\frac{Q}{4 \\pi \\epsilon_o a^2}$ [ V/m ]   \n전위 $V = \\frac{Q}{4 \\pi \\epsilon_o a}$ [ V ]   \n따라서 $V = E a$ [ V ] ","img":null,"expImg":null},{"id":18,"text":"비투자율 $\\mu_s$ 가 $1$ 인 자성체 내에서 주파수 $2$ [ GHz ] 인 전자기파의 파장 [ m ] 은?","opts":["$0.1$","$0.15$","$0.25$","$0.4$"],"answer":1,"exp":"전자파의 전파속도\n$v = \\frac{1}{\\sqrt{\\epsilon \\mu}} = \\frac{3 \\times 10^8}{\\sqrt{\\epsilon_s \\mu_s}} = \\frac{3 \\times 10^8}{\\sqrt{1 \\times 1}} = 3 \\times 10^8$ [ m/s ]\n전파속도 $v = f \\lambda$ 에서\n파장 $\\lambda = \\frac{v}{f} = \\frac{3 \\times 10^8}{2 \\times 10^9} = 0.15$ [ m ]","img":null,"expImg":null},{"id":19,"text":"액체 유전체를 포함한 콘덴서 용량이 $C$ [ F ] 인 것에 $V$ [ V ] 의 전압을 가했을 경우에 흐르는 누설전류 [ A ] 는? (단, 유전체의 유전율은 $\\epsilon$, 고유저항은 $\\rho$ 라 한다)","opts":["$\\frac{\\rho \\epsilon}{C} V$","$\\frac{C}{\\rho \\epsilon} V$","$\\frac{C}{\\rho \\epsilon} V^2$","$\\frac{\\rho \\epsilon}{C V}$"],"answer":1,"exp":"$R C = \\rho \\epsilon$ 에서 $R = \\frac{\\rho \\epsilon}{C}$\n누설전류 $I = \\frac{V}{R} = \\frac{V}{\\frac{\\rho \\epsilon}{C}} = \\frac{C V}{\\rho \\epsilon}$ [ A ]","img":null,"expImg":null},{"id":20,"text":"전기력선의 기본성질에 관한 설명으로 틀린 것은?","opts":["전기력선은 그 자신만으로 폐곡선이 된다.","도체 내부에는 전기력선이 없다.","전기력선은 전위가 높은 점에서 낮은 점으로 향한다.","전기력선은 양전하 $(+)$ 에서 시작하여 음전하 $(-)$ 에서 끝난다."],"answer":0,"exp":"전기력선의 성질\n전기력선의 밀도는 전계의 세기이다.(전기력선의 총수 $N = \\int_{S} E \\, ds = \\frac{Q}{\\epsilon}$ )\n전기력선의 접선 방향은 전계의 방향이다.\n전기력선은 등전위면과 수직이다.\n전기력선은 정전하에서 시작하여 부전하로 도착한다.\n전기력선(전계)은 전위가 높은 점에서 낮은 점으로 향한다.\n전기력선은 그 자신만으로 폐곡선이 되지 않는다.\n전기력선은 교차하지 않는다.\n도체 내부에는 전기력선이 없다.(전계도 없다.)\n전하가 없는 곳에서는 전기력선의 발생, 소멸이 없고 연속적이다.","img":null,"expImg":null},{"id":21,"text":"송전선로의 4단자 정수가 $A$, $B$, $C$, $D$ 이고 송전단 상전압이 $E_s$ 인 경우 무부하 시의 충전전류(송전단 전류)는?","opts":["$C E_s$","$A C E_s$","$\\frac{C}{A} E_s$","$\\frac{A}{C} E_s$"],"answer":2,"exp":"무부하 시 ( $I_r = 0$ )\n$E_s = A E_r + B I_r$ 에서 $E_s = A E_r$\n$\\therefore E_r = \\frac{1}{A} E_s$\n$I_s = C E_r + D I_r$\n따라서, 무부하시의 충전 전류(송전단 전류) $I_s = C E_r = \\frac{C}{A} E_s$","img":null,"expImg":null},{"id":22,"text":"$62,000$ [ kW ] 의 전력을 $60$ [ km ] 떨어진 지점에서 송전하려면 전압은 몇 [ kV ] 로 하면 좋은가? 단, Still 식을 사용한다.","opts":["$66$","$110$","$140$","$154$"],"answer":2,"exp":"Still 의 식(경제적인 송전 전압 결정식)\n$V_s = 5.5 \\sqrt{0.6 \\ell + \\frac{P}{100}}$ [ kV ] 여기서, $\\ell$ : 송전 거리 [ km ] , $P$ : 송전전력 [ kW ]\n$= 5.5 \\sqrt{0.6 \\times 60 + \\frac{62,000}{100}} = 140.86$ [ kV ]","img":null,"expImg":null},{"id":23,"text":"전력계통에서 인터록의 설명으로 옳은 것은?","opts":["차단기와 단로기는 각각 열리고 닫힌다.","차단기가 열려 있어야만 단로기를 닫을 수 있다.","차단기의 접점과 단로기의 접점이 동시에 투입될 수 있다.","차단기가 닫혀 있어야만 단로기를 닫을 수 있다."],"answer":1,"exp":"인터록 ( Interlock ) : 차단기가 열려 있어야 단로기 조작 가능\n투입 시 : DS - CB 순\n차단 시 : CB - DS 순","img":null,"expImg":null},{"id":24,"text":"전력계통의 전압을 조정하는 가장 보편적인 방법은?","opts":["계통의 주파수 조정","계통의 무효전력 조정","부하의 유효전력 조정","발전기의 유효전력 조정"],"answer":1,"exp":"계통의 전압 조정 : 무효전력을 조정 ( 동기조상기, 분로 리액터, 전력용 콘덴서 등 )\n주파수 조정 : 유효전력 조정","img":null,"expImg":null},{"id":25,"text":"단상 승압기 1대를 사용하여 승압하는 경우 승압 전의 전압을 $E_1$ 이라 하면, 승압 후의 전압 $E_2$ 는? (단, 승압기의 변압비는 $\\frac{\\text{전원측전압}}{\\text{부하측전압}} = \\frac{e_1}{e_2}$ 이다)","opts":["$E_2 = E_1 + \\frac{e_1}{e_2} E_1$","$E_2 = E_1 + e_2$","$E_2 = E_1 + \\frac{e_2}{e_1} E_1$","$E_2 = E_1 + e_1$"],"answer":2,"exp":"단권변압기\n$\\frac{V_h}{V_l} = \\frac{n_1 + n_2}{n_1} = \\left( 1 + \\frac{n_2}{n_1} \\right)$ 에서\n$\\frac{E_2}{E_1} = \\frac{n_1 + n_2}{n_1} = \\left( \\frac{e_1 + e_2}{e_1} \\right) = \\left( 1 + \\frac{e_2}{e_1} \\right)$\n따라서 $E_2 = E_1 + \\frac{e_2}{e_1} E_1$","img":null,"expImg":null},{"id":26,"text":"여러 회선의 비접지 3상 3선식 배전선로에 선택지락계전기를 사용하여 선택지락보호를 하려고 할 때 필요한 것은?","opts":["PT와 CT","GPT와 CT","GPT와 ZCT","PT와 ZCT"],"answer":2,"exp":"GPT ( Ground Potential Transformer ) : 접지형 계기용 변압기. 지락 사고 시 영상전압 검출\n영상변류기 ( ZCT ) : 영상(지락)전류 검출. 지락(접지)계전기와 연결","img":null,"expImg":null},{"id":27,"text":"정격 전압이 $24$ [ kV ], 정격 용량이 $665$ [ MVA ] 인 차단기가 있다. 이 차단기의 정격 차단전류는 약 몇 [ kA ] 인가?","opts":["$12.5$","$16$","$25$","$32$"],"answer":1,"exp":"3상용 차단기의 정격 용량 $P_s = \\sqrt{3} \\times \\text{정격전압} \\times \\text{정격차단전류}$ [ MVA ] \n정격 차단 전류 : $I_s = \\frac{P_s}{\\sqrt{3} V} = \\frac{665 \\times 10^6}{\\sqrt{3} \\times 24 \\times 10^3} \\times 10^{-3} = 16$ [ kA ] ","img":null,"expImg":null},{"id":28,"text":"송전계통의 중성점을 접지하는 목적으로 틀린 것은?","opts":["지락 고장 시 전선로의 대지 전위 상승을 억제하고 전선로와 기기의 절연을 경감시킨다.","소호리액터 접지방식에서는 1선 지락 시 지락점 아크를 빨리 소멸시킨다.","차단기의 차단용량을 증대시킨다.","지락고장에 대한 계전기의 동작을 확실하게 한다."],"answer":2,"exp":"송전선의 중성점 접지 목적\n1선 지락 시 전위 상승 억제하고 전선로와 기기의 절연을 경감\n지락 사고 시 보호 계전기 동작의 확실\n과도안정도 증진\n이상전압 발생 방지","img":null,"expImg":null},{"id":29,"text":"열사이클의 효율을 올리는 방법과 거리가 먼 것은?","opts":["절탄기 설치","저압저온 이용","재생사이클 채용","과열증기 사용"],"answer":1,"exp":"화력 발전소 열효율 향상\n절탄기, 공기예열기의 설치\n재생 · 재열 사이클의 채용\n고압, 고온증기의 채용과 과열기의 설치","img":null,"expImg":null},{"id":30,"text":"뇌해방지와 관계가 없는 것은?","opts":["댐퍼","초호각","가공지선","매설지선"],"answer":0,"exp":"가공지선 : 직격뢰, 유도뢰 차폐\n매설지선 : 역섬락 방지\n소호각(소호환) : 섬락 시 애자련 보호\n여기서, 댐퍼는 선로의 진동 방지에 쓴다.","img":null,"expImg":null},{"id":31,"text":"총 설비용량은 $800$ [ kW ], 수용률은 $0.5$ 인 건물의 변압기 용량은 몇 [ kA ] 인가? (단, 부하역률은 $0.8$ 이다)","opts":["$200$","$250$","$350$","$500$"],"answer":3,"exp":"변압기 용량 [ kVA ] = $\\frac{\\text{설비용량} \\times \\text{수용률}}{\\text{부등률} \\times \\text{역률}} = \\frac{800 \\times 0.5}{0.8} = 500$ [ kVA ]","img":null,"expImg":null},{"id":32,"text":"송전 계통에서 이상 전압의 방지 대책으로 볼 수 없는 것은?","opts":["철탑 접지저항의 저감","가공 송전선로의 피뢰용으로서의 가공지선에 의한 뇌차폐","기기 보호용으로서의 피뢰기 설치","복도체 방식 채택"],"answer":3,"exp":"이상 전압 보호 장치 및 기능\n가공지선 : 뇌의 차폐\n피뢰기 : 기기(변압기) 보호\n매설지선, 철탑 접지저항의 저감 : 역섬락 방지\n여기서, 복도체 방식은 코로나 대책이다.","img":null,"expImg":null},{"id":33,"text":"변류기의 2차측 외부를 변류기와 분리할 때 변류기의 2차측에 과전압이 유도되는 것을 방지하기 위한 조치로 옳은 것은?","opts":["2차 측 각 단자를 단락시킨다.","2차 측 각 단자를 절연시킨다.","2차 측 각 단자를 고저항으로 연결한다.","2차 측 각 단자를 개방한다."],"answer":0,"exp":"계기용 변성기 점검\nPT(계기용 변압기) : 2차측 개방(2차측 과전류 보호)\nCT(변류기) : 2차측 단락(2차측 과전압보호, 2차측 절연보호)","img":null,"expImg":null},{"id":34,"text":"송배전 선로에 사용하는 직렬 커패시터에 대한 설명으로 옳은 것은?","opts":["선로의 유도 리액턴스를 보상하고 전압강하를 감소시킨다.","최대 송전전력이 감소하고 정태안정도가 감소된다.","부하의 변동에 따른 수전단의 전압변동률은 증대된다.","송수 양단의 전달 리액턴스가 증가하고 안정극한전력이 감소한다."],"answer":0,"exp":"직렬콘덴서(직렬축전지)는 유도 리액턴스에 의한 선로의 전압 강하 보상용으로 전압변동을 줄이고 정태안정도 개선용으로 사용한다. 따라서, 역률개선에는 큰 영향이 되지 않는다.","img":null,"expImg":null},{"id":35,"text":"코로나 방지에 가장 효과적인 방법은?","opts":["선간거리를 증가시킨다.","전선의 높이를 가급적 낮게 한다.","전선 표면의 전위경도를 높인다.","전선의 바깥지름을 크게 한다."],"answer":3,"exp":"코로나 방지대책\n코로나 임계 전압을 크게, 전위경도를 작게\n전선의 지름을 크게\n복도체(다도체) 방식(가장 효과적인 방법)\n가선금구를 개량","img":null,"expImg":null},{"id":36,"text":"전력용 퓨즈는 주로 어떤 전류의 차단을 목적으로 사용하는가?","opts":["과도전류","단락전류","과부하전류","지락전류"],"answer":1,"exp":"전력 퓨즈(PF : Power Fuse) : 단락전류 차단","img":null,"expImg":null},{"id":37,"text":"등가 선간거리를 $D$ 라 할 때, 등가 선간거리 $D$ 가 증가할 때 송전선의 정전용량은 어떻게 되는가?","opts":["$\\log_{10} \\frac{r}{D}$ 에 비례","$\\log_{10} \\frac{D}{r}$ 에 비례","$\\log_{10} \\frac{r}{D}$ 에 반비례","$\\log_{10} \\frac{D}{r}$ 에 반비례"],"answer":3,"exp":"작용정전용량 $C = \\frac{0.02413}{\\log_{10} \\frac{D}{r}}$ [ $\\mu\\text{F/km}$ ] $\\therefore$ 작용정전용량 $C \\propto \\frac{1}{\\log_{10} \\frac{D}{r}}$","img":null,"expImg":null},{"id":38,"text":"원자력 발전소에서 원자로의 냉각재가 갖추어야 할 조건으로 틀린 것은?","opts":["열전도가 적을 것","비열이 클 것","핵연료의 피복재와 감속재 등의 사이에서 화학반응이 적을 것","중성자 흡수 단면적이 적을 것"],"answer":0,"exp":"냉각재\n원자로 내의 열을 외부로 운반하는 역할\n열전도율과 비열이 클 것\n$\\text{H}_2\\text{O}$ ( 경수 ), $\\text{D}_2\\text{O}$ ( 중수 ), $\\text{CO}_2$, $\\text{He}$, 액체 $\\text{Na}$ 등\n중성자의 흡수 단면적이 클 것은 제어재의 구비 조건이다.","img":null,"expImg":null},{"id":39,"text":"지락사고 시 일정 전압 이상이 되면 동작하는 계전기는?","opts":["비율 차동 계전기","부족 전압 계전기","지락 과전류 계전기","지락 과전압 계전기"],"answer":3,"exp":"지락과전압계전기(OVGR) : 지락사고 시 일정 전압 이상이 되면 동작","img":null,"expImg":null},{"id":40,"text":"출력 $3,000$ [ kW ] 의 수력 발전소를 설치하는 경우 유효 낙차가 $20$ [ m ] 이면 사용 수량은 약 몇 [ m3/s ] 가 되는가? ( 단, 수차효율은 $86$ [ % ], 발전기 효율은 $96$ [ % ] 이다 )","opts":["$8.5$","$12$","$18.5$","$28.5$"],"answer":2,"exp":"수력 발전소 출력 $P_g = 9.8 Q H \\eta_t \\eta_g$ [ kW ]\n유량 $Q = \\frac{P}{9.8 H \\eta} = \\frac{3,000}{9.8 \\times 20 \\times 0.86 \\times 0.96} = 18.5$ [ $\\text{m}^3/\\text{sec}$ ]","img":null,"expImg":null},{"id":41,"text":"6상 회전변류기의 정격 출력이 $2,500$ [ kW ] 이고 직류측 정격 전압이 $1,000$ [ V ] 이다. 교류측의 입력전류 [ A ] 는 약 얼마인가? ( 단, 역률은 $80$ [ % ], 효율은 $100$ [ % ] 이다 )","opts":["$943$","$1,170$","$1,360$","$1,473$"],"answer":3,"exp":"회전 변류기 전류비 $\\frac{I_a}{I_d} = \\frac{2\\sqrt{2}}{m \\cdot \\cos\\theta}$ \n여기서, 직류측 전류 $P = E_d I_d$ 에서 \n$I_d = \\frac{P}{E_d} = \\frac{2,500 \\times 10^3}{1,000} = 2,500$ [ A ] \n교류측 전류 $I_a = \\frac{2\\sqrt{2}}{m \\cdot \\cos\\theta} I_d = \\frac{2\\sqrt{2} \\times 2,500}{6 \\times 0.8} = 1,473$ [ A ]","img":null,"expImg":null},{"id":42,"text":"직류전동기 중에서 부하의 변화에 따른 속도 변화가 가장 많은 전동기는?","opts":["가동 복권전동기","타여자전동기","직권전동기","분권전동기"],"answer":2,"exp":"부하의 변화에 대하여 속도 변동이 큰 순서\n직권 > 가동복권 > 분권 > 차동복권","img":null,"expImg":null},{"id":43,"text":"변압기유로 쓰이는 절연유에 요구되는 특성이 아닌 것은?","opts":["점도가 클 것","절연 내력이 클 것","응고점이 낮을 것","인화점이 높을 것"],"answer":0,"exp":"절연유의 구비조건(절연+냉각)\n절연내력이 클 것\n점도가 적고 비열이 커서 냉각 효과가 클 것\n인화점은 높고, 응고점이 낮을 것\n고온에서 산화하지 않고, 침전물이 생기지 않을 것","img":null,"expImg":null},{"id":44,"text":"3상 유도전동기의 기동법으로 옳지 않은 것은?","opts":["전력 기동법","전전압 기동법","단권 변압기 기동법","Y-$\\Delta$ 기동법"],"answer":0,"exp":"3상 농형 유도 전동기 기동법\n전전압 기동(직입기동) : $5$ [ HP ] 이하( $3.7$ [ kW ] )\nY-$\\Delta$ 기동( $5 \\sim 15$ [ kW ] )급 : 전류 $1/3$ 배, 전압 $1/\\sqrt{3}$ 배\n기동 보상기법 : $15$ [ kW ] 초과 단권변압기를 사용하여 감전압기동","img":null,"expImg":null},{"id":45,"text":"교류 전압제어기를 전원과 부하회로에 연결된 조광기에 교류 실효전압을 변화시켜서 사용할 수 있는 소자 중 가장 옳은 것은?","opts":["TRIAC","MOSFET","Diode","Power Transister"],"answer":0,"exp":"TRIAC의 특징\nSCR $2$ 개를 역병렬 접속한 것과 같은 것\n게이트에 전류를 흘리면 어느 방향이건 전압이 높은 쪽에서 낮은 쪽으로 도통\n정격 전류 이하로 전류를 제어해주면 과전압에 의해서는 파괴되지 않는다.\n교류전력 제어용","img":null,"expImg":null},{"id":46,"text":"단상 유도 전압 조정기에서 단락권선의 설치목적은?","opts":["분로권선에 직렬로 연결하여 파형을 개선한다.","직렬권선의 누설 리액턴스를 감소하여 전압강하를 적게 한다.","직렬권선과 병렬로 연결하여 역률을 개선한다.","분로권선에 병렬로 연결하여 고조파를 제거한다."],"answer":1,"exp":"단락권선의 역할\n누설 리액턴스에 의한 2차 전압 강하 방지\n단락 권선은 회전자 1차 권선과 직각으로 감는다.","img":null,"expImg":null},{"id":47,"text":"20 [ V ] , 6 극 , 60 [ Hz ] , 10 [ kW ] 인 3상 유도전동기의 회전자 1상의 저항은 0.1 [ $\\Omega$ ], 리액턴스는 0.5 [ $\\Omega$ ] 이다. 정격전압을 가했을 때 슬립이 4 [ % ] 일 때 회전자 전류는 몇 [ A ] 인가? ( 단, 고정자와 회전자는 $\\Delta$ 결선으로서 권수는 각각 300 회 , 150 회이며, 각 권선계수는 같다 )","opts":["27","36","43","52"],"answer":2,"exp":"권선계수 $k_{w1} = k_{w2}$ 라 하면\n권수비 : $a = \\frac{w_1}{w_2} = \\frac{300}{150} = 2$\n정지 시 2차 유기 전압 : $E_2 = \\frac{E_1}{a} = \\frac{220}{2} = 110$ [ V ]\n회전자 전류 $I_2 = \\frac{s E_2}{\\sqrt{r_2^2 + (s x_2)^2}} = \\frac{0.04 \\times 110}{\\sqrt{0.1^2 + (0.04 \\times 0.5)^2}} = 43$ [ A ]","img":null,"expImg":null},{"id":48,"text":"어느 변압기의 1차 권수가 $1,500$ 인 변압기의 2차측에 접속한 $20$ [ $\\Omega$ ] 의 저항은 1차측으로 환산했을 때 $8$ [ $\\text{k}\\Omega$ ] 으로 되었다고 한다. 이 변압기의 2차 권수는?","opts":["$400$","$250$","$150$","$75$"],"answer":3,"exp":"$a = \\frac{n_1}{n_2} = \\frac{V_1}{V_2} = \\sqrt{\\frac{Z_1}{Z_2}}$ 에서\n$a = \\sqrt{\\frac{Z_1}{Z_2}} = \\sqrt{\\frac{8,000}{20}} = 20$\n$a = \\frac{n_1}{n_2} = \\frac{V_1}{V_2} = \\sqrt{\\frac{Z_1}{Z_2}}$ 에서\n차측 권수 $n_2 = \\frac{n_1}{a} = \\frac{1,500}{20} = 75$","img":null,"expImg":null},{"id":49,"text":"변압기의 표유 부하손이란?","opts":["부하전류 중 누전에 의한 손실","무부하시 여자전류에 의한 동손","누설자속에 의하여 외함, 기타 철물에 생기는 손실","1차, 2차 권선 간의 누설자속에 의하여 생기는 손실"],"answer":2,"exp":"변압기의 부하손\n동손 : 권선에 의한 손실\n표유 부하손 : 권선이외 부분의 누설 자속에 의한 손실","img":null,"expImg":null},{"id":50,"text":"전기기계에 있어서 히스테리시스손을 감소시키기 위한 방법은?","opts":["보극 설치","규소강판 사용","보상권선 설치","성층철심 사용"],"answer":1,"exp":"히스테리시스손 감소 : 규소강판 사용\n와류손 감소 : 성층철심 사용","img":null,"expImg":null}];
const title="25년 1회 산업기사 01~50";
let cur=0,score=0,ans=new Array(QS.length).fill(null),cache={};

window.onerror=function(msg,src,line,col,err){
  var box=document.getElementById('main');
  if(box){
    box.innerHTML='<div style="padding:20px;color:#f85149;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;">'+
      '⚠️ 오류가 발생했습니다. 아래 내용을 캡처해서 알려주세요:\n\n'+
      String(msg)+'\n(줄 '+line+', 칸 '+col+')\n\n'+
      'QS문제수: '+(typeof QS!=='undefined'?QS.length:'undefined')+'\n'+
      'UA: '+navigator.userAgent+
      '</div>';
  }
  return false;
};

async function getExp(q){
  if(cache[q.id]) return cache[q.id];
  if(!q.exp) return q.expImg?'':'해설이 없습니다.';
  cache[q.id]=q.exp; return q.exp;
}

function mkDots(){
  return '<div class="dots">'+QS.map((q,i)=>{
    let c='dot'+(i===cur?' cur':'')+(ans[i]!==null?(ans[i].ok?' c-ok':' c-ng'):'');
    return '<div class="'+c+'" onclick="jump('+i+')">'+(i+1)+'</div>';
  }).join('')+'</div>';
}

function render(){
  const q=QS[cur],a=ans[cur],done=a!==null;
  const lbls=['①','②','③','④'];
  const imgH=q.img?'<img src="'+q.img+'" class="q-img">':'';
  const optsH=q.opts.map((o,i)=>{
    let c='opt'+(done?i===q.answer?' ok':i===a.chosen?' ng':'':'');
    return '<button class="'+c+'"'+(done?' disabled':'')+' onclick="choose('+i+')"><span class="opt-lbl">'+lbls[i]+'</span><span>'+o+'</span></button>';
  }).join('');
  const expShow=done?' show':'';
  const cached=cache[q.id];
  const expH='<div class="exp'+expShow+'"><div class="exp-hdr"><div class="exp-dot"></div>해설</div><div class="exp-body" id="eb">'+(done?(cached||q.exp||'<div class="ld"><span></span><span></span><span></span></div>'):'')+'</div>'+(q.expImg?'<div class="exp-imgwrap"><img src="'+q.expImg+'" class="exp-img"></div>':'')+'</div>';
  const isLast=cur===QS.length-1;
  document.getElementById('main').innerHTML=
    '<div class="q-card"><div class="q-tag">'+title+' · '+( cur+1)+'/'+QS.length+'</div><div class="q-body">'+
    '<div class="q-num">Q'+String(q.id).padStart(2,'0')+'</div>'+
    '<div class="q-text">'+q.text+'</div>'+imgH+
    '<div class="opts">'+optsH+'</div>'+expH+'</div></div>'+
    '<div class="nav"><button class="nav-btn prev" onclick="go(-1)"'+(cur===0?' disabled':'')+'>← 이전</button>'+
    (isLast?'<button class="nav-btn next" onclick="result()">결과 보기 🎯</button>':'<button class="nav-btn next" onclick="go(1)">다음 →</button>')+
    '</div>'+mkDots();
  updateHdr();
  renderMath(document.getElementById('main'));
  if(done&&!cache[q.id]) getExp(q).then(t=>{const el=document.getElementById('eb');if(el){el.textContent=t;renderMath(el);}});
}

function renderMath(el){
  if(el&&window.renderMathInElement){
    renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false});
  }
}

function choose(i){
  if(ans[cur]!==null) return;
  const ok=i===QS[cur].answer; if(ok) score++;
  ans[cur]={chosen:i,ok}; render();
}
function go(d){cur=Math.max(0,Math.min(QS.length-1,cur+d));render();}
function jump(i){cur=i;render();}
function result(){
  const total=QS.length,done=ans.filter(a=>a!==null).length;
  const pct=Math.round(score/total*100),pass=pct>=60;
  const C=2*Math.PI*44,off=C-(pct/100)*C;
  document.getElementById('main').innerHTML=
    '<div class="result">'+
    '<div class="ring"><svg width="100" height="100" viewBox="0 0 100 100">'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="#30363d" stroke-width="7"/>'+
    '<circle cx="50" cy="50" r="44" fill="none" stroke="'+(pass?'#3fb950':'#f85149')+'" stroke-width="7" stroke-dasharray="'+C+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>'+
    '<div class="ring-pct" style="color:'+(pass?'#3fb950':'#f85149')+'">'+pct+'%</div></div>'+
    '<div class="res-title">'+(pass?'🎉 합격!':'😥 불합격')+'</div>'+
    '<div class="res-sub">'+(pass?'축하합니다! 60점 이상 달성':'60점 이상이면 합격입니다')+'</div>'+
    '<div class="stats">'+
    '<div class="stat"><div class="stat-v" style="color:#58a6ff">'+done+'</div><div class="stat-l">풀은 문제</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#3fb950">'+score+'</div><div class="stat-l">정답</div></div>'+
    '<div class="stat"><div class="stat-v" style="color:#f85149">'+(done-score)+'</div><div class="stat-l">오답</div></div>'+
    '</div><button class="retry" onclick="restart()">🔄 다시 풀기</button></div>';
  document.getElementById('pf').style.width='100%';
  document.getElementById('sc').textContent=score+'점';
}
function restart(){cur=0;score=0;ans=new Array(QS.length).fill(null);cache={};render();}
function updateHdr(){
  const done=ans.filter(a=>a!==null).length;
  document.getElementById('pf').style.width=(done/QS.length*100)+'%';
  document.getElementById('sc').textContent=score+'점';
}
if(document.readyState==='complete'){render();}else{window.addEventListener('load',render);}
</script>
</body>
</html>
